<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fieldwork®</title>
    <style>
      :root {
        --accent: #dca822;
        --bg: #f6f3eb;
        --ink: #1c1e1b;
        --muted: #50564d;
        --rule: #d9d4c6;
        --sheet: rgba(255, 254, 250, 0.78);
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 72% 58% at 18% 12%, rgba(255, 253, 247, 0.9), transparent 64%),
          radial-gradient(
            circle at 86% 84%,
            color-mix(in srgb, var(--accent) 10%, transparent),
            transparent 46%
          );
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI",
          "Helvetica Neue", sans-serif;
        position: relative;
        overflow-x: clip;
      }
      .paper-grain {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.038;
        z-index: 20;
      }
      .page {
        max-width: 1240px;
        min-height: 100vh;
        margin: auto;
        padding: 34px 56px 30px;
        display: flex;
        flex-direction: column;
      }
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--rule);
        position: relative;
      }
      .topline::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -4px;
        height: 1px;
        background: color-mix(in srgb, var(--rule) 55%, transparent);
      }
      .wordmark {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", serif;
        font-size: 20px;
        letter-spacing: -0.025em;
        font-weight: 600;
        color: var(--ink);
      }
      .availability {
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 13px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--ink) 11%, transparent);
        background: var(--sheet);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .availability:before {
        content: "";
        background: #3d6b4a;
        border-radius: 50%;
        width: 7px;
        height: 7px;
        box-shadow: 0 0 0 3px rgba(61, 107, 74, 0.16);
      }
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 40px 0 34px;
      }
      .eyebrow {
        color: var(--muted);
        text-transform: uppercase;
        font:
          500 11px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.16em;
        margin: 0 0 22px;
      }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        align-items: center;
        margin-left: -18px;
        width: fit-content;
        max-width: 100%;
      }
      .nav button {
        position: relative;
        background: none;
        border: 0;
        padding: 13px 22px;
        min-height: 50px;
        font: inherit;
        font-size: clamp(17px, 2.2vw, 23px);
        font-weight: 450;
        letter-spacing: -0.015em;
        color: var(--muted);
        cursor: pointer;
        white-space: normal;
        overflow-wrap: anywhere;
        max-width: 100%;
        -webkit-tap-highlight-color: transparent;
        transition: color 180ms ease;
        z-index: 0;
      }
      .nav button[aria-selected="true"] {
        color: var(--ink);
        font-weight: 560;
      }
      @media (hover: hover) {
        .nav button:hover {
          color: var(--ink);
        }
      }
      .nav button:focus-visible {
        color: var(--ink);
      }
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 6px;
        border-radius: 6px;
      }
      .ring {
        position: absolute;
        inset: -2px -4px;
        width: calc(100% + 8px);
        height: calc(100% + 4px);
        z-index: -1;
        overflow: visible;
        pointer-events: none;
      }
      .ring path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .ring .ring-wash {
        stroke: var(--accent);
        stroke-width: 9;
        stroke-opacity: 0.24;
      }
      .ring .ring-ink {
        stroke: var(--accent);
        stroke-width: 2.6;
      }
      .nav button .ring {
        visibility: hidden;
      }
      .nav button.marked .ring {
        visibility: visible;
      }
      .nav button.marked .ring path {
        stroke-dashoffset: 0;
      }
      .panel {
        position: relative;
        width: 100%;
        max-width: 1128px;
        margin-top: 34px;
        padding: 40px 44px 42px;
        min-height: 268px;
        border-radius: 18px;
        border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
        background: linear-gradient(
          180deg,
          rgba(255, 254, 250, 0.9) 0%,
          rgba(249, 246, 238, 0.76) 100%
        );
        box-shadow:
          0 24px 52px rgba(28, 30, 27, 0.065),
          0 2px 6px rgba(28, 30, 27, 0.04),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 156px;
        gap: 36px;
        align-items: center;
      }
      .panel-copy {
        min-width: 0;
      }
      .panel-folio {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: space-between;
        align-self: stretch;
        padding-left: 28px;
        border-left: 1px solid color-mix(in srgb, var(--rule) 85%, transparent);
        user-select: none;
      }
      .folio-num {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-size: 74px;
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.04em;
        color: color-mix(in srgb, var(--accent) 42%, var(--rule));
        font-variant-numeric: tabular-nums;
      }
      .folio-marks {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .folio-marks span {
        display: block;
        height: 2px;
        border-radius: 99px;
        background: color-mix(in srgb, var(--ink) 18%, transparent);
      }
      .folio-marks span:nth-child(1) {
        width: 44px;
        background: var(--accent);
      }
      .folio-marks span:nth-child(2) {
        width: 28px;
      }
      .folio-marks span:nth-child(3) {
        width: 16px;
      }
      .panel::before,
      .panel::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        pointer-events: none;
        border-color: color-mix(in srgb, var(--accent) 65%, var(--ink));
        border-style: solid;
      }
      .panel::before {
        top: 12px;
        left: 12px;
        border-width: 1.5px 0 0 1.5px;
      }
      .panel::after {
        right: 12px;
        bottom: 12px;
        border-width: 0 1.5px 1.5px 0;
      }
      .panel h1 {
        font-family:
          "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", "STSong", serif;
        font-size: clamp(36px, 4.9vw, 62px);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 1.08;
        margin: 0 0 22px;
        max-width: 16ch;
        color: var(--ink);
        text-wrap: balance;
      }
      :lang(zh) .panel h1 {
        font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Iowan Old Style", Georgia, serif;
        font-size: clamp(30px, 4.2vw, 52px);
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.2;
        max-width: 12em;
        word-break: keep-all;
      }
      .panel p {
        max-width: 52ch;
        padding-top: 18px;
        border-top: 1px solid color-mix(in srgb, var(--rule) 85%, transparent);
        font-size: 15px;
        line-height: 1.72;
        color: var(--muted);
        margin: 0;
        text-wrap: pretty;
      }
      .bottom {
        border-top: 1px solid var(--rule);
        padding-top: 18px;
        display: flex;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 12.5px;
      }
      .counter {
        display: flex;
        gap: 14px;
        align-items: center;
        font-variant-numeric: tabular-nums;
      }
      .counter:before {
        content: "";
        height: 1px;
        width: 28px;
        background: color-mix(in srgb, var(--ink) 32%, transparent);
      }
      #count {
        font:
          600 12px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: var(--ink);
      }
      .hint {
        font-size: 11.5px;
        letter-spacing: 0.02em;
      }
      @media (max-width: 650px) {
        .page {
          padding: 22px 20px 24px;
          min-height: 0;
        }
        .topline {
          padding-bottom: 14px;
        }
        .wordmark {
          font-size: 18px;
        }
        .availability {
          font-size: 10.5px;
          padding: 5px 10px;
        }
        .content {
          padding: 30px 0 28px;
        }
        .nav {
          gap: 8px 6px;
          margin-left: -12px;
        }
        .nav button {
          font-size: 16.5px;
          padding: 11px 14px;
          min-height: 44px;
        }
        .eyebrow {
          margin-bottom: 18px;
        }
        .panel {
          margin-top: 26px;
          padding: 24px 22px 26px;
          min-height: 210px;
          grid-template-columns: 1fr;
          gap: 0;
        }
        .panel-folio {
          display: none;
        }
        .panel h1 {
          font-size: clamp(30px, 8.8vw, 42px);
          margin-bottom: 18px;
        }
        :lang(zh) .panel h1 {
          font-size: clamp(26px, 7.6vw, 36px);
          max-width: 100%;
        }
        .bottom {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
        }
        .panel p {
          font-size: 14px;
          padding-top: 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <svg class="paper-grain" aria-hidden="true">
      <filter id="cotton-grain">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.82"
          numOctaves="3"
          stitchTiles="stitch"
        />
      </filter>
      <rect width="100%" height="100%" filter="url(#cotton-grain)" />
    </svg>
    <main class="page">
      <header class="topline">
        <div class="wordmark">Fieldwork®</div>
        <div class="availability">Available for good ideas</div>
      </header>
      <section class="content">
        <p class="eyebrow">A small gesture. A clear direction.</p>
        <div class="nav" role="tablist" aria-label="Explore sections"></div>
        <section class="panel" id="content-panel" role="tabpanel" tabindex="0">
          <div class="panel-copy">
            <h1></h1>
            <p></p>
          </div>
          <div class="panel-folio" aria-hidden="true">
            <span class="folio-num" id="folio-num">01</span>
            <div class="folio-marks">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </section>
      </section>
      <footer class="bottom">
        <span>An expressive navigation study.</span>
        <div class="counter">
          <span id="count">01 / 05</span>
          <span class="hint">Hover to explore · click to select</span>
        </div>
      </footer>
    </main>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {
          "A selection of identities, interfaces, and experiments. Each project starts with a question and ends with something worth using.":
            "收集识别、界面与实验，每个项目都从问题出发，落到能使用的作品。",
          "A small gesture. A clear direction.": "一个小动作，指向清晰的下一步。",
          "A small studio with a wider perspective.": "小小工作室，宽一点的视角。",
          About: "关于",
          "An expressive navigation study.": "一组会回应动作的导航练习。",
          "Available for good ideas": "期待好想法",
          Contact: "联系",
          "Explore sections": "浏览分区",
          "Fieldwork®": "Fieldwork®",
          "From the first idea to the final detail.": "从第一个想法，到最后一个细节。",
          "Good things start with a little curiosity.": "好的事情，从一点好奇心开始。",
          "Have a project in mind? Start a conversation with your team and turn the next good idea into a considered experience.":
            "有了项目想法，就与团队开始讨论，让它成为认真完成的体验。",
          Home: "首页",
          "Hover to explore · click to select": "悬停预览 · 点击选择",
          "Ideas made tangible.": "让想法，变得可以触摸。",
          Item: "项目",
          "Let’s make something that matters.": "一起做一点有意义的东西。",
          List: "列表",
          Select: "选择",
          Services: "服务",
          "Strategy, visual identity, and digital products. We help ambitious teams find their voice and bring it to life.":
            "从策略、视觉识别到数字产品，帮助团队找到自己的表达。",
          "Thoughtful digital experiences, built around the small moments that make a lasting impression.":
            "围绕那些值得记住的小瞬间，认真构建数字体验。",
          "We are a close-knit team of designers and makers. Our best work happens where clear thinking meets playful exploration.":
            "我们是一组设计与创作伙伴，把清楚的思考和有趣的尝试放在一起。",
          Work: "作品",
          name: "名称",
          star: "星星",
        };
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(
              /Packed ([\d,]+) bytes\. CRC32 ([0-9a-f]+)\. Download contains the complete file, ready to decode\./gi,
              "已打包 $1 字节。CRC32 $2。下载文件包含完整内容，可直接解码。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
          applyLanguage(resolved);
        };

        function boot() {
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;
          if (chinese) applyLanguage("zh");

          let langObserver;
          if (typeof MutationObserver === "function") {
            langObserver = new MutationObserver(() => {
              const next =
                normalizeLang(document.documentElement.dataset.skillLang) || resolveLang();
              if (next !== currentLang) applyLanguage(next);
            });
            langObserver.observe(document.documentElement, {
              attributes: true,
