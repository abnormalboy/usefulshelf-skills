<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fieldwork®</title>
    <style>
      :root {
        --accent: #e4bb32;
        --bg: #f8f8f3;
        --ink: #222423;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .page {
        max-width: 1280px;
        min-height: 100svh;
        margin: auto;
        padding: 42px 64px;
        display: flex;
        flex-direction: column;
      }
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .wordmark {
        font-size: 17px;
        letter-spacing: -0.05em;
        font-weight: 650;
      }
      .availability {
        font-size: 11px;
        color: #555b57;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .availability:before {
        content: "";
        background: #5b7857;
        border-radius: 50%;
        width: 6px;
        height: 6px;
      }
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 64px 0;
      }
      .eyebrow {
        color: #595e56;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.14em;
        margin: 0 0 36px;
      }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 16px 30px;
        align-items: center;
        margin-left: -15px;
        width: fit-content;
        max-width: 100%;
      }
      .nav button {
        position: relative;
        background: none;
        border: 0;
        padding: 13px 16px;
        min-height: 48px;
        font: inherit;
        font-size: clamp(17px, 2.5vw, 24px);
        color: #595e56;
        cursor: pointer;
        white-space: normal;
        overflow-wrap: anywhere;
        max-width: 100%;
        transition: color 0.18s;
        z-index: 0;
      }
      .nav button[aria-selected="true"],
      .nav button:hover,
      .nav button:focus-visible {
        color: var(--ink);
      }
      button:focus-visible {
        outline: 2px solid #666d60;
        outline-offset: 7px;
        border-radius: 3px;
      }
      .ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: visible;
        pointer-events: none;
      }
      .ring path {
        stroke: var(--accent);
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .nav button .ring {
        visibility: hidden;
      }
      .nav button.marked .ring {
        visibility: visible;
      }
      .nav button.marked .ring path {
        stroke-dashoffset: 0;
      }
      .panel {
        max-width: 900px;
        margin-top: 55px;
        min-height: 240px;
      }
      .panel h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(44px, 6.5vw, 82px);
        font-weight: 400;
        letter-spacing: -0.06em;
        line-height: 1.06;
        margin: 0 0 26px;
        max-width: 15ch;
        text-wrap: balance;
      }
      :lang(zh) .panel h1 {
        font-size: clamp(36px, 5vw, 66px);
        letter-spacing: -0.02em;
        line-height: 1.18;
        max-width: 11em;
        word-break: keep-all;
      }
      .panel p {
        max-width: 44ch;
        font-size: 15px;
        line-height: 1.7;
        color: #525750;
        margin: 0;
      }
      .bottom {
        border-top: 1px solid #dadcd5;
        padding-top: 20px;
        display: flex;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
        color: #595e56;
        font-size: 12px;
      }
      .counter {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .counter:before {
        content: "";
        height: 1px;
        width: 32px;
        background: #8c9186;
      }
      .hint {
        font-size: 11px;
        letter-spacing: 0.02em;
      }
      @media (max-width: 650px) {
        .page {
          padding: 28px 25px;
        }
        .availability {
          font-size: 11px;
        }
        .content {
          padding: 60px 0;
        }
        .nav {
          gap: 11px 9px;
          margin-left: -10px;
        }
        .nav button {
          font-size: 17px;
          padding: 12px 11px;
          color: #4f544d;
        }
        .eyebrow {
          margin-bottom: 26px;
        }
        .panel {
          margin-top: 40px;
          min-height: 230px;
        }
        .panel h1 {
          font-size: clamp(34px, 10vw, 46px);
        }
        :lang(zh) .panel h1 {
          font-size: clamp(30px, 8.6vw, 40px);
          max-width: 100%;
        }
        .bottom {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }
        .panel p {
          font-size: 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topline">
        <div class="wordmark">Fieldwork®</div>
        <div class="availability">Available for good ideas</div>
      </header>
      <section class="content">
        <p class="eyebrow">A small gesture. A clear direction.</p>
        <div class="nav" role="tablist" aria-label="Explore sections"></div>
        <section class="panel" id="content-panel" role="tabpanel" tabindex="0">
          <h1></h1>
          <p></p>
        </section>
      </section>
      <footer class="bottom">
        <span>An expressive navigation study.</span>
        <div class="counter">
          <span id="count">01 / 05</span>
          <span class="hint">Hover to explore · click to select</span>
        </div>
      </footer>
    </main>

        if (!nav.contains(e.relatedTarget)) mark(selected);
      });
      nav.addEventListener("keydown", (e) => {
        let i = tabs.indexOf(document.activeElement);
        if (i < 0) return;
        const keys = ["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp", "Home", "End"];
        if (!keys.includes(e.key)) return;
        e.preventDefault();
        i =
          e.key === "Home"
            ? 0
            : e.key === "End"
              ? tabs.length - 1
              : (i + (e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : -1) + tabs.length) %
                tabs.length;
        select(i);
        tabs[i].focus();
      });
      motion.addEventListener("change", () => {
        drawing?.cancel();
        mark(marked, true);
      });
      select(0);
    </script>
  </body>
</html>
