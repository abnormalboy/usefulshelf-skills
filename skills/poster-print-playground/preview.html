<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>把灵感，印成一张。</title>
    <style>
      :root {
        --accent: #c24124;
        --bg: #f3f0e9;
        --ink: #1e231f;
        --muted: #4b524a;
        --rule: rgba(30, 35, 31, 0.16);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 70% 60% at 80% 15%, rgba(255, 252, 244, 0.72), transparent 72%),
          radial-gradient(ellipse 60% 50% at 15% 90%, rgba(196, 179, 152, 0.18), transparent 70%),
          url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44MiIgbnVtT2N0YXZlcz0iMiIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIiBmaWx0ZXI9InVybCgjbikiIG9wYWNpdHk9IjAuMDM2Ii8+PC9zdmc+");
        color: var(--ink);
        font:
          14px/1.55 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Hiragino Sans GB",
          "Noto Sans CJK SC",
          system-ui,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px 32px 20px;
      }
      .mast {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        border-bottom: 1.5px solid rgba(30, 35, 31, 0.2);
        padding-bottom: 11px;
        font:
          600 11px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        letter-spacing: 0.13em;
        color: var(--muted);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 0.94fr) minmax(0, 1.06fr);
        gap: 44px;
        margin-top: 18px;
        align-items: start;
      }
      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font:
          600 11px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        color: var(--accent);
        letter-spacing: 0.13em;
      }
      .kicker::before {
        content: "";
        width: 16px;
        height: 1.5px;
        background: var(--accent);
      }
      h1 {
        font:
          600 clamp(32px, 3.8vw, 48px)/1.12 "Iowan Old Style",
          "Palatino Linotype",
          Georgia,
          "Songti SC",
          "Noto Serif CJK SC",
          serif;
        letter-spacing: -0.03em;
        margin: 10px 0 10px;
        overflow-wrap: anywhere;
        text-wrap: balance;
        color: #171b18;
      }
      :lang(zh) h1 {
        font-size: clamp(30px, 3.4vw, 44px);
        line-height: 1.18;
        letter-spacing: -0.015em;
        word-break: keep-all;
      }
      .sub {
        font-size: 13.5px;
        line-height: 1.62;
        color: var(--muted);
        max-width: 400px;
        margin: 0;
        text-wrap: pretty;
      }
      .controls-card {
        margin-top: 18px;
        padding: 18px 20px 18px;
        background: linear-gradient(180deg, rgba(255, 253, 248, 0.9), rgba(248, 245, 236, 0.85));
        border: 1px solid rgba(30, 35, 31, 0.14);
        border-radius: 14px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.88) inset,
          0 14px 28px rgba(34, 38, 30, 0.06);
      }
      .field {
        display: block;
        margin: 15px 0 8px;
        font:
          600 11.5px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .field:first-child {
        margin-top: 0;
      }
      input[type="text"] {
        width: 100%;
        border: 0;
        border-bottom: 1.5px solid rgba(30, 35, 31, 0.28);
        background: rgba(255, 255, 255, 0.55);
        padding: 9px 10px;
        border-radius: 6px 6px 0 0;
        font:
          600 18px/1.3 "Iowan Old Style",
          Georgia,
          "Songti SC",
          serif;
        color: var(--ink);
        transition:
          border-color 0.18s ease,
          background-color 0.18s ease;
      }
      input[type="text"]:focus {
        border-bottom-color: var(--accent);
        background: #ffffff;
      }
      .choice {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .choice button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 13px;
        background: rgba(255, 254, 250, 0.8);
        border: 1px solid rgba(30, 35, 31, 0.2);
        border-radius: 999px;
        font:
          600 12px/1.2 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(24, 30, 22, 0.05);
        transition:
          transform 0.15s ease,
          background-color 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      @media (hover: hover) {
        .choice button:hover {
          transform: translateY(-1px);
          border-color: rgba(30, 35, 31, 0.45);
          background: #ffffff;
        }
      }
      .choice button[aria-pressed="true"] {
        background: #1e231f;
        border-color: #1e231f;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(24, 30, 22, 0.18);
      }
      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
        background: var(--c);
        box-shadow:
          inset 0 1.5px 2px rgba(255, 255, 255, 0.45),
          0 0 0 1px rgba(0, 0, 0, 0.2);
      }
      .choice button[aria-pressed="true"] .swatch {
        box-shadow:
          inset 0 1.5px 2px rgba(255, 255, 255, 0.45),
          0 0 0 1.5px rgba(255, 255, 255, 0.85);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2.5px solid var(--accent);
        outline-offset: 3px;
      }
      .download {
        margin-top: 18px;
        width: 100%;
        padding: 13px 20px;
        border: 1px solid color-mix(in srgb, var(--accent) 85%, #000 15%);
        background-color: var(--accent);
        background-image: linear-gradient(
          180deg,
          color-mix(in srgb, var(--accent) 92%, #fff 8%),
          var(--accent)
        );
        color: #ffffff;
        border-radius: 9px;
        font:
          600 13.5px/1.2 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        letter-spacing: 0.01em;
        cursor: pointer;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.24) inset,
          0 8px 18px color-mix(in srgb, var(--accent) 26%, transparent);
        transition:
          transform 0.16s ease,
          box-shadow 0.16s ease,
          filter 0.16s ease;
        -webkit-tap-highlight-color: transparent;
      }
      @media (hover: hover) {
        .download:hover {
          transform: translateY(-1px);
          filter: brightness(1.04);
          box-shadow:
            0 1px 0 rgba(255, 255, 255, 0.3) inset,
            0 12px 22px color-mix(in srgb, var(--accent) 32%, transparent);
        }
      }
      .poster-frame {
        position: relative;
        background:
          radial-gradient(ellipse 80% 55% at 50% 15%, rgba(255, 254, 249, 0.65), transparent 72%),
          linear-gradient(165deg, #e5e1d6 0%, #d8d3c5 100%);
        border: 1px solid rgba(30, 35, 31, 0.15);
        border-radius: 14px;
        padding: 20px 26px;
        display: grid;
        place-items: center;
        min-width: 0;
        box-shadow:
          inset 0 2px 10px rgba(32, 36, 28, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.72),
          0 18px 34px rgba(32, 36, 28, 0.07);
      }
      .poster-frame::before,
      .poster-frame::after {
        content: "+";
        position: absolute;
        font:
          500 11px/1 ui-monospace,
          monospace;
        color: rgba(45, 50, 42, 0.35);
        pointer-events: none;
      }
      .poster-frame::before {
        top: 8px;
        left: 11px;
      }
      .poster-frame::after {
        bottom: 8px;
        right: 11px;
      }
      .poster-frame svg {
        width: 100%;
        height: auto;
        max-width: 318px;
        display: block;
        border-radius: 2px;
        box-shadow:
          0 22px 38px rgba(24, 28, 22, 0.2),
          0 4px 10px rgba(24, 28, 22, 0.12),
          0 0 0 1px rgba(0, 0, 0, 0.08);
      }
      .thumbs {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .thumbs button {
        padding: 6px 6px 7px;
        background: rgba(255, 253, 248, 0.65);
        border: 1.5px solid rgba(30, 35, 31, 0.12);
        border-radius: 8px;
        cursor: pointer;
        min-width: 0;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease,
          background-color 0.15s ease,
          box-shadow 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      @media (hover: hover) {
        .thumbs button:hover {
          transform: translateY(-2px);
          background: #ffffff;
          border-color: rgba(30, 35, 31, 0.34);
        }
      }
      .thumbs button[aria-pressed="true"] {
        border-color: var(--accent);
        background: #ffffff;
        box-shadow:
          0 6px 14px color-mix(in srgb, var(--accent) 18%, transparent),
          0 0 0 1px var(--accent);
      }
      .thumbs svg {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 2px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }
      .thumbs span {
        font:
          600 10.5px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        display: block;
        margin-top: 6px;
        color: var(--muted);
      }
      .thumbs button[aria-pressed="true"] span {
        color: var(--accent);
      }
      #status {
        min-height: 22px;
        line-height: 1.5;
        font:
          500 12px/1.5 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        color: var(--muted);
        margin: 12px 0 0;
      }
      .foot {
        margin-top: 16px;
        padding-top: 11px;
        border-top: 1px solid var(--rule);
        font:
          600 10.5px/1.4 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        letter-spacing: 0.11em;
        color: var(--muted);
      }
      @media (max-width: 760px) {
        main {
          padding: 18px 18px 22px;
        }
        .layout {
          grid-template-columns: 1fr;
          gap: 22px;
        }
        .poster-frame {
          padding: 18px;
        }
        .poster-frame svg {
          max-width: 300px;
        }
        h1 {
          max-width: 460px;
        }
        .sub {
          max-width: 100%;
        }
        .mast {
          font-size: 9.5px;
          letter-spacing: 0.08em;
        }
        input[type="text"] {
          font-size: 16px;
        }
        .thumbs {
          gap: 7px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mast">
        <span>SMALL PRESS / PRINT ROOM</span>
        <span data-zh="四张海报 · 无限小想法" data-en="FOUR PRINTS · ENDLESS LITTLE IDEAS">
          四张海报 · 无限小想法
        </span>
      </div>
      <div class="layout">
        <section>
          <span class="kicker">FORM / SIGNAL / HUMAN / OBJECT</span>
          <h1>把灵感，印成一张。</h1>
          <p class="sub" id="subtitle">
            四种画面，三套油墨。改一行文字，印一份属于你的灵感。
          </p>
          <div class="controls-card">
            <label
              class="field"
              for="headline"
              data-zh="海报上的一句话"
              data-en="YOUR POSTER HEADLINE"
            >
              海报上的一句话
            </label>
            <input
              id="headline"
              type="text"
              maxlength="48"
              value="慢一点，也很好"
              aria-label="海报文字"
            />
            <span class="field" data-zh="挑选油墨" data-en="CHOOSE YOUR INK">挑选油墨</span>
            <div class="choice" id="palettes">
              <button data-palette="0" aria-pressed="true">
                <i class="swatch" style="--c: #c24124"></i>
                <span data-zh="赤陶" data-en="Terracotta">赤陶</span>
              </button>
              <button data-palette="1" aria-pressed="false">
                <i class="swatch" style="--c: #365ca8"></i>
                <span data-zh="蓝调" data-en="Blue hour">蓝调</span>
              </button>
              <button data-palette="2" aria-pressed="false">
                <i class="swatch" style="--c: #3f6a4b"></i>
                <span data-zh="苔绿" data-en="Moss">苔绿</span>
              </button>
            </div>
            <span class="field" data-zh="排版方式" data-en="COMPOSITION">排版方式</span>
            <div class="choice" id="layouts">
              <button data-layout="0" aria-pressed="true" data-zh="留白版" data-en="Airy">
                留白版
              </button>
              <button data-layout="1" aria-pressed="false" data-zh="大字版" data-en="Bold type">
                大字版
              </button>
            </div>
            <button
              class="download"
              id="download"
              data-zh="下载这张 SVG 海报 ↓"
              data-en="Download SVG poster ↓"
            >
              下载这张 SVG 海报 ↓
            </button>
          </div>
          <p
            id="status"
            role="status"
            data-zh="从右侧挑一张，开始你的印刷小实验。"
            data-en="Pick a print and make it your own."
          >
            从右侧挑一张，开始你的印刷小实验。
          </p>
        </section>
        <section aria-label="海报预览" id="preview-area">
          <div class="poster-frame" id="poster"></div>
          <div class="thumbs" id="thumbs" role="group" aria-label="选择海报"></div>
        </section>
      </div>
      <div class="foot">FOUR DISTINCT SYSTEMS. ONE PRINT ROOM. / VECTOR EDITION 002</div>
    </main>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {};
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(
              /Packed ([\d,]+) bytes\. CRC32 ([0-9a-f]+)\. Download contains the complete file, ready to decode\./gi,
              "已打包 $1 字节。CRC32 $2。下载文件包含完整内容，可直接解码。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }

            </g>
            <g stroke="${deep}" stroke-opacity=".42" fill="none" stroke-dasharray="2 3">
              <path d="M24 218H126M24 308H176M24 412H100"/>
            </g>
            <g fill="${deep}" font-family="monospace" font-size="7" font-weight="700">
              <text x="24" y="211">01 / OPEN</text>
              <text x="24" y="301">02 / PAUSE</text>
              <text x="24" y="405">03 / KEEP</text>
            </g>`
          );
        }

        function svg(i, thumb = false) {
          const pal = colors[palette],
            a = pal[0],
            deep = pal[2],
            id = "print" + i + (thumb ? "thumb" : "main"),
            text = input.value.trim() || L("留一点想象", "LEAVE ROOM FOR POSSIBILITY");
          const boxes = [
              { x: 24, y: 374, w: 352, h: 100 },
              { x: 29, y: 58, w: 340, h: 86 },
              { x: 24, y: 408, w: 352, h: 78 },
              { x: 24, y: 50, w: 352, h: 74 },
            ],
            inks = [a, "#f2f6ef", deep, deep],
            max = [layout ? 52 : 42, layout ? 40 : 30, layout ? 37 : 27, layout ? 36 : 27];
          return `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520" role="img" aria-label="${esc(names[i][en ? 1 : 0])}" data-system="${["perspective-card", "data-nodes", "human-dialogue", "layered-product"][i]}">${posterScene(i, pal, id)}${titleBlock(text, boxes[i], inks[i], max[i])}</svg>`;
        }

        function render() {
          document.querySelector("#poster").innerHTML = svg(selected);
          document.querySelectorAll("#thumbs button").forEach((b, i) => {
            b.innerHTML = svg(i, true) + "<span>0" + (i + 1) + "</span>";
            b.setAttribute("aria-pressed", String(i === selected));
          });
        }

        names.forEach((n, i) => {
          const b = document.createElement("button");
          b.setAttribute("aria-label", n[en ? 1 : 0]);
          b.addEventListener("click", () => {
            selected = i;
            render();
            document.querySelector("#status").textContent =
              L("正在编辑：", "Editing: ") + n[en ? 1 : 0];
          });
          document.querySelector("#thumbs").append(b);
        });

        input.addEventListener("input", render);
        document.querySelectorAll("[data-palette]").forEach((b) =>
          b.addEventListener("click", () => {
            palette = Number(b.dataset.palette);
            document
              .querySelectorAll("[data-palette]")
              .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            render();
            document.querySelector("#status").textContent = L(
              "新油墨已印上画面。",
              "Fresh ink, freshly printed.",
            );
          }),
        );
        document.querySelectorAll("[data-layout]").forEach((b) =>
          b.addEventListener("click", () => {
            layout = Number(b.dataset.layout);
            document
              .querySelectorAll("[data-layout]")
              .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            render();
          }),
        );
        document.querySelector("#download").addEventListener("click", () => {
          const blob = new Blob([svg(selected)], { type: "image/svg+xml" }),
            url = URL.createObjectURL(blob),
            a = document.createElement("a");
          a.href = url;
          a.download = "small-press-" + (selected + 1) + ".svg";
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          document.querySelector("#status").textContent = L(
            "SVG 已准备好，保留了你的文字与配色。",
            "SVG ready with your words and chosen ink.",
          );
        });
        render();
      })();
    </script>
  </body>
</html>
