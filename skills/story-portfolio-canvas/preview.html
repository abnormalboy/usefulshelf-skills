<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>每个作品，都有故事。</title>
    <style>
      :root {
        --accent: #d9724e;
        --bg: #131513;
        --ink: #f2efe7;
        --muted: #aab1a5;
        --line: rgba(255, 255, 255, 0.1);
        --surface: rgba(255, 255, 255, 0.045);
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 76% 52% at 50% 8%, rgba(235, 224, 204, 0.08), transparent 66%),
          radial-gradient(
            circle at 84% 78%,
            color-mix(in srgb, var(--accent) 9%, transparent),
            transparent 46%
          );
        color: var(--ink);
        font:
          13.5px/1.5 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Segoe UI",
          "Helvetica Neue",
          sans-serif;
        overflow-x: clip;
      }
      main {
        width: 100%;
        max-width: 1440px;
        margin: auto;
        padding: 20px 36px 24px;
        min-height: 700px;
      }
      .mast {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
        font:
          500 11px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.1em;
        color: #c2c8bc;
      }
      .mark {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        color: var(--ink);
      }
      .mark i {
        width: 8px;
        height: 8px;
        background: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      .intro {
        display: flex;
        justify-content: space-between;
        gap: 32px;
        align-items: flex-end;
        margin: 18px 0 16px;
      }
      h1 {
        font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", Georgia, serif;
        font-size: clamp(24px, 2.5vw, 34px);
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
        margin: 0;
        max-width: 56%;
        text-wrap: balance;
      }
      :lang(zh) h1 {
        font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
        font-weight: 600;
        word-break: keep-all;
      }
      .sub {
        font-size: 13px;
        line-height: 1.65;
        max-width: 440px;
        color: var(--muted);
        margin: 0;
        text-wrap: pretty;
      }
      .tools {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        position: relative;
        z-index: 6;
      }
      .tools > div {
        display: inline-flex;
        gap: 3px;
        padding: 4px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--line);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        flex-wrap: wrap;
      }
      .tools button {
        border: 1px solid transparent;
        border-radius: 999px;
        background: transparent;
        color: #b4bbb0;
        padding: 6px 14px;
        font:
          500 12.5px/1.3 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          sans-serif;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition:
          color 160ms ease,
          background-color 160ms ease,
          border-color 160ms ease;
      }
      @media (hover: hover) {
        .tools button:hover {
          color: var(--ink);
          background: rgba(255, 255, 255, 0.06);
        }
      }
      .tools button[aria-pressed="true"] {
        color: #fffdf8;
        background: color-mix(in srgb, var(--accent) 26%, rgba(255, 255, 255, 0.1));
        border-color: color-mix(in srgb, var(--accent) 52%, rgba(255, 255, 255, 0.18));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
      }
      .gallery {
        position: relative;
        perspective: 1450px;
        height: 520px;
        min-height: 520px;
        width: 100%;
        max-width: 1240px;
        margin: 10px auto 14px;
        overflow: hidden;
        isolation: isolate;
        --look-x: 0deg;
        --look-y: 0deg;
      }
      .gallery::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 52%;
        width: min(760px, 84%);
        height: 360px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(232, 222, 202, 0.06) 0%,
          rgba(232, 222, 202, 0) 70%
        );
        pointer-events: none;
        z-index: 0;
      }
      .project {
        position: relative;
        min-width: 0;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 10px;
        overflow: hidden;
        background: #1c1e1b;
        color: #f4f2ec;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 540ms cubic-bezier(0.2, 0.78, 0.2, 1),
          opacity 360ms ease,
          border-color 220ms ease,
          box-shadow 260ms ease;
        transform-style: preserve-3d;
        outline-offset: 6px;
        box-shadow:
          0 22px 44px rgba(0, 0, 0, 0.56),
          0 4px 12px rgba(0, 0, 0, 0.32),
          inset 0 1px 0 rgba(255, 255, 255, 0.24);
      }
      .project::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.14) 0%,
          rgba(255, 255, 255, 0) 36%
        );
        pointer-events: none;
      }
      .project svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .project .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 0;
        padding: 12px 12px 10px;
        background: linear-gradient(
          to top,
          rgba(14, 16, 14, 0.92) 0%,
          rgba(14, 16, 14, 0.76) 72%,
          rgba(14, 16, 14, 0) 100%
        );
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font:
          500 12.5px/1.3 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          sans-serif;
        color: #f6f4ee;
        letter-spacing: 0.01em;
        text-align: left;
        gap: 6px;
        opacity: 1;
      }
      .project .caption small {
        font:
          500 11px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        color: #cfd4c7;
      }
      .gallery[data-layout="scatter"] .project {
        position: absolute;
        width: clamp(168px, 19%, 234px);
        left: var(--sx);
        top: var(--sy);
        transform: translate(-50%, -50%) translateZ(var(--depth))
          rotateY(calc(var(--tilt) + var(--look-y))) rotateX(var(--look-x)) rotateZ(var(--twist));
        opacity: 0.97;
        z-index: var(--order);
      }
      @media (hover: hover) {
        .gallery[data-layout="scatter"] .project:hover {
          opacity: 1;
          z-index: 30;
          border-color: rgba(255, 255, 255, 0.34);
          box-shadow:
            0 30px 60px rgba(0, 0, 0, 0.68),
            0 0 0 1px color-mix(in srgb, var(--accent) 40%, rgba(255, 255, 255, 0.2));
          transform: translate(-50%, -50%) translateZ(125px) rotateY(0deg) rotateZ(0deg);
        }
      }
      .gallery[data-layout="scatter"] .project:focus-visible {
        opacity: 1;
        z-index: 30;
        transform: translate(-50%, -50%) translateZ(125px) rotateY(0deg) rotateZ(0deg);
      }
      .gallery[data-layout="grid"] {
        display: grid;
        height: auto;
        min-height: 490px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
        max-width: 920px;
        padding: 18px 24px;
        overflow: visible;
      }
      .gallery[data-layout="grid"] .project {
        max-width: 248px;
        width: 100%;
        justify-self: center;
      }
      @media (hover: hover) {
        .gallery[data-layout="grid"] .project:hover {
          transform: translateY(-6px);
          border-color: rgba(255, 255, 255, 0.32);
        }
      }
      .gallery[data-layout="orbit"] {
        height: 500px;
        min-height: 500px;
      }
      .gallery[data-layout="orbit"] .project {
        position: absolute;
        width: 252px;
        left: calc(50% - 126px);
        top: 68px;
        transform: translateX(var(--x)) translateZ(var(--z)) rotateY(var(--r));
        opacity: var(--opacity);
        z-index: var(--order);
      }
      .gallery[data-layout="orbit"] .project[data-center="true"] {
        border-color: rgba(255, 255, 255, 0.32);
        box-shadow:
          0 28px 60px rgba(0, 0, 0, 0.68),
          0 0 42px color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .gallery[data-layout="orbit"] .project:not([data-center="true"]) .caption {
        visibility: hidden;
      }
      .project[hidden] {
        display: none !important;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .arrows {
        display: flex;
        gap: 8px;
      }
      .arrows button {
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        width: 36px;
        height: 36px;
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
        display: grid;
        place-items: center;
        transition:
          background-color 160ms ease,
          border-color 160ms ease;
      }
      @media (hover: hover) {
        .arrows button:hover {
          background: rgba(255, 255, 255, 0.1);
          border-color: var(--accent);
        }
      }
      .arrows[hidden] {
        display: none;
      }
      #status {
        font:
          12.5px/1.6 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          sans-serif;
        color: #c5cbc0;
      }
      .edition {
        font:
          500 10.5px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.12em;
        color: #9ba396;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      dialog {
        width: min(760px, calc(100vw - 32px));
        max-height: calc(100vh - 40px);
        overflow: auto;
        padding: 0;
        background: linear-gradient(180deg, #f3f0e7 0%, #e7e3d6 100%);
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 16px;
        color: #242921;
        box-shadow: 0 36px 80px rgba(0, 0, 0, 0.65);
      }
      dialog::backdrop {
        background: rgba(8, 10, 8, 0.78);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .dialog-inner {
        padding: 28px;
      }
      .dialog-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font:
          600 11px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.1em;
        color: #4f5848;
      }
      .close {
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid #aeb4a4;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        color: #242921;
        font-size: 18px;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .case-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
        gap: 30px;
        align-items: center;
        margin-top: 20px;
      }
      #case-art {
        padding: 10px;
        border-radius: 12px;
        background: #1b1d19;
        box-shadow: 0 18px 36px rgba(20, 24, 19, 0.24);
      }
      #case-art svg {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 6px;
      }
      h2 {
        font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", Georgia, serif;
        font-size: 32px;
        font-weight: 500;
        line-height: 1.15;
        margin: 0 0 14px;
      }
      #case-story {
        font-size: 14px;
        line-height: 1.8;
        color: #3d4537;
      }
      .case-note {
        font-size: 11.5px;
        color: #525c4b;
        border-top: 1px solid #c6cbb9;
        padding-top: 14px;
        margin-top: 20px;
      }
      @media (max-width: 650px) {
        main {
          padding: 18px 16px 22px;
        }
        .mast {
          font-size: 10px;
          gap: 10px;
          padding-bottom: 12px;
        }
        .intro {
          display: block;
          margin: 14px 0 12px;
        }
        h1 {
          font-size: 24px;
          max-width: 100%;
          margin-bottom: 6px;
        }
        .sub {
          font-size: 12.5px;
          max-width: 100%;
        }
        .tools {
          gap: 8px;
          margin-bottom: 6px;
        }
        .tools > div {
          padding: 3px;
        }
        .tools button {
          font-size: 12px;
          padding: 6px 10px;
          min-height: 32px;
        }
        .gallery {
          height: 696px;
          min-height: 696px;
          margin: 12px 0 12px;
          width: 100%;
        }
        .gallery[data-layout="scatter"] .project {
          width: 43%;
          min-width: 136px;
          max-width: 156px;
          left: var(--mx);
          top: var(--my);
          transform: translate(-50%, -50%) translateZ(0) rotateZ(var(--twist));
          opacity: 1;
        }
        .gallery[data-layout="scatter"] .project:hover,
        .gallery[data-layout="scatter"] .project:focus-visible {
          transform: translate(-50%, -50%) translateZ(15px) rotate(0);
        }
        .gallery[data-layout="grid"] {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px 12px;
          padding: 12px 0;
          height: auto;
          min-height: 0;
        }
        .gallery[data-layout="orbit"] {
          height: 440px;
          min-height: 440px;
        }
        .gallery[data-layout="orbit"] .project {
          width: 214px;
          left: calc(50% - 107px);
          top: 66px;
        }
        .edition {
          display: none;
        }
        .case-grid {
          grid-template-columns: 1fr;
        }
        #case-art {
          max-width: 230px;
          margin: auto;
        }
        h2 {
          font-size: 26px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
        .gallery[data-layout="scatter"] .project {
          transform: translate(-50%, -50%) translateZ(var(--depth)) rotateY(var(--tilt))
            rotateZ(var(--twist));
        }
        .gallery[data-layout="grid"] .project:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mast">
        <span class="mark">
          <i></i>
          PEBBLE / INDEPENDENT STUDIO
        </span>
        <span data-zh="作品与日常 · 2024—2026" data-en="WORK & EVERYDAY / 2024—2026">
          作品与日常 · 2024—2026
        </span>
      </div>
      <div class="intro">
        <h1>每个作品，都有故事。</h1>
        <p class="sub" id="subtitle">
          翻阅一间独立工作室的创作笔记，发现每个小作品背后的想法。
        </p>
      </div>
      <div class="tools">
        <div role="group" aria-label="项目筛选" id="filters">
          <button data-filter="all" aria-pressed="true" data-zh="全部作品" data-en="All work">
            全部作品
          </button>
          <button data-filter="object" aria-pressed="false" data-zh="物件" data-en="Objects">
            物件
          </button>
          <button data-filter="space" aria-pressed="false" data-zh="空间" data-en="Spaces">
            空间
          </button>
          <button data-filter="print" aria-pressed="false" data-zh="印刷" data-en="Print">
            印刷
          </button>
        </div>
        <div role="group" aria-label="画布布局" id="layouts">
          <button data-layout="scatter" aria-pressed="true" data-zh="散落" data-en="Scatter">
            散落
          </button>
          <button data-layout="grid" aria-pressed="false" data-zh="整齐" data-en="Grid">
            整齐
          </button>
          <button data-layout="orbit" aria-pressed="false" data-zh="环绕" data-en="Orbit">
            环绕
          </button>
        </div>
      </div>
      <div class="gallery" data-layout="scatter" id="gallery"></div>
      <div class="controls">
        <div
          id="status"
          role="status"
          data-zh="六个小作品。点击一张，读读它的故事。"
          data-en="Six little works. Pick one to read its story."
        >
          六个小作品。点击一张，读读它的故事。
        </div>
        <span class="edition">SMALL WORKS / OPEN POSSIBILITIES</span>
        <div class="arrows" id="arrows" hidden>
          <button id="previous" aria-label="上一个作品">←</button>
          <button id="next" aria-label="下一个作品">→</button>
        </div>
      </div>
    </main>
    <dialog id="case">
      <div class="dialog-inner">
        <div class="dialog-top">
          <span id="case-type"></span>
          <button class="close" id="close" aria-label="关闭故事">×</button>
        </div>
        <div class="case-grid">
          <div id="case-art"></div>
          <div>
            <h2 id="case-title"></h2>
            <p id="case-story"></p>
            <div
              class="case-note"
              data-zh="一段虚构的工作室创作札记，供作品集演示使用。"
              data-en="A fictional studio study for this portfolio demonstration."
            >
              一段虚构的工作室创作札记，供作品集演示使用。
            </div>
          </div>
        </div>
      </div>
    </dialog>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {};
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",

            b.style.setProperty("--my", pose[6] + "%");
            b.style.setProperty("--x", Math.sin(angle) * 365 + "px");
            b.style.setProperty("--z", (Math.cos(angle) - 1) * 275 + "px");
            b.style.setProperty("--r", -Math.sin(angle) * 63 + "deg");
            b.style.setProperty("--opacity", String(center ? 1 : 0.53));
            b.style.setProperty(
              "--order",
              String(
                layout === "scatter"
                  ? Math.round(pose[2] / 20 + 6)
                  : Math.round(Math.cos(angle) * 10 + 10),
              ),
            );
            b.dataset.center = String(center);
          });
          document.querySelector("#arrows").hidden = layout !== "orbit";
          status.textContent =
            layout === "orbit"
              ? L("正在环绕：", "In orbit: ") + works[ids[index]].name[en ? 1 : 0]
              : ids.length + L(" 个作品 · 点击阅读故事", " projects · pick one to read its story");
        }
        works.forEach((w, i) => {
          const b = document.createElement("button");
          b.className = "project";
          b.innerHTML =
            art(i) +
            '<span class="caption"><span>' +
            w.name[en ? 1 : 0] +
            "</span><small>" +
            w.year +
            "</small></span>";
          b.setAttribute("aria-label", L("阅读：", "Read: ") + w.name[en ? 1 : 0]);
          b.addEventListener("click", () => {
            opener = b;
            document.querySelector("#case-art").innerHTML = art(i, "detail");
            document.querySelector("#case-title").textContent = w.name[en ? 1 : 0];
            document.querySelector("#case-story").textContent = w.story[en ? 1 : 0];
            document.querySelector("#case-type").textContent =
              w.type.toUpperCase() + " / " + w.year;
            dialog.showModal();
            document.querySelector("#close").focus();
          });
          b.addEventListener("focus", () => {
            if (layout === "orbit") {
              index = visible().indexOf(i);
              arrange();
            }
          });
          gallery.append(b);
          buttons.push(b);
        });
        document.querySelectorAll("[data-filter]").forEach((b) =>
          b.addEventListener("click", () => {
            filter = b.dataset.filter;
            index = 0;
            document
              .querySelectorAll("[data-filter]")
              .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            arrange();
          }),
        );
        document.querySelectorAll("#layouts [data-layout]").forEach((b) =>
          b.addEventListener("click", () => {
            layout = b.dataset.layout;
            document
              .querySelectorAll("#layouts [data-layout]")
              .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            arrange();
          }),
        );
        const still = matchMedia("(prefers-reduced-motion: reduce)");
        gallery.addEventListener("pointermove", (e) => {
          if (layout !== "scatter" || still.matches) return;
          const b = gallery.getBoundingClientRect();
          gallery.style.setProperty(
            "--look-x",
            (-(e.clientY - b.top) / b.height + 0.5) * 4 + "deg",
          );
          gallery.style.setProperty("--look-y", ((e.clientX - b.left) / b.width - 0.5) * 6 + "deg");
        });
        gallery.addEventListener("pointerleave", () => {
          gallery.style.setProperty("--look-x", "0deg");
          gallery.style.setProperty("--look-y", "0deg");
        });
        document.querySelector("#previous").addEventListener("click", () => {
          index--;
          arrange();
        });
        document.querySelector("#next").addEventListener("click", () => {
          index++;
          arrange();
        });
        document
          .querySelector("#previous")
          .setAttribute("aria-label", L("上一个作品", "Previous project"));
        document.querySelector("#next").setAttribute("aria-label", L("下一个作品", "Next project"));
        document.querySelector("#close").setAttribute("aria-label", L("关闭故事", "Close story"));
        document.querySelector("#close").addEventListener("click", () => dialog.close());
        dialog.addEventListener("close", () => opener?.focus());
        dialog.setAttribute("aria-labelledby", "case-title");
        document
          .querySelector("#filters")
          .setAttribute("aria-label", L("项目筛选", "Filter projects"));
        document
          .querySelector("#layouts")
          .setAttribute("aria-label", L("画布布局", "Canvas layout"));
        arrange();
      })();
    </script>
  </body>
</html>
