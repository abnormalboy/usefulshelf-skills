<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>每个作品，都有故事。</title>
    <style>
      :root {
        --accent: #cf6948;
        --bg: #171917;
        --ink: #eeece6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px system-ui;
      }
      main {
        width: 100%;
        max-width: 1510px;
        margin: auto;
        padding: 23px 30px;
        min-height: 740px;
      }
      .mast {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        font:
          9px ui-monospace,
          monospace;
        letter-spacing: 0.1em;
      }
      .mark {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .mark i {
        width: 7px;
        height: 7px;
        background: var(--accent);
        border-radius: 50%;
      }
      .intro {
        display: flex;
        justify-content: space-between;
        gap: 30px;
        align-items: baseline;
        margin: 22px 0 16px;
      }
      h1 {
        font:
          19px/1.35 Georgia,
          serif;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
        margin: 0;
        max-width: 58%;
      }
      .sub {
        font-size: 10px;
        line-height: 1.7;
        max-width: 420px;
        color: #848b7f;
        margin: 0;
      }
      .tools {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }
      .tools > div {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tools button {
        border: 0;
        border-bottom: 1px solid transparent;
        background: none;
        color: #727c69;
        padding: 7px 9px;
        font:
          9px ui-monospace,
          monospace;
        cursor: pointer;
      }
      .tools button[aria-pressed="true"] {
        color: #edede4;
        border-color: #a4ad98;
      }
      .gallery {
        position: relative;
        perspective: 1450px;
        height: 530px;
        min-height: 530px;
        width: 100%;
        max-width: 1240px;
        margin: 7px auto 18px;
        overflow: hidden;
        isolation: isolate;
        --look-x: 0deg;
        --look-y: 0deg;
      }
      .project {
        min-width: 0;
        padding: 0;
        border: 0;
        background: none;
        color: #c3c9bb;
        cursor: pointer;
        transition:
          transform 0.55s cubic-bezier(0.2, 0.75, 0.2, 1),
          opacity 0.4s;
        transform-style: preserve-3d;
        outline-offset: 6px;
      }
      .project svg {
        display: block;
        width: 100%;
        height: auto;
        filter: grayscale(1);
        box-shadow: 12px 20px 30px #0008;
      }
      .project .caption {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        font:
          8px ui-monospace,
          monospace;
        letter-spacing: 0.04em;
        text-align: left;
        gap: 6px;
        opacity: 0.55;
        transition: opacity 0.2s;
      }
      .project .caption small {
        color: #717a66;
      }
      .project:hover .caption,
      .project:focus-visible .caption {
        opacity: 1;
      }
      .gallery[data-layout="scatter"] .project {
        position: absolute;
        width: clamp(165px, 20%, 250px);
        left: var(--sx);
        top: var(--sy);
        transform: translate(-50%, -50%) translateZ(var(--depth))
          rotateY(calc(var(--tilt) + var(--look-y))) rotateX(var(--look-x)) rotateZ(var(--twist));
        opacity: 0.85;
        z-index: var(--order);
      }
      .gallery[data-layout="scatter"] .project:hover,
      .gallery[data-layout="scatter"] .project:focus-visible {
        opacity: 1;
        z-index: 30;
        transform: translate(-50%, -50%) translateZ(125px) rotateY(0deg) rotateZ(0deg);
      }
      .gallery[data-layout="grid"] {
        display: grid;
        height: auto;
        min-height: 530px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
        max-width: 920px;
        padding: 23px 30px;
        overflow: visible;
      }
      .gallery[data-layout="grid"] .project {
        max-width: 240px;
        width: 100%;
        justify-self: center;
      }
      .gallery[data-layout="grid"] .project:hover {
        transform: translateY(-6px);
      }
      .gallery[data-layout="orbit"] {
        height: 540px;
        min-height: 540px;
      }
      .gallery[data-layout="orbit"] .project {
        position: absolute;
        width: 260px;
        left: calc(50% - 130px);
        top: 85px;
        transform: translateX(var(--x)) translateZ(var(--z)) rotateY(var(--r));
        opacity: var(--opacity);
        z-index: var(--order);
      }
      .gallery[data-layout="orbit"] .project:not([data-center="true"]) .caption {
        visibility: hidden;
      }
      .project[hidden] {
        display: none !important;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-top: 6px;
      }
      .arrows {
        display: flex;
        gap: 7px;
      }
      .arrows button {
        border: 1px solid #4a5144;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        color: #dce1d3;
        background: none;
        cursor: pointer;
      }
      .arrows[hidden] {
        display: none;
      }
      #status {
        font:
          9px/1.6 ui-monospace,
          monospace;
        color: #929b85;
      }
      .edition {
        font:
          8px ui-monospace,
          monospace;
        letter-spacing: 0.12em;
        color: #616c57;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 5px;
      }
      dialog {
        width: min(750px, calc(100vw - 32px));
        max-height: calc(100vh - 40px);
        overflow: auto;
        padding: 0;
        background: #e8e7df;
        border: 0;
        border-radius: 4px;
        color: #30382c;
      }
      dialog::backdrop {
        background: #060a07d9;
        backdrop-filter: blur(6px);
      }
      .dialog-inner {
        padding: 24px;
      }
      .dialog-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font:
          10px ui-monospace,
          monospace;
        color: #87917c;
      }
      .close {
        background: none;
        border: 1px solid #a5ad98;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        color: #44513a;
        cursor: pointer;
      }
      .case-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 27px;
        align-items: center;
        margin-top: 18px;
      }
      #case-art svg {
        width: 100%;
        height: auto;
        display: block;
        filter: grayscale(1);
      }
      h2 {
        font:
          32px/1.1 Georgia,
          serif;
        margin: 8px 0 15px;
      }
      #case-story {
        font: 12px/1.8 system-ui;
        color: #707b66;
      }
      .case-note {
        font: 10px system-ui;
        color: #88967c;
        border-top: 1px solid #bcc4b1;
        padding-top: 13px;
        margin-top: 20px;
      }
      @media (max-width: 650px) {
        main {
          padding: 22px 18px;
        }
        .mast {
          font-size: 7px;
        }
        .intro {
          display: block;
          margin: 22px 0 13px;
        }
        h1 {
          font-size: 19px;
          max-width: 100%;
          margin-bottom: 7px;
        }
        .sub {
          font-size: 10px;
          max-width: 360px;
        }
        .gallery {
          height: 490px;
          min-height: 490px;
          margin-left: -18px;
          width: calc(100% + 36px);
        }
        .gallery[data-layout="scatter"] .project {
          width: 43%;
          min-width: 138px;
          max-width: 200px;
          left: var(--mx);
          top: var(--my);
          transform: translate(-50%, -50%) translateZ(0) rotateY(var(--tilt)) rotateZ(var(--twist));
        }
        .gallery[data-layout="scatter"] .project:hover,
        .gallery[data-layout="scatter"] .project:focus-visible {
          transform: translate(-50%, -50%) translateZ(15px) rotate(0);
        }
        .gallery[data-layout="grid"] {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 25px 18px;
          padding: 20px;
          height: auto;
          min-height: 0;
        }
        .tools {
          gap: 5px;
        }
        .tools button {
          font-size: 8px;
          padding: 7px 5px;
        }
        .gallery[data-layout="orbit"] {
          height: 460px;
          min-height: 460px;
        }
        .gallery[data-layout="orbit"] .project {
          width: 210px;
          left: calc(50% - 105px);
          top: 78px;
        }
        .edition {
          display: none;
        }
        .case-grid {
          grid-template-columns: 1fr;
        }
        #case-art {
          max-width: 230px;
          margin: auto;
        }
        h2 {
          font-size: 28px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
        .gallery[data-layout="scatter"] .project {
          transform: translate(-50%, -50%) translateZ(var(--depth)) rotateY(var(--tilt))
            rotateZ(var(--twist));
        }
        .gallery[data-layout="grid"] .project:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mast">
        <span class="mark">
          <i></i>
          PEBBLE / INDEPENDENT STUDIO
        </span>
        <span data-zh="作品与日常 · 2024—2026" data-en="WORK & EVERYDAY / 2024—2026">
          作品与日常 · 2024—2026
        </span>
      </div>
      <div class="intro">
        <h1>每个作品，都有故事。</h1>
        <p class="sub" id="subtitle">翻阅一间独立工作室的创作笔记，发现每个小作品背后的想法。</p>
      </div>
      <div class="tools">
        <div role="group" aria-label="项目筛选" id="filters">
          <button data-filter="all" aria-pressed="true" data-zh="全部作品" data-en="All work">
            全部作品
          </button>
          <button data-filter="object" aria-pressed="false" data-zh="物件" data-en="Objects">
            物件
          </button>
          <button data-filter="space" aria-pressed="false" data-zh="空间" data-en="Spaces">
            空间
          </button>
          <button data-filter="print" aria-pressed="false" data-zh="印刷" data-en="Print">
            印刷
          </button>
        </div>
        <div role="group" aria-label="画布布局" id="layouts">
          <button data-layout="scatter" aria-pressed="true" data-zh="散落" data-en="Scatter">
            散落
          </button>
          <button data-layout="grid" aria-pressed="false" data-zh="整齐" data-en="Grid">
            整齐
          </button>
          <button data-layout="orbit" aria-pressed="false" data-zh="环绕" data-en="Orbit">
            环绕
          </button>
        </div>
      </div>
      <div class="gallery" data-layout="scatter" id="gallery"></div>
      <div class="controls">
        <div
          id="status"
          role="status"
          data-zh="六个小作品。点击一张，读读它的故事。"
          data-en="Six little works. Pick one to read its story."
        >
          六个小作品。点击一张，读读它的故事。
        </div>
        <span class="edition">SMALL WORKS / OPEN POSSIBILITIES</span>
        <div class="arrows" id="arrows" hidden>
          <button id="previous" aria-label="上一个作品">←</button>
          <button id="next" aria-label="下一个作品">→</button>
        </div>
      </div>
    </main>
    <dialog id="case">
      <div class="dialog-inner">
        <div class="dialog-top">
          <span id="case-type"></span>
          <button class="close" id="close" aria-label="关闭故事">×</button>
        </div>
        <div class="case-grid">
          <div id="case-art"></div>
          <div>
            <h2 id="case-title"></h2>
            <p id="case-story"></p>
            <div
              class="case-note"
              data-zh="一段虚构的工作室创作札记，供作品集演示使用。"
              data-en="A fictional studio study for this portfolio demonstration."
            >
              一段虚构的工作室创作札记，供作品集演示使用。
            </div>
          </div>
        </div>
      </div>
    </dialog>

              '<ellipse cx="145" cy="216" rx="82" ry="12" fill="#252c2322"/><path d="M138 119H153V205H138Z" fill="#82765c"/><ellipse cx="145" cy="207" rx="51" ry="9" fill="#8b8064"/><path d="M61 127Q75 37 145 39Q219 43 233 127Z" fill="#5e6d58"/><ellipse cx="147" cy="127" rx="86" ry="15" fill="#f4dda3"/>';
          if (i === 1)
            shapes =
              '<path d="M38 270V93Q38 15 115 15Q192 15 192 93V270" fill="#c9c3a9"/><path d="M65 270V99Q65 44 115 44Q164 44 164 99V270" fill="#6c7560"/><path d="M106 270V123Q106 68 158 68Q211 68 211 123V270" fill="#a6ae92"/><path d="M132 270V130Q132 99 158 99Q185 99 185 130V270" fill="#434f40"/><path d="M198 0H300V270H226V112Q226 35 198 0" fill="#898f77"/>';
          if (i === 2)
            shapes =
              '<g transform="rotate(-12 145 133)"><rect x="60" y="39" width="182" height="214" fill="#989d84"/><rect x="50" y="30" width="182" height="214" fill="#ede9d6"/><path d="M70 31V241" stroke="#cacbb4"/><path d="M140 207V98M140 154Q93 151 97 115Q138 117 140 154M140 185Q185 178 186 143Q145 147 140 185" stroke="#5d7257" fill="none" stroke-width="3"/><text x="90" y="69" fill="#505d47" font-family="Georgia" font-size="17">SUNDAY</text></g>';
          if (i === 3)
            shapes =
              '<ellipse cx="148" cy="228" rx="83" ry="10" fill="#574b3d22"/><path d="M115 68Q155 50 186 66L177 108Q227 140 207 210Q161 249 93 216Q73 155 117 111Z" fill="#9a6c57"/><ellipse cx="150" cy="65" rx="37" ry="9" fill="#614b3f"/><path d="M146 76Q151 151 125 213" fill="none" stroke="#c49a7f" stroke-width="14" opacity=".5"/>';
          if (i === 4)
            shapes =
              '<rect x="39" y="17" width="189" height="173" fill="#8f9f86"/><path d="M48 24H219V180H48Z" fill="#dce0c6"/><path d="M132 23V179M46 105H219" stroke="#7c8a70" stroke-width="7"/><path d="M20 211H267V224H20Z" fill="#88775b"/><path d="M42 224V264M247 224V264" stroke="#71644e" stroke-width="9"/><path d="M186 160H228L222 200H194Z" fill="#ac7e61"/><path d="M207 170V117M207 146Q168 143 175 115Q204 118 207 146M207 157Q237 149 239 129Q209 133 207 157" fill="#516747"/>';
          if (i === 5)
            shapes =
              '<g fill="none" stroke="#c6bc9f" stroke-width="3">' +
              Array.from(
                { length: 12 },
                (_, n) =>
                  `<ellipse cx="150" cy="135" rx="${30 + n * 8}" ry="${15 + n * 9}" transform="rotate(${n * 4} 150 135)"/>`,
              ).join("") +
              '</g><circle cx="150" cy="135" r="9" fill="' +
              config.accent +
              '"/>';
          const id = "study" + i + instance;
          shapes = shapes.replace(/#5e6d58|#9a6c57/g, "url(#" + id + "object)");
          return `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="375" viewBox="0 0 300 375" aria-hidden="true"><defs><linearGradient id="${id}paper" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="${paper}"/><stop offset="1" stop-color="${ink}"/></linearGradient><linearGradient id="${id}object"><stop stop-color="#c7c9b7"/><stop offset=".35" stop-color="#8b927d"/><stop offset=".76" stop-color="#4b5845"/><stop offset="1" stop-color="#78836a"/></linearGradient><radialGradient id="${id}light" cx=".22" cy=".16" r=".95"><stop stop-color="#fff" stop-opacity=".24"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient><filter id="${id}shade" x="-.4" y="-.3" width="1.8" height="1.8"><feDropShadow dx="14" dy="18" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter></defs><rect width="300" height="375" fill="url(#${id}paper)"/>${[0, 3].includes(i) ? '<path d="M0 292L300 257V375H0Z" fill="#292d24" opacity=".24"/><path d="M0 52L176 0H211L0 208Z" fill="#fff" opacity=".10"/>' : ""}<g transform="translate(0 42)" filter="url(#${id}shade)">${shapes}</g><rect width="300" height="375" fill="url(#${id}light)"/><rect x=".5" y=".5" width="299" height="374" fill="none" stroke="#fff" opacity=".07"/></svg>`;
        }
        let filter = "all",
          layout = "scatter",
          index = 0,
          opener = null;
        const gallery = document.querySelector("#gallery"),
          status = document.querySelector("#status"),
          dialog = document.querySelector("#case"),
          buttons = [];
        function visible() {
          return works.map((w, i) => i).filter((i) => filter === "all" || works[i].type === filter);
        }
        function arrange() {
          const ids = visible();
          index = ((index % ids.length) + ids.length) % ids.length;
          gallery.dataset.layout = layout;
          const composition = [
            [17, 36, -60, -12, -5, 25, 22],
            [39, 30, 55, 7, 3, 70, 24],
            [62, 35, 20, -9, -2, 30, 53],
            [79, 56, 80, -15, 2, 73, 56],
            [54, 73, -30, 8, -3, 28, 83],
            [30, 73, 45, -5, 5, 71, 84],
          ];
          buttons.forEach((b, i) => {
            b.hidden = !ids.includes(i);
            const pos = ids.indexOf(i),
              angle = ((pos - index) * 2 * Math.PI) / ids.length;
            const center = pos === index,
              pose =
                ids.length === 2
                  ? [
                      [34, 50, 15, -9, -4, 32, 42],
                      [66, 55, 40, 9, 4, 68, 65],
                    ][Math.max(0, pos)]
                  : composition[Math.max(0, pos)];
            b.style.setProperty("--sx", pose[0] + "%");
            b.style.setProperty("--sy", pose[1] + "%");
            b.style.setProperty("--depth", pose[2] + "px");
            b.style.setProperty("--tilt", pose[3] + "deg");
            b.style.setProperty("--twist", pose[4] + "deg");
            b.style.setProperty("--mx", pose[5] + "%");
            b.style.setProperty("--my", pose[6] + "%");
            b.style.setProperty("--x", Math.sin(angle) * 365 + "px");
            b.style.setProperty("--z", (Math.cos(angle) - 1) * 275 + "px");
            b.style.setProperty("--r", -Math.sin(angle) * 63 + "deg");
            b.style.setProperty("--opacity", String(center ? 1 : 0.53));
            b.style.setProperty(
              "--order",
              String(
                layout === "scatter"
                  ? Math.round(pose[2] / 20 + 6)
                  : Math.round(Math.cos(angle) * 10 + 10),
              ),
            );
            b.dataset.center = String(center);
          });
          document.querySelector("#arrows").hidden = layout !== "orbit";
          status.textContent =
            layout === "orbit"
              ? L("正在环绕：", "In orbit: ") + works[ids[index]].name[en ? 1 : 0]
              : ids.length + L(" 个作品 · 点击阅读故事", " projects · pick one to read its story");
        }
        works.forEach((w, i) => {
          const b = document.createElement("button");
          b.className = "project";
          b.innerHTML =
            art(i) +
            '<span class="caption"><span>' +
            w.name[en ? 1 : 0] +
            "</span><small>" +
            w.year +
            "</small></span>";
          b.setAttribute("aria-label", L("阅读：", "Read: ") + w.name[en ? 1 : 0]);
          b.addEventListener("click", () => {
            opener = b;
            document.querySelector("#case-art").innerHTML = art(i, "detail");
            document.querySelector("#case-title").textContent = w.name[en ? 1 : 0];
            document.querySelector("#case-story").textContent = w.story[en ? 1 : 0];
            document.querySelector("#case-type").textContent =
              w.type.toUpperCase() + " / " + w.year;
            dialog.showModal();
            document.querySelector("#close").focus();
          });
          b.addEventListener("focus", () => {
            if (layout === "orbit") {
              index = visible().indexOf(i);
              arrange();
            }
          });
          gallery.append(b);
          buttons.push(b);
        });
        document.querySelectorAll("[data-filter]").forEach((b) =>
          b.addEventListener("click", () => {
            filter = b.dataset.filter;
            index = 0;
            document
              .querySelectorAll("[data-filter]")
              .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            arrange();
          }),
        );
        document.querySelectorAll("#layouts [data-layout]").forEach((b) =>
          b.addEventListener("click", () => {
            layout = b.dataset.layout;
            document
              .querySelectorAll("#layouts [data-layout]")
              .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            arrange();
          }),
        );
        const still = matchMedia("(prefers-reduced-motion: reduce)");
        gallery.addEventListener("pointermove", (e) => {
          if (layout !== "scatter" || still.matches) return;
          const b = gallery.getBoundingClientRect();
          gallery.style.setProperty(
            "--look-x",
            (-(e.clientY - b.top) / b.height + 0.5) * 4 + "deg",
          );
          gallery.style.setProperty("--look-y", ((e.clientX - b.left) / b.width - 0.5) * 6 + "deg");
        });
        gallery.addEventListener("pointerleave", () => {
          gallery.style.setProperty("--look-x", "0deg");
          gallery.style.setProperty("--look-y", "0deg");
        });
        document.querySelector("#previous").addEventListener("click", () => {
          index--;
          arrange();
        });
        document.querySelector("#next").addEventListener("click", () => {
          index++;
          arrange();
        });
        document
          .querySelector("#previous")
          .setAttribute("aria-label", L("上一个作品", "Previous project"));
        document.querySelector("#next").setAttribute("aria-label", L("下一个作品", "Next project"));
        document.querySelector("#close").setAttribute("aria-label", L("关闭故事", "Close story"));
        document.querySelector("#close").addEventListener("click", () => dialog.close());
        dialog.addEventListener("close", () => opener?.focus());
        dialog.setAttribute("aria-labelledby", "case-title");
        document
          .querySelector("#filters")
          .setAttribute("aria-label", L("项目筛选", "Filter projects"));
        document
          .querySelector("#layouts")
          .setAttribute("aria-label", L("画布布局", "Canvas layout"));
        arrange();
      })();
    </script>
  </body>
</html>
