<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A little gloss goes a long way.</title>
    <style>
      :root {
        --accent: #6f4b99;
        --bg: #f3f0e9;
        --ink: #261e33;
        --muted: #504561;
        --rule: rgba(54, 40, 74, 0.14);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 64% 56% at 14% 12%, rgba(226, 206, 248, 0.42), transparent 68%),
          radial-gradient(ellipse 58% 52% at 88% 18%, rgba(255, 224, 214, 0.4), transparent 66%),
          radial-gradient(ellipse 68% 54% at 62% 94%, rgba(206, 236, 244, 0.36), transparent 72%);
        color: var(--ink);
        font:
          14px/1.55 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Hiragino Sans GB",
          "Noto Sans CJK SC",
          system-ui,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 1080px;
        margin: 0 auto;
        padding: 18px 32px 22px;
      }
      .mast {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 11px;
        font:
          600 11px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        letter-spacing: 0.13em;
        color: var(--muted);
      }
      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 28px;
        margin: 18px 0 18px;
      }
      h1 {
        font:
          600 clamp(32px, 4.1vw, 50px)/1.08 "Iowan Old Style",
          "Palatino Linotype",
          Georgia,
          "Songti SC",
          "Noto Serif CJK SC",
          serif;
        letter-spacing: -0.035em;
        margin: 0;
        overflow-wrap: anywhere;
        text-wrap: balance;
        color: #1f172b;
      }
      :lang(zh) h1 {
        font-size: clamp(30px, 3.5vw, 44px);
        line-height: 1.16;
        letter-spacing: -0.015em;
        word-break: keep-all;
      }
      .sub {
        color: var(--muted);
        line-height: 1.62;
        font-size: 13.5px;
        margin: 0;
        max-width: 390px;
        text-wrap: pretty;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1.38fr) minmax(268px, 0.78fr);
        gap: 22px;
        align-items: stretch;
      }
      .shelf {
        padding: 20px 18px;
        background: linear-gradient(
          165deg,
          rgba(255, 255, 255, 0.88) 0%,
          rgba(251, 248, 255, 0.82) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.92);
        border-radius: 26px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 1),
          0 20px 44px rgba(58, 38, 88, 0.08),
          0 2px 8px rgba(58, 38, 88, 0.05),
          0 0 0 1px rgba(84, 64, 112, 0.1);
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        align-content: center;
      }
      .sweet {
        border: 1.5px solid transparent;
        background: rgba(255, 255, 255, 0.45);
        padding: 10px 8px 12px;
        border-radius: 18px;
        cursor: pointer;
        min-width: 0;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          transform 0.24s cubic-bezier(0.22, 0.85, 0.3, 1),
          box-shadow 0.24s ease;
        color: var(--ink);
        -webkit-tap-highlight-color: transparent;
      }
      @media (hover: hover) {
        .sweet:hover {
          transform: translateY(-4px);
          background: rgba(255, 255, 255, 0.9);
          box-shadow: 0 12px 24px rgba(58, 38, 88, 0.09);
        }
      }
      .sweet[aria-pressed="true"] {
        background: linear-gradient(180deg, #ffffff, #f3edf9);
        border-color: color-mix(in srgb, var(--accent) 55%, #ffffff 45%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 1),
          0 12px 24px color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .sweet svg {
        width: 100%;
        height: auto;
        max-width: 146px;
        display: block;
        margin: 0 auto 2px;
        overflow: visible;
      }
      .sweet span {
        display: block;
        font:
          600 11.5px/1.2 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        color: var(--ink);
        letter-spacing: 0.01em;
      }
      .panel {
        border: 1px solid rgba(255, 255, 255, 0.92);
        border-radius: 26px;
        padding: 18px 22px 18px;
        background: linear-gradient(
          165deg,
          rgba(255, 255, 255, 0.84) 0%,
          rgba(247, 242, 253, 0.78) 100%
        );
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 1),
          0 20px 44px rgba(58, 38, 88, 0.09),
          0 0 0 1px rgba(84, 64, 112, 0.12);
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      #large {
        width: 100%;
        max-width: 196px;
        margin: 0 auto 4px;
        padding: 6px;
        border-radius: 20px;
        background: radial-gradient(circle at 50% 48%, rgba(255, 255, 255, 0.85), transparent 72%);
      }
      #large svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
        transition: transform 0.25s ease;
      }
      .controls label {
        font:
          600 12px/1.2 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 12px 0 6px;
        color: var(--ink);
      }
      .controls output {
        font:
          600 11.5px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(82, 58, 118, 0.08);
        color: var(--ink);
      }
      .controls input[type="color"] {
        width: 44px;
        height: 28px;
        border: 2px solid #ffffff;
        border-radius: 999px;
        background: transparent;
        padding: 0;
        cursor: pointer;
        box-shadow:
          0 2px 6px rgba(40, 26, 60, 0.16),
          0 0 0 1px rgba(40, 26, 60, 0.15);
      }
      .controls input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .controls input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 999px;
      }
      .controls input[type="range"] {
        width: 100%;
        height: 6px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .download {
        width: 100%;
        border: 1px solid color-mix(in srgb, var(--accent) 85%, #000 15%);
        background-color: var(--accent);
        background-image: linear-gradient(
          180deg,
          color-mix(in srgb, var(--accent) 88%, #fff 12%),
          var(--accent)
        );
        color: #ffffff;
        border-radius: 999px;
        padding: 12px 14px;
        font:
          600 13px/1.2 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        cursor: pointer;
        margin-top: 14px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.28) inset,
          0 10px 20px color-mix(in srgb, var(--accent) 28%, transparent);
        transition:
          transform 0.16s ease,
          box-shadow 0.16s ease,
          filter 0.16s ease;
        -webkit-tap-highlight-color: transparent;
      }
      @media (hover: hover) {
        .download:hover {
          transform: translateY(-1px);
          filter: brightness(1.05);
          box-shadow:
            0 1px 0 rgba(255, 255, 255, 0.34) inset,
            0 13px 24px color-mix(in srgb, var(--accent) 34%, transparent);
        }
      }
      .reset {
        border: 0;
        background: transparent;
        text-decoration: underline;
        text-underline-offset: 3px;
        color: var(--muted);
        font:
          600 12px/1.2 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 34px;
        padding: 6px 12px;
        width: 100%;
        margin: 6px auto 0;
      }
      @media (hover: hover) {
        .reset:hover {
          color: var(--ink);
        }
      }
      #status {
        font:
          500 12px/1.5 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        min-height: 22px;
        color: var(--muted);
        margin: 14px 0 0;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2.5px solid var(--accent);
        outline-offset: 3px;
      }
      .foot {
        font:
          600 10.5px/1.4 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        letter-spacing: 0.11em;
        color: var(--muted);
        margin-top: 14px;
        border-top: 1px solid var(--rule);
        padding-top: 11px;
      }
      @media (max-width: 760px) {
        main {
          padding: 18px 16px 22px;
        }
        .header-row {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
          margin: 14px 0 16px;
        }
        .sub {
          max-width: 100%;
        }
        .workspace {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .shelf {
          padding: 14px 10px;
          gap: 8px;
          border-radius: 20px;
        }
        .sweet {
          padding: 6px 4px 10px;
          border-radius: 14px;
        }
        .sweet svg {
          max-width: 116px;
        }
        .panel {
          display: grid;
          grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
          gap: 14px;
          align-items: center;
          padding: 16px;
          border-radius: 20px;
        }
        #large {
          margin: auto;
        }
        .mast {
          font-size: 9.5px;
          letter-spacing: 0.08em;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
        .sweet:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mast">
        <span>SUGAR / OBJECT LIBRARY</span>
        <span data-zh="六枚小图标 · 一点好心情" data-en="SIX LITTLE OBJECTS · GOOD FEELINGS">
          六枚小图标 · 一点好心情
        </span>
      </div>
      <div class="header-row">
        <h1>A little gloss goes a long way.</h1>
        <p class="sub" id="subtitle">Pick a shape, tune the light, and take a little happy icon home.</p>
      </div>
      <div class="workspace">
        <section class="shelf" id="shelf" role="group" aria-label="图标选择"></section>
        <aside class="panel">
          <div id="large" aria-label="选中图标预览"></div>
          <div class="controls">
            <label for="color">
              <span data-zh="糖衣颜色" data-en="Candy color">糖衣颜色</span>
              <input type="color" id="color" value="#b282d0" />
            </label>
            <label for="light">
              <span data-zh="高光亮度" data-en="Gloss intensity">高光亮度</span>
              <output id="light-value">70%</output>
            </label>
            <input id="light" type="range" min="0" max="100" value="70" />
            <label for="tilt">
              <span data-zh="摆放角度" data-en="Playful tilt">摆放角度</span>
              <output id="tilt-value">0°</output>
            </label>
            <input id="tilt" type="range" min="-20" max="20" value="0" />
            <button
              class="download"
              id="download"
              data-zh="带走这枚 SVG ↓"
              data-en="Download this SVG ↓"
            >
              带走这枚 SVG ↓
            </button>
            <button class="reset" id="reset" data-zh="恢复这枚的原色" data-en="Reset this icon">
              恢复这枚的原色
            </button>
          </div>
        </aside>
      </div>
      <p
        id="status"
        role="status"
        data-zh="选一枚，调一束光，把快乐带走。"
        data-en="Pick a sweet, shape the light, keep a little joy."
      >
        选一枚，调一束光，把快乐带走。
      </p>
      <div class="foot">SOFT EDGES. BRIGHT IDEAS. / VECTOR CANDY COLLECTION</div>
    </main>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {};
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(
              /Packed ([\d,]+) bytes\. CRC32 ([0-9a-f]+)\. Download contains the complete file, ready to decode\./gi,
              "已打包 $1 字节。CRC32 $2。下载文件包含完整内容，可直接解码。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
          applyLanguage(resolved);
        };

        function boot() {
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;
          if (chinese) applyLanguage("zh");

          let langObserver;
          if (typeof MutationObserver === "function") {
            langObserver = new MutationObserver(() => {
              const next =
                normalizeLang(document.documentElement.dataset.skillLang) || resolveLang();
              if (next !== currentLang) applyLanguage(next);
            });
            langObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skill-lang"],
            });
            window.addEventListener("pagehide", () => langObserver.disconnect(), { once: true });
          }

          if (parent === window) return;
          // Freeze viewport-based demo heights before measuring, avoiding vh feedback
          // when the parent grows the iframe. Intentional inner demo scrollers remain.
          const initialHeight = Math.max(360, Math.min(760, innerHeight));
          function fixRules(rules) {
            for (const rule of rules) {
              if (rule.cssRules) fixRules(rule.cssRules);
              if (!rule.style) continue;
              if (/v[hbs]/.test(rule.style.minHeight))
                rule.style.setProperty("min-height", "0", "important");
              if (/v[hbs]/.test(rule.style.height))
                rule.style.setProperty("height", `${initialHeight}px`, "important");
            }
          }
          for (const sheet of document.styleSheets) {
            try {
              fixRules(sheet.cssRules);
            } catch {
              /* Same-file styles are sufficient. */
            }
          }
          for (const element of [document.documentElement, document.body]) {
            element.style.setProperty("height", "auto", "important");
            element.style.setProperty("min-height", "0", "important");
          }
          document.documentElement.style.overflowX = "clip";
          let frame = 0,
            lastHeight = 0;
          const measure = () => {
            frame = 0;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height),
            );
            if (height > 0 && height <= 20000 && height !== lastHeight) {
              lastHeight = height;
              parent.postMessage({ type: "usefulshelf:resize", height }, "*");
            }
          };
          const schedule = () => {
            if (!frame) frame = requestAnimationFrame(measure);
          };
          const observer = new ResizeObserver(schedule);
          observer.observe(document.body);
          window.addEventListener("resize", schedule);
          const onMessage = (event) => {
            if (event.source === parent && event.data?.type === "usefulshelf:measure") {
              // The first resize may precede parent hydration. A measurement request
              // must acknowledge even an unchanged height, so that message is recovered.
              lastHeight = 0;
              schedule();
            }
          };
          window.addEventListener("message", onMessage);
          document.fonts?.ready.then(schedule);
          window.addEventListener(
            "pagehide",
            () => {
              observer.disconnect();
              cancelAnimationFrame(frame);
              window.removeEventListener("resize", schedule);
              window.removeEventListener("message", onMessage);
            },
            { once: true },
          );
          schedule();
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        else boot();
      })();
    </script>
    <!-- usefulshelf-runtime:end -->
    <script>
      (() => {
        "use strict";
        const config = window.__usefulshelfConfigure({"title": "A little gloss goes a long way.", "subtitle": "Pick a shape, tune the light, and take a little happy icon home.", "accent": "#6f4b99", "bg": "#f3f0e9", "customTitle": false, "customSubtitle": false}),
          resolvedLang =
            new URLSearchParams(location.search).get("lang") ||
            document.documentElement.dataset.skillLang ||
            (/^zh/i.test(document.documentElement.lang) ? "zh" : "en"),
          en = resolvedLang !== "zh",
          L = (a, b) => (en ? b : a);
        document.documentElement.lang = en ? "en" : "zh-CN";
        document
          .querySelectorAll("[data-en]")
          .forEach((e) => (e.textContent = e.dataset[en ? "en" : "zh"]));
        const resolvedTitle = config.customTitle
          ? config.title
          : L("给界面，一点甜。", "A little gloss goes a long way.");
        document.querySelector("h1").textContent = resolvedTitle;
        document.title = resolvedTitle;
        if (!config.customSubtitle)
          document.querySelector("#subtitle").textContent = L(
            "挑一个形状，调一束光，把喜欢的小图标带走。",
            "Pick a shape, tune the light, and take a little happy icon home.",
          );
        const names = [
            ["相机", "Camera"],
            ["对话", "Conversation"],
            ["星光", "Sparkle"],
            ["天气", "Weather"],
            ["花朵", "Flower"],
            ["书本", "Book"],
          ],
          defaults = ["#5c7ee6", "#6fc458", "#e56bb0", "#45b6dd", "#a874dc", "#f0a943"],
          colors = [...defaults],
          shelf = document.querySelector("#shelf"),
          large = document.querySelector("#large"),
          color = document.querySelector("#color"),
          light = document.querySelector("#light"),
          tilt = document.querySelector("#tilt"),
          status = document.querySelector("#status");
        let selected = 4;
        const values = names.map(() => ({ gloss: 70, tilt: 0 }));

        function symbol(i, id) {
          if (i === 0)
            return `<rect x="55" y="68" width="90" height="66" rx="18"/>
              <path d="M76 68L84 55H116L124 68Z"/>
              <circle cx="100" cy="102" r="24" fill="#d8dae8"/>
              <circle cx="100" cy="102" r="19" fill="#46455d"/>
              <circle cx="100" cy="102" r="12" fill="url(#${id}lens)"/>
              <circle cx="106" cy="96" r="4.8" fill="#ffffff" opacity=".88"/>
              <circle cx="94" cy="107" r="2.2" fill="#99e2ff" opacity=".75"/>
              <circle cx="131" cy="82" r="4.5" fill="#fff7cc"/>`;
          if (i === 1)
            return `<path d="M54 98Q52 61 100 60Q147 60 148 97Q149 132 104 135L81 151L78 131Q54 124 54 98Z"/>
              <circle cx="84" cy="93" r="5" fill="#2d5a30"/>
              <circle cx="82.5" cy="91.5" r="1.6" fill="#ffffff"/>
              <circle cx="117" cy="93" r="5" fill="#2d5a30"/>
              <circle cx="115.5" cy="91.5" r="1.6" fill="#ffffff"/>
              <ellipse cx="74" cy="104" rx="6" ry="3.5" fill="#ff96b0" opacity=".45"/>
              <ellipse cx="127" cy="104" rx="6" ry="3.5" fill="#ff96b0" opacity=".45"/>
              <path d="M84 109Q100 123 117 109" fill="none" stroke="#2d5a30" stroke-width="4.2" stroke-linecap="round"/>`;
          if (i === 2)
            return `<path d="M100 46L115 84L154 100L115 115L100 154L85 115L46 100L85 84Z"/>
              <path d="M100 58L108 88L138 100L108 108L100 138L92 108L62 100L92 88Z" fill="#ffffff" opacity=".45"/>
              <circle cx="142" cy="58" r="7" fill="#fff8d6"/>
              <circle cx="56" cy="140" r="4.5" fill="#fff8d6"/>
              <circle cx="138" cy="138" r="3" fill="#ffffff" opacity=".85"/>`;
          if (i === 3)
            return `<circle cx="126" cy="79" r="28" fill="url(#${id}sun)"/>
              <circle cx="126" cy="79" r="34" fill="#ffe78f" opacity=".28"/>
              <path d="M58 132Q36 130 41 109Q45 93 64 91Q68 67 93 70Q114 71 119 92Q146 90 149 112Q151 134 126 134Z"/>
              <path d="M68 99Q84 85 106 95" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".65"/>`;
          if (i === 4)
            return `<g>
                <ellipse cx="100" cy="74" rx="19" ry="33"/>
                <ellipse cx="100" cy="74" rx="19" ry="33" transform="rotate(72 100 102)"/>
                <ellipse cx="100" cy="74" rx="19" ry="33" transform="rotate(144 100 102)"/>
                <ellipse cx="100" cy="74" rx="19" ry="33" transform="rotate(216 100 102)"/>
                <ellipse cx="100" cy="74" rx="19" ry="33" transform="rotate(288 100 102)"/>
              </g>
              <circle cx="100" cy="102" r="20" fill="url(#${id}sun)"/>
              <circle cx="95" cy="96" r="5" fill="#ffffff" opacity=".65"/>`;
          return `<g transform="rotate(-8 100 102)">
              <rect x="66" y="61" width="76" height="92" rx="11" fill="#8b5a2f"/>
              <rect x="59" y="55" width="76" height="92" rx="11"/>
              <path d="M72 56V146" stroke="#d5bb93" stroke-width="3.5"/>
              <path d="M107 55V77L113 72L119 77V55Z" fill="#e25d52"/>
              <path d="M84 82H121M84 95H114M84 118H116" stroke="#9e764d" stroke-width="5" stroke-linecap="round"/>
            </g>`;
        }

        function svg(i, id) {
          const v = values[i],
            c = colors[i],
            g = v.gloss / 100;
          return `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="216" viewBox="0 0 200 216" role="img" aria-label="${names[i][en ? 1 : 0]}">
            <defs>
              <radialGradient id="${id}caustic" cx=".5" cy=".5" r=".5">
                <stop offset="0" stop-color="${c}" stop-opacity=".46"/>
                <stop offset=".65" stop-color="${c}" stop-opacity=".16"/>
                <stop offset="1" stop-color="${c}" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="${id}body" cx=".34" cy=".24" r=".78">
                <stop offset="0" stop-color="#ffffff" stop-opacity="${(0.52 + g * 0.28).toFixed(2)}"/>
                <stop offset=".38" stop-color="${c}" stop-opacity=".15"/>
                <stop offset=".78" stop-color="#2a163f" stop-opacity=".22"/>
                <stop offset="1" stop-color="#1d0d2e" stop-opacity=".42"/>
              </radialGradient>
              <radialGradient id="${id}subsurface" cx=".5" cy=".86" r=".58">
                <stop offset="0" stop-color="#ffffff" stop-opacity="${(0.28 + g * 0.34).toFixed(2)}"/>
                <stop offset=".55" stop-color="${c}" stop-opacity=".18"/>
                <stop offset="1" stop-color="${c}" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="${id}dome" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity="${(0.22 + g * 0.72).toFixed(2)}"/>
                <stop offset=".58" stop-color="#ffffff" stop-opacity="${(0.06 + g * 0.22).toFixed(2)}"/>
                <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="${id}rim" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
                <stop offset=".5" stop-color="#ffffff" stop-opacity=".16"/>
                <stop offset="1" stop-color="#ffffff" stop-opacity=".62"/>
              </linearGradient>
              <linearGradient id="${id}symbol" x1=".15" y1="0" x2=".35" y2="1">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset=".68" stop-color="#f6f1fa"/>
                <stop offset="1" stop-color="#dcd2e6"/>
              </linearGradient>
              <linearGradient id="${id}lens" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3a5299"/>
                <stop offset=".5" stop-color="#23243b"/>
                <stop offset="1" stop-color="#5a397a"/>
              </linearGradient>
              <radialGradient id="${id}sun" cx=".35" cy=".32" r=".7">
                <stop offset="0" stop-color="#fff8d1"/>
                <stop offset=".6" stop-color="#ffd563"/>
                <stop offset="1" stop-color="#e89a2c"/>
              </radialGradient>
              <filter id="${id}shadow" x="-.35" y="-.35" width="1.7" height="1.7">
                <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#200d30" flood-opacity=".28"/>
              </filter>
            </defs>
            <ellipse cx="100" cy="193" rx="68" ry="15" fill="url(#${id}caustic)"/>
            <ellipse cx="100" cy="192" rx="46" ry="8" fill="#2a1d3a" opacity=".16"/>
            <g transform="rotate(${v.tilt} 100 100)">
              <circle cx="100" cy="100" r="82" fill="${c}"/>
              <circle cx="100" cy="100" r="82" fill="url(#${id}body)"/>
              <circle cx="100" cy="100" r="82" fill="url(#${id}subsurface)"/>
              <circle cx="100" cy="100" r="78.5" fill="none" stroke="url(#${id}rim)" stroke-width="2.2"/>
              <g fill="url(#${id}symbol)" filter="url(#${id}shadow)">${symbol(i, id)}</g>
              <ellipse cx="100" cy="54" rx="58" ry="30" fill="url(#${id}dome)"/>
              <ellipse cx="68" cy="48" rx="22" ry="11" transform="rotate(-26 68 48)" fill="#ffffff" opacity="${(g * 0.72).toFixed(2)}"/>
              <path d="M46 144Q100 184 154 144" fill="none" stroke="#ffffff" stroke-opacity="${(0.14 + g * 0.34).toFixed(2)}" stroke-width="4.5" stroke-linecap="round"/>
            </g>
          </svg>`;
        }

        function render() {
          shelf.querySelectorAll("button").forEach((b, i) => {
            b.innerHTML = svg(i, "small" + i) + "<span>" + names[i][en ? 1 : 0] + "</span>";
            b.setAttribute("aria-pressed", String(i === selected));
          });
          large.innerHTML = svg(selected, "large");
          color.value = colors[selected];
          light.value = values[selected].gloss;
          tilt.value = values[selected].tilt;
          document.querySelector("#light-value").textContent = light.value + "%";
          document.querySelector("#tilt-value").textContent = tilt.value + "°";
        }

        names.forEach((n, i) => {
          const b = document.createElement("button");
          b.className = "sweet";
          b.setAttribute("aria-label", n[en ? 1 : 0]);
          b.addEventListener("click", () => {
            selected = i;
            render();
            status.textContent = L("正在调制：", "Mixing: ") + n[en ? 1 : 0];
          });
          shelf.append(b);
        });
        shelf.setAttribute("aria-label", L("图标选择", "Choose an icon"));
        large.setAttribute("aria-label", L("选中图标预览", "Selected icon preview"));
        color.addEventListener("input", () => {
          colors[selected] = color.value;
          render();
          status.textContent = L("新糖衣已准备好。", "A fresh coat of candy.");
        });
        light.addEventListener("input", () => {
          values[selected].gloss = Number(light.value);
          render();
        });
        tilt.addEventListener("input", () => {
          values[selected].tilt = Number(tilt.value);
          render();
        });
        document.querySelector("#reset").addEventListener("click", () => {
          colors[selected] = defaults[selected];
          values[selected] = { gloss: 70, tilt: 0 };
          render();
          status.textContent = L(
            "已恢复这枚图标的初始外观。",
            "This icon is back to its original recipe.",
          );
        });
        document.querySelector("#download").addEventListener("click", () => {
          const blob = new Blob([svg(selected, "icon")], { type: "image/svg+xml" }),
            url = URL.createObjectURL(blob),
            a = document.createElement("a");
          a.href = url;
          a.download = "sweet-" + names[selected][1].toLowerCase() + ".svg";
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          status.textContent = L(
            "SVG 已准备好，颜色和高光都保留了。",
            "SVG ready, with your color and lighting intact.",
          );
        });
        render();
      })();
    </script>
  </body>
