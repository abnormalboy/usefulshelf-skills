<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A world in a little switch.</title>
    <style>
      :root {
        --accent: #bd743e;
        --bg: #f4f1e9;
        --ink: #272e28;
        --muted: #4b544b;
        --ease: cubic-bezier(0.22, 0.95, 0.3, 1);
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI",
          sans-serif;
        position: relative;
        overflow-x: clip;
      }
      /* Warm gallery matboard paper atmosphere */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(
          ellipse 78% 58% at 50% 24%,
          rgba(255, 253, 246, 0.78) 0%,
          rgba(255, 250, 240, 0.16) 58%,
          rgba(74, 82, 64, 0.08) 100%
        );
      }
      main {
        position: relative;
        z-index: 1;
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 28px 26px;
        text-align: center;
      }
      .mast {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        font-weight: 550;
        letter-spacing: 0.14em;
        color: #414a40;
        border-top: 1px solid rgba(39, 46, 40, 0.13);
        border-bottom: 1px solid rgba(39, 46, 40, 0.13);
        padding: 10px 4px;
      }
      .mast span:first-child {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .mast span:first-child::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      .hero-head {
        margin: 22px auto 0;
        max-width: 720px;
      }
      h1 {
        font-family: Georgia, "Songti SC", "STSong", "Noto Serif SC", "Times New Roman", serif;
        font-size: clamp(2.15rem, 4.8vw, 3.45rem);
        font-weight: 500;
        line-height: 1.1;
        letter-spacing: -0.035em;
        margin: 0 auto 10px;
        overflow-wrap: anywhere;
        text-wrap: balance;
        color: var(--ink);
      }
      :lang(zh) h1 {
        letter-spacing: -0.015em;
        line-height: 1.18;
      }
      .sub {
        max-width: 48ch;
        margin: 0 auto;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.6;
        text-wrap: pretty;
      }
      /* Gallery Shadow-Box Diorama Arch Frame */
      .diorama-frame {
        max-width: 676px;
        margin: 22px auto 20px;
        padding: 8px;
        border-radius: 174px 174px 30px 30px;
        background: linear-gradient(160deg, #fffdf8 0%, #e7dfd1 60%, #d9cfbe 100%);
        border: 1px solid rgba(68, 72, 58, 0.16);
        box-shadow:
          0 28px 54px -20px rgba(42, 48, 36, 0.24),
          0 8px 18px -6px rgba(42, 48, 36, 0.12),
          inset 0 1px 1px rgba(255, 255, 255, 0.95);
      }
      .scene {
        height: 296px;
        width: 100%;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border-radius: 166px 166px 22px 22px;
        background: linear-gradient(180deg, #7aaec4 0%, #bcd4cc 36%, #f0d49c 74%, #f6be82 100%);
        box-shadow:
          inset 0 8px 24px rgba(42, 52, 44, 0.16),
          inset 0 0 0 1px rgba(255, 255, 255, 0.35);
        transition: background 0.85s ease;
      }
      /* Twilight night sky layer crossfade */
      .scene::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0c162b 0%, #172a4b 44%, #244064 78%, #305173 100%);
        opacity: 0;
        transition: opacity 0.85s ease;
        z-index: 0;
      }
      .scene.night::before {
        opacity: 1;
      }
      /* Subtle northern twilight aurora veil at night */
      .scene::after {
        content: "";
        position: absolute;
        inset: -10% -10% 34% -10%;
        background:
          radial-gradient(
            ellipse 55% 38% at 28% 36%,
            rgba(74, 222, 198, 0.18) 0%,
            rgba(99, 152, 241, 0.12) 48%,
            transparent 76%
          ),
          radial-gradient(ellipse 48% 34% at 72% 28%, rgba(129, 140, 248, 0.16) 0%, transparent 72%);
        opacity: 0;
        transition: opacity 0.9s ease;
        z-index: 0;
        pointer-events: none;
      }
      .scene.night::after {
        opacity: 1;
      }
      /* Golden sun morphing to luminous true-alpha crescent moon */
      .celestial {
        position: absolute;
        left: 65%;
        top: 34px;
        width: 58px;
        height: 58px;
        z-index: 1;
        transition: transform 0.85s var(--ease);
      }
      .celestial svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 0 18px rgba(246, 196, 98, 0.65));
        transition: filter 0.75s ease;
      }
      .sun-halo {
        fill: #face72;
        opacity: 0.24;
        transition:
          opacity 0.75s ease,
          fill 0.75s ease;
      }
      .sun-halo-outer {
        fill: #face72;
        opacity: 0.11;
        transition: opacity 0.75s ease;
      }
      .celestial-disc {
        fill: url(#sunGrad);
        transition: opacity 0.75s ease;
      }
      .celestial-moon {
        fill: url(#moonGrad);
        opacity: 0;
        transition: opacity 0.75s ease;
      }
      .moon-cut {
        transform: translate(58px, -42px);
        opacity: 0;
        transition:
          transform 0.85s var(--ease),
          opacity 0.65s ease;
      }
      /* Multi-layered storybook hills with directional light */
      .hill {
        position: absolute;
        width: 88%;
        height: 236px;
        border-radius: 50% 50% 0 0;
        bottom: -120px;
        left: -20%;
        background: linear-gradient(175deg, #98ad7d 0%, #748a62 55%, #5c7050 100%);
        transform: rotate(12deg);
        z-index: 1;
        transition:
          background 0.85s ease,
          filter 0.85s ease;
      }
      .hill.back {
        bottom: -74px;
        left: 38%;
        width: 88%;
        background: linear-gradient(185deg, #c1c38f 0%, #98a378 58%, #7a8a64 100%);
        transform: rotate(-18deg);
        z-index: 1;
      }
      .hill.front {
        bottom: -162px;
        left: 24%;
        width: 108%;
        background: linear-gradient(180deg, #658260 0%, #4d674c 55%, #3c523d 100%);
        transform: rotate(-4deg);
        z-index: 3;
      }
      /* Architectural Storybook Cottage */
      .home {
        position: absolute;
        left: 41.5%;
        bottom: 54px;
        width: 108px;
        height: 86px;
        background: linear-gradient(180deg, #f0c99a 0%, #dfab78 65%, #c98f61 100%);
        box-shadow:
          inset -24px 0 0 rgba(140, 86, 48, 0.34),
          inset 0 -8px 0 rgba(114, 78, 56, 0.28),
          0 10px 18px rgba(32, 42, 30, 0.22);
        border-radius: 2px 2px 0 0;
        transition:
          background 0.85s ease,
          box-shadow 0.85s ease;
        z-index: 2;
      }
      .roof {
        position: absolute;
        left: -15px;
        top: -48px;
        width: 138px;
        height: 55px;
        background: linear-gradient(180deg, #8e5744 0%, #6d4034 65%, #543127 100%);
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
        filter: drop-shadow(0 4px 3px rgba(38, 22, 14, 0.25));
      }
      .chimney {
        position: absolute;
        right: 12px;
        top: -38px;
        background: linear-gradient(90deg, #84503f 0%, #623a2e 100%);
        width: 15px;
        height: 30px;
        border-top: 3px solid #9d6854;
      }
      /* Cozy chimney smoke wisp */
      .chimney::before,
      .chimney::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 250, 240, 0.55);
        pointer-events: none;
      }
      .chimney::before {
        width: 10px;
        height: 10px;
        top: -12px;
        left: 3px;
        animation: puff 4.5s ease-in-out infinite;
      }
      .chimney::after {
        width: 14px;
        height: 14px;
        top: -24px;
        left: 9px;
        opacity: 0.4;
        animation: puff 4.5s ease-in-out 1.4s infinite;
      }
      @keyframes puff {
        0%,
        100% {
          transform: translate(0, 0) scale(0.9);
          opacity: 0.35;
        }
        50% {
          transform: translate(6px, -7px) scale(1.18);
          opacity: 0.65;
        }
      }
      .door {
        position: absolute;
        left: 20px;
        bottom: 0;
        width: 26px;
        height: 46px;
        background: linear-gradient(180deg, #7c583f 0%, #5b3f2d 100%);
        border: 2px solid #f2dbb5;
        border-bottom: 0;
        border-radius: 14px 14px 0 0;
      }
      .door::after {
        content: "";
        position: absolute;
        right: 5px;
        top: 23px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #f0c977;
      }
      .window {
        position: absolute;
        right: 16px;
        top: 22px;
        background: linear-gradient(160deg, #7fa1a3 0%, #567378 100%);
        width: 28px;
        height: 28px;
        border: 3.5px solid #f7e4c1;
        border-radius: 3px;
        box-shadow: inset 0 1px 3px rgba(24, 34, 36, 0.3);
        transition:
          background 0.85s ease,
          box-shadow 0.85s ease;
      }
      /* Crisp cross mullions */
      .window::before,
      .window::after {
        content: "";
        position: absolute;
        background: #f7e4c1;
      }
      .window::before {
        left: 50%;
        top: 0;
        bottom: 0;
        width: 2px;
        transform: translateX(-50%);
      }
      .window::after {
        top: 50%;
        left: 0;
        right: 0;
        height: 2px;
        transform: translateY(-50%);
      }
      /* Storybook Cypress & Meadow Trees */
      .tree {
        position: absolute;
        left: 23%;
        bottom: 54px;
        width: 11px;
        height: 58px;
        background: linear-gradient(90deg, #70553c, #523d2a);
        z-index: 2;
      }
      .tree::before {
        content: "";
        position: absolute;
        width: 66px;
        height: 98px;
        border-radius: 50% 50% 44% 44%;
        background: radial-gradient(circle at 34% 28%, #98af75 0%, #68825a 58%, #4d6548 100%);
        bottom: 34px;
        left: -28px;
        box-shadow: inset -10px -8px 16px rgba(32, 48, 30, 0.26);
        transition: background 0.85s ease;
      }
      .tree.small {
        left: 76%;
        transform: scale(0.68);
        transform-origin: bottom;
      }
      /* Sculpted multi-puff clouds */
      .cloud {
        position: absolute;
        width: 78px;
        height: 22px;
        border-radius: 22px;
        background: linear-gradient(180deg, #fffdf6 0%, #f7ebd3 100%);
        box-shadow: 0 5px 12px rgba(154, 128, 92, 0.14);
        left: 17%;
        top: 58px;
        z-index: 1;
        transition: opacity 0.55s ease;
      }
      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: inherit;
      }
      .cloud::before {
        left: 14px;
        bottom: 3px;
        width: 34px;
        height: 34px;
      }
      .cloud::after {
        right: 14px;
        bottom: 2px;
        width: 24px;
        height: 24px;
      }
      .stars {
        position: absolute;
        inset: 0;
        opacity: 0;
        z-index: 1;
        transition: opacity 0.85s ease;
      }
      .star {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff4d1;
        box-shadow: 0 0 6px rgba(255, 240, 196, 0.85);
      }
      .star:nth-child(3n) {
        width: 4px;
        height: 4px;
      }
      .star:nth-child(4n) {
        opacity: 0.72;
      }
      /* Nighttime Transformation */
      .night .celestial {
        transform: translate(-28px, 6px);
      }
      .night .celestial svg {
        filter: drop-shadow(0 0 16px rgba(245, 225, 175, 0.55));
      }
      .night .sun-halo {
        fill: #f5e1af;
        opacity: 0.11;
      }
      .night .sun-halo-outer {
        opacity: 0;
      }
      .night .celestial-disc {
        opacity: 0;
      }
      .night .celestial-moon {
        opacity: 1;
      }
      .night .moon-cut {
        transform: translate(15px, -9px);
        opacity: 1;
      }
      .night .stars {
        opacity: 1;
      }
      .night .cloud {
        opacity: 0;
      }
      .night .hill {
        background: linear-gradient(175deg, #324e5d 0%, #233a47 60%, #1a2d38 100%);
      }
      .night .hill.back {
        background: linear-gradient(185deg, #405e70 0%, #2f4959 60%, #223846 100%);
      }
      .night .hill.front {
        background: linear-gradient(180deg, #253d47 0%, #1a2e36 58%, #132229 100%);
      }
      .night .home {
        background: linear-gradient(180deg, #8b7b70 0%, #6d5f57 65%, #554a45 100%);
        box-shadow:
          inset -24px 0 0 rgba(20, 26, 38, 0.42),
          0 12px 24px rgba(8, 16, 28, 0.45);
      }
      .night .roof {
        background: linear-gradient(180deg, #4b3d4a 0%, #342c39 100%);
      }
      .night .chimney {
        background: linear-gradient(90deg, #493c47, #322a36);
        border-top-color: #5e4f5c;
      }
      .night .chimney::before,
      .night .chimney::after {
        background: rgba(196, 214, 238, 0.28);
      }
      .home::after {
        content: "";
        position: absolute;
        right: -12px;
        bottom: -18px;
        width: 82px;
        height: 44px;
        border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255, 214, 120, 0.34) 0%, transparent 72%);
        opacity: 0;
        transition: opacity 0.85s ease;
        pointer-events: none;
      }
      .night .home::after {
        opacity: 1;
      }
      .night .window {
        background: radial-gradient(circle at 50% 45%, #fff6cc 0%, #ffd97d 68%, #f5b349 100%);
        box-shadow:
          0 0 22px 4px rgba(255, 214, 118, 0.85),
          0 0 48px 12px rgba(255, 196, 88, 0.42);
      }
      .night .tree::before {
        background: radial-gradient(circle at 36% 28%, #3c5f63 0%, #254147 62%, #192f36 100%);
      }
      .shooting {
        position: absolute;
        left: 72%;
        top: 38px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #fff9df;
        box-shadow:
          0 0 10px #fff4c4,
          18px -9px 0 rgba(255, 246, 215, 0.48),
          36px -18px 0 rgba(255, 246, 215, 0.22);
        animation: wish 1.2s ease-out forwards;
        z-index: 4;
      }
      @keyframes wish {
        to {
          transform: translate(-230px, 115px);
          opacity: 0;
        }
      }
      /* Sculptural Elevated Hardware Pill Switch */
      .switch {
        display: inline-flex;
        position: relative;
        background: linear-gradient(180deg, #dad7cd 0%, #e6e3da 100%);
        padding: 5px;
        border-radius: 34px;
        gap: 4px;
        isolation: isolate;
        box-shadow:
          inset 0 2px 5px rgba(39, 46, 40, 0.14),
          inset 0 0 0 1px color-mix(in srgb, var(--accent) 26%, rgba(48, 58, 50, 0.16)),
          0 1px 0 rgba(255, 255, 255, 0.85);
      }
      .thumb {
        position: absolute;
        inset: 5px auto 5px 5px;
        width: 120px;
        border-radius: 28px;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--accent) 6%, #ffffff) 0%,
          color-mix(in srgb, var(--accent) 13%, #faf6ee) 100%
        );
        border: 2px solid var(--accent);
        box-shadow:
          0 6px 14px -3px color-mix(in srgb, var(--accent) 34%, rgba(36, 46, 34, 0.2)),
          0 2px 4px rgba(36, 46, 34, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
        z-index: -1;
        transition: transform 0.5s var(--ease);
      }
      .switch[data-night="true"] .thumb {
        transform: translateX(124px);
      }
      .switch button {
        width: 120px;
        min-height: 44px;
        padding: 10px 8px;
        border: 0;
        background: none;
        font-family: inherit;
        font-size: 0.86rem;
        font-weight: 550;
        color: #41483f;
        cursor: pointer;
        border-radius: 28px;
        -webkit-tap-highlight-color: transparent;
      }
      .switch button[aria-pressed="true"] {
        color: #1c231d;
        font-weight: 650;
      }
      .switch .icon {
        display: inline-block;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        vertical-align: -1px;
        transition:
          max-width 0.36s ease,
          opacity 0.36s ease;
        margin-right: 0;
      }
      .switch [aria-pressed="true"] .icon {
        max-width: 28px;
        opacity: 1;
        margin-right: 6px;
        color: var(--accent);
      }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }
      .detail {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 16px;
        margin: 18px auto 8px;
      }
      .detail p {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.8rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: #434b42;
        min-width: 158px;
        margin: 0;
      }
      #magic {
        min-height: 36px;
        border: 1.5px solid color-mix(in srgb, var(--accent) 55%, rgba(40, 48, 40, 0.25));
        border-bottom-width: 2.5px;
        border-bottom-color: var(--accent);
        border-radius: 999px;
        padding: 7px 16px;
        background: color-mix(in srgb, var(--accent) 11%, #fffdf8);
        color: #1f2720;
        font-family: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow:
          0 3px 8px color-mix(in srgb, var(--accent) 16%, rgba(30, 38, 30, 0.08)),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
        -webkit-tap-highlight-color: transparent;
        transition:
          background-color 160ms ease,
          transform 140ms ease,
          box-shadow 160ms ease;
      }
      @media (hover: hover) {
        #magic:hover {
          background: color-mix(in srgb, var(--accent) 18%, #fffdf8);
          transform: translateY(-1px);
        }
      }
      #magic:active {
        transform: translateY(1px);
      }
      #status {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.78rem;
        color: #414940;
        min-height: 20px;
        margin-top: 8px;
      }
      .footer {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        color: #4b5449;
        margin-top: 18px;
      }
      @media (max-width: 520px) {
        main {
          padding: 18px 16px 22px;
        }
        .mast {
          font-size: 0.62rem;
          letter-spacing: 0.08em;
        }
        .hero-head {
          margin-top: 16px;
        }
        h1 {
          font-size: 2rem;
        }
        .sub {
          font-size: 0.86rem;
        }
        .diorama-frame {
          padding: 6px;
          border-radius: 138px 138px 24px 24px;
        }
        .scene {
          height: 254px;
          border-radius: 132px 132px 18px 18px;
        }
        .home {
          left: 38%;
          transform: scale(0.92);
          transform-origin: bottom;
        }
        .tree {
          left: 16%;
        }
        .tree.small {
          left: 81%;
        }
        .celestial {
          left: 64%;
          width: 44px;
          height: 44px;
        }
        .detail {
          gap: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
        .shooting {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mast">
        <span>POCKET LANDSCAPES</span>
        <span>ONE PLACE · TWO LITTLE WORLDS</span>
      </div>
      <header class="hero-head">
        <h1>A world in a little switch.</h1>
        <p class="sub">Slide from golden afternoons to quiet evenings. There is a little magic in both.</p>
      </header>
      <div class="diorama-frame">
        <div
          class="scene"
          id="scene"
          role="img"
          aria-label="Daytime cottage in green hills with sunshine"
        >
          <div class="stars" id="stars"></div>
          <div class="celestial" aria-hidden="true">
            <svg viewBox="0 0 60 60">
              <defs>
                <radialGradient id="sunGrad" cx="38%" cy="36%" r="68%">
                  <stop offset="0%" stop-color="#fff6d1" />
                  <stop offset="58%" stop-color="#f6c462" />
                  <stop offset="100%" stop-color="#e3963c" />
                </radialGradient>
                <radialGradient id="moonGrad" cx="32%" cy="34%" r="72%">
                  <stop offset="0%" stop-color="#fffbe8" />
                  <stop offset="68%" stop-color="#f5e2b2" />
                  <stop offset="100%" stop-color="#dcc07d" />
                </radialGradient>
                <mask id="crescentMask">
                  <rect width="60" height="60" fill="white" />
                  <circle class="moon-cut" cx="30" cy="30" r="24" fill="black" />
                </mask>
              </defs>
              <circle class="sun-halo-outer" cx="30" cy="30" r="46" />
              <circle class="sun-halo" cx="30" cy="30" r="36" />

    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {

        const dictionary = {

          "21:08 · wishful thinking": "21:08 · 许愿时刻",
          "A small place to slow down.": "一个可以慢下来的小地方。",
          "A world in a little switch.": "小小开关，装着一整个世界。",
          Add: "添加",
          "Add a cloud +": "添一朵云 +",
          Daylight: "白昼",
          "Daytime cottage in green hills with sunshine": "阳光照在绿丘间的小屋上",
          Home: "首页",
          List: "列表",
          "Make a wish ↗": "许个愿 ↗",
          Moonlight: "月夜",
          "Moonlit cottage with a glowing window, stars and dark hills":

          New: "新建",
          "ONE PLACE · TWO LITTLE WORLDS": "一处小小天地 · 两种光影心情",
          "POCKET LANDSCAPES": "口袋风景",
          "SWITCH THE LIGHT. CHANGE THE FEELING.": "切换光线，换一种心情。",
          Select: "选择",
          "Slide from golden afternoons to quiet evenings. There is a little magic in both.":

          "The lights are on. Make yourself at home.": "灯亮了，像回到家一样。",
          "Time of day": "日夜时段",
          "added to your sky.": "已加入夜空。",
          cloud: "云朵",
          "drifting by.": "正轻轻飘过。",
          "little cloud": "朵小云",
          name: "名称",
          star: "星星",
          wish: "个愿望",
        };
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(
              /Packed ([\d,]+) bytes\. CRC32 ([0-9a-f]+)\. Download contains the complete file, ready to decode\./gi,
              "已打包 $1 字节。CRC32 $2。下载文件包含完整内容，可直接解码。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
          applyLanguage(resolved);
        };

        function boot() {
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;
          if (chinese) applyLanguage("zh");

          let langObserver;
          if (typeof MutationObserver === "function") {
            langObserver = new MutationObserver(() => {
              const next =
                normalizeLang(document.documentElement.dataset.skillLang) || resolveLang();
              if (next !== currentLang) applyLanguage(next);
            });
            langObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skill-lang"],
            });
            window.addEventListener("pagehide", () => langObserver.disconnect(), { once: true });
          }

          if (parent === window) return;
          // Freeze viewport-based demo heights before measuring, avoiding vh feedback
          // when the parent grows the iframe. Intentional inner demo scrollers remain.
          const initialHeight = Math.max(360, Math.min(760, innerHeight));
          function fixRules(rules) {
            for (const rule of rules) {
              if (rule.cssRules) fixRules(rule.cssRules);
              if (!rule.style) continue;
              if (/v[hbs]/.test(rule.style.minHeight))
                rule.style.setProperty("min-height", "0", "important");
              if (/v[hbs]/.test(rule.style.height))
                rule.style.setProperty("height", `${initialHeight}px`, "important");
            }
          }
          for (const sheet of document.styleSheets) {
            try {
              fixRules(sheet.cssRules);
            } catch {
              /* Same-file styles are sufficient. */
            }
          }
          for (const element of [document.documentElement, document.body]) {
            element.style.setProperty("height", "auto", "important");
            element.style.setProperty("min-height", "0", "important");
          }
          document.documentElement.style.overflowX = "clip";
          let frame = 0,
            lastHeight = 0;
          const measure = () => {
            frame = 0;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height),
            );
            if (height > 0 && height <= 20000 && height !== lastHeight) {
              lastHeight = height;
              parent.postMessage({ type: "usefulshelf:resize", height }, "*");
            }
          };
          const schedule = () => {
            if (!frame) frame = requestAnimationFrame(measure);
          };
          const observer = new ResizeObserver(schedule);
          observer.observe(document.body);
          window.addEventListener("resize", schedule);
          const onMessage = (event) => {
            if (event.source === parent && event.data?.type === "usefulshelf:measure") {
              // The first resize may precede parent hydration. A measurement request
              // must acknowledge even an unchanged height, so that message is recovered.
              lastHeight = 0;
              schedule();
            }
          };
          window.addEventListener("message", onMessage);
          document.fonts?.ready.then(schedule);
          window.addEventListener(
            "pagehide",
            () => {
              observer.disconnect();
              cancelAnimationFrame(frame);
              window.removeEventListener("resize", schedule);
              window.removeEventListener("message", onMessage);
            },
            { once: true },
          );
          schedule();
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        else boot();
      })();
    </script>
    <!-- usefulshelf-runtime:end -->
    <script>
      (() => {
        "use strict";
        let isNight = false,
          clouds = 0,
          wishes = 0;
        const scene = document.querySelector("#scene"),
          stars = document.querySelector("#stars"),
          day = document.querySelector("#day"),
          night = document.querySelector("#night"),
          status = document.querySelector("#status"),
          magic = document.querySelector("#magic");
        for (let i = 0; i < 27; i++) {
          const s = document.createElement("i");
          s.className = "star";
          s.style.left = 9 + ((i * 37) % 83) + "%";
          s.style.top = 13 + ((i * 29) % 45) + "%";
          stars.append(s);
        }
        function set(n) {
          isNight = n;
          scene.classList.toggle("night", n);
          document.querySelector(".switch").dataset.night = String(n);
          day.setAttribute("aria-pressed", String(!n));
          night.setAttribute("aria-pressed", String(n));
          scene.setAttribute(
            "aria-label",
            n
              ? window.__usefulshelfText(
                  "Moonlit cottage with a glowing window, stars and dark hills",
                )
              : window.__usefulshelfText("Daytime cottage in green hills with sunshine"),
          );
          document.querySelector("#time").textContent = n
            ? window.__usefulshelfText("21:08 · wishful thinking")
            : window.__usefulshelfText("16:24 · golden hour");
          magic.textContent = n
            ? window.__usefulshelfText("Make a wish ↗")
            : window.__usefulshelfText("Add a cloud +");
          status.textContent = n
            ? window.__usefulshelfText("The lights are on. Make yourself at home.")
            : window.__usefulshelfText("A small place to slow down.");
        }
        day.addEventListener("click", () => set(false));
        night.addEventListener("click", () => set(true));
        [day, night].forEach((b) =>
          b.addEventListener("keydown", (e) => {
            if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
              e.preventDefault();
              set(e.key === "ArrowRight" || e.key === "End");
              (isNight ? night : day).focus();
            }
          }),
        );
        magic.addEventListener("click", () => {
          const isZh = document.documentElement.lang.toLowerCase().startsWith("zh");
          if (isNight) {
            wishes++;
            const s = document.createElement("i");
            s.className = "shooting";
            scene.append(s);
            setTimeout(() => s.remove(), 1300);
            const star = document.createElement("i");
            star.className = "star";
            star.style.left = 12 + ((wishes * 17) % 74) + "%";
            star.style.top = 12 + ((wishes * 11) % 36) + "%";
            stars.append(star);
            if (stars.children.length > 60) stars.children[27].remove();
            status.textContent = isZh
              ? wishes + " 个愿望已加入夜空。"
              : wishes + (wishes === 1 ? " wish" : " wishes") + " added to your sky.";
          } else {
            clouds++;
            const c = document.createElement("i");
            c.className = "cloud extra";
            c.style.left = 9 + ((clouds * 23) % 70) + "%";
            c.style.top = 36 + ((clouds * 17) % 55) + "px";
            c.style.transform = "scale(" + (0.55 + (clouds % 3) * 0.15) + ")";
            scene.append(c);
            const extras = scene.querySelectorAll(".extra");
            if (extras.length > 5) extras[0].remove();
            const count = Math.min(clouds, 5);
            status.textContent = isZh
              ? count + " 朵小云正轻轻飘过。"
              : count + (count === 1 ? " little cloud" : " little clouds") + " drifting by.";
          }
        });
      })();
    </script>
