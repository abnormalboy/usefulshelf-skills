<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A tiny arrow. A lot of character.</title>
    <style>
      :root {
        --accent: #454bc5;
        --bg: #f8f6f0;
        --surface: #ffffff;
        --ink: #1e1d1a;
        --muted: #58534a;
        --rule: #dcd7cc;
        --rule-strong: #c5bfb2;
        font-family:
          "SF Pro Display",
          "Helvetica Neue",
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Hiragino Sans GB",
          "Noto Sans SC",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        color-scheme: light;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--ink);
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .shell {
        max-width: 1180px;
        padding: 18px 4.5% 20px;
        margin: auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        font:
          500 0.72rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: var(--muted);
        letter-spacing: 0.12em;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 13px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        font-weight: 700;
      }
      .brand::before {
        content: "";
        width: 8px;
        height: 8px;
        background: var(--accent);
        transform: rotate(45deg);
      }
      .heading-block {
        text-align: center;
        margin: 16px auto 14px;
      }
      h1 {
        text-align: center;
        font-size: clamp(1.9rem, 3.3vw, 2.75rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.1;
        margin: 0 0 8px;
        white-space: pre-line;
        overflow-wrap: anywhere;
        color: var(--ink);
        text-wrap: balance;
      }
      :lang(zh) h1 {
        letter-spacing: -0.02em;
        line-height: 1.18;
      }
      .intro {
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--muted);
        text-align: center;
        margin: 0 auto;
        max-width: 62ch;
        text-wrap: pretty;
      }
      /* Outer frame holds the border so #arena keeps border: 0 (border-box === padding-box for exact hotspot alignment!) */
      .arena-frame {
        border: 1px solid var(--rule);
        border-radius: 18px;
        overflow: hidden;
        background: var(--surface);
        box-shadow:
          0 18px 42px rgba(38, 34, 26, 0.07),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .arena {
        height: 278px;
        position: relative;
        background-color: var(--surface);
        background-image:
          linear-gradient(to right, rgba(30, 29, 26, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(30, 29, 26, 0.045) 1px, transparent 1px),
          radial-gradient(rgba(30, 29, 26, 0.14) 0.75px, transparent 0.75px);
        background-size:
          100px 100px,
          100px 100px,
          20px 20px;
        background-position:
          center center,
          center center,
          center center;
        overflow: hidden;
      }
      .arena::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 220px;
        height: 220px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 1px dashed rgba(30, 29, 26, 0.12);
        pointer-events: none;
      }
      .arena::after {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 42px 18px rgba(255, 255, 255, 0.72);
        pointer-events: none;
      }
      .cursor {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 150px;
        height: 150px;
        transform: translate(-50%, -50%);
        filter: drop-shadow(6px 12px 12px rgba(30, 29, 26, 0.16));
        pointer-events: none;
        z-index: 3;
        transition:
          width 0.2s ease,
          height 0.2s ease;
      }
      .cursor svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .arena.playing {
        cursor: none;
      }
      .arena.playing .cursor {
        transition: none;
      }
      .arena-note {
        position: absolute;
        left: 18px;
        top: 14px;
        font:
          500 0.68rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.1em;
        color: var(--muted);
        z-index: 4;
        pointer-events: none;
        background: rgba(255, 255, 255, 0.85);
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid rgba(30, 29, 26, 0.08);
      }
      .specimen {
        position: absolute;
        bottom: 14px;
        right: 18px;
        font:
          600 0.7rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.1em;
        color: var(--ink);
        z-index: 4;
        pointer-events: none;
        background: rgba(255, 255, 255, 0.88);
        padding: 5px 9px;
        border-radius: 4px;
        border: 1px solid rgba(30, 29, 26, 0.1);
      }
      .target {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1.5px dashed var(--accent);
        color: var(--accent);
        background: rgba(255, 255, 255, 0.92);
        box-shadow:
          0 0 0 5px color-mix(in srgb, var(--accent) 12%, transparent),
          0 4px 12px rgba(30, 29, 26, 0.1);
        z-index: 2;
        transform: translate(-50%, -50%);
        font:
          700 0.85rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        cursor: none;
        padding: 0;
        display: grid;
        place-items: center;
      }
      .target:disabled {
        background: var(--accent);
        color: #ffffff;
        border-style: solid;
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
        opacity: 0.78;
      }
      .target[hidden] {
        display: none;
      }
      .epoch {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 14px;
        margin-top: 14px;
      }
      .year {
        font:
          600 2.05rem/1 Georgia,
          "Songti SC",
          serif;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.03em;
        color: var(--ink);
      }
      .era-name {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--muted);
        padding: 4px 11px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--rule);
      }
      .timeline {
        max-width: 780px;
        margin: 12px auto 0;
        position: relative;
        padding: 6px 0 0;
      }
      .bars {
        height: 44px;
        display: flex;
        gap: 4px;
        align-items: flex-end;
        pointer-events: none;
      }
      .bars i {
        flex: 1;
        min-width: 0;
        background: #d8d3c8;
        display: block;
        border-radius: 2px 2px 0 0;
        transition:
          height 0.18s ease,
          background-color 0.18s ease;
      }
      .bars i.active {
        background: var(--accent);
        box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 42%, transparent);
      }
      #era {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 52px;
        margin: 0;
        opacity: 0.001;
        cursor: ew-resize;
      }
      #era:focus-visible {
        outline-offset: 6px;
      }
      .ends {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font:
          500 0.7rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        margin-top: 8px;
      }
      .ends span.active {
        color: var(--accent);
        font-weight: 700;
      }
      .controls {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 16px;
        display: grid;
        grid-template-columns: minmax(180px, 1fr) auto auto;
        gap: 28px;
        align-items: center;
        padding: 14px 20px;
        margin-top: 16px;
        box-shadow: 0 10px 26px rgba(38, 34, 26, 0.05);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .row output {
        font:
          600 0.78rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: #e1dcd1;
        accent-color: var(--accent);
        cursor: pointer;
        margin: 6px 0;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid var(--accent);
        box-shadow: 0 2px 8px rgba(30, 29, 26, 0.22);
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid var(--accent);
        box-shadow: 0 2px 8px rgba(30, 29, 26, 0.22);
      }
      .colors {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .colors button {
        height: 34px;
        width: 34px;
        min-height: 34px;
        border-radius: 50%;
        padding: 0;
        border: 3px solid var(--surface);
        box-shadow: 0 0 0 1px #bfb8aa;
      }
      .colors button[aria-pressed="true"] {
        box-shadow:
          0 0 0 2px var(--accent),
          0 3px 10px rgba(30, 29, 26, 0.16);
      }
      button {
        border: 1px solid var(--rule-strong);
        border-radius: 999px;
        padding: 10px 18px;
        min-height: 40px;
        background: transparent;
        color: var(--ink);
        font-size: 0.82rem;
        font-weight: 500;
        transition:
          background-color 0.18s ease,
          border-color 0.18s ease;
      }
      @media (hover: hover) {
        button:hover:not(.primary):not(.target):not([data-color]) {
          background: #f2eee6;
          border-color: #9e9688;
        }
        .actions .primary:hover {
          background: #33312b;
        }
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .actions .primary {
        background: var(--ink);
        color: #ffffff;
        border-color: var(--ink);
        font-weight: 600;
      }
      footer {
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        font:
          500 0.7rem/1.6 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: var(--muted);
      }
      #status {
        color: #3e3a32;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      @media (max-width: 820px) {
        .shell {
          padding: 16px 18px 20px;
        }
        header {
          font-size: 0.66rem;
        }
        h1 {
          font-size: 1.95rem;
        }
        .intro {
          font-size: 0.82rem;
        }
        .arena {
          height: 246px;
        }
        .controls {
          grid-template-columns: 1fr;
          gap: 16px;
          padding: 14px 16px;
        }
        .actions {
          justify-content: stretch;
        }
        .actions button {
          flex: 1;
        }
        .bars {
          gap: 3px;
        }
        .cursor {
          width: 138px;
          height: 138px;
        }
        footer {
          flex-direction: column;
          align-items: flex-start;
          gap: 5px;
        }
        .arena-note {
          left: 10px;
          top: 10px;
          font-size: 0.62rem;
        }
        .specimen {
          right: 10px;
          bottom: 10px;
          font-size: 0.62rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <span class="brand">POINT / OF VIEW</span>
        <span data-i="header">03 — 指针形态档案</span>
      </header>
      <div class="heading-block">
        <h1>A tiny arrow. A lot of character.</h1>
        <p class="intro" data-i="intro">
          从像素阶梯到柔和曲线，一支箭头，换了许多种性格。拖动时间轴，再亲自试用你喜欢的那一款。
        </p>
      </div>
      <div class="arena-frame">
        <div class="arena" id="arena">
          <span class="arena-note" data-i="arenaNote">一支箭头，无数次出发。</span>
          <div class="cursor" id="cursor" role="img" aria-label="当前指针形态"></div>
          <button class="target" data-point="0" hidden aria-label="捕捉目标 1">1</button>
          <button class="target" data-point="1" hidden aria-label="捕捉目标 2">2</button>
          <button class="target" data-point="2" hidden aria-label="捕捉目标 3">3</button>
          <span class="specimen" id="score" data-i="specimen">POINTER SPECIMEN / 04</span>
        </div>
      </div>
      <div class="epoch">
        <div class="year" id="year">2012</div>
        <div class="era-name" id="eraName">精密轮廓</div>
      </div>
      <div class="timeline">
        <div class="bars" id="bars" aria-hidden="true"></div>
        <label for="era" class="sr" data-i="eraLabel">指针时代</label>
        <input type="range" min="0" max="5" value="3" id="era" />
        <div class="ends">
          <span>1968</span>
          <span>1984</span>
          <span>1995</span>
          <span>2012</span>
          <span>2020</span>
          <span data-i="today">当下</span>
        </div>
      </div>
      <section class="controls">
        <div>
          <label class="row" for="size">
            <span data-i="size">指针尺寸</span>
            <output id="sizeValue">80%</output>
          </label>
          <input type="range" min="40" max="140" value="80" id="size" />
        </div>
        <div>
          <div class="row" data-i="ink">指针墨色</div>
          <div class="colors" role="group" aria-label="指针墨色">
            <button
              style="background: #232326"
              data-color="dark"
              aria-label="石墨黑"
              aria-pressed="true"
            ></button>
            <button
              style="background: var(--accent)"
              data-color="accent"
              aria-label="强调色"
              aria-pressed="false"
            ></button>
            <button
              style="background: #ffffff"
              data-color="light"
              aria-label="纸白色"
              aria-pressed="false"
            ></button>
          </div>
        </div>
        <div class="actions">
          <button id="try" class="primary" data-i="try">试用这支指针 ↗</button>
          <button id="save" data-i="save">带走 SVG ↓</button>
        </div>
      </section>
      <footer>
        <span data-i="footer">六种独立形态研究 · 拖动或左右键切换</span>
        <span id="status" role="status" aria-live="polite">拖动时间轴，发现下一种性格。</span>
      </footer>
    </main>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {};
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(
              /Packed ([\d,]+) bytes\. CRC32 ([0-9a-f]+)\. Download contains the complete file, ready to decode\./gi,
              "已打包 $1 字节。CRC32 $2。下载文件包含完整内容，可直接解码。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {

    <script>
      const config = window.__usefulshelfConfigure({"title": null, "accent": "#454bc5", "era": 3, "size": 80}),
        resolvedLang =
          new URLSearchParams(location.search).get("lang") ||
          document.documentElement.dataset.skillLang ||
          (/^zh/i.test(document.documentElement.lang) ? "zh" : "en"),
        en = resolvedLang !== "zh";
      document.documentElement.lang = en ? "en" : "zh-CN";
      const words = {
        header: "03 — AN ARCHIVE OF POINTER SHAPES",
        intro:
          "From pixel steps to soft curves: one arrow, many personalities. Scrub through the timeline, then take your favorite for a test drive.",
        arenaNote: "ONE ARROW. SO MANY BEGINNINGS.",
        eraLabel: "Pointer era",
        today: "Now",
        size: "Pointer size",
        ink: "Pointer ink",
        try: "Try this cursor ↗",
        save: "Keep SVG ↓",

      document.title = resolvedTitle;
      const eras = [
        {
          year: "1968",
          hotspot: [25, 12],
          zh: "线条的开端",
          en: "A line takes direction",
          d: "M25 12L25 79L40 62L53 91L65 85L53 57L76 57Z",
          type: "line",
        },
        {
          year: "1984",
          hotspot: [20, 10],
          zh: "像素的阶梯",
          en: "The pixel staircase",
          d: "M20 10H26V16H32V22H38V28H44V34H50V40H56V46H62V52H68V58H48V64H54V76H60V88H48V82H42V70H36V64H30V70H24V76H20Z",
          type: "pixel",
        },
        {
          year: "1995",
          hotspot: [22, 10],
          zh: "清晰的边界",
          en: "A sharper silhouette",
          d: "M22 10L22 80L40 62L52 90L67 83L54 57H79Z",
          type: "solid",
        },
        {
          year: "2012",
          hotspot: [23, 10],
          zh: "精密的轮廓",
          en: "A precise outline",
          d: "M23 10L23 80L41 62L54 91L68 85L55 57L79 57Z",
          type: "outline",
        },
        {
          year: "2020",
          hotspot: [24.234568, 10.222222],
          zh: "柔和的转折",
          en: "Softer around the edges",
          d: "M23 13Q23 8 27 12L78 53Q83 58 77 59L57 60L69 84Q70 87 67 89L57 93Q54 94 52 91L40 65L27 79Q23 83 23 78Z",
          type: "soft",
        },
        {
          year: "2026",
          hotspot: [21.888889, 10],
          zh: "自由的姿态",
          en: "Room for expression",
          d: "M21 14Q19 8 25 11L81 45Q88 50 80 54L61 63L56 87Q54 96 48 89L16 43Q13 38 18 37L32 34Z",
          type: "expressive",
        },
      ];
      const arena = document.querySelector("#arena"),
        cursor = document.querySelector("#cursor"),
        eraInput = document.querySelector("#era"),
        sizeInput = document.querySelector("#size"),
        status = document.querySelector("#status"),
        tryButton = document.querySelector("#try"),
        targets = [...document.querySelectorAll("[data-point]")];
      let era = config.era,
        color = "dark",
        playing = false,
        caught = new Set(),
        position = { x: 50, y: 50 };
      eraInput.value = era;
      sizeInput.value = config.size;
      const bars = document.querySelector("#bars");
      for (let i = 0; i < 54; i++) {
        const bar = document.createElement("i");
        bars.append(bar);

      function shape() {
        const e = eras[era],
          fill = color === "dark" ? "#232327" : color === "accent" ? config.accent : "#ffffff",
          stroke = color === "light" ? "#232327" : e.type === "line" ? fill : "#ffffff",
          actualFill = e.type === "line" ? "none" : fill,
          highlightStroke = color === "light" ? "rgba(35,35,39,0.14)" : "rgba(255,255,255,0.28)",
          sheenOverlay =
            e.type === "line"
              ? `<circle cx="${e.hotspot[0]}" cy="${e.hotspot[1]}" r="2.2" fill="${config.accent}"/>`

        const extraDetail =
          e.type === "expressive"
            ? `<circle cx="36" cy="35" r="3.4" fill="${color === "light" ? "#232327" : "#ffffff"}"/>`
            : e.type === "outline"
              ? `<path d="M26 17L26 70L41 55" fill="none" stroke="${highlightStroke}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>`

                : "";

          e.type === "line"
            ? ""
            : `<path d="${e.d}" fill="none" stroke="${color === "light" ? "rgba(35,35,39,0.25)" : "rgba(255,255,255,0.92)"}" stroke-width="${e.type === "outline" ? 4.4 : 3.2}" stroke-linejoin="${e.type === "pixel" ? "miter" : "round"}"/>`;
        return (
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">` +
          `<defs><linearGradient id="cursorSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".65"/><stop offset=".48" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".24"/></linearGradient></defs>` +
          outerRim +
          `<path d="${e.d}" fill="${actualFill}" stroke="${stroke}" stroke-width="${e.type === "line" ? 2.5 : 1.8}" stroke-linejoin="${e.type === "pixel" ? "miter" : "round"}"/>` +
          sheenOverlay +
          extraDetail +
          `</svg>`

        cursor.style.left = x + "%";
        cursor.style.top = y + "%";

      function render() {
        cursor.innerHTML = shape();
        place(position.x, position.y);
        cursor.style.width = Number(sizeInput.value) * (playing ? 0.62 : 1.85) + "px";
        cursor.style.height = Number(sizeInput.value) * (playing ? 0.62 : 1.85) + "px";
        document.querySelector("#sizeValue").textContent = sizeInput.value + "%";
        document.querySelector("#year").textContent = eras[era].year;

        cursor.setAttribute(

          b.classList.toggle("active", distance < 4.5);

        document

          document.querySelector("#score").textContent = "POINTER SPECIMEN / 0" + (era + 1);

      function endTrial() {

        render();

          : `指针尺寸 ${sizeInput.value}%。`;

      targets.forEach((b, i) => {
        if (en) b.setAttribute("aria-label", "Capture target " + (i + 1));

          document.querySelector("#score").textContent = caught.size + " / 3";
          if (caught.size === 3) {
            status.textContent = en
              ? "3 of 3 captured. This cursor is ready for another adventure."

            tryButton.textContent = en ? "Replay target test ↻" : "再玩一次 ↻";
            tryButton.focus();
          } else {
            status.textContent = en
              ? `${caught.size} of 3 captured. Find the next target.`
              : `已捕捉 ${caught.size} / 3，寻找下一个目标。`;
            if (wasFocused) targets.find((x) => !x.disabled)?.focus();
          }

      tryButton.onclick = () => {
        playing = true;
        caught.clear();
        arena.classList.add("playing");
        targets.forEach((b, i) => {
          b.hidden = false;
          b.disabled = false;
          b.textContent = i + 1;
          b.style.left = [23, 73, 54][i] + (era % 2 ? 3 : -3) + "%";
          b.style.top = [33, 41, 73][i] + "%";

        cursor.style.width = Number(sizeInput.value) * 0.62 + "px";
        cursor.style.height = Number(sizeInput.value) * 0.62 + "px";

            '" height="' +
            Math.round(Number(sizeInput.value) * 4) +
            '"',
