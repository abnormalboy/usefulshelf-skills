<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A little bite of joy.</title>
    <style>
      :root {
        --accent: #ac492e;
        --bg: #f4f1e9;
        --icing: #f3ddb0;
        --icing-hi: #fff6df;
        --icing-edge: #d8b574;
        --speck: #6e4522;
        --crust: #c8894b;
        --crust-deep: #8c5323;
        --ink: #2c2118;
        --muted: #5a4b3d;
        --linen-line: color-mix(in srgb, var(--ink) 14%, transparent);
        --ease-spring: cubic-bezier(0.22, 1.28, 0.36, 1);
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI",
          sans-serif;
        font-size: 1rem;
        position: relative;
        overflow-x: clip;
      }
      /* Warm Tokyo patisserie linen weave + sunlit counter glow */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image:
          radial-gradient(
            ellipse 76% 58% at 50% 18%,
            rgba(255, 252, 244, 0.72) 0%,
            rgba(255, 250, 240, 0.14) 55%,
            rgba(116, 84, 52, 0.08) 100%
          ),
          repeating-linear-gradient(
            0deg,
            rgba(86, 64, 42, 0.022) 0px,
            rgba(86, 64, 42, 0.022) 1px,
            transparent 1px,
            transparent 5px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(86, 64, 42, 0.022) 0px,
            rgba(86, 64, 42, 0.022) 1px,
            transparent 1px,
            transparent 5px
          );
      }
      main {
        position: relative;
        z-index: 1;
        max-width: 960px;
        margin: 0 auto;
        padding: 26px 28px 28px;
        text-align: center;
      }
      .mast {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        color: var(--muted);
        border-top: 1px solid var(--linen-line);
        border-bottom: 1px solid var(--linen-line);
        padding: 11px 4px;
      }
      .mast-brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .mast-brand::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .hero-head {
        margin: 26px auto 0;
        max-width: 680px;
      }
      h1 {
        font-family: Georgia, "Songti SC", "STSong", "Noto Serif SC", "Times New Roman", serif;
        font-size: clamp(2.25rem, 5.2vw, 3.65rem);
        font-weight: 500;
        line-height: 1.1;
        letter-spacing: -0.03em;
        margin: 0 auto 10px;
        color: var(--ink);
        overflow-wrap: anywhere;
        text-wrap: balance;
      }
      :lang(zh) h1 {
        letter-spacing: -0.01em;
        line-height: 1.16;
      }
      .hero-head p {
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.58;
        max-width: 48ch;
        margin: 0 auto;
        text-wrap: pretty;
      }
      .flavors {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin: 20px auto 14px;
        padding: 5px;
        border-radius: 999px;
        background: rgba(255, 253, 248, 0.72);
        border: 1px solid rgba(94, 72, 48, 0.14);
        box-shadow:
          0 2px 8px rgba(72, 49, 26, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      .flavors button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: transparent;
        color: var(--ink);
        padding: 7px 16px 7px 12px;
        font-family: inherit;
        font-size: 0.84rem;
        font-weight: 550;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition:
          background-color 180ms ease,
          color 180ms ease,
          box-shadow 180ms ease,
          transform 140ms ease;
      }
      @media (hover: hover) {
        .flavors button:hover:not([aria-pressed="true"]) {
          background: rgba(92, 68, 44, 0.08);
        }
      }
      .flavors button[aria-pressed="true"] {
        background: var(--ink);
        color: #fffbf4;
        box-shadow:
          0 4px 12px rgba(44, 33, 24, 0.24),
          inset 0 1px 0 rgba(255, 255, 255, 0.16);
      }
      .flavors i {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          rgba(255, 255, 255, 0.75) 0%,
          var(--chip) 52%,
          color-mix(in srgb, var(--chip) 72%, #3a2310) 100%
        );
        box-shadow:
          inset 0 -1px 2px rgba(44, 28, 12, 0.28),
          0 1px 2px rgba(44, 28, 12, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.45);
      }
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }
      /* Glazed Japanese stoneware dessert plate */
      .plate-stage {
        position: relative;
        max-width: 560px;
        margin: 6px auto 10px;
        display: grid;
        place-items: center;
      }
      .plate {
        position: relative;
        width: min(520px, 100%);
        height: 268px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: radial-gradient(
          ellipse 50% 50% at 50% 49%,
          #fdfbf6 0%,
          #f8f4ea 52%,
          #eae2d1 58%,
          #fbf8f1 61%,
          #f3ecde 68%,
          #dfd5c1 72%,
          rgba(164, 145, 118, 0.18) 74%,
          transparent 76%
        );
        filter: drop-shadow(0 18px 24px rgba(71, 51, 30, 0.13))
          drop-shadow(0 4px 8px rgba(71, 51, 30, 0.08));
      }
      /* Delicate patisserie gilt hairline inner rim */
      .plate::before {
        content: "";
        position: absolute;
        width: 79%;
        height: 76%;
        border-radius: 50%;
        border: 1px solid rgba(182, 146, 94, 0.34);
        box-shadow: inset 0 1px 6px rgba(102, 78, 50, 0.08);
        pointer-events: none;
      }
      .plate::after {
        content: "";
        position: absolute;
        width: 89%;
        height: 87%;
        border-radius: 50%;
        border: 1px dashed rgba(178, 145, 98, 0.24);
        pointer-events: none;
      }
      .treat {
        position: relative;
        z-index: 2;
        width: min(392px, 88%);
        height: 188px;
        border: 0;
        background: none;
        cursor: pointer;
        touch-action: manipulation;
        color: var(--ink);
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        transition: transform 220ms var(--ease-spring);
      }
      @media (hover: hover) {
        .treat:hover {
          transform: translateY(-3px) scale(1.015);
        }
      }
      .treat:active {
        transform: translateY(1px) scale(0.965);
      }
      .treat.nibble {
        animation: nibble 260ms var(--ease-spring);
      }
      @keyframes nibble {
        0% {
          transform: scale(0.95) rotate(-0.8deg);
        }
        45% {
          transform: scale(1.03) rotate(0.6deg);
        }
        100% {
          transform: scale(1) rotate(0deg);
        }
      }
      .treat svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .cookie-base {
        fill: url(#crustGrad);
        stroke: var(--crust-deep);
        stroke-width: 1.5;
      }
      .cookie-icing {
        fill: url(#icingGrad);
        stroke: var(--icing-edge);
        stroke-width: 1.4;
      }
      .cookie-stitch {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.25;
        stroke-dasharray: 2.5 6.5;
        stroke-linecap: round;
        opacity: 0.48;
      }
      .cookie-gloss {
        fill: url(#glossGrad);
        pointer-events: none;
      }
      .bite-label {
        font-family: Georgia, "Songti SC", "Times New Roman", serif;
        font-style: italic;
        font-size: 32px;
        font-weight: 500;
        fill: #2c1e14;
        letter-spacing: -0.02em;
      }
      .crumb {
        position: absolute;
        width: var(--sz, 7px);
        height: var(--sz, 7px);
        border-radius: 35% 65% 55% 45% / 45% 40% 60% 55%;
        background: var(--crumb-bg, var(--crust));
        box-shadow: inset -1px -1px 0 rgba(62, 34, 12, 0.28);
        pointer-events: none;
        z-index: 4;
        animation: crumb 0.78s cubic-bezier(0.18, 0.72, 0.32, 1) forwards;
      }
      .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: Georgia, "Songti SC", serif;
        font-style: italic;
        font-size: clamp(1.7rem, 4vw, 2.15rem);
        color: var(--ink);
        letter-spacing: -0.02em;
      }
      .empty[hidden] {
        display: none;
      }
      @keyframes crumb {
        0% {
          transform: translate(0, 0) scale(1) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translate(var(--dx), var(--dy)) scale(0.45) rotate(var(--rot, 240deg));
          opacity: 0;
        }
      }
      .telemetry {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }
      .progress {
        display: inline-flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(255, 253, 248, 0.7);
        border: 1px solid rgba(94, 72, 48, 0.12);
      }
      .progress span {
        width: 9px;
        height: 9px;
        border: 1.5px solid color-mix(in srgb, var(--accent) 65%, var(--ink));
        border-radius: 50%;
        background: rgba(255, 252, 246, 0.9);
        transition:
          background-color 220ms ease,
          transform 220ms var(--ease-spring),
          box-shadow 220ms ease;
      }
      .progress span.done {
        background: var(--accent);
        border-color: var(--accent);
        transform: scale(1.18);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      #status {
        min-height: 24px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.82rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        letter-spacing: 0.01em;
      }
      .reset {
        margin-top: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 40px;
        padding: 9px 20px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--accent) 34%, rgba(44, 33, 24, 0.22));
        background: linear-gradient(180deg, #fffdf9 0%, #f5ecdc 100%);
        color: var(--ink);
        font-family: inherit;
        font-size: 0.84rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow:
          0 2px 6px rgba(56, 38, 20, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 160ms var(--ease-spring),
          border-color 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }
      @media (hover: hover) {
        .reset:hover {
          border-color: var(--accent);
          box-shadow:
            0 6px 14px rgba(56, 38, 20, 0.12),
            inset 0 1px 0 rgba(255, 255, 255, 0.95);
          transform: translateY(-1px);
        }
      }
      .reset:active {
        transform: translateY(1px);
      }
      .note {
        margin-top: 22px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      @media (max-width: 520px) {
        main {
          padding: 18px 16px 24px;
        }
        .mast {
          font-size: 0.64rem;
          letter-spacing: 0.08em;
          padding: 9px 2px;
        }
        .hero-head {
          margin-top: 20px;
        }
        h1 {
          font-size: 2.05rem;
        }
        .hero-head p {
          font-size: 0.88rem;
        }
        .flavors {
          margin: 16px auto 10px;
        }
        .flavors button {
          padding: 7px 12px 7px 10px;
          font-size: 0.8rem;
        }
        .plate {
          height: 220px;
        }
        .treat {
          height: 158px;
        }
        .bite-label {
          font-size: 30px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .crumb {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mast">
        <span class="mast-brand">THE LITTLE TREAT SHOP</span>
        <span>FRESHLY CLICKED · 06 BITES</span>
      </div>
      <header class="hero-head">
        <h1>A little bite of joy.</h1>
        <p>Choose a flavor. Take six little bites. Leave no crumbs behind.</p>
      </header>
      <div class="flavors" role="group" aria-label="Cookie flavor">
        <button
          type="button"
          aria-pressed="true"
          data-flavor="Vanilla"
          data-color="#f3ddb0"
          data-hi="#fff7e2"
          data-edge="#d4ae6a"
          data-speck="#6b4423"
        >
          <i style="--chip: #e4c283"></i>
          Vanilla
        </button>
        <button
          type="button"
          aria-pressed="false"
          data-flavor="Berry"
          data-color="#f2b5c4"
          data-hi="#ffe5ec"
          data-edge="#cf7d94"
          data-speck="#8c2947"
        >
          <i style="--chip: #d46d89"></i>
          Berry
        </button>
        <button
          type="button"
          aria-pressed="false"
          data-flavor="Matcha"
          data-color="#bfd09d"
          data-hi="#e5f0ce"
          data-edge="#8aa264"
          data-speck="#3f5a29"
        >
          <i style="--chip: #7d9b58"></i>
          Matcha
        </button>
      </div>
      <div class="plate-stage">
        <div class="plate">
          <button class="treat" id="bite" type="button" aria-label="Take a bite">
            <svg viewBox="0 0 420 200" aria-hidden="true">
              <defs>
                <linearGradient id="crustGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#dea15d" />
                  <stop offset="52%" stop-color="#c98544" />
                  <stop offset="100%" stop-color="#9e5e29" />
                </linearGradient>
                <linearGradient id="icingGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="var(--icing-hi)" />
                  <stop offset="28%" stop-color="var(--icing)" />
                  <stop offset="100%" stop-color="var(--icing-edge)" />
                </linearGradient>
                <linearGradient id="glossGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.62" />
                  <stop offset="55%" stop-color="#ffffff" stop-opacity="0.16" />
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>
                <filter id="cookieShadow" x="-12%" y="-18%" width="124%" height="148%">
                  <feDropShadow
                    dx="0"
                    dy="10"
                    stdDeviation="7"
                    flood-color="#4e3418"
                    flood-opacity="0.24"
                  />
                  <feDropShadow
                    dx="0"
                    dy="3"
                    stdDeviation="2"
                    flood-color="#3c240d"
                    flood-opacity="0.18"
                  />
                </filter>
                <mask id="cookie-mask">
                  <rect width="420" height="200" fill="white" />
                  <g id="holes" fill="black"></g>
                </mask>
              </defs>
              <g filter="url(#cookieShadow)">
                <g id="cookie" mask="url(#cookie-mask)">
                  <!-- Baked golden sablé biscuit rim & thickness -->
                  <rect class="cookie-base" x="18" y="34" width="384" height="134" rx="67" />
                  <!-- Crisp biscuit bevel shadow -->
                  <rect
                    x="22"
                    y="38"
                    width="376"
                    height="122"
                    rx="61"
                    fill="none"
                    stroke="#f7d19b"
                    stroke-opacity="0.45"
                    stroke-width="2"
                  />
                  <!-- Glossy artisanal flavor ganache layer -->
                  <rect class="cookie-icing" x="28" y="42" width="364" height="114" rx="57" />
                  <!-- Specular top icing glaze highlight -->
                  <path
                    class="cookie-gloss"
                    d="M84 48 H336 C362 48 380 65 382 86 C355 72 288 66 210 66 C132 66 65 72 38 86 C40 65 58 48 84 48 Z"
                  />
                  <!-- Patisserie piped dotted accent frame -->
                  <rect class="cookie-stitch" x="38" y="51" width="344" height="96" rx="48" />
                  <!-- Vanilla bean / berry / matcha micro-speckles -->
                  <g fill="var(--speck)" opacity="0.44">
                    <circle cx="64" cy="96" r="2.2" />
                    <circle cx="88" cy="70" r="1.7" />
                    <circle cx="118" cy="134" r="2" />
                    <circle cx="154" cy="64" r="1.5" />
                    <circle cx="286" cy="63" r="1.8" />
                    <circle cx="332" cy="133" r="2.2" />
                    <circle cx="352" cy="88" r="1.9" />
                    <circle cx="316" cy="75" r="1.4" />
                    <circle cx="176" cy="139" r="1.7" />
                    <circle cx="246" cy="138" r="1.5" />
                  </g>
                  <!-- Subtle embossed highlight behind script -->
                  <text
                    class="bite-label"
                    x="210"
                    y="112"
                    text-anchor="middle"
                    fill="#ffffff"
                    opacity="0.45"
                    transform="translate(0 1.2)"
                  >
                    take a bite.
                  </text>
                  <text class="bite-label" x="210" y="112" text-anchor="middle">take a bite.</text>
                </g>
              </g>
            </svg>
            <span class="empty" hidden>One more?</span>
          </button>
        </div>
      </div>
      <div class="telemetry">
        <div class="progress" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div id="status" role="status">Vanilla · 6 bites to happiness</div>
        <button class="reset" id="reset" type="button">Bake a fresh one ↻</button>
      </div>
      <div class="note">Zero calories. Quite a lot of delight.</div>
    </main>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {
          "A little bite of joy.": "咬一口小快乐。",
          "All gone!": "吃完啦",
          "Bake a fresh one ↻": "重新烘焙 ↻",
          "Bake another cookie": "再烤一枚饼干",
          Berry: "莓果",
          "Choose a flavor. Take six little bites. Leave no crumbs behind.":
            "选一种口味，分六口吃掉，再烤一枚新的。",
          Citrus: "柑橘",
          Cocoa: "可可",
          "Cookie flavor": "饼干口味",
          "FRESHLY CLICKED · 06 BITES": "新鲜出炉 · 六口快乐",
          List: "列表",
          Matcha: "抹茶",
          New: "新建",
          "One more?": "再来一枚？",
          Peach: "蜜桃",
          Select: "选择",
          "THE LITTLE TREAT SHOP": "小小甜点铺",
          "Take a bite": "咬一口",
          Vanilla: "香草",
          "Vanilla · 6 bites to happiness": "香草 · 六口小快乐",
          "Zero calories. Quite a lot of delight.": "零卡路里，一点小快乐。",
          bite: "口",
          cookie: "枚饼干",
          "enjoyed.": "，享用完毕。",
          name: "名称",
          "take a bite.": "咬一口。",
          "to happiness": "小快乐",
        };
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(
              /Packed ([\d,]+) bytes\. CRC32 ([0-9a-f]+)\. Download contains the complete file, ready to decode\./gi,
              "已打包 $1 字节。CRC32 $2。下载文件包含完整内容，可直接解码。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
          applyLanguage(resolved);
        };

        function boot() {
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;
          if (chinese) applyLanguage("zh");

          let langObserver;
          if (typeof MutationObserver === "function") {
            langObserver = new MutationObserver(() => {
              const next =
                normalizeLang(document.documentElement.dataset.skillLang) || resolveLang();
              if (next !== currentLang) applyLanguage(next);
            });
            langObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skill-lang"],
            });
            window.addEventListener("pagehide", () => langObserver.disconnect(), { once: true });
          }

          if (parent === window) return;
          // Freeze viewport-based demo heights before measuring, avoiding vh feedback
          // when the parent grows the iframe. Intentional inner demo scrollers remain.
          const initialHeight = Math.max(360, Math.min(760, innerHeight));
          function fixRules(rules) {
            for (const rule of rules) {
              if (rule.cssRules) fixRules(rule.cssRules);
              if (!rule.style) continue;
              if (/v[hbs]/.test(rule.style.minHeight))
                rule.style.setProperty("min-height", "0", "important");
              if (/v[hbs]/.test(rule.style.height))
                rule.style.setProperty("height", `${initialHeight}px`, "important");
            }
          }
          for (const sheet of document.styleSheets) {
            try {
              fixRules(sheet.cssRules);
            } catch {
              /* Same-file styles are sufficient. */
            }
          }
          for (const element of [document.documentElement, document.body]) {
            element.style.setProperty("height", "auto", "important");
            element.style.setProperty("min-height", "0", "important");
          }
          document.documentElement.style.overflowX = "clip";
          let frame = 0,
            lastHeight = 0;
          const measure = () => {
            frame = 0;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height),
            );
            if (height > 0 && height <= 20000 && height !== lastHeight) {
              lastHeight = height;
              parent.postMessage({ type: "usefulshelf:resize", height }, "*");
            }
          };
          const schedule = () => {
            if (!frame) frame = requestAnimationFrame(measure);
          };
          const observer = new ResizeObserver(schedule);
          observer.observe(document.body);
          window.addEventListener("resize", schedule);
          const onMessage = (event) => {
            if (event.source === parent && event.data?.type === "usefulshelf:measure") {
              // The first resize may precede parent hydration. A measurement request
              // must acknowledge even an unchanged height, so that message is recovered.
              lastHeight = 0;
              schedule();
            }
          };
          window.addEventListener("message", onMessage);
          document.fonts?.ready.then(schedule);
          window.addEventListener(
            "pagehide",
            () => {
              observer.disconnect();
              cancelAnimationFrame(frame);
              window.removeEventListener("resize", schedule);
              window.removeEventListener("message", onMessage);
            },
            { once: true },
          );
          schedule();
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        else boot();
      })();
    </script>
    <!-- usefulshelf-runtime:end -->
    <script>
      (() => {
        "use strict";
        let bites = 0,
          rounds = 0,
          flavor = window.__usefulshelfText("Vanilla"),
          flavorColor = "#f3ddb0";
        const button = document.querySelector("#bite"),
          holes = document.querySelector("#holes"),
          status = document.querySelector("#status"),
          cookie = document.querySelector("#cookie"),
          empty = document.querySelector(".empty"),
          dots = [...document.querySelectorAll(".progress span")],
          reduced = matchMedia("(prefers-reduced-motion: reduce)");
        const positions = [
          [350, 50, 67],
          [60, 145, 72],
          [247, 155, 65],
          [149, 46, 65],
          [360, 137, 76],
          [185, 105, 175],
        ];
        function update() {
          dots.forEach((d, i) => d.classList.toggle("done", i < bites));
          cookie.style.opacity = bites === 6 ? "0" : "1";
          empty.hidden = bites !== 6;
          button.setAttribute(
            "aria-label",
            bites === 6
              ? window.__usefulshelfText("Bake another cookie")
              : window.__usefulshelfText("Take a bite"),
          );
          const left = 6 - bites;
          status.textContent =
            bites === 6
              ? window.__usefulshelfText(
                  "All gone! " + rounds + (rounds === 1 ? " cookie" : " cookies") + " enjoyed.",
                )
              : flavor +
                " · " +
                window.__usefulshelfText(
                  left + (left === 1 ? " bite" : " bites") + " to happiness",
                );
        }
        function reset() {
          bites = 0;
          holes.replaceChildren();
          document.querySelectorAll(".crumb").forEach((c) => c.remove());
          update();
        }
        button.addEventListener("click", () => {
          if (bites === 6) {
            reset();
            return;
          }
          const [x, y, r] = positions[bites];
          const offsets = [
            [-19, -11, 0.72],
            [17, -13, 0.78],
            [-14, 13, 0.76],
            [18, 12, 0.74],
            [0, 0, 0.82],
          ];
          for (const [ox, oy, scale] of offsets) {
            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            c.setAttribute("cx", x + ox);
            c.setAttribute("cy", y + oy);
            c.setAttribute("r", r * scale);
            holes.append(c);
          }
          bites++;
          if (bites === 6) rounds++;
          if (!reduced.matches) {
            button.classList.remove("nibble");
            void button.offsetWidth;
            button.classList.add("nibble");
            const palette = [flavorColor, "#d08e4a", "#9f5f28", "var(--accent)"];
            for (let i = 0; i < 12; i++) {
              const c = document.createElement("i");
              c.className = "crumb";
              c.style.left = (x / 420) * 100 + "%";
              c.style.top = (y / 200) * 100 + "%";
              c.style.setProperty("--sz", 4.5 + Math.random() * 5.5 + "px");
              c.style.setProperty("--dx", Math.random() * 170 - 85 + "px");
              c.style.setProperty("--dy", 26 + Math.random() * 104 + "px");
              c.style.setProperty("--rot", Math.round(Math.random() * 340 - 170) + "deg");
              c.style.setProperty("--crumb-bg", palette[i % palette.length]);
              button.append(c);
              setTimeout(() => c.remove(), 820);
            }
          }
          update();
        });
        document.querySelector("#reset").addEventListener("click", reset);
        document.querySelectorAll("[data-flavor]").forEach((b) =>
          b.addEventListener("click", () => {
            flavor = window.__usefulshelfText(b.dataset.flavor);
            flavorColor = b.dataset.color;
            const root = document.documentElement.style;
            root.setProperty("--icing", b.dataset.color);
            root.setProperty("--icing-hi", b.dataset.hi);
            root.setProperty("--icing-edge", b.dataset.edge);
            root.setProperty("--speck", b.dataset.speck);
            document
              .querySelectorAll("[data-flavor]")
              .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            reset();
          }),
        );
      })();
    </script>
