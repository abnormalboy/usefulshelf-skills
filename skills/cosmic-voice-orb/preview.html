<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A little universe.</title>
    <style>
      :root {
        --accent: #bda8ff;
        --bg: #07060d;
        --surface: rgba(18, 16, 32, 0.78);
        --surface-strong: rgba(25, 22, 44, 0.9);
        --ink: #f5f2ff;
        --muted: #b6aed0;
        --subtle: #978eb6;
        --border: rgba(255, 255, 255, 0.1);
        --border-strong: rgba(255, 255, 255, 0.18);
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Hiragino Sans GB",
          "Noto Sans SC",
          "Helvetica Neue",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        color-scheme: dark;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 68% 58% at 72% 38%, rgba(111, 101, 246, 0.16), transparent 68%),
          radial-gradient(ellipse 52% 48% at 18% 82%, rgba(189, 168, 255, 0.08), transparent 70%);
        color: var(--ink);
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible,
      canvas:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .shell {
        max-width: 1240px;
        margin: auto;
        padding: 20px 4.5% 22px;
        min-height: 700px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-weight: 600;
        letter-spacing: 0.12em;
        font-size: 0.875rem;
        color: #f6f3ff;
      }
      .brand span {
        color: var(--accent);
        text-shadow: 0 0 14px var(--accent);
        font-size: 1rem;
        line-height: 1;
      }
      .demo-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font:
          500 0.72rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        color: #ccc4e4;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 8px 13px;
        border-radius: 999px;
      }
      .demo-label::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }
      .main {
        display: grid;
        grid-template-columns: minmax(0, 0.84fr) minmax(0, 1.16fr);
        gap: 4.5%;
        align-items: center;
        margin-top: 20px;
      }
      .copy-col {
        min-width: 0;
      }
      .eyebrow {
        font:
          500 0.75rem/1.3 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: var(--accent);
        letter-spacing: 0.1em;
      }
      h1 {
        white-space: pre-line;
        font-size: clamp(2.4rem, 4.4vw, 4.1rem);
        line-height: 1.06;
        letter-spacing: -0.04em;
        font-weight: 600;
        overflow-wrap: anywhere;
        margin: 14px 0 14px;
        color: #faf8ff;
        text-wrap: balance;
      }
      :lang(zh) h1 {
        letter-spacing: -0.02em;
        line-height: 1.16;
        font-size: clamp(2.25rem, 3.9vw, 3.6rem);
      }
      .intro {
        font-size: 0.9375rem;
        line-height: 1.65;
        color: var(--muted);
        max-width: 39ch;
        margin: 0;
        text-wrap: pretty;
      }
      .modes {
        display: inline-flex;
        gap: 6px;
        margin-top: 20px;
        padding: 5px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        flex-wrap: wrap;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      button {
        border: 1px solid var(--border-strong);
        color: #dbd4ee;
        background: rgba(255, 255, 255, 0.04);
        padding: 9px 16px;
        min-height: 38px;
        border-radius: 10px;
        font-size: 0.84rem;
        font-weight: 500;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.15s ease;
      }
      .modes button {
        border-color: transparent;
        background: transparent;
        border-radius: 9px;
        padding: 8px 16px;
        min-height: 36px;
      }
      button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #120d21;
        font-weight: 600;
        box-shadow:
          0 0 22px color-mix(in srgb, var(--accent) 42%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }
      @media (hover: hover) {
        button:hover:not([aria-pressed="true"]) {
          background: rgba(255, 255, 255, 0.1);
          border-color: rgba(255, 255, 255, 0.24);
          color: #ffffff;
        }
        button[aria-pressed="true"]:hover {
          filter: brightness(1.06);
        }
      }
      #modeNote {
        font-size: 0.84rem;
        color: #bcb4d6;
        line-height: 1.55;
        margin: 14px 0 0;
        min-height: 24px;
        max-width: 40ch;
      }
      .signal-wrap {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(12, 10, 22, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        max-width: 340px;
      }
      .signal {
        display: flex;
        gap: 4px;
        height: 30px;
        align-items: center;
      }
      .signal i {
        flex: 1;
        min-width: 3px;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          var(--accent) 55%,
          rgba(111, 101, 246, 0.6) 100%
        );
        opacity: 0.78;
        border-radius: 999px;
        box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 45%, transparent);
        transition:
          height 0.18s ease,
          opacity 0.18s ease;
      }
      .stage {
        height: 420px;
        position: relative;
        min-width: 0;
        border-radius: 26px;
        background:
          radial-gradient(ellipse 68% 64% at 50% 52%, rgba(56, 39, 98, 0.34), transparent 72%),
          linear-gradient(180deg, #100e1c 0%, #090812 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 28px 64px rgba(0, 0, 0, 0.58),
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          inset 0 0 40px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      .stage::before,
      .stage::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        pointer-events: none;
        border-color: rgba(255, 255, 255, 0.22);
        border-style: solid;
        z-index: 2;
      }
      .stage::before {
        top: 14px;
        left: 14px;
        border-width: 1px 0 0 1px;
        border-top-left-radius: 4px;
      }
      .stage::after {
        bottom: 14px;
        right: 14px;
        border-width: 0 1px 1px 0;
        border-bottom-right-radius: 4px;
      }
      canvas {
        display: block;
        height: 100%;
        width: 100%;
        cursor: pointer;
        user-select: none;
      }
      .stage-top {
        position: absolute;
        left: 26px;
        right: 26px;
        top: 18px;
        display: flex;
        justify-content: space-between;
        color: #b4abd0;
        font:
          500 0.7rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.12em;
        pointer-events: none;
        z-index: 2;
      }
      .stage-bottom {
        position: absolute;
        bottom: 18px;
        left: 26px;
        right: 26px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font:
          500 0.72rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        color: #ddd6f2;
        pointer-events: none;
        z-index: 2;
      }
      .stage-bottom span:last-child {
        color: #b4abd0;
      }
      .controls {
        margin-top: 20px;
        padding: 16px 20px;
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.38),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        display: grid;
        grid-template-columns: auto minmax(200px, 1.2fr) auto;
        gap: 28px;
        align-items: center;
      }
      .label {
        font:
          500 0.72rem/1.2 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        color: #bfb7d8;
        margin-bottom: 10px;
      }
      .palette {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .swatch {
        width: 38px;
        height: 38px;
        min-height: 38px;
        border-radius: 50%;
        padding: 0;
        position: relative;
        border: 2px solid rgba(10, 9, 18, 0.9);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.22),
          inset 0 2px 5px rgba(255, 255, 255, 0.55),
          inset 0 -3px 6px rgba(0, 0, 0, 0.35);
      }
      .swatch[aria-pressed="true"] {
        border-color: #0c0a18;
        box-shadow:
          0 0 0 2px #f6f2ff,
          0 0 18px color-mix(in srgb, var(--accent) 55%, transparent),
          inset 0 2px 5px rgba(255, 255, 255, 0.65);
      }
      .swatch:nth-child(1) {
        background: radial-gradient(circle at 32% 28%, #f8e5ff 0%, #bda8ff 44%, #5d4ce0 100%);
      }
      .swatch:nth-child(2) {
        background: radial-gradient(circle at 32% 28%, #e4fff6 0%, #6ce8cf 44%, #2568c4 100%);
      }
      .swatch:nth-child(3) {
        background: radial-gradient(circle at 32% 28%, #fff0d4 0%, #ffad72 44%, #d63d6a 100%);
      }
      .energy-label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        color: #dfd8f3;
        font-size: 0.8125rem;
        font-weight: 500;
        margin-bottom: 10px;
      }
      .energy-label output {
        font:
          600 0.8125rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        accent-color: var(--accent);
        cursor: pointer;
        margin: 8px 0;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid var(--accent);
        box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent);
        cursor: pointer;
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid var(--accent);
        box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent);
        cursor: pointer;
      }
      .play {
        display: flex;
        justify-content: flex-end;
      }
      .play button {
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #f6f2ff;
        padding: 12px 22px;
        min-height: 44px;
        white-space: nowrap;
        font-weight: 500;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
      }
      .play button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #130e24;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        line-height: 1.5;
        color: #aba2c7;
        font:
          400 0.72rem/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      #status {
        color: #dcd4f2;
      }
      @media (max-width: 820px) {
        .shell {
          padding: 18px 20px 22px;
          min-height: 0;
        }
        .main {
          grid-template-columns: 1fr;
          gap: 18px;
          margin-top: 16px;
        }
        h1 {
          font-size: 2.35rem;
          margin: 10px 0 10px;
        }
        .intro {
          max-width: none;
        }
        .modes {
          margin-top: 16px;
        }
        .signal-wrap {
          display: none;
        }
        #modeNote {
          min-height: 0;
          margin: 10px 0 0;
        }
        .stage {
          height: 310px;
          border-radius: 22px;
        }
        .controls {
          grid-template-columns: 1fr;
          gap: 18px;
          margin-top: 16px;
          padding: 16px;
          border-radius: 18px;
        }
        .play {
          justify-content: stretch;
        }
        .play button {
          width: 100%;
        }
        .demo-label {
          font-size: 0.68rem;
          padding: 6px 10px;
        }
        footer {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
          margin-top: 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="brand">
          <span>◉</span>
          INNER / SPACE
        </div>
        <span class="demo-label" data-i="demoLabel">演示信号 · 无需麦克风</span>
      </header>
      <section class="main">
        <div class="copy-col">
          <div class="eyebrow" data-i="eyebrow">让声音，有自己的形状。</div>
          <h1>A little universe.</h1>
          <p class="intro" data-i="intro">
            一颗安静的小宇宙。换一种状态、挑一种颜色，再给它一点能量，看看它如何回应你。
          </p>
          <div class="modes" role="group" aria-label="声纹状态">
            <button data-mode="idle" aria-pressed="false" data-i="idle">静候</button>
            <button data-mode="listen" aria-pressed="false" data-i="listen">聆听</button>
            <button data-mode="speak" aria-pressed="true" data-i="speak">表达</button>
          </div>
          <p id="modeNote">起伏的丝带，像一句正在展开的话。</p>
          <div class="signal-wrap" aria-hidden="true">
            <div class="signal"></div>
          </div>
        </div>
        <div class="stage">
          <div class="stage-top">
            <span>PROCEDURAL / 03</span>
            <span id="energyReadout">ENERGY 55</span>
          </div>
          <canvas tabindex="0" role="button" aria-label="点击或按回车，释放脉冲"></canvas>
          <div class="stage-bottom">
            <span id="stateLabel">表达 / SPEAKING</span>
            <span data-i="tap">点一下 · 释放脉冲</span>
          </div>
        </div>
      </section>
      <section class="controls" aria-label="声纹控制">
        <div>
          <div class="label" data-i="palette">选择色域</div>
          <div class="palette" role="group" aria-label="色域">
            <button
              class="swatch"
              data-palette="0"
              aria-label="紫色星云"
              aria-pressed="true"
            ></button>
            <button
              class="swatch"
              data-palette="1"
              aria-label="青色极光"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-palette="2"
              aria-label="珊瑚日落"
              aria-pressed="false"
            ></button>
          </div>
        </div>
        <div>
          <label class="energy-label" for="energy">
            <span data-i="energy">手动能量</span>
            <output id="energyValue">55%</output>
          </label>
          <input id="energy" type="range" min="0" max="100" value="55" />
        </div>
        <div class="play">
          <button id="play" aria-pressed="false" data-i="play">▷ 播放 12 秒演示</button>
        </div>
      </section>
      <footer>
        <span data-i="footer">程序化丝带 / 玻璃高光 / 合成声纹</span>
        <span role="status" aria-live="polite" id="status">轻触球体，唤醒一次脉冲。</span>
      </footer>
    </main>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {};
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",

        if (document.hidden) stop(en ? "Demo paused while hidden." : "页面隐藏，演示已暂停。");
      });
      motion.addEventListener("change", () => {
        if (motion.matches) stop(en ? "Reduced motion enabled." : "已启用减少动态效果。");
      });
      note();
      status.textContent = en ? "Tap the orb to wake a pulse." : "轻触球体，唤醒一次脉冲。";
    </script>
  </body>
</html>
