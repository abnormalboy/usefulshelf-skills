<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>把一束光，拆成彩虹。</title>
    <style>
      :root {
        --accent: #b9a5ff;
        --bg: #07070c;
        --deck: rgba(16, 15, 26, 0.86);
        --ink: #f3f1fa;
        --muted: #aca4c2;
        --line: rgba(212, 198, 255, 0.13);
        --line-strong: rgba(212, 198, 255, 0.24);
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Hiragino Sans GB",
          "Noto Sans SC",
          "Helvetica Neue",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        color-scheme: dark;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 64% 52% at 54% 44%, rgba(124, 96, 224, 0.14), transparent 68%),
          radial-gradient(ellipse 46% 42% at 88% 58%, rgba(84, 196, 255, 0.08), transparent 72%);
        color: var(--ink);
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .shell {
        max-width: 1240px;
        padding: 18px 4.5% 20px;
        margin: auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
        font:
          500 0.72rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: #aba3c2;
        letter-spacing: 0.12em;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: #f4f1fc;
        font-weight: 600;
        font-size: 0.9rem;
        letter-spacing: 0.1em;
      }
      .brand span {
        color: var(--accent);
        text-shadow: 0 0 14px var(--accent);
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 28px;
        align-items: flex-end;
        margin-top: 14px;
      }
      h1 {
        font-size: clamp(1.9rem, 3.4vw, 2.85rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1.08;
        margin: 0;
        overflow-wrap: anywhere;
        max-width: 640px;
        white-space: pre-line;
        color: #faf8ff;
        text-wrap: balance;
      }
      :lang(zh) h1 {
        letter-spacing: -0.02em;
        line-height: 1.16;
      }
      .intro {
        font-size: 0.875rem;
        line-height: 1.62;
        color: var(--muted);
        max-width: 40ch;
        margin: 0;
        text-wrap: pretty;
      }
      .stage {
        position: relative;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin-top: 14px;
        border-radius: 22px;
        background:
          radial-gradient(ellipse 56% 64% at 49% 54%, rgba(56, 42, 92, 0.34), transparent 70%),
          linear-gradient(180deg, #0b0a14 0%, #05050a 100%);
        border: 1px solid var(--line-strong);
        box-shadow:
          0 28px 60px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(235, 226, 255, 0.14);
        aspect-ratio: 2.55;
        min-height: 220px;
        max-height: 345px;
        overflow: hidden;
      }
      .stage svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: hidden;
      }
      .edge {
        position: absolute;
        left: 18px;
        top: 14px;
        color: #b4accb;
        font:
          500 0.68rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.12em;
        pointer-events: none;
        padding: 4px 8px;
        border-radius: 4px;
        background: rgba(7, 7, 12, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .bottomedge {
        top: auto;
        bottom: 14px;
        left: auto;
        right: 18px;
      }
      .deck {
        margin-top: 14px;
        padding: 16px 20px;
        border-radius: 18px;
        background: var(--deck);
        border: 1px solid var(--line);
        box-shadow:
          0 16px 38px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 26px;
        align-items: center;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        color: #d2cae6;
        font-size: 0.8125rem;
        font-weight: 500;
        margin-bottom: 8px;
      }
      output {
        font:
          600 0.8rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: rgba(212, 198, 255, 0.15);
        accent-color: var(--accent);
        cursor: pointer;
        margin: 6px 0;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid var(--accent);
        box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent);
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        border: 3px solid var(--accent);
        box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent);
      }
      .swatches {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid rgba(212, 198, 255, 0.24);
        background: rgba(255, 255, 255, 0.045);
        border-radius: 10px;
        color: #dcd5ee;
        padding: 8px 14px;
        min-height: 36px;
        font-size: 0.8rem;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition:
          background-color 0.18s ease,
          border-color 0.18s ease,
          color 0.18s ease,
          box-shadow 0.18s ease;
      }
      .swatches button::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .swatches button[data-source="white"]::before {
        background: conic-gradient(#ff4d5a, #ffe45e, #4ef28b, #3be3f5, #c76bff, #ff4d5a);
      }
      .swatches button[data-source="red"]::before {
        background: #ff5964;
        box-shadow: 0 0 8px #ff5964;
      }
      .swatches button[data-source="blue"]::before {
        background: #6787ff;
        box-shadow: 0 0 8px #6787ff;
      }
      button[aria-pressed="true"] {
        color: #140d24;
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
        box-shadow:
          0 0 18px color-mix(in srgb, var(--accent) 42%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }
      @media (hover: hover) {
        button:hover:not([aria-pressed="true"]):not(.primary) {
          background: rgba(255, 255, 255, 0.1);
          border-color: rgba(212, 198, 255, 0.42);
          color: #ffffff;
        }
        button[aria-pressed="true"]:hover,
        .actions .primary:hover {
          filter: brightness(1.06);
        }
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .actions div {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .actions button {
        border-radius: 999px;
        padding: 9px 18px;
        min-height: 38px;
      }
      .actions .primary {
        background: #f2eefc;
        color: #150e24;
        border-color: #f2eefc;
        font-weight: 600;
        box-shadow: 0 0 22px rgba(242, 238, 252, 0.24);
      }
      #spectrumCount {
        font:
          500 0.76rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        color: #c4b9dc;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
      }
      footer {
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font:
          400 0.72rem/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: #a49bbb;
      }
      #status {
        color: #d4cae8;
      }
      @media (max-width: 820px) {
        .shell {
          padding: 18px 18px 20px;
        }
        .top {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
          margin-top: 14px;
        }
        h1 {
          font-size: 2.15rem;
        }
        .intro {
          max-width: none;
        }
        .stage {
          margin-top: 12px;
          min-height: 0;
          aspect-ratio: 1.5;
          border-radius: 16px;
        }
        .deck {
          padding: 14px;
          border-radius: 16px;
        }
        .controls {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .actions {
          align-items: flex-start;
          flex-direction: column;
          gap: 12px;
        }
        .edge {
          font-size: 0.62rem;
          top: 10px;
          left: 10px;
        }
        .bottomedge {
          top: auto;
          bottom: 10px;
          right: 10px;
          left: auto;
        }
        footer {
          flex-direction: column;
          gap: 5px;
        }
        header {
          font-size: 0.66rem;
        }
        .brand {
          font-size: 0.82rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="brand">
          <span>△</span>
          SPECTRUM / ROOM
        </div>
        <span data-i="header">02 — 光的拆解实验</span>
      </header>
      <section class="top">
        <h1>把一束光，拆成彩虹。</h1>
        <p class="intro" data-i="intro">
          转动入射光，展开一片颜色。调节色散，切换单色，再将你的光谱带走。
        </p>
      </section>
      <div class="stage">
        <span class="edge" data-i="incident">入射光 / INPUT</span>
        <svg
          id="optics"
          viewBox="0 0 900 460"
          role="img"
          aria-label="白光经过三角棱镜，分成七条彩色光束"
        >
          <defs>
            <linearGradient id="glass" x1="0.15" y1="0" x2="0.88" y2="1">
              <stop offset="0" stop-color="#e9e2ff" stop-opacity=".22" />
              <stop offset=".42" stop-color="#a898dc" stop-opacity=".04" />
              <stop offset=".78" stop-color="#87b2ff" stop-opacity=".08" />
              <stop offset="1" stop-color="#d8c8ff" stop-opacity=".18" />
            </linearGradient>
            <linearGradient id="bevelRight" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity=".35" />
              <stop offset="1" stop-color="#9e87dc" stop-opacity=".06" />
            </linearGradient>
            <linearGradient id="prismRim" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity=".95" />
              <stop offset=".5" stop-color="#d2c6f6" stop-opacity=".75" />
              <stop offset="1" stop-color="#95b7ff" stop-opacity=".85" />
            </linearGradient>
            <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur stdDeviation="11" />
            </filter>
            <filter id="blend" x="-20%" y="-100%" width="140%" height="300%">
              <feGaussianBlur stdDeviation="5.5" />
            </filter>
            <radialGradient id="vertexGlint">
              <stop offset="0" stop-color="#ffffff" stop-opacity=".95" />
              <stop offset=".45" stop-color="#d6c8ff" stop-opacity=".35" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <pattern id="benchGrid" width="45" height="45" patternUnits="userSpaceOnUse">
              <path
                d="M45 0H0V45"
                fill="none"
                stroke="#ffffff"
                stroke-opacity=".035"
                stroke-width="1"
              />
            </pattern>
          </defs>
          <!-- Optical bench background grid & goniometer calibration arc -->
          <rect width="900" height="460" fill="url(#benchGrid)" />
          <g fill="none" stroke="#b9a8e8" stroke-opacity=".14" stroke-width="1">
            <circle cx="430" cy="255" r="196" stroke-dasharray="2 7" />
            <circle cx="430" cy="255" r="142" stroke-opacity=".08" />
            <line x1="20" y1="235" x2="880" y2="235" stroke-opacity=".07" stroke-dasharray="4 6" />
          </g>
          <g id="rays"></g>
          <!-- Jewel-beveled equilateral crystal prism -->
          <path
            d="M430 95 270 370 590 370Z"
            fill="url(#glass)"
            stroke="url(#prismRim)"
            stroke-width="1.65"
            stroke-linejoin="round"
          />
          <!-- 3D beveled facet thickness & internal caustic reflection ribs -->
          <path d="M430 95 441 103 601 378 590 370Z" fill="url(#bevelRight)" opacity=".32" />
          <path d="M270 370 281 378 601 378 590 370Z" fill="#8d7eb8" opacity=".16" />
          <path
            d="M430 95 441 103 601 378 281 378 270 370"
            fill="none"
            stroke="#9a8bbf"
            stroke-opacity=".42"
            stroke-width="1"
          />
          <path
            d="M430 112 288 357 572 357Z"
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".16"
            stroke-width="0.9"
          />
          <path
            d="M430 104 294 344"
            fill="none"
            stroke="#ffffff"
            stroke-opacity=".42"
            stroke-width="1.4"
            stroke-linecap="round"
          />
          <!-- Pinpoint crystal vertex glints -->
          <circle cx="430" cy="95" r="9" fill="url(#vertexGlint)" />
          <circle cx="270" cy="370" r="6" fill="url(#vertexGlint)" opacity=".65" />
          <circle cx="590" cy="370" r="6" fill="url(#vertexGlint)" opacity=".65" />
          <g id="pulseDot"></g>
          <g
            font-family="ui-monospace, Menlo, monospace"
            font-size="11"
            fill="#a59cc4"
            letter-spacing="1.4"
          >
            <text x="419" y="75">60°</text>
            <text x="328" y="408">OPTICAL DISPERSION · CROWN GLASS</text>
          </g>
        </svg>
        <span class="edge bottomedge" data-i="output">折射光 / OUTPUT</span>
      </div>
      <div class="deck">
        <section class="controls">
          <div>
            <label class="row" for="angle">
              <span data-i="angle">入射方向</span>
              <output id="angleValue">−10°</output>
            </label>
            <input type="range" min="-25" max="25" value="-10" id="angle" />
          </div>
          <div>
            <label class="row" for="spread">
              <span data-i="spread">色散展开</span>
              <output id="spreadValue">48°</output>
            </label>
            <input type="range" min="12" max="78" value="48" id="spread" />
          </div>
          <div class="source">
            <div class="row" data-i="source">光源颜色</div>
            <div class="swatches" role="group" aria-label="光源">
              <button data-source="white" aria-pressed="true" data-i="white">白光</button>
              <button data-source="red" aria-pressed="false" data-i="red">红光</button>
              <button data-source="blue" aria-pressed="false" data-i="blue">蓝光</button>
            </div>
          </div>
        </section>
        <section class="actions">
          <div>
            <button id="pulse" class="primary" data-i="pulse">释放一束光 ↗</button>
            <button id="reset" data-i="reset">回到起点 ↺</button>
            <button id="save" data-i="save">保存 SVG ↓</button>
          </div>
          <span id="spectrumCount">7 条出射光束</span>
        </section>
      </div>
      <footer>
        <span data-i="footer">几何色散示意 · 非精密光学仿真</span>
        <span id="status" role="status" aria-live="polite">七种颜色，来自同一束光。</span>
      </footer>
    </main>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {};
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(
              /Packed ([\d,]+) bytes\. CRC32 ([0-9a-f]+)\. Download contains the complete file, ready to decode\./gi,
              "已打包 $1 字节。CRC32 $2。下载文件包含完整内容，可直接解码。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
          applyLanguage(resolved);
        };

        function boot() {
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;
          if (chinese) applyLanguage("zh");

          let langObserver;
          if (typeof MutationObserver === "function") {
            langObserver = new MutationObserver(() => {
              const next =
                normalizeLang(document.documentElement.dataset.skillLang) || resolveLang();
              if (next !== currentLang) applyLanguage(next);
            });
            langObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skill-lang"],
            });
            window.addEventListener("pagehide", () => langObserver.disconnect(), { once: true });
          }

          if (parent === window) return;
          // Freeze viewport-based demo heights before measuring, avoiding vh feedback
          // when the parent grows the iframe. Intentional inner demo scrollers remain.
          const initialHeight = Math.max(360, Math.min(760, innerHeight));
          function fixRules(rules) {
            for (const rule of rules) {
              if (rule.cssRules) fixRules(rule.cssRules);
              if (!rule.style) continue;
              if (/v[hbs]/.test(rule.style.minHeight))
                rule.style.setProperty("min-height", "0", "important");
              if (/v[hbs]/.test(rule.style.height))
                rule.style.setProperty("height", `${initialHeight}px`, "important");
            }
          }
          for (const sheet of document.styleSheets) {
            try {
              fixRules(sheet.cssRules);
            } catch {
              /* Same-file styles are sufficient. */
            }
          }
          for (const element of [document.documentElement, document.body]) {
            element.style.setProperty("height", "auto", "important");
            element.style.setProperty("min-height", "0", "important");
          }
          document.documentElement.style.overflowX = "clip";
          let frame = 0,
            lastHeight = 0;
          const measure = () => {
            frame = 0;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height),
            );
            if (height > 0 && height <= 20000 && height !== lastHeight) {
              lastHeight = height;
              parent.postMessage({ type: "usefulshelf:resize", height }, "*");
            }
          };
          const schedule = () => {
            if (!frame) frame = requestAnimationFrame(measure);
          };
          const observer = new ResizeObserver(schedule);
          observer.observe(document.body);
          window.addEventListener("resize", schedule);
          const onMessage = (event) => {
            if (event.source === parent && event.data?.type === "usefulshelf:measure") {
              // The first resize may precede parent hydration. A measurement request
              // must acknowledge even an unchanged height, so that message is recovered.
              lastHeight = 0;
              schedule();
            }
          };
          window.addEventListener("message", onMessage);
          document.fonts?.ready.then(schedule);
          window.addEventListener(
            "pagehide",
            () => {
              observer.disconnect();
              cancelAnimationFrame(frame);
              window.removeEventListener("resize", schedule);
              window.removeEventListener("message", onMessage);
            },
            { once: true },
          );
          schedule();
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        else boot();
      })();
    </script>
    <!-- usefulshelf-runtime:end -->
    <script>
      const config = window.__usefulshelfConfigure({"title": null, "accent": "#b9a5ff", "spread": 48, "angle": -10, "customTitle": false}),
        resolvedLang =
          new URLSearchParams(location.search).get("lang") ||
          document.documentElement.dataset.skillLang ||
          (document.documentElement.lang?.toLowerCase().startsWith("zh") ? "zh" : "en"),
        en = resolvedLang !== "zh";
      document.documentElement.lang = en ? "en" : "zh-CN";
      const words = {
        header: "02 — THE ANATOMY OF LIGHT",
        intro:
          "Turn the incoming beam and open a field of color. Adjust its spread, try a single color, and take your spectrum with you.",
        incident: "INPUT / INCIDENT LIGHT",
        output: "OUTPUT / REFRACTED LIGHT",
        angle: "Incoming direction",
        spread: "Spectral spread",
        source: "Light source",
        white: "White light",
        red: "Red light",
        blue: "Blue light",
        pulse: "Send a light pulse ↗",
        reset: "Reset the scene ↺",
        save: "Save SVG ↓",
        footer: "Geometric dispersion study · Not a precision optics simulation",
      };
      if (en) {
        document.querySelectorAll("[data-i]").forEach((e) => (e.textContent = words[e.dataset.i]));
        document.querySelector(".swatches").setAttribute("aria-label", "Light source");
      }
      if (!config.customTitle) {
        document.querySelector("h1").textContent = en
          ? "One beam.\nA world of color."
          : "把一束光，\n拆成彩虹。";
        document.title = en ? "One beam. A world of color." : "把一束光，拆成彩虹。";
      }
      const angle = document.querySelector("#angle"),
        spread = document.querySelector("#spread"),
        svg = document.querySelector("#optics"),
        rays = document.querySelector("#rays"),
        pulseLayer = document.querySelector("#pulseDot"),
        status = document.querySelector("#status"),
        motion = matchMedia("(prefers-reduced-motion: reduce)");
      angle.value = config.angle;
      spread.value = config.spread;
      let source = "white",
        raf = 0,
        started = 0,
        path = [];
      const colors = ["#ff4d5a", "#ff9c3b", "#ffe45e", "#4ef28b", "#3be3f5", "#5e7cff", "#c76bff"];
      const radians = (d) => (d * Math.PI) / 180;
      function endpoint(deg) {
        const dx = Math.cos(radians(deg)),
          dy = Math.sin(radians(deg)),
          tx = (884 - 511) / dx,
          ty = dy > 0 ? (444 - 235) / dy : dy < 0 ? (16 - 235) / dy : Infinity,
          t = Math.min(tx, ty);
        return { x: 511 + dx * t, y: 235 + dy * t };
      }
      function clearPulse() {
        cancelAnimationFrame(raf);
        raf = 0;
        pulseLayer.replaceChildren();
      }
      function render() {
        clearPulse();
        const a = Number(angle.value),
          s = Number(spread.value),
          startY = 235 - Math.tan(radians(a)) * 318;
        const indices = source === "white" ? [0, 1, 2, 3, 4, 5, 6] : [source === "red" ? 0 : 5];
        let output = "";
        for (const i of indices) {
          const deg = a * 0.42 + 8 + ((i - 3) * s) / 6,
            end = endpoint(deg),
            lower = endpoint(deg - s / 12),
            upper = endpoint(deg + s / 12),
            color = colors[i];
          output +=
            `<path d="M511 235 L${lower.x.toFixed(1)} ${lower.y.toFixed(1)} L${upper.x.toFixed(1)} ${upper.y.toFixed(1)}Z" fill="${color}" opacity=".54" filter="url(#blend)"/>` +
            `<path d="M511 235 L${end.x.toFixed(1)} ${end.y.toFixed(1)}" fill="none" stroke="${color}" stroke-width="26" opacity=".26" filter="url(#soft)"/>` +
            `<path d="M511 235 L${end.x.toFixed(1)} ${end.y.toFixed(1)}" fill="none" stroke="${color}" stroke-width="1.4" opacity=".62"/>`;
        }
        const input = source === "white" ? "#f8f4ff" : colors[indices[0]];
        const internalCone =
          `<path d="M348 235 L511 223 L511 247 Z" fill="${input}" opacity=".2" filter="url(#blend)"/>` +
          `<path d="M348 235 L511 235" fill="none" stroke="${input}" stroke-width="4" opacity=".26" filter="url(#blend)"/>` +
          `<path d="M348 235 L511 235" fill="none" stroke="${input}" stroke-width="1.6" opacity=".72"/>`;
        const emitter =
          `<rect x="14" y="${(startY - 9).toFixed(1)}" width="18" height="18" rx="4" fill="#171526" stroke="#625880" stroke-width="1.1"/>` +
          `<circle cx="30" cy="${startY.toFixed(1)}" r="4.5" fill="${input}" opacity=".85" filter="url(#blend)"/>` +
          `<circle cx="30" cy="${startY.toFixed(1)}" r="2" fill="#ffffff"/>`;
        const entryAndExitFlares =
          `<circle cx="348" cy="235" r="14" fill="${input}" opacity=".35" filter="url(#soft)"/>` +
          `<circle cx="348" cy="235" r="3" fill="#ffffff" opacity=".9"/>` +
          `<circle cx="511" cy="235" r="16" fill="${source === "white" ? "#d5c6ff" : input}" opacity=".35" filter="url(#soft)"/>` +
          `<circle cx="511" cy="235" r="3.2" fill="#ffffff" opacity=".88"/>`;
        rays.innerHTML =
          `<path d="M30 ${startY.toFixed(1)} L348 235" fill="none" stroke="${input}" stroke-width="16" opacity=".24" filter="url(#soft)"/>` +
          `<path d="M30 ${startY.toFixed(1)} L348 235" fill="none" stroke="${input}" stroke-width="4.5" opacity=".5" filter="url(#blend)"/>` +
          `<path d="M30 ${startY.toFixed(1)} L348 235" fill="none" stroke="#ffffff" stroke-width="2.1"/>` +
          internalCone +
          output +
          entryAndExitFlares +
          emitter;
        path = [
          { x: 30, y: startY },
          { x: 348, y: 235 },
          { x: 511, y: 235 },
          endpoint(a * 0.42 + 8 + ((indices[Math.floor(indices.length / 2)] - 3) * s) / 6),
        ];
        document.querySelector("#angleValue").textContent = a + "°";
        document.querySelector("#spreadValue").textContent = s + "°";
        document.querySelector("#spectrumCount").textContent = en
          ? `${indices.length} outgoing beam${indices.length === 1 ? "" : "s"}`
          : `${indices.length} 条出射光束`;
        svg.setAttribute(
          "aria-label",
          en
            ? `${words[source]}, incoming direction ${a} degrees, spread ${s} degrees, ${indices.length} outgoing beams.`
            : `${{ white: "白光", red: "红光", blue: "蓝光" }[source]}，入射方向 ${a} 度，色散展开 ${s} 度，${indices.length} 条出射光束。`,
        );
      }
      function changed() {
        render();
        status.textContent = en
          ? `Direction ${angle.value}° · spread ${spread.value}°.`
          : `入射方向 ${angle.value}° · 色散展开 ${spread.value}°。`;
      }
      angle.oninput = changed;
      spread.oninput = changed;
      document.querySelectorAll("[data-source]").forEach(
        (b) =>
          (b.onclick = () => {
            source = b.dataset.source;
            document
              .querySelectorAll("[data-source]")
              .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            render();
            status.textContent = en ? `${words[source]} selected.` : `已切换为${b.textContent}。`;
          }),
      );
      function pointAt(t) {
        const lengths = path.slice(1).map((p, i) => Math.hypot(p.x - path[i].x, p.y - path[i].y)),
          total = lengths.reduce((a, b) => a + b, 0);
        let distance = t * total;
        for (let i = 0; i < lengths.length; i++) {
          if (distance <= lengths[i]) {
            const p = distance / lengths[i];
            return {
              x: path[i].x + (path[i + 1].x - path[i].x) * p,
              y: path[i].y + (path[i + 1].y - path[i].y) * p,
            };
          } else distance -= lengths[i];
        }
        return path.at(-1);
      }
      function frame(now) {
        const t = Math.min((now - started) / 1500, 1),
          p = pointAt(t);
        pulseLayer.innerHTML =
          `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="16" fill="#ffffff" opacity=".4" filter="url(#soft)"/>` +
          `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="7" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.2"/>` +
          `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.6" fill="#ffffff"/>`;
        if (t < 1) raf = requestAnimationFrame(frame);
        else {
          clearPulse();
          status.textContent = en
            ? "Pulse complete. Send another, or change the light."
            : "光脉冲已完成。再发一束，或换一种光。";
        }
      }
      document.querySelector("#pulse").onclick = () => {
        clearPulse();
        if (motion.matches) {
          status.textContent = en
            ? "Static light paths shown. Reduced motion is enabled."
            : "已显示静态光路。减少动态效果已启用。";
          return;
        }
        started = performance.now();
        status.textContent = en
          ? "A pulse is travelling through the prism."
          : "一束光脉冲正在穿过棱镜。";
        raf = requestAnimationFrame(frame);
      };
      document.querySelector("#reset").onclick = () => {
        angle.value = config.angle;
        spread.value = config.spread;
        source = "white";
        document
          .querySelectorAll("[data-source]")
          .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.source === "white")));
        render();
        status.textContent = en
          ? "Scene reset. White light is ready."
          : "已回到起点，白光已准备好。";
      };
      document.querySelector("#save").onclick = () => {
        const clone = svg.cloneNode(true);
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        clone.setAttribute("width", "1800");
        clone.setAttribute("height", "920");
        clone.querySelector("#pulseDot").replaceChildren();
        const background = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        background.setAttribute("width", "900");
        background.setAttribute("height", "460");
        background.setAttribute("fill", "#07070c");
        clone.insertBefore(background, clone.firstChild);
        const url = URL.createObjectURL(
            new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" }),
          ),
          a = document.createElement("a");
        a.href = url;
        a.download = "prism-light-study.svg";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        status.textContent = en
          ? "Your current light paths were saved as SVG."
          : "当前光路已保存为 SVG。";
      };
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          const active = Boolean(raf);
          clearPulse();
          if (active)
            status.textContent = en ? "Pulse stopped while hidden." : "页面隐藏，光脉冲已停止。";
        }
      });
      motion.addEventListener("change", () => {
        if (motion.matches) {
          clearPulse();
          status.textContent = en
            ? "Reduced motion enabled. Light paths remain visible."
            : "减少动态效果已启用，静态光路保持可见。";
        }
      });
      render();
      status.textContent = en ? "Seven colors, one incoming beam." : "七种颜色，来自同一束光。";
    </script>
  </body>
