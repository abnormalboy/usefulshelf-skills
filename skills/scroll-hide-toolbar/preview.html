<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll-aware toolbar</title>
    <style>
      :root {
        --bg: #e2e6ee;
        --stage: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2f7dff;
        --glass: rgba(255,255,255,0.68);
        --glass-border: rgba(255,255,255,0.75);
        --shadow: 0 32px 72px rgba(15,23,42,0.22);
        --icon-radius: 28%;
        --nav-hide-ms: 320ms;
        --font:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
        --phone-w: 378px;
        --phone-h: 616px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        font-family: var(--font);
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 68% 58% at 50% 24%, rgba(255, 255, 255, 0.72), transparent 68%),
          radial-gradient(
            circle at 22% 82%,
            color-mix(in srgb, var(--accent) 9%, transparent),
            transparent 46%
          );
        color: var(--text);
        display: grid;
        place-items: center;
        min-height: 100%;
        padding: 18px 16px 24px;
      }
      body.theme-dark {
        background-image:
          radial-gradient(ellipse 64% 52% at 50% 22%, rgba(255, 255, 255, 0.065), transparent 64%),
          radial-gradient(
            circle at 50% 78%,
            color-mix(in srgb, var(--accent) 12%, transparent),
            transparent 52%
          );
      }
      .wrap {
        width: min(100%, 920px);
        display: grid;
        gap: 16px;
        justify-items: center;
      }
      .meta {
        text-align: center;
        max-width: 560px;
        overflow-wrap: anywhere;
      }
      .meta h1 {
        margin: 0 0 6px;
        font-size: clamp(1.4rem, 2.2vw, 1.8rem);
        font-weight: 680;
        letter-spacing: -0.03em;
        line-height: 1.18;
      }
      .meta p {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.48;
      }
      .hint {
        margin-top: 6px !important;
        font-size: 0.8rem !important;
        color: var(--muted);
      }
      .device-chassis {
        position: relative;
        width: min(100%, calc(var(--phone-w) + 22px));
        padding: 11px;
        border-radius: 54px;
        background: linear-gradient(
          145deg,
          #e3e6ec 0%,
          #9ca2ae 24%,
          #d2d6de 48%,
          #757b86 76%,
          #c4c9d2 100%
        );
        box-shadow:
          var(--shadow),
          0 4px 12px rgba(15, 23, 42, 0.14),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.9),
          inset 0 -1.5px 2px rgba(15, 23, 42, 0.32);
      }
      body.theme-dark .device-chassis {
        background: linear-gradient(
          145deg,
          #5c616d 0%,
          #2a2d35 28%,
          #4b505c 54%,
          #1f2228 80%,
          #464b56 100%
        );
      }
      .device-chassis::before {
        content: "";
        position: absolute;
        left: -3px;
        top: 132px;
        width: 3px;
        height: 46px;
        border-radius: 3px 0 0 3px;
        background: linear-gradient(180deg, #b8bec8, #707682);
        box-shadow: 0 58px 0 #8a909b;
        pointer-events: none;
      }
      .device-chassis::after {
        content: "";
        position: absolute;
        right: -3px;
        top: 162px;
        width: 3px;
        height: 68px;
        border-radius: 0 3px 3px 0;
        background: linear-gradient(180deg, #b8bec8, #707682);
        pointer-events: none;
      }
      .phone {
        width: 100%;
        height: min(74vh, var(--phone-h));
        background-color: var(--stage);
        border-radius: 43px;
        border: 4px solid #0e1014;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.2),
          0 0 0 1px rgba(0, 0, 0, 0.35);
        position: relative;
        overflow: hidden;
      }
      .phone::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.24) 0%,
          rgba(255, 255, 255, 0.04) 22%,
          transparent 44%
        );
        pointer-events: none;
        z-index: 12;
      }
      .status {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 24px 0;
        font-size: 13.5px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        z-index: 9;
        pointer-events: none;
        background: linear-gradient(
          to bottom,
          color-mix(in srgb, var(--stage) 92%, transparent) 55%,
          transparent
        );
      }
      .island {
        position: absolute;
        left: 50%;
        top: 11px;
        transform: translateX(-50%);
        width: 106px;
        height: 28px;
        border-radius: 999px;
        background: linear-gradient(180deg, #111318 0%, #050608 100%);
        box-shadow:
          0 2px 8px rgba(0, 0, 0, 0.24),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 10px;
      }
      .island-lens {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: radial-gradient(circle at 38% 36%, #3f6ec9 0%, #142244 45%, #05080f 85%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      }
      .status .pills {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .status svg {
        display: block;
        height: 12px;
        width: auto;
      }
      .home-bar {
        position: absolute;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        width: 120px;
        height: 4.5px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--text) 28%, transparent);
        z-index: 10;
        pointer-events: none;
      }
      .scroller {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding: 66px 26px 136px;
        scrollbar-width: none;
      }
      .scroller::-webkit-scrollbar {
        display: none;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px 22px;
      }
      .app {
        display: flex;
        flex-direction: column;
        min-width: 0;
        align-items: center;
        gap: 9px;
        text-decoration: none;
        color: inherit;
        cursor: default;
        user-select: none;
      }
      .icon {
        width: 100%;
        aspect-ratio: 1;
        border-radius: var(--icon-radius);
        box-shadow:
          0 12px 24px rgba(15, 23, 42, 0.14),
          0 3px 6px rgba(15, 23, 42, 0.08),
          inset 0 1.5px 1.5px rgba(255, 255, 255, 0.78),
          inset 0 -2px 4px rgba(15, 23, 42, 0.12);
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }
      .icon::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          150deg,
          rgba(255, 255, 255, 0.28) 0%,
          rgba(255, 255, 255, 0.04) 38%,
          transparent 54%
        );
        pointer-events: none;
      }
      .label {
        font-size: 13px;
        text-align: center;
        overflow-wrap: anywhere;
        max-width: 100%;
        font-weight: 540;
        letter-spacing: -0.01em;
        color: var(--text);
      }
      /* Sculpted multi-layered iOS app icon skins */
      .i-camera {
        background: linear-gradient(160deg, #f0f2f5 0%, #c8cdd6 65%, #aeb5c2 100%);
      }
      .i-maps {
        background: linear-gradient(145deg, #f1f5f9, #e2e8f0);
      }
      .i-weather {
        background: linear-gradient(180deg, #3c98ff 0%, #1d64d8 64%, #1549ab 100%);
      }
      .i-share {
        background: linear-gradient(180deg, #43a4ff 0%, #1762d4 100%);
      }
      .i-translate {
        background: linear-gradient(165deg, #273242 0%, #111827 100%);
      }
      .i-wallet {
        background: linear-gradient(180deg, #292c34 0%, #12141a 100%);
      }
      .i-mail {
        background: linear-gradient(180deg, #4ab3ff 0%, #1e6de2 100%);
      }
      .i-passwords {
        background: linear-gradient(165deg, #282c36 0%, #12141b 100%);
      }
      .i-music {
        background: linear-gradient(155deg, #ff5f8d 0%, #f42c5c 52%, #cf1552 100%);
      }
      .i-settings {
        background: linear-gradient(180deg, #d7dce4 0%, #99a1b0 100%);
      }
      .i-photos {
        background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      }
      .i-notes {
        background: linear-gradient(180deg, #ffffff 0%, #f7f4e9 100%);
      }
      .glyph {
        width: 100%;
        height: 100%;
        display: block;
      }
      .nav {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: max(26px, env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 8;
      }
      .pill {
        width: 160px;
        height: 56px;
        border-radius: 999px;
        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.56) 0%,
            rgba(255, 255, 255, 0.14) 52%,
            rgba(180, 232, 255, 0.18) 100%
          ),
          var(--glass);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(26px) saturate(1.85);
        -webkit-backdrop-filter: blur(26px) saturate(1.85);
        box-shadow:
          0 16px 36px rgba(15, 23, 42, 0.16),
          0 2px 8px rgba(15, 23, 42, 0.08),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.92),
          inset 0 -8px 16px rgba(96, 205, 235, 0.2);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 6px;
        overflow: hidden;
        transition:
          width var(--nav-hide-ms) cubic-bezier(0.22, 1, 0.36, 1),
          background var(--nav-hide-ms) ease;
        will-change: width;
      }
      body.theme-dark .pill {
        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.14) 0%,
            rgba(255, 255, 255, 0.02) 55%,
            rgba(96, 165, 250, 0.12) 100%
          ),
          var(--glass);
        box-shadow:
          0 18px 36px rgba(0, 0, 0, 0.52),
          inset 0 1px 0 rgba(255, 255, 255, 0.24),
          inset 0 -8px 14px rgba(56, 189, 248, 0.12);
      }
      .nav.is-hidden .pill {
        width: 56px;
        background: var(--glass);
      }
      .pill button {
        flex: 0 0 42px;
        width: 42px;
        height: 42px;
        border: 0;
        background: transparent;
        border-radius: 50%;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: var(--text);
        -webkit-tap-highlight-color: transparent;
        transition:
          background 160ms ease,
          transform 120ms ease,
          opacity var(--nav-hide-ms) ease;
      }
      .pill button[data-tab="profile"] {
        background: linear-gradient(155deg, #ffffff 0%, #c6f0fb 78%);
        border: 1px solid rgba(255, 255, 255, 0.94);
        box-shadow:
          0 4px 12px rgba(37, 99, 235, 0.22),
          inset 0 1px 1px #ffffff;
        overflow: hidden;
      }
      .pill button[data-tab="profile"] svg {
        width: 34px;
        height: 34px;
      }
      .nav.is-hidden .pill button:not([data-tab="profile"]) {
        opacity: 0;
        pointer-events: none;
      }
      @media (hover: hover) {
        .pill button:hover {
          background: rgba(15, 23, 42, 0.07);
        }
        .pill button[data-tab="profile"]:hover {
          background: linear-gradient(155deg, #ffffff, #ace6f8);
        }
      }
      .pill button:active {
        transform: scale(0.93);
      }
      .pill button.active:not([data-tab="profile"]) {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 24%, transparent);
      }
      .fab {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 1px solid var(--glass-border);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.56), transparent 62%), var(--glass);
        backdrop-filter: blur(26px) saturate(1.85);
        -webkit-backdrop-filter: blur(26px) saturate(1.85);
        box-shadow:
          0 16px 34px rgba(15, 23, 42, 0.16),
          0 2px 8px rgba(15, 23, 42, 0.08),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.92);
        display: grid;
        place-items: center;
        cursor: pointer;
        color: var(--text);
        font-size: 27px;
        font-weight: 400;
        line-height: 1;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform var(--nav-hide-ms) cubic-bezier(0.22, 1, 0.36, 1),
          opacity var(--nav-hide-ms) ease,
          background 160ms ease;
      }
      body.theme-dark .fab {
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.14), transparent 60%), var(--glass);
        box-shadow:
          0 18px 34px rgba(0, 0, 0, 0.52),
          inset 0 1px 0 rgba(255, 255, 255, 0.24);
      }
      .nav.is-hidden .fab {
        opacity: 0;
        transform: translateY(20px) scale(0.72);
        pointer-events: none;
      }
      .fab:active {
        transform: scale(0.93);
      }
      @media (hover: hover) {
        .fab:hover {
          background: color-mix(in srgb, var(--accent) 14%, var(--glass));
          color: var(--accent);
        }
      }
      button:focus-visible,
      .scroller:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      @media (max-width: 480px) {
        body {
          padding: 0;
        }
        .wrap {
          width: 100%;
          gap: 0;
        }
        .device-chassis {
          width: 100%;
          padding: 0;
          border-radius: 0;
          background: none;
          box-shadow: none;
        }
        .device-chassis::before,
        .device-chassis::after {
          display: none;
        }
        .phone {
          width: 100%;
          height: 100vh;
          height: 100dvh;
          border-radius: 0;
          border: 0;
          box-shadow: none;
        }
        .phone::after {
          display: none;
        }
        .meta,
        .hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body
    class="theme-light"
    data-hide-threshold="8"
    data-title="Scroll-aware toolbar"
    data-accent="#2f7dff"
  >
    <div class="wrap">
      <div class="meta">
        <h1 id="doc-title">Scroll-aware toolbar</h1>
        <p id="doc-label">A floating glass toolbar that follows your scroll direction.</p>
        <p class="hint">
          Scroll the phone screen — the capsule contracts on down-scroll and expands on up-scroll.
        </p>
      </div>
      <div class="device-chassis">
        <div class="phone" id="phone" aria-label="Hide-on-scroll navbar demo">
          <div class="status" aria-hidden="true">
            <span>9:41</span>
            <div class="island"><span class="island-lens"></span></div>
            <span class="pills">
              <svg viewBox="0 0 18 12" fill="currentColor">
                <rect x="0" y="7" width="3" height="5" rx="1" />
                <rect x="4.5" y="5" width="3" height="7" rx="1" />
                <rect x="9" y="2.5" width="3" height="9.5" rx="1" />
                <rect x="13.5" y="0" width="3" height="12" rx="1" />
              </svg>
              <svg viewBox="0 0 26 12" fill="none">
                <rect
                  x="1"
                  y="1"
                  width="21"
                  height="10"
                  rx="3"
                  stroke="currentColor"
                  stroke-width="1.4"
                  opacity="0.82"
                />
                <rect x="3" y="3" width="15" height="6" rx="1.4" fill="currentColor" />
                <path
                  d="M23.5 4.2v3.6"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  opacity="0.6"
                />
              </svg>
            </span>
          </div>
          <div
            class="scroller"
            id="scroller"
            tabindex="0"
            role="region"
            aria-label="Scrollable app grid"
          >
            <div class="grid" id="app-grid"></div>
          </div>
          <nav class="nav" id="floating-nav" aria-label="Floating toolbar">
            <div class="pill" role="toolbar" aria-label="Demo views">
              <button
                type="button"
                data-tab="profile"
                aria-pressed="false"
                tabindex="-1"
                aria-label="Profile"
                title="Profile"
              >
                <svg viewBox="0 0 40 40" aria-hidden="true">
                  <path d="M8 37c1-8 6-11 12-11s11 3 12 11" fill="#689bb2" />
                  <ellipse cx="20" cy="20" rx="10" ry="12" fill="#f5dbc8" />
                  <path
                    d="M10 18c-2-9 4-15 12-14 5-3 11 2 9 10-3-1-4-4-6-5-2 3-7 5-15 4z"
                    fill="#1e293b"
                  />
                  <path d="M10 15l-4 3 6 1m17-7 5 5-5 1" fill="#1e293b" />
                  <path
                    d="M11 20c3-3 6-2 9 0 3-2 6-3 9 0m-9 0v2"
                    fill="none"
                    stroke="#1e293b"
                    stroke-width="1.6"
                  />
                  <circle cx="15" cy="21" r="1.2" fill="#1e293b" />
                  <circle cx="25" cy="21" r="1.2" fill="#1e293b" />
                  <path
                    d="M17 27q3 2 6 0"
                    fill="none"
                    stroke="#a4695d"
                    stroke-width="1.4"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
              <button
                type="button"
                data-tab="charts"
                aria-pressed="false"
                tabindex="-1"
                aria-label="Charts"
                title="Charts"
              >
                <svg
                  width="21"
                  height="21"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 16l4-4 3 3 6-7" />
                  <path d="M4 20h16" />
                </svg>
              </button>
              <button
                type="button"
                data-tab="list"
                class="active"
                aria-label="List"
                title="List"
                aria-pressed="true"
              >
                <svg
                  width="21"
                  height="21"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                >
                  <path d="M8 7h11M8 12h11M8 17h11" />
                  <circle cx="4.8" cy="7" r="1.15" fill="currentColor" stroke="none" />
                  <circle cx="4.8" cy="12" r="1.15" fill="currentColor" stroke="none" />
                  <circle cx="4.8" cy="17" r="1.15" fill="currentColor" stroke="none" />
                </svg>
              </button>
            </div>
            <button
              type="button"
              class="fab"
              id="fab"
              aria-label="Add a sample icon"
              title="Add a sample icon"
            >
              +
            </button>
          </nav>
          <div class="home-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {
          "A floating glass toolbar that follows your scroll direction.":
            "跟随滚动方向展开与收起的玻璃悬浮导航。",
          Add: "添加",
          "Add a sample icon": "添加示例图标",
          Camera: "相机",
          Charts: "图表",
          "Demo views": "示例视图",
          "Floating toolbar": "悬浮导航",
          "Hide-on-scroll navbar demo": "滚动隐藏导航演示",
          Home: "首页",
          List: "列表",
          Mail: "邮件",
          Maps: "地图",
          Music: "音乐",
          New: "新建",
          Notes: "便笺",
          Passwords: "密码",
          Photos: "照片",
          Profile: "个人入口",
          "Scroll the phone screen — the capsule contracts on down-scroll and expands on up-scroll.":
            "滚动手机画面：下滑收起胶囊，上滑重新展开。",
          "Scroll-aware toolbar": "会随滚动收起的导航。",
          "Scrollable app grid": "可滚动的应用网格",
          Select: "选择",
          Settings: "设置",
          Share: "分享",
          Translate: "翻译",
          Wallet: "钱包",
          Weather: "天气",
          name: "名称",
        };
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
