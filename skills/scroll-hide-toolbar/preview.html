<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll-aware toolbar</title>
    <style>
      :root {
        --bg: #e8eaef;
        --stage: #ffffff;
        --text: #111111;
        --muted: #475569;
        --accent: #2f7dff;
        --glass: rgba(255,255,255,0.62);
        --glass-border: rgba(255,255,255,0.55);
        --shadow: 0 24px 60px rgba(15,23,42,0.18);
        --icon-radius: 28%;
        --nav-hide-ms: 320ms;
        --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --phone-w: 390px;
        --phone-h: 844px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        min-height: 100%;
        padding: 24px 16px;
      }
      .wrap {
        width: min(100%, 920px);
        display: grid;
        gap: 18px;
        justify-items: center;
      }
      .meta {
        text-align: center;
        max-width: 560px;
        overflow-wrap: anywhere;
      }
      .meta h1 {
        margin: 0 0 6px;
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .meta p {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }
      .hint {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .phone {
        width: min(100%, var(--phone-w));
        height: min(76vh, var(--phone-h));
        background: var(--stage);
        border-radius: 42px;
        border: 3px solid #111;
        box-shadow:
          var(--shadow),
          inset 0 0 0 1px rgba(255, 255, 255, 0.35);
        position: relative;
        overflow: hidden;
      }
      .status {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 28px 8px;
        font-size: 14px;
        font-weight: 600;
        z-index: 5;
        pointer-events: none;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0.85), transparent);
      }
      body.theme-dark .status {
        background: linear-gradient(to bottom, rgba(17, 19, 24, 0.9), transparent);
      }
      .status .pills {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .status .bar {
        width: 17px;
        height: 10px;
        border: 1.5px solid currentColor;
        border-radius: 2px;
        position: relative;
        opacity: 0.85;
      }
      .status .bar::after {
        content: "";
        position: absolute;
        inset: 2px 5px 2px 2px;
        background: currentColor;
        border-radius: 1px;
      }
      .scroller {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding: 56px 28px 140px;
        scrollbar-width: none;
      }
      .scroller::-webkit-scrollbar {
        display: none;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px 22px;
      }
      .app {
        display: flex;
        flex-direction: column;
        min-width: 0;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: inherit;
        cursor: default;
        user-select: none;
      }
      .icon {
        width: 100%;
        aspect-ratio: 1;
        border-radius: var(--icon-radius);
        box-shadow:
          0 9px 18px rgba(0, 0, 0, 0.12),
          inset 0 1px 1px rgba(255, 255, 255, 0.7),
          inset 0 -2px 3px rgba(0, 0, 0, 0.08);
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }
      .label {
        font-size: 13px;
        text-align: center;
        overflow-wrap: anywhere;
        max-width: 100%;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: var(--text);
      }
      /* Icon skins */
      .i-camera {
        background: linear-gradient(160deg, #e8e9ec, #c9ccd3);
      }
      .i-maps {
        background:
          linear-gradient(45deg, #f7b6c8 0 28%, transparent 28%),
          linear-gradient(135deg, #b8e986 0 34%, transparent 34%),
          linear-gradient(225deg, #ffe28a 0 30%, transparent 30%),
          linear-gradient(315deg, #9ad7ff 0 36%, transparent 36%), #eef1f4;
      }
      .i-weather {
        background: linear-gradient(180deg, #5eb6ff, #1e78e8);
      }
      .i-share {
        background: linear-gradient(180deg, #4aa3ff, #1f6fe0);
      }
      .i-translate {
        background: linear-gradient(180deg, #8fe0ef, #4ec4d9);
      }
      .i-wallet {
        background: linear-gradient(180deg, #2a2c31, #111214);
      }
      .i-mail {
        background: linear-gradient(180deg, #8fd4ff, #4aaef0);
      }
      .i-passwords {
        background: linear-gradient(180deg, #2c2e34, #15161a);
      }
      .i-music {
        background: linear-gradient(160deg, #ff6ab0, #e11d74);
      }
      .i-settings {
        background: linear-gradient(180deg, #d5d7dc, #a8adb8);
      }
      .i-photos {
        background: linear-gradient(135deg, #ffd76a, #ff7eb3 45%, #7aa2ff);
      }
      .i-notes {
        background: linear-gradient(180deg, #fff7a8, #f3e36a);
      }
      .glyph {
        width: 58%;
        height: 58%;
        display: block;
      }
      .i-camera .glyph,
      .i-maps .glyph,
      .i-weather .glyph,
      .i-share .glyph {
        width: 100%;
        height: 100%;
      }
      .i-wallet .glyph,
      .i-mail .glyph,
      .i-passwords .glyph,
      .i-music .glyph,
      .i-settings .glyph {
        width: 78%;
        height: 78%;
      }
      .nav {
        position: absolute;
        left: 22px;
        right: 22px;
        bottom: max(28px, env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 8;
      }
      .pill {
        width: 160px;
        height: 56px;
        border-radius: 999px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.42), transparent 58%), var(--glass);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(22px) saturate(1.65);
        -webkit-backdrop-filter: blur(22px) saturate(1.65);
        box-shadow:
          0 12px 30px rgba(0, 0, 0, 0.12),
          inset 0 1px 1px rgba(255, 255, 255, 0.8),
          inset 0 -10px 15px rgba(93, 226, 226, 0.24);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 6px;
        overflow: hidden;
        transition:
          width var(--nav-hide-ms) cubic-bezier(0.22, 0.61, 0.36, 1),
          background var(--nav-hide-ms) ease;
        will-change: width;
      }
      .nav.is-hidden .pill {
        width: 56px;
        background: var(--glass);
      }
      .pill button {
        flex: 0 0 42px;
        width: 42px;
        height: 42px;
        border: 0;
        background: transparent;
        border-radius: 50%;
        display: grid;
        place-items: center;
        cursor: pointer;
        color: var(--text);
        transition:
          background 160ms ease,
          transform 120ms ease,
          opacity var(--nav-hide-ms) ease;
      }
      .pill button[data-tab="profile"] {
        background: linear-gradient(155deg, #fbfdff, #c9f6f6 75%);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 3px 10px rgba(53, 132, 159, 0.22);
        overflow: hidden;
      }
      .pill button[data-tab="profile"] svg {
        width: 32px;
        height: 32px;
      }
      .nav.is-hidden .pill button:not([data-tab="profile"]) {
        opacity: 0;
        pointer-events: none;
      }
      .pill button:hover {
        background: rgba(0, 0, 0, 0.06);
      }
      .pill button[data-tab="profile"]:hover {
        background: linear-gradient(155deg, #fff, #a9eeee);
      }
      .pill button:active {
        transform: scale(0.94);
      }
      .pill button.active:not([data-tab="profile"]) {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        color: var(--accent);
      }
      .fab {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        backdrop-filter: blur(22px) saturate(1.65);
        -webkit-backdrop-filter: blur(22px) saturate(1.65);
        box-shadow:
          0 12px 28px rgba(0, 0, 0, 0.16),
          inset 0 1px 1px rgba(255, 255, 255, 0.8);
        display: grid;
        place-items: center;
        cursor: pointer;
        color: var(--text);
        font-size: 28px;
        line-height: 1;
        transition:
          transform var(--nav-hide-ms) cubic-bezier(0.22, 0.61, 0.36, 1),
          opacity var(--nav-hide-ms) ease,
          background 160ms ease;
      }
      .nav.is-hidden .fab {
        opacity: 0;
        transform: translateY(20px) scale(0.72);
        pointer-events: none;
      }
      .fab:active {
        transform: scale(0.94);
      }
      .fab:hover {
        background: color-mix(in srgb, var(--accent) 14%, var(--glass));
      }
      button:focus-visible,
      .scroller:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -3px;
      }
      @media (max-width: 480px) {
        body {
          padding: 0;
        }
        .phone {
          width: 100%;
          height: 100vh;
          height: 100dvh;
          border-radius: 0;
          border: 0;
          box-shadow: none;
        }
        .meta,
        .hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body
    class="theme-light"
    data-hide-threshold="8"
    data-title="Scroll-aware toolbar"
    data-accent="#2f7dff"
  >
    <div class="wrap">
      <div class="meta">
        <h1 id="doc-title">Scroll-aware toolbar</h1>
        <p id="doc-label">A floating glass toolbar that follows your scroll direction.</p>
        <p class="hint">
          Scroll the phone screen — the capsule contracts on down-scroll and expands on up-scroll.
        </p>
      </div>
      <div class="phone" id="phone" aria-label="Hide-on-scroll navbar demo">
        <div class="status" aria-hidden="true">
          <span>9:41</span>
          <span class="pills"><span class="bar"></span></span>
        </div>
        <div
          class="scroller"
          id="scroller"
          tabindex="0"
          role="region"
          aria-label="Scrollable app grid"
        >
          <div class="grid" id="app-grid"></div>
        </div>
        <nav class="nav" id="floating-nav" aria-label="Floating toolbar">
          <div class="pill" role="toolbar" aria-label="Demo views">
            <button
              type="button"
              data-tab="profile"
              aria-pressed="false"
              tabindex="-1"
              aria-label="Profile"
              title="Profile"
            >
              <svg viewBox="0 0 40 40" aria-hidden="true">
                <path d="M8 37c1-8 6-11 12-11s11 3 12 11" fill="#87b5c4" />
                <ellipse cx="20" cy="20" rx="10" ry="12" fill="#f3d8c5" />
                <path
                  d="M10 18c-2-9 4-15 12-14 5-3 11 2 9 10-3-1-4-4-6-5-2 3-7 5-15 4z"
                  fill="#263140"
                />
                <path d="M10 15l-4 3 6 1m17-7 5 5-5 1" fill="#263140" />
                <path
                  d="M11 20c3-3 6-2 9 0 3-2 6-3 9 0m-9 0v2"
                  fill="none"
                  stroke="#263140"
                  stroke-width="1.6"
                />
                <circle cx="15" cy="21" r="1.2" fill="#263140" />
                <circle cx="25" cy="21" r="1.2" fill="#263140" />
                <path
                  d="M17 27q3 2 6 0"
                  fill="none"
                  stroke="#aa6f64"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
            </button>
            <button
              type="button"
              data-tab="charts"
              aria-pressed="false"
              tabindex="-1"
              aria-label="Charts"
              title="Charts"
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <path d="M4 16l4-4 3 3 6-7" />
                <path d="M4 20h16" />
              </svg>
            </button>
            <button
              type="button"
              data-tab="list"
              class="active"
              aria-label="List"
              title="List"
              aria-pressed="true"
            >
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <path d="M8 7h11M8 12h11M8 17h11" />
                <circle cx="5" cy="7" r="1" fill="currentColor" stroke="none" />
                <circle cx="5" cy="12" r="1" fill="currentColor" stroke="none" />
                <circle cx="5" cy="17" r="1" fill="currentColor" stroke="none" />
              </svg>
            </button>
          </div>
          <button
            type="button"
            class="fab"
            id="fab"
            aria-label="Add a sample icon"
            title="Add a sample icon"
          >
            +
          </button>
        </nav>
      </div>
    </div>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {
          "A floating glass toolbar that follows your scroll direction.":
            "跟随滚动方向展开与收起的玻璃悬浮导航。",
          Add: "添加",
          "Add a sample icon": "添加示例图标",
          Camera: "相机",
          Charts: "图表",
          "Demo views": "示例视图",
          "Floating toolbar": "悬浮导航",
          "Hide-on-scroll navbar demo": "滚动隐藏导航演示",
          Home: "首页",
          List: "列表",
          Mail: "邮件",
          Maps: "地图",
          Music: "音乐",
          New: "新建",
          Notes: "便笺",
          Passwords: "密码",
          Photos: "照片",
          Profile: "个人入口",
          "Scroll the phone screen — the capsule contracts on down-scroll and expands on up-scroll.":
            "滚动手机画面：下滑收起胶囊，上滑重新展开。",
          "Scroll-aware toolbar": "会随滚动收起的导航。",
          "Scrollable app grid": "可滚动的应用网格",
          Select: "选择",
          Settings: "设置",
          Share: "分享",
          Translate: "翻译",
          Wallet: "钱包",
          Weather: "天气",
          cloud: "云朵",
          name: "名称",
        };
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
