<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A little out of orbit.</title>
    <style>
      :root {
        --accent: #b64828;
        --paper: #eeeae2;
        --ink: #302e28;
        --muted: #57544c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      #stage:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 5px;
      }
      .shell {
        max-width: 1200px;
        margin: auto;
        padding: 28px 36px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding-bottom: 25px;
        border-bottom: 1px solid #d4d0c5;
      }
      .brand {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .edition {
        font: 10px monospace;
        color: var(--muted);
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 350px;
        gap: 36px;
        align-items: center;
      }
      .stage {
        height: 620px;
        position: relative;
        touch-action: pan-y;
        cursor: grab;
        overflow: hidden;
      }
      .stage:active {
        cursor: grabbing;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .center-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font: 10px/1.8 monospace;
        letter-spacing: 2px;
        text-align: center;
        pointer-events: none;
        color: #5b574e;
      }
      .kicker {
        font: 10px monospace;
        letter-spacing: 2px;
        color: #9c391d;
        color: color-mix(in srgb, var(--accent) 82%, #1a0a04);
      }
      h1 {
        font-size: 53px;
        font-weight: 400;
        line-height: 1.06;
        letter-spacing: -2.5px;
        margin: 22px 0;
        text-wrap: balance;
      }
      aside > p {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.7;
        max-width: 320px;
        text-wrap: pretty;
      }
      :lang(zh) h1 {
        font-size: clamp(32px, 3.3vw, 42px);
        line-height: 1.18;
        letter-spacing: -0.02em;
        max-width: 7.4em;
        text-wrap: initial;
      }
      :lang(zh) aside > p {
        max-width: 340px;
        text-wrap: pretty;
      }
      .selected {
        margin-top: 40px;
        padding-top: 22px;
        border-top: 1px solid #d4d0c5;
      }
      .selected small {
        font: 10px monospace;
        color: var(--muted);
      }
      h2 {
        font-size: 24px;
        font-weight: 400;
        margin: 10px 0;
      }
      .selected p {
        font-size: 12px;
        line-height: 1.65;
        color: var(--muted);
        min-height: 42px;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 20px 0;
      }
      .btn {
        border: 1px solid #bcb6a8;
        border-radius: 30px;
        background: transparent;
        padding: 11px 16px;
        min-width: 44px;
        min-height: 44px;
        font-size: 12px;
      }
      .btn:hover {
        background: #e1dcd1;
      }
      .btn.filled {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
      }
      label {
        display: flex;
        justify-content: space-between;
        font: 11px monospace;
        color: var(--muted);
        margin-bottom: 12px;
      }
      input {
        width: 100%;
        accent-color: var(--accent);
        height: 28px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        font: 10px/1.7 monospace;
        color: var(--muted);
        padding: 22px 0;
        border-top: 1px solid #d4d0c5;
      }
      .object-list {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 22px;
      }
      .swatch {
        width: 29px;
        height: 29px;
        min-width: 29px;
        border: 3px solid var(--paper);
        border-radius: 50%;
        padding: 0;
        box-shadow: 0 0 0 1px transparent;
      }
      .swatch[aria-pressed="true"] {
        box-shadow: 0 0 0 1px var(--ink);
      }
      .swatch:focus-visible {
        outline-offset: 2px;
      }
      @media (max-width: 800px) {
        .shell {
          padding: 22px;
        }
        .layout {
          grid-template-columns: 1fr;
          gap: 0;
        }
        .stage {
          height: 400px;
        }
        aside {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0 30px;
          padding: 0 0 30px;
        }
        h1 {
          font-size: 40px;
          margin: 13px 0;
        }
        .intro {
          grid-column: 1/-1;
        }
        .intro p {
          max-width: 360px;
          font-size: 13px;
          line-height: 1.6;
          color: var(--muted);
        }
        .selected {
          margin-top: 20px;
        }
        .adjustments {
          padding-top: 20px;
        }
        .center-label {
          font-size: 9px;
        }
        .edition {
          font-size: 9px;
        }
        footer {
          font-size: 9px;
        }
      }
      @media (max-width: 420px) {
        .shell {
          padding: 18px;
        }
        .stage {
          height: 340px;
        }
        aside {
          display: block;
        }
        .selected {
          margin-top: 22px;
        }
        .selected p {
          min-height: 0;
        }
        .controls {
          margin: 16px 0;
        }
        h1 {
          font-size: 39px;
        }
        .adjustments {
          padding-top: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body data-speed="0.6">
    <div class="shell">
      <header>
        <span class="brand">OBJECT STUDIES</span>
        <span class="edition">VOLUME 01 / INTERACTIVE EDITION</span>
      </header>
      <div class="layout">
        <div
          class="stage"
          id="stage"
          tabindex="0"
          role="group"
          aria-label="Interactive object gallery. Drag horizontally or use arrow keys to rotate; select objects below."
        >
          <canvas id="canvas" aria-hidden="true"></canvas>
          <div class="center-label" aria-hidden="true">
            FORM
            <br />
            IN MOTION
          </div>
        </div>
        <aside>
          <div class="intro">
            <span class="kicker">PLAY IS A PERSPECTIVE.</span>
            <h1>A little out of orbit.</h1>
            <p>An interactive collection of shape, rhythm and possibility.</p>
          </div>
          <section class="selected" aria-live="polite" aria-atomic="true">
            <small id="number">01 / 08</small>
            <h2 id="name">Ribbon study</h2>
            <p id="description"></p>
            <div class="object-list" id="object-list" aria-label="Choose an object"></div>
          </section>
          <div class="adjustments">
            <div class="controls">
              <button class="btn" id="prev" aria-label="Previous object">←</button>
              <button class="btn" id="next" aria-label="Next object">→</button>
              <button class="btn filled" id="motion" aria-pressed="false">Pause</button>
            </div>
            <label for="spread">
              Orbit spread
              <output id="spread-value">65%</output>
            </label>
            <input id="spread" type="range" min="0" max="100" value="65" />
          </div>
        </aside>
      </div>
      <footer>
        <span>DRAG TO ROTATE · SELECT TO EXPLORE</span>
        <span>
          Eight original geometric studies.
          <br />
          Infinite ways of looking.
        </span>
      </footer>

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;

            "[aria-label],[placeholder],[title],[data-hint]",

            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;

                if (next !== source) {

                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {

              if (next !== currentLang) applyLanguage(next);

            langObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skill-lang"],
            });
            window.addEventListener("pagehide", () => langObserver.disconnect(), { once: true });
          }

          if (parent === window) return;
          // Freeze viewport-based demo heights before measuring, avoiding vh feedback
          // when the parent grows the iframe. Intentional inner demo scrollers remain.
          const initialHeight = Math.max(360, Math.min(760, innerHeight));
          function fixRules(rules) {
            for (const rule of rules) {
              if (rule.cssRules) fixRules(rule.cssRules);
              if (!rule.style) continue;
              if (/v[hbs]/.test(rule.style.minHeight))
                rule.style.setProperty("min-height", "0", "important");
              if (/v[hbs]/.test(rule.style.height))
                rule.style.setProperty("height", `${initialHeight}px`, "important");
            }
          }
          for (const sheet of document.styleSheets) {
            try {
              fixRules(sheet.cssRules);
            } catch {
              /* Same-file styles are sufficient. */
            }
          }
          for (const element of [document.documentElement, document.body]) {
            element.style.setProperty("height", "auto", "important");
            element.style.setProperty("min-height", "0", "important");
          }
          document.documentElement.style.overflowX = "clip";
          let frame = 0,
            lastHeight = 0;
          const measure = () => {
            frame = 0;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height),
            );
            if (height > 0 && height <= 20000 && height !== lastHeight) {
              lastHeight = height;
              parent.postMessage({ type: "usefulshelf:resize", height }, "*");
            }

            if (!frame) frame = requestAnimationFrame(measure);
          };
          const observer = new ResizeObserver(schedule);
          observer.observe(document.body);
          window.addEventListener("resize", schedule);
          const onMessage = (event) => {
            if (event.source === parent && event.data?.type === "usefulshelf:measure") {

              lastHeight = 0;

          window.addEventListener("message", onMessage);

            "pagehide",
            () => {

              cancelAnimationFrame(frame);

              window.removeEventListener("message", onMessage);
            },
            { once: true },

          ),
          window.__usefulshelfText(
            "A small architectural landscape explores scale, texture and proportion.",
          ),
        ];
        let W = 0,
          H = 0,
          dpr = 1,
          rotation = -0.4,
          selected = 0,
          spacing = 0.65,
          paused = media.matches,
          raf = 0,
          last = 0,
          drag = null,
          poses = [];
        const speed = Number(document.body.dataset.speed),
          buttons = [];
        const textures = palette.map((color, i) => {
          const c = document.createElement("canvas");
          c.width = c.height = 240;
          const x = c.getContext("2d");
          x.fillStyle = color;
          x.fillRect(0, 0, 240, 240);
          x.strokeStyle = "#ece5d1";
          x.fillStyle = "#ece5d1";
          x.lineWidth = 10;
          if (i % 4 === 0) {
            for (let n = -1; n < 7; n++) {
              x.beginPath();
              x.moveTo(n * 46, -20);
              x.bezierCurveTo(n * 46 + 110, 60, n * 46 - 110, 180, n * 46, 260);
              x.stroke();
            }
          } else if (i % 4 === 1) {
            x.lineWidth = 3;
            for (let r = 10; r < 230; r += 14) {
              x.beginPath();
              x.arc(145, 120, r, 0, Math.PI * 2);
              x.stroke();
            }
          } else if (i % 4 === 2) {
            for (let y = 0; y < 4; y++)
              for (let k = 0; k < 4; k++) {
                x.beginPath();
                x.arc(k * 66 + 18, y * 66 + 18, 28, 0, Math.PI * 2);
                x.fill();
              }
          } else {
            x.beginPath();
            x.moveTo(25, 195);
            x.lineTo(95, 35);
            x.lineTo(124, 132);
            x.lineTo(205, 22);
            x.lineTo(210, 195);
            x.closePath();
            x.fill();
          }
          return c;
        });
        function select(i) {
          selected = (i + 8) % 8;
          document.querySelector("#number").textContent =
            String(selected + 1).padStart(2, "0") + " / 08";
          document.querySelector("#name").textContent = names[selected];
          document.querySelector("#description").textContent = descriptions[selected];
          buttons.forEach((b, j) => b.setAttribute("aria-pressed", String(j === selected)));
          draw();
        }
        names.forEach((name, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "swatch";
          b.style.background = palette[i];
          b.setAttribute("aria-label", window.__usefulshelfText("Select ") + name);
          b.onclick = () => select(i);
          document.querySelector("#object-list").append(b);
          buttons.push(b);
        });
        function draw() {
          if (!W) return;
          ctx.clearRect(0, 0, W, H);
          const cx = W / 2,
            cy = H / 2,
            rx = Math.max(45, W * (0.23 + spacing * 0.13)),
            ry = H * (0.25 + spacing * 0.11);
          ctx.lineWidth = 1;
          ctx.strokeStyle = "#d5d0c3";
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
          poses = palette.map((color, i) => {
            const a = (i / 8) * Math.PI * 2 + rotation,
              z = (Math.sin(a) + 1) / 2,
              r = Math.min(W, H) * (0.065 + z * 0.023);
            return { i, x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry, r, z };
          });
          poses
            .slice()
            .sort((a, b) => a.z - b.z)
            .forEach((p) => {
              ctx.save();
              ctx.shadowBlur = 15;
              ctx.shadowOffsetY = 7;
              ctx.shadowColor = "#302e2818";
              ctx.fillStyle = palette[p.i];
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
              ctx.save();
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.clip();
              ctx.drawImage(textures[p.i], p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
              ctx.restore();
              if (p.i === selected) {
                ctx.strokeStyle = "#302e28";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r + 6, 0, Math.PI * 2);
                ctx.stroke();
              }
              ctx.fillStyle = "#746e61";
              ctx.font = "9px monospace";
              ctx.textAlign = "center";
              ctx.fillText(String(p.i + 1).padStart(2, "0"), p.x, p.y + p.r + 21);
            });
        }
        function tick(t) {
          const dt = last ? Math.min(t - last, 40) : 0;
          last = t;
          rotation += dt * 0.00012 * speed;
          draw();
          raf = requestAnimationFrame(tick);
        }
        function stop() {
          cancelAnimationFrame(raf);
          raf = 0;
          last = 0;
        }
        function start() {
          stop();
          if (!paused && !media.matches && !document.hidden && !drag && speed > 0)
            raf = requestAnimationFrame(tick);
        }
        function sync() {
          motion.textContent = paused
            ? window.__usefulshelfText("Play")
            : window.__usefulshelfText("Pause");
          motion.disabled = media.matches;
          motion.setAttribute("aria-pressed", String(paused));
          start();
        }
        motion.onclick = () => {
          paused = !paused;
          sync();
        };
        media.addEventListener("change", () => {
          paused = media.matches;
          sync();
          draw();
        });
        document.addEventListener("visibilitychange", start);
        spread.oninput = () => {
          spacing = Number(spread.value) / 100;
          document.querySelector("#spread-value").value = spread.value + "%";
          draw();
        };
        document.querySelector("#prev").onclick = () => select(selected - 1);
        document.querySelector("#next").onclick = () => select(selected + 1);
        stage.addEventListener("keydown", (e) => {
          if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
            e.preventDefault();
            if (e.key === "Home") select(0);
            else if (e.key === "End") select(7);
            else {
              rotation += e.key === "ArrowLeft" ? -0.18 : 0.18;
              select(selected + (e.key === "ArrowLeft" ? -1 : 1));
            }
          }
        });
        stage.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          drag = { id: e.pointerId, x: e.clientX, y: e.clientY, start: rotation, moved: false };
          stage.setPointerCapture(e.pointerId);
          stop();
        });
        stage.addEventListener("pointermove", (e) => {
          if (!drag || drag.id !== e.pointerId) return;
          const dx = e.clientX - drag.x;
          drag.moved = drag.moved || Math.abs(dx) > 6;
          rotation = drag.start + dx * 0.008;
          draw();
        });
        stage.addEventListener("pointerup", (e) => {
          if (!drag || drag.id !== e.pointerId) return;
          if (!drag.moved) {
            const rect = stage.getBoundingClientRect();
            const p = poses
              .slice()
              .reverse()
              .find(
                (p) =>
                  Math.hypot(e.clientX - rect.left - p.x, e.clientY - rect.top - p.y) < p.r + 5,
              );
            if (p) select(p.i);
          }
          drag = null;
          start();
        });
        stage.addEventListener("pointercancel", () => {
          drag = null;
          start();
        });
        stage.addEventListener("lostpointercapture", () => {
          drag = null;
          start();
        });
        new ResizeObserver(() => {
          W = stage.clientWidth;
          H = stage.clientHeight;
          dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          draw();
        }).observe(stage);
        select(0);
        sync();
      })();
    </script>
  </body>
</html>
