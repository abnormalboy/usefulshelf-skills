<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A little out of orbit.</title>
    <style>
      :root {
        --accent: #b64828;
        --paper: #f1ede4;
        --plinth: #faf7f0;
        --ink: #22201b;
        --muted: #595449;
        --rule: #d6d0c3;
        --rule-strong: #bdb5a5;
        color-scheme: light;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: var(--paper);
        background-image:
          radial-gradient(ellipse 68% 60% at 32% 48%, rgba(255, 252, 245, 0.72), transparent 68%),
          radial-gradient(rgba(34, 32, 27, 0.045) 0.6px, transparent 0.6px);
        background-size:
          100% 100%,
          24px 24px;
        color: var(--ink);
        font-family:
          "SF Pro Display",
          "Helvetica Neue",
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Hiragino Sans GB",
          "Noto Sans SC",
          sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible,
      #stage:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      .shell {
        max-width: 1220px;
        margin: auto;
        padding: 18px 36px 20px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--rule);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: var(--ink);
      }
      .brand::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
      }
      .edition {
        font:
          500 0.7rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.1em;
        color: var(--muted);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 372px;
        gap: 34px;
        align-items: center;
        padding: 16px 0 18px;
      }
      .stage {
        height: 556px;
        position: relative;
        touch-action: pan-y;
        cursor: grab;
        overflow: hidden;
        border-radius: 22px;
        background:
          radial-gradient(
            ellipse 62% 58% at 50% 50%,
            rgba(255, 253, 248, 0.88),
            rgba(235, 229, 217, 0.45) 72%
          ),
          var(--plinth);
        border: 1px solid var(--rule);
        box-shadow:
          0 20px 44px rgba(48, 42, 32, 0.07),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
        user-select: none;
      }
      .stage:active {
        cursor: grabbing;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .center-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font:
          600 0.68rem/1.75 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.22em;
        text-align: center;
        pointer-events: none;
        color: #5d574c;
      }
      aside {
        min-width: 0;
      }
      .kicker {
        font:
          600 0.7rem/1.2 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.14em;
        color: #9c391d;
        color: color-mix(in srgb, var(--accent) 82%, #1a0a04);
      }
      h1 {
        font-size: clamp(2.2rem, 3.6vw, 3.1rem);
        font-weight: 500;
        line-height: 1.06;
        letter-spacing: -0.04em;
        margin: 10px 0 10px;
        color: var(--ink);
        text-wrap: balance;
      }
      .intro p {
        font-size: 0.875rem;
        color: var(--muted);
        line-height: 1.62;
        max-width: 36ch;
        margin: 0;
        text-wrap: pretty;
      }
      :lang(zh) h1 {
        font-size: clamp(1.65rem, 2.35vw, 1.9rem);
        line-height: 1.24;
        letter-spacing: -0.02em;
        max-width: none;
        text-wrap: pretty;
      }
      :lang(zh) .intro p {
        max-width: 340px;
      }
      .selected {
        margin-top: 18px;
        padding: 16px 18px;
        background: var(--plinth);
        border: 1px solid var(--rule);
        border-radius: 16px;
        box-shadow:
          0 10px 26px rgba(48, 42, 32, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.85);
      }
      .selected small {
        font:
          600 0.72rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.1em;
        color: color-mix(in srgb, var(--accent) 82%, #1a0a04);
      }
      h2 {
        font:
          500 1.4rem/1.2 Georgia,
          "Songti SC",
          serif;
        letter-spacing: -0.02em;
        margin: 8px 0 6px;
        color: var(--ink);
      }
      .selected p {
        font-size: 0.8125rem;
        line-height: 1.58;
        color: var(--muted);
        min-height: 40px;
        margin: 0;
        text-wrap: pretty;
      }
      .object-list {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .swatch {
        width: 32px;
        height: 32px;
        min-width: 32px;
        border: 3px solid var(--plinth);
        border-radius: 50%;
        padding: 0;
        box-shadow:
          0 0 0 1px rgba(34, 32, 27, 0.2),
          inset 0 2px 3px rgba(255, 255, 255, 0.35);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .swatch[aria-pressed="true"] {
        box-shadow:
          0 0 0 2px var(--ink),
          0 4px 10px rgba(34, 32, 27, 0.18);
        transform: scale(1.08);
      }
      .swatch:focus-visible {
        outline-offset: 2px;
      }
      .adjustments {
        margin-top: 16px;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 0 0 14px;
      }
      .btn {
        border: 1px solid var(--rule-strong);
        border-radius: 999px;
        background: var(--plinth);
        padding: 9px 16px;
        min-width: 42px;
        min-height: 40px;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--ink);
        transition:
          background-color 0.18s ease,
          border-color 0.18s ease,
          transform 0.15s ease;
      }
      @media (hover: hover) {
        .btn:hover:not(.filled):not(:disabled) {
          background: #e9e3d7;
          border-color: #9e9686;
        }
        .btn.filled:hover:not(:disabled) {
          background: #36332b;
        }
      }
      .btn.filled {
        background: var(--ink);
        color: var(--plinth);
        border-color: var(--ink);
        padding: 9px 22px;
        font-weight: 600;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font:
          500 0.75rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        margin-bottom: 8px;
      }
      label output {
        color: var(--ink);
        font-weight: 600;
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: #dad4c7;
        accent-color: var(--accent);
        cursor: pointer;
        margin: 6px 0;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--plinth);
        border: 3px solid var(--accent);
        box-shadow: 0 2px 8px rgba(34, 32, 27, 0.22);
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--plinth);
        border: 3px solid var(--accent);
        box-shadow: 0 2px 8px rgba(34, 32, 27, 0.22);
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        font:
          500 0.7rem/1.6 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: var(--muted);
        padding-top: 14px;
        border-top: 1px solid var(--rule);
      }
      @media (max-width: 860px) {
        .shell {
          padding: 18px 18px 20px;
        }
        .layout {
          grid-template-columns: 1fr;
          gap: 18px;
          padding: 14px 0 16px;
        }
        .stage {
          height: 350px;
          border-radius: 18px;
        }
        h1 {
          font-size: 2.15rem;
          margin: 8px 0;
        }
        .selected p {
          min-height: 0;
        }
        .edition {
          font-size: 0.64rem;
        }
        footer {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
          font-size: 0.66rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body data-speed="0.6">
    <div class="shell">
      <header>
        <span class="brand">OBJECT STUDIES</span>
        <span class="edition">VOLUME 01 / INTERACTIVE EDITION</span>
      </header>
      <div class="layout">
        <div
          class="stage"
          id="stage"
          tabindex="0"
          role="group"
          aria-label="Interactive object gallery. Drag horizontally or use arrow keys to rotate; select objects below."
        >
          <canvas id="canvas" aria-hidden="true"></canvas>
          <div class="center-label" aria-hidden="true">
            FORM
            <br />
            IN MOTION
          </div>
        </div>
        <aside>
          <div class="intro">
            <span class="kicker">PLAY IS A PERSPECTIVE.</span>
            <h1>A little out of orbit.</h1>
            <p>An interactive collection of shape, rhythm and possibility.</p>
          </div>
          <section class="selected" aria-live="polite" aria-atomic="true">
            <small id="number">01 / 08</small>
            <h2 id="name">Ribbon study</h2>
            <p id="description"></p>
            <div class="object-list" id="object-list" aria-label="Choose an object"></div>
          </section>
          <div class="adjustments">
            <div class="controls">
              <button class="btn" id="prev" aria-label="Previous object">←</button>
              <button class="btn" id="next" aria-label="Next object">→</button>
              <button class="btn filled" id="motion" aria-pressed="false">Pause</button>
            </div>
            <label for="spread">
              Orbit spread
              <output id="spread-value">65%</output>
            </label>
            <input id="spread" type="range" min="0" max="100" value="65" />
          </div>
        </aside>
      </div>
      <footer>
        <span>DRAG TO ROTATE · SELECT TO EXPLORE</span>
        <span>
          Eight original geometric studies.
          <br />
          Infinite ways of looking.
        </span>
      </footer>
    </div>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {
          "A continuous line folds back on itself, turning tension into a quiet rhythm.":
            "连续的线条折返，让张力化作安静的节奏。",
          "A field of repeated modules breaks gently away from its own rules.":
            "重复模块轻轻打破自己的排列规则。",
          "A folded silhouette balances structure with unexpected negative space.":
            "折叠轮廓在结构与留白之间取得平衡。",
          "A little out of orbit.": "在轨道外，发现一点不同。",
          "A small architectural landscape explores scale, texture and proportion.":
            "一处小小建筑景观，探索尺度、肌理与比例。",
          "An interactive collection of shape, rhythm and possibility.":
            "一组关于形状、节奏与可能性的交互练习。",
          "Choose an object": "选择图形",
          "DRAG TO ROTATE · SELECT TO EXPLORE": "拖动旋转 · 选择查看",
          "Earth signal": "大地信号",
          "Eight original geometric studies.": "八组原创几何练习。",
          FORM: "形态",
          "Fine concentric marks create a graphic echo across a green field.":
            "细密同心线在绿色画面中留下回声。",
          "Forest module": "森林模块",
          "Green frequency": "绿色频率",
          Home: "首页",
          "Horizontal bands move like water across a circular window.":
            "横向条带像水面一样穿过圆窗。",
          "IN MOTION": "流动之中",
          "Infinite ways of looking.": "换个角度，看看不同。",
          "Interactive object gallery. Drag horizontally or use arrow keys to rotate; select objects below.":
            "交互图形画廊。横向拖动或按方向键旋转，在下方选择图形。",
          List: "列表",
          "Midnight fold": "午夜折叠",
          "Next object": "下一个图形",
          "Offset circles reveal a sunny composition of overlapping forms.":
            "错位圆形组成一幅明亮的重叠构图。",
          "Orbit spread": "轨道间距",
          "PLAY IS A PERSPECTIVE.": "玩乐本身就是一种视角。",
          Pause: "暂停",
          Play: "播放",
          "Previous object": "上一个图形",
          "Ribbon study": "丝带研究",
          Select: "选择",
          "Soft symmetry": "柔和对称",
          "Solar assembly": "阳光组合",
          "Tidal rhythm": "潮汐节奏",
          "Two mirrored curves find a soft balance in a warm palette.":
            "两条镜像曲线在温暖配色中找到柔和的平衡。",
          "VOLUME 01 / INTERACTIVE EDITION": "第 01 辑 / 交互版",
          name: "名称",
          star: "星星",
        };
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(
              /Packed ([\d,]+) bytes\. CRC32 ([0-9a-f]+)\. Download contains the complete file, ready to decode\./gi,
              "已打包 $1 字节。CRC32 $2。下载文件包含完整内容，可直接解码。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
          applyLanguage(resolved);
        };

        function boot() {
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;
          if (chinese) applyLanguage("zh");

          let langObserver;
          if (typeof MutationObserver === "function") {
            langObserver = new MutationObserver(() => {
              const next =
                normalizeLang(document.documentElement.dataset.skillLang) || resolveLang();
              if (next !== currentLang) applyLanguage(next);
            });
            langObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skill-lang"],
            });
            window.addEventListener("pagehide", () => langObserver.disconnect(), { once: true });
          }

          if (parent === window) return;
          // Freeze viewport-based demo heights before measuring, avoiding vh feedback
          // when the parent grows the iframe. Intentional inner demo scrollers remain.
          const initialHeight = Math.max(360, Math.min(760, innerHeight));
          function fixRules(rules) {
            for (const rule of rules) {
              if (rule.cssRules) fixRules(rule.cssRules);
              if (!rule.style) continue;
              if (/v[hbs]/.test(rule.style.minHeight))
                rule.style.setProperty("min-height", "0", "important");
              if (/v[hbs]/.test(rule.style.height))
                rule.style.setProperty("height", `${initialHeight}px`, "important");
            }
          }
          for (const sheet of document.styleSheets) {
            try {
              fixRules(sheet.cssRules);
            } catch {
              /* Same-file styles are sufficient. */
            }
          }
          for (const element of [document.documentElement, document.body]) {
            element.style.setProperty("height", "auto", "important");
            element.style.setProperty("min-height", "0", "important");
          }
          document.documentElement.style.overflowX = "clip";
          let frame = 0,
            lastHeight = 0;
          const measure = () => {
            frame = 0;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height),
            );
            if (height > 0 && height <= 20000 && height !== lastHeight) {
              lastHeight = height;
              parent.postMessage({ type: "usefulshelf:resize", height }, "*");
            }
          };
          const schedule = () => {
            if (!frame) frame = requestAnimationFrame(measure);
          };
          const observer = new ResizeObserver(schedule);
          observer.observe(document.body);
          window.addEventListener("resize", schedule);
          const onMessage = (event) => {
            if (event.source === parent && event.data?.type === "usefulshelf:measure") {
              // The first resize may precede parent hydration. A measurement request
              // must acknowledge even an unchanged height, so that message is recovered.
              lastHeight = 0;
              schedule();
            }
          };
          window.addEventListener("message", onMessage);
          document.fonts?.ready.then(schedule);
          window.addEventListener(
            "pagehide",
            () => {
              observer.disconnect();
              cancelAnimationFrame(frame);
              window.removeEventListener("resize", schedule);
              window.removeEventListener("message", onMessage);
            },
            { once: true },
          );
          schedule();
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        else boot();
      })();
    </script>
    <!-- usefulshelf-runtime:end -->
    <script>
      (() => {
        "use strict";
        const canvas = document.querySelector("#canvas"),
          ctx = canvas.getContext("2d"),
          stage = document.querySelector("#stage"),
          media = matchMedia("(prefers-reduced-motion: reduce)"),
          motion = document.querySelector("#motion"),
          spread = document.querySelector("#spread");
        const palette = [
          "#b74729",
          "#2d5e4e",
          "#c7ae3a",
          "#36385c",
          "#c47c66",
          "#2e596b",
          "#28362f",
          "#826242",
        ];
        const names = [
          window.__usefulshelfText("Ribbon study"),
          window.__usefulshelfText("Green frequency"),
          window.__usefulshelfText("Solar assembly"),
          window.__usefulshelfText("Midnight fold"),
          window.__usefulshelfText("Soft symmetry"),
          window.__usefulshelfText("Tidal rhythm"),
          window.__usefulshelfText("Forest module"),
          window.__usefulshelfText("Earth signal"),
        ];
        const descriptions = [
          window.__usefulshelfText(
            "A continuous line folds back on itself, turning tension into a quiet rhythm.",
          ),
          window.__usefulshelfText(
            "Fine concentric marks create a graphic echo across a green field.",
          ),
          window.__usefulshelfText(
            "Offset circles reveal a sunny composition of overlapping forms.",
          ),
          window.__usefulshelfText(
            "A folded silhouette balances structure with unexpected negative space.",
          ),
          window.__usefulshelfText("Two mirrored curves find a soft balance in a warm palette."),
          window.__usefulshelfText("Horizontal bands move like water across a circular window."),
          window.__usefulshelfText(
            "A field of repeated modules breaks gently away from its own rules.",
          ),
          window.__usefulshelfText(
            "A small architectural landscape explores scale, texture and proportion.",
          ),
        ];
        let W = 0,
          H = 0,
          dpr = 1,
          rotation = -0.4,
          selected = 0,
          spacing = 0.65,
          paused = media.matches,
          raf = 0,
          last = 0,
          drag = null,
          poses = [];
        const speed = Number(document.body.dataset.speed),
          buttons = [];

        // Eight distinct Bauhaus/Constructivist ceramic medallion patterns
        const textures = palette.map((color, i) => {
          const S = 320;
          const c = document.createElement("canvas");
          c.width = c.height = S;
          const x = c.getContext("2d");
          x.fillStyle = color;
          x.fillRect(0, 0, S, S);
          // Subtle matte enamel gradient depth
          const enamel = x.createRadialGradient(
            S * 0.34,
            S * 0.28,
            S * 0.05,
            S * 0.5,
            S * 0.5,
            S * 0.62,
          );
          enamel.addColorStop(0, "rgba(255,250,240,0.16)");
          enamel.addColorStop(0.6, "rgba(0,0,0,0)");
          enamel.addColorStop(1, "rgba(18,14,10,0.28)");
          x.fillStyle = enamel;
          x.fillRect(0, 0, S, S);

          x.strokeStyle = "#f2ebdc";
          x.fillStyle = "#f2ebdc";
          x.lineCap = "round";

          if (i === 0) {
            // Ribbon study: flowing doubled S-ribbons
            x.lineWidth = 13;
            for (let n = -1; n < 6; n++) {
              x.beginPath();
              x.moveTo(n * 62, -24);
              x.bezierCurveTo(n * 62 + 128, 86, n * 62 - 128, 234, n * 62, S + 24);
              x.stroke();
            }
          } else if (i === 1) {
            // Green frequency: offset concentric resonant arcs
            x.lineWidth = 4.5;
            for (let r = 14; r < 290; r += 18) {
              x.beginPath();
              x.arc(198, 152, r, 0, Math.PI * 2);
              x.stroke();
            }
          } else if (i === 2) {
            // Solar assembly: Bauhaus overlapping sun discs & crescent rings
            x.globalAlpha = 0.92;
            x.beginPath();
            x.arc(128, 128, 84, 0, Math.PI * 2);
            x.fill();
            x.fillStyle = "#2b2517";
            x.beginPath();
            x.arc(204, 198, 66, 0, Math.PI * 2);
            x.fill();
            x.strokeStyle = "#f2ebdc";
            x.lineWidth = 8;
            x.beginPath();
            x.arc(166, 162, 108, -0.4, 2.2);
            x.stroke();
            x.globalAlpha = 1;
          } else if (i === 3) {
            // Midnight fold: sharp architectural origami chevron silhouette
            x.beginPath();
            x.moveTo(28, 258);
            x.lineTo(120, 48);
            x.lineTo(164, 174);
            x.lineTo(272, 34);
            x.lineTo(286, 258);
            x.closePath();
            x.fill();
            x.fillStyle = "rgba(54, 56, 92, 0.35)";
            x.beginPath();
            x.moveTo(120, 48);
            x.lineTo(164, 174);
            x.lineTo(120, 258);
            x.closePath();
            x.fill();
          } else if (i === 4) {
            // Soft symmetry: mirrored warm terracotta arches
            x.lineWidth = 14;
            for (let k = 0; k < 4; k++) {
              const r = 34 + k * 34;
              x.beginPath();
              x.arc(160, 56, r, 0.1 * Math.PI, 0.9 * Math.PI);
              x.stroke();
              x.beginPath();
              x.arc(160, 264, r, 1.1 * Math.PI, 1.9 * Math.PI);
              x.stroke();
            }
          } else if (i === 5) {
            // Tidal rhythm: undulating horizontal water bands
            x.lineWidth = 9;
            for (let row = 0; row < 8; row++) {
              const y0 = 32 + row * 38;
              x.beginPath();
              for (let px = -10; px <= S + 10; px += 12) {
                const py = y0 + Math.sin(px * 0.035 + row * 0.65) * 12;
                px === -10 ? x.moveTo(px, py) : x.lineTo(px, py);
              }
              x.stroke();
            }
          } else if (i === 6) {
            // Forest module: rotated grid of geometric tiles with one breakaway
            for (let row = 0; row < 5; row++)
              for (let col = 0; col < 5; col++) {
                const bx = 42 + col * 58,
                  by = 42 + row * 58;
                x.save();
                x.translate(bx, by);
                x.rotate(row === 2 && col === 2 ? Math.PI / 4 : 0);
                x.fillStyle = row === 2 && col === 2 ? "#d6a756" : "#f2ebdc";
                x.beginPath();
                x.roundRect(-17, -17, 34, 34, 7);
                x.fill();
                x.restore();
              }
          } else {
            // Earth signal: architectural monolith steps & sun dot
            x.fillRect(36, 210, 248, 34);
            x.fillRect(68, 162, 184, 34);
            x.fillRect(104, 114, 112, 34);
            x.beginPath();
            x.arc(160, 74, 24, 0, Math.PI * 2);
            x.fill();
          }

          // Subtle ceramic glaze specular arc & rim shading baked cleanly
          const rim = x.createRadialGradient(
            S * 0.5,
            S * 0.5,
            S * 0.36,
            S * 0.5,
            S * 0.5,
            S * 0.51,
          );
          rim.addColorStop(0, "rgba(0,0,0,0)");
          rim.addColorStop(0.84, "rgba(24,20,16,0.08)");
          rim.addColorStop(1, "rgba(24,20,16,0.28)");
          x.fillStyle = rim;
          x.fillRect(0, 0, S, S);
          return c;
        });

        function select(i) {
          selected = (i + 8) % 8;
          document.querySelector("#number").textContent =
            String(selected + 1).padStart(2, "0") + " / 08";
          document.querySelector("#name").textContent = names[selected];
          document.querySelector("#description").textContent = descriptions[selected];
          buttons.forEach((b, j) => b.setAttribute("aria-pressed", String(j === selected)));
          draw();
        }
        names.forEach((name, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "swatch";
          b.style.background = palette[i];
          b.setAttribute("aria-label", window.__usefulshelfText("Select ") + name);
          b.onclick = () => select(i);
          document.querySelector("#object-list").append(b);
          buttons.push(b);
        });
        function draw() {
          if (!W) return;
          ctx.clearRect(0, 0, W, H);
          const cx = W / 2,
            cy = H / 2,
            rx = Math.max(55, W * (0.24 + spacing * 0.135)),
            ry = H * (0.24 + spacing * 0.115);

          // Architectural museum guide crosshairs & dual orbital tracks
          ctx.save();
          ctx.strokeStyle = "rgba(89, 84, 73, 0.14)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cx - rx - 26, cy);
          ctx.lineTo(cx + rx + 26, cy);
          ctx.moveTo(cx, cy - ry - 26);
          ctx.lineTo(cx, cy + ry + 26);
          ctx.stroke();

          ctx.strokeStyle = "rgba(89, 84, 73, 0.24)";
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();

          ctx.setLineDash([2, 6]);
          ctx.strokeStyle = "rgba(89, 84, 73, 0.18)";
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx * 0.56, ry * 0.56, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();

          poses = palette.map((color, i) => {
            const a = (i / 8) * Math.PI * 2 + rotation,
              z = (Math.sin(a) + 1) / 2,
              r = Math.min(W, H) * (0.068 + z * 0.028);
            return { i, x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry, r, z };
          });

          poses
            .slice()
            .sort((a, b) => a.z - b.z)
            .forEach((p) => {
              const isSelected = p.i === selected;
              // Layered museum drop shadow proportional to orbital depth
              ctx.save();
              ctx.shadowBlur = 14 + p.z * 16;
              ctx.shadowOffsetY = 6 + p.z * 8;
              ctx.shadowColor = `rgba(34, 30, 22, ${(0.14 + p.z * 0.14).toFixed(2)})`;
              ctx.fillStyle = palette[p.i];
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();

              // Clipped high-res geometric medallion artwork
              ctx.save();
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.clip();
              ctx.drawImage(textures[p.i], p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
              // Ceramic top-left rim sheen
              const sheen = ctx.createRadialGradient(
                p.x - p.r * 0.35,
                p.y - p.r * 0.42,
                1,
                p.x - p.r * 0.2,
                p.y - p.r * 0.25,
                p.r * 0.9,
              );
              sheen.addColorStop(0, "rgba(255,255,255,0.28)");
              sheen.addColorStop(0.45, "rgba(255,255,255,0.04)");
              sheen.addColorStop(1, "rgba(255,255,255,0)");
              ctx.fillStyle = sheen;
              ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
              ctx.restore();

              // Fine white enamel edge ring
              ctx.strokeStyle = "rgba(255, 252, 245, 0.55)";
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r - 0.5, 0, Math.PI * 2);
              ctx.stroke();

              // Precision curator callout ring around selected sculpture
              if (isSelected) {
                ctx.strokeStyle = "#22201b";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r + 7, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = "#22201b";
                ctx.beginPath();
                ctx.arc(p.x, p.y - p.r - 7, 2.8, 0, Math.PI * 2);
                ctx.fill();
              }

              // Crisp catalog index number beneath disc
              ctx.fillStyle = isSelected ? "#22201b" : "#6c665a";
              ctx.font = `${isSelected ? 700 : 500} 10px ui-monospace, Menlo, monospace`;
              ctx.textAlign = "center";
              ctx.fillText(String(p.i + 1).padStart(2, "0"), p.x, p.y + p.r + 22);
            });
        }
        function tick(t) {
          const dt = last ? Math.min(t - last, 40) : 0;
          last = t;
          rotation += dt * 0.00012 * speed;
          draw();
          raf = requestAnimationFrame(tick);
        }
        function stop() {
          cancelAnimationFrame(raf);
          raf = 0;
          last = 0;
        }
        function start() {
          stop();
          if (!paused && !media.matches && !document.hidden && !drag && speed > 0)
            raf = requestAnimationFrame(tick);
        }
        function sync() {
          motion.textContent = paused
            ? window.__usefulshelfText("Play")
            : window.__usefulshelfText("Pause");
          motion.disabled = media.matches;
          motion.setAttribute("aria-pressed", String(paused));
          start();
        }
        motion.onclick = () => {
          paused = !paused;
          sync();
        };
        media.addEventListener("change", () => {
          paused = media.matches;
          sync();
          draw();
        });
        document.addEventListener("visibilitychange", start);
        spread.oninput = () => {
          spacing = Number(spread.value) / 100;
          document.querySelector("#spread-value").value = spread.value + "%";
          draw();
        };
        document.querySelector("#prev").onclick = () => select(selected - 1);
        document.querySelector("#next").onclick = () => select(selected + 1);
        stage.addEventListener("keydown", (e) => {
          if (["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
            e.preventDefault();
            if (e.key === "Home") select(0);
            else if (e.key === "End") select(7);
            else {
              rotation += e.key === "ArrowLeft" ? -0.18 : 0.18;
              select(selected + (e.key === "ArrowLeft" ? -1 : 1));
            }
          }
        });
        stage.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          drag = { id: e.pointerId, x: e.clientX, y: e.clientY, start: rotation, moved: false };
          stage.setPointerCapture(e.pointerId);
          stop();
        });
        stage.addEventListener("pointermove", (e) => {
          if (!drag || drag.id !== e.pointerId) return;
          const dx = e.clientX - drag.x;
          drag.moved = drag.moved || Math.abs(dx) > 6;
          rotation = drag.start + dx * 0.008;
          draw();
        });
        stage.addEventListener("pointerup", (e) => {
          if (!drag || drag.id !== e.pointerId) return;
          if (!drag.moved) {
            const rect = stage.getBoundingClientRect();
            const p = poses
              .slice()
              .reverse()
              .find(
                (p) =>
                  Math.hypot(e.clientX - rect.left - p.x, e.clientY - rect.top - p.y) < p.r + 5,
              );
            if (p) select(p.i);
          }
          drag = null;
          start();
        });
        stage.addEventListener("pointercancel", () => {
          drag = null;
          start();
        });
        stage.addEventListener("lostpointercapture", () => {
          drag = null;
          start();
        });
        new ResizeObserver(() => {
          W = stage.clientWidth;
          H = stage.clientHeight;
          dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          draw();
        }).observe(stage);
        select(0);
        sync();
      })();
    </script>
