<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>让小想法，探出一点头。</title>
    <style>
      :root {
        --accent: #dbbe84;
        --tilt: 7deg;
        --panel: #212329;
        --desk: #111216;
        --ink: #efe9dc;
        --muted: #adb4c0;
        --aside-ink: #c8cdd6;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC",
          ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background: var(--desk);
        color-scheme: dark;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--desk);
        background-image:
          radial-gradient(ellipse 75% 50% at 50% 0%, rgba(219, 190, 132, 0.08), transparent 68%),
          radial-gradient(ellipse 65% 50% at 88% 92%, rgba(92, 114, 152, 0.08), transparent 72%),
          url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIj48ZmlsdGVyIGlkPSJsIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45NSIgbnVtT2N0YXZlcz0iMiIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIiBmaWx0ZXI9InVybCgjbCkiIG9wYWNpdHk9IjAuMDMyIi8+PC9zdmc+");
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 20px 32px 24px;
      }
      .mast {
        font:
          600 11px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        letter-spacing: 0.13em;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding-bottom: 11px;
        border-bottom: 1px solid rgba(219, 190, 132, 0.2);
      }
      .brand {
        color: var(--accent);
      }
      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 32px;
        margin: 18px 0 18px;
      }
      h1 {
        font:
          600 clamp(30px, 3.8vw, 46px)/1.12 "Iowan Old Style",
          "Palatino Linotype",
          Georgia,
          "Songti SC",
          "Noto Serif CJK SC",
          serif;
        letter-spacing: -0.03em;
        margin: 0;
        overflow-wrap: anywhere;
        text-wrap: balance;
        color: #f6f1e4;
      }
      :lang(zh) h1 {
        font-size: clamp(28px, 3.4vw, 42px);
        line-height: 1.18;
        letter-spacing: -0.015em;
        word-break: keep-all;
      }
      .intro {
        font-size: 13px;
        line-height: 1.65;
        color: var(--muted);
        margin: 0;
        max-width: 410px;
        text-wrap: pretty;
      }
      .window {
        border: 1px solid rgba(219, 190, 132, 0.24);
        border-radius: 20px;
        overflow: hidden;
        box-shadow:
          inset 0 1px 0 rgba(255, 245, 220, 0.1),
          0 28px 60px rgba(0, 0, 0, 0.52),
          0 6px 18px rgba(0, 0, 0, 0.32);
        background: var(--panel);
      }
      .tabs-shell {
        background: linear-gradient(180deg, #0c0d11 0%, #12141a 100%);
        padding: 14px 18px 0;
        display: flex;
        align-items: flex-end;
        gap: 16px;
        position: relative;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .compass {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid rgba(219, 190, 132, 0.36);
        background: radial-gradient(circle at 35% 30%, rgba(219, 190, 132, 0.2), #14151a);
        border-radius: 50%;
        font-size: 14px;
        color: var(--accent);
        margin-bottom: 10px;
        flex-shrink: 0;
      }
      .tabs {
        display: flex;
        min-width: 0;
        gap: 8px;
        width: 100%;
        align-items: flex-end;
      }
      .tab {
        position: relative;
        isolation: isolate;
        min-width: 0;
        padding: 13px 19px 12px;
        border: 0;
        background: rgba(255, 255, 255, 0.035);
        border-radius: 12px 12px 0 0;
        color: #b4bcc8;
        font-size: 13px;
        font-weight: 550;
        transition:
          transform 0.24s cubic-bezier(0.2, 0.78, 0.22, 1),
          background-color 0.2s ease,
          color 0.2s ease;
        z-index: 1;
        transform-origin: center bottom;
        white-space: nowrap;
        overflow: visible;
      }
      /* Delicate color-coded physical index strip along top edge of each tab */
      .tab::before,
      .tab::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }
      .tab .edge-strip {
        position: absolute;
        left: 14px;
        right: 14px;
        top: 0;
        height: 3px;
        border-radius: 0 0 3px 3px;
        background: var(--tab-color, var(--accent));
        opacity: 0.45;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      #tab-0 {
        --tab-color: var(--accent);
      }
      #tab-1 {
        --tab-color: #7cc69e;
      }
      #tab-2 {
        --tab-color: #8fb0ec;
      }
      #tab-3 {
        --tab-color: #e49788;
      }
      .tab span:not(.edge-strip) {
        pointer-events: none;
        display: inline-block;
        transition: transform 0.24s cubic-bezier(0.2, 0.78, 0.22, 1);
      }
      .tab[aria-selected="true"] {
        background: var(--panel);
        color: #f7f3e8;
        font-weight: 600;
        z-index: 3;
        box-shadow: inset 0 1px 0 rgba(255, 248, 232, 0.1);
      }
      .tab[aria-selected="true"] .edge-strip,
      .tab.hovered .edge-strip {
        opacity: 1;
      }
      .tab[aria-selected="true"]::before,
      .tab[aria-selected="true"]::after {
        width: 14px;
        height: 14px;
        bottom: 0;
      }
      .tab[aria-selected="true"]::before {
        left: -14px;
        border-radius: 0 0 14px 0;
        box-shadow: 5px 5px 0 4px var(--panel);
      }
      .tab[aria-selected="true"]::after {
        right: -14px;
        border-radius: 0 0 0 14px;
        box-shadow: -5px 5px 0 4px var(--panel);
      }
      .tab.hovered {
        background: #2f333d;
        color: #f7f3e8;
        border-radius: 12px 12px 6px 6px;
        transform: translateY(-5px);
        z-index: 4;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
      }
      .tab.left-neighbor {
        transform: skewX(var(--tilt)) translateX(-3px);
      }
      .tab.right-neighbor {
        transform: skewX(calc(-1 * var(--tilt))) translateX(3px);
      }
      .tab.left-neighbor span:not(.edge-strip) {
        transform: skewX(calc(-1 * var(--tilt)));
      }
      .tab.right-neighbor span:not(.edge-strip) {
        transform: skewX(var(--tilt));
      }
      .panel {
        background:
          radial-gradient(ellipse 65% 45% at 15% 0%, rgba(219, 190, 132, 0.045), transparent 65%),
          var(--panel);
        padding: 24px 30px 20px;
        min-height: 360px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 208px;
        gap: 32px;
      }
      .page-content {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .page-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font:
          600 10.5px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .color-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 7px;
        box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 55%, transparent);
      }
      .title-input {
        font:
          600 24px/1.25 "Iowan Old Style",
          Georgia,
          "Songti SC",
          serif;
        letter-spacing: -0.02em;
        padding: 0 0 10px;
        width: 100%;
        border: 0;
        border-bottom: 1px solid rgba(219, 190, 132, 0.26);
        background: transparent;
        color: #f6f1e4;
        border-radius: 0;
        min-width: 0;
      }
      .writing {
        display: block;
        width: 100%;
        margin-top: 14px;
        min-height: 184px;
        resize: vertical;
        background-color: transparent;
        background-image: linear-gradient(
          to bottom,
          transparent calc(2em - 1px),
          rgba(219, 190, 132, 0.14) calc(2em - 1px),
          rgba(219, 190, 132, 0.14) 2em
        );
        background-size: 100% 2em;
        background-attachment: local;
        font-size: 14.5px;
        line-height: 2;
        border: 0;
        color: #e9e3d5;
        padding: 0;
        min-width: 0;
      }
      .aside {
        border-left: 1px solid rgba(219, 190, 132, 0.18);
        padding-left: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      /* Gold-foil embossed collector Ex Libris bookplate vignette */
      .stamp {
        position: relative;
        border: 1.5px solid rgba(219, 190, 132, 0.62);
        border-radius: 6px;
        width: 112px;
        height: 126px;
        padding: 9px;
        transform: rotate(3.5deg);
        background: linear-gradient(155deg, #2d2a24 0%, #1d1b18 100%);
        color: var(--accent);
        align-self: center;
        box-shadow:
          inset 0 0 0 3px #1d1b18,
          inset 0 0 0 4px rgba(219, 190, 132, 0.28),
          0 12px 24px rgba(0, 0, 0, 0.42);
      }
      .stamp-art {
        height: 76px;
        display: grid;
        place-items: center;
        border-radius: 3px;
        background: radial-gradient(circle at 50% 40%, rgba(219, 190, 132, 0.14), #161513);
        border: 1px solid rgba(219, 190, 132, 0.22);
        color: var(--accent);
        font:
          44px Georgia,
          serif;
        text-shadow: 0 2px 10px rgba(219, 190, 132, 0.35);
      }
      .stamp small {
        display: block;
        font:
          600 7.5px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        letter-spacing: 0.1em;
        text-align: center;
        margin-top: 9px;
        color: #dfd0ac;
      }
      .aside p {
        font-size: 12.5px;
        line-height: 1.72;
        color: var(--aside-ink);
        margin: 0;
        white-space: pre-line;
      }
      .stat {
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid rgba(219, 190, 132, 0.16);
        font:
          600 30px/1 "Iowan Old Style",
          Georgia,
          serif;
        font-variant-numeric: tabular-nums;
        color: #f3e8ce;
      }
      .stat small {
        display: block;
        font:
          600 10px/1.3 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-top: 6px;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font:
          600 10.5px/1.3 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        margin-top: auto;
        padding-top: 13px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
      }
      .btn {
        font-size: 12.5px;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 10px 16px;
        background: rgba(255, 255, 255, 0.04);
        color: #e4e8f0;
        transition:
          background-color 0.16s ease,
          transform 0.16s ease;
      }
      @media (hover: hover) {
        .btn:hover {
          background: rgba(255, 255, 255, 0.1);
          transform: translateY(-1px);
        }
      }
      .primary {
        color: #16140f;
        background-color: var(--accent);
        background-image: linear-gradient(
          180deg,
          color-mix(in srgb, var(--accent) 88%, #fff 12%),
          var(--accent)
        );
        border-color: var(--accent);
        margin-left: auto;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          0 8px 20px color-mix(in srgb, var(--accent) 26%, transparent);
      }
      @media (hover: hover) {
        .primary:hover {
          background: var(--accent);
          filter: brightness(1.07);
        }
      }
      .status {
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
        min-height: 20px;
        margin: 12px 0 0;
      }
      .todo-list {
        list-style: none;
        padding: 0;
        margin: 14px 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .todo-list label {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 13.5px;
        line-height: 1.6;
        color: #eae4d6;
        overflow-wrap: anywhere;
        cursor: pointer;
      }
      .todo-list input {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
        margin-top: 3px;
        flex-shrink: 0;
        cursor: pointer;
      }
      .todo-list input:checked + span {
        text-decoration: line-through;
        color: #9ba3b0;
      }
      .todo-list li {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.03);
      }
      .remove-task {
        border: 0;
        background: transparent;
        color: #a6b0bf;
        padding: 2px 7px;
        border-radius: 6px;
        font-size: 17px;
      }
      @media (hover: hover) {
        .remove-task:hover {
          background: rgba(255, 128, 114, 0.16);
          color: #ffb0a6;
        }
      }
      .add-row {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .add-row input {
        background: #17191e;
        border: 1px solid rgba(219, 190, 132, 0.28);
        color: #f1ece0;
        min-width: 0;
        width: 100%;
        padding: 9px 12px;
        border-radius: 9px;
        font-size: 13px;
      }
      .add-row button {
        border: 1px solid rgba(219, 190, 132, 0.45);
        background: rgba(219, 190, 132, 0.14);
        color: var(--accent);
        border-radius: 9px;
        padding: 6px 15px;
        font-size: 18px;
        font-weight: 600;
      }
      .hidden {
        display: none !important;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font:
          600 10.5px/1.6 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        color: var(--muted);
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      @media (max-width: 780px) {
        .header-row {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
          margin: 14px 0 16px;
        }
        .intro {
          max-width: 100%;
        }
      }
      @media (max-width: 720px) {
        main {
          padding: 18px 14px 22px;
        }
        .mast {
          font-size: 9.5px;
        }
        .mast span:last-child {
          display: none;
        }
        .tabs-shell {
          gap: 4px;
          padding: 10px 6px 0;
        }
        .compass {
          display: none;
        }
        .tabs {
          gap: 4px;
        }
        .tab {
          font-size: 12px;
          padding: 12px 6px 11px;
          flex: 1;
          text-align: center;
        }
        .tab .edge-strip {
          left: 8px;
          right: 8px;
        }
        .panel {
          grid-template-columns: 1fr;
          padding: 20px 18px;
          gap: 20px;
          min-height: 340px;
        }
        .aside {
          display: none;
        }
        .title-input {
          font-size: 21px;
        }
        .writing {
          font-size: 16px;
          min-height: 190px;
        }
        .add-row input {
          font-size: 16px;
        }
        .toolbar {
          gap: 8px;
        }
        .btn {
          font-size: 12px;
          padding: 9px 13px;
        }
        .primary {
          margin-left: 0;
        }
        .page-meta,
        .bottom {
          font-size: 10px;
        }
        footer {
          flex-direction: column;
          gap: 6px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
        .tab.hovered,
        .tab.left-neighbor,
        .tab.right-neighbor,
        .tab span {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mast">
        <span class="brand" id="notebook">
          小小灵感簿
        </span>
        <span>ODD LITTLE IDEAS / ALWAYS WELCOME</span>
      </div>
      <div class="header-row">
        <h1>让小想法，探出一点头。</h1>
        <p class="intro" data-i18n="intro">
          划过一个标签，邻居会轻轻让一让。每一页都能留下不同的想法，写完就把它们一起带走。
        </p>
      </div>
      <section class="window">
        <div class="tabs-shell">
          <span class="compass" aria-hidden="true">✳</span>
          <div class="tabs" id="tabs" role="tablist" aria-label="笔记页面">
            <button
              class="tab"
              id="tab-0"
              role="tab"
              aria-selected="true"
              aria-controls="panel"
              tabindex="0"
            >
              <span class="edge-strip" aria-hidden="true"></span>
              <span data-i18n="tab0">◌ 随手记</span>
            </button>
            <button
              class="tab"
              id="tab-1"
              role="tab"
              aria-selected="false"
              aria-controls="panel"
              tabindex="-1"
            >
              <span class="edge-strip" aria-hidden="true"></span>
              <span data-i18n="tab1">☑ 小计划</span>
            </button>
            <button
              class="tab"
              id="tab-2"
              role="tab"
              aria-selected="false"
              aria-controls="panel"
              tabindex="-1"
            >
              <span class="edge-strip" aria-hidden="true"></span>
              <span data-i18n="tab2">✧ 灵感角</span>
            </button>
            <button
              class="tab"
              id="tab-3"
              role="tab"
              aria-selected="false"
              aria-controls="panel"
              tabindex="-1"
            >
              <span class="edge-strip" aria-hidden="true"></span>
              <span data-i18n="tab3">♡ 小确幸</span>
            </button>
          </div>
        </div>
        <div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-0">
          <div class="page-content">
            <div class="page-meta">
              <span>
                <i class="color-dot"></i>
                <span id="page-number">PAGE 01 / 04</span>
              </span>
              <span data-i18n="session">只在当前会话保存</span>
            </div>
            <input class="title-input" id="page-title" maxlength="80" aria-label="页面标题" />
            <textarea
              class="writing"
              id="writing"
              maxlength="4000"
              aria-label="笔记正文"
            ></textarea>
            <div id="tasks" class="hidden">
              <ul class="todo-list" id="todo-list"></ul>
              <form class="add-row" id="add-form">
                <input
                  id="task-text"
                  maxlength="120"
                  aria-label="新计划"
                  placeholder="加一个小小的计划…"
                />
                <button type="submit" aria-label="添加计划" id="add-task">+</button>
              </form>
            </div>
            <div class="bottom">
              <span id="count"></span>
              <span data-i18n="hint">← → 切换标签 · 自由书写</span>
            </div>
          </div>
          <aside class="aside">
            <div class="stamp">
              <div class="stamp-art" id="stamp">✳</div>
              <small>EX LIBRIS</small>
            </div>
            <p id="page-aside"></p>
            <div class="stat">
              <span id="total">0</span>
              <small data-i18n="total">整本笔记的字符</small>
            </div>
          </aside>
        </div>
      </section>
      <div class="toolbar">
        <button class="btn" id="prompt" data-i18n="prompt">给我一个开头 ↗</button>
        <button class="btn" id="next" data-i18n="next">翻到下一页 →</button>
        <button class="btn primary" id="export" data-i18n="export">导出整本 Markdown ↓</button>
      </div>
      <p class="status" id="status" role="status"></p>
      <footer>
        <span data-i18n="footer">没有云同步 · 刷新前记得导出</span>
        <span>NOTICE / COLLECT / BEGIN AGAIN</span>
      </footer>
    </main>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {};
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(
              /Packed ([\d,]+) bytes\. CRC32 ([0-9a-f]+)\. Download contains the complete file, ready to decode\./gi,
              "已打包 $1 字节。CRC32 $2。下载文件包含完整内容，可直接解码。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
          applyLanguage(resolved);
        };

        function boot() {
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;
          if (chinese) applyLanguage("zh");

          let langObserver;
          if (typeof MutationObserver === "function") {
            langObserver = new MutationObserver(() => {
              const next =
                normalizeLang(document.documentElement.dataset.skillLang) || resolveLang();
              if (next !== currentLang) applyLanguage(next);
            });
            langObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skill-lang"],
            });
            window.addEventListener("pagehide", () => langObserver.disconnect(), { once: true });
          }

          if (parent === window) return;
          // Freeze viewport-based demo heights before measuring, avoiding vh feedback
          // when the parent grows the iframe. Intentional inner demo scrollers remain.
          const initialHeight = Math.max(360, Math.min(760, innerHeight));
          function fixRules(rules) {
            for (const rule of rules) {
              if (rule.cssRules) fixRules(rule.cssRules);
              if (!rule.style) continue;
              if (/v[hbs]/.test(rule.style.minHeight))
                rule.style.setProperty("min-height", "0", "important");
              if (/v[hbs]/.test(rule.style.height))
                rule.style.setProperty("height", `${initialHeight}px`, "important");
            }
          }
          for (const sheet of document.styleSheets) {
            try {
              fixRules(sheet.cssRules);
            } catch {
              /* Same-file styles are sufficient. */
            }
          }
          for (const element of [document.documentElement, document.body]) {
            element.style.setProperty("height", "auto", "important");
            element.style.setProperty("min-height", "0", "important");
          }
          document.documentElement.style.overflowX = "clip";
          let frame = 0,
            lastHeight = 0;
          const measure = () => {
            frame = 0;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height),
            );
            if (height > 0 && height <= 20000 && height !== lastHeight) {
              lastHeight = height;
              parent.postMessage({ type: "usefulshelf:resize", height }, "*");
            }
          };
          const schedule = () => {
            if (!frame) frame = requestAnimationFrame(measure);
          };
          const observer = new ResizeObserver(schedule);
          observer.observe(document.body);
          window.addEventListener("resize", schedule);
          const onMessage = (event) => {
            if (event.source === parent && event.data?.type === "usefulshelf:measure") {
              // The first resize may precede parent hydration. A measurement request
              // must acknowledge even an unchanged height, so that message is recovered.
              lastHeight = 0;
              schedule();
            }
          };
          window.addEventListener("message", onMessage);
          document.fonts?.ready.then(schedule);
          window.addEventListener(
            "pagehide",
            () => {
              observer.disconnect();
              cancelAnimationFrame(frame);
              window.removeEventListener("resize", schedule);
              window.removeEventListener("message", onMessage);
            },
            { once: true },
          );
          schedule();
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        else boot();
      })();
    </script>
    <!-- usefulshelf-runtime:end -->
    <script>
      const config = window.__usefulshelfConfigure({"title": "\u8ba9\u5c0f\u60f3\u6cd5\uff0c\u63a2\u51fa\u4e00\u70b9\u5934\u3002", "accent": "#dbbe84", "notebook": "\u5c0f\u5c0f\u7075\u611f\u7c3f", "tilt": 7, "customTitle": false, "customText": []}),
        resolvedLang =
          new URLSearchParams(location.search).get("lang") ||
          document.documentElement.dataset.skillLang ||
          (document.documentElement.lang?.toLowerCase().startsWith("zh") ? "zh" : "en"),
        en = resolvedLang !== "zh",
        $ = (id) => document.getElementById(id),
        t = (zh, eng) => (en ? eng : zh);
      document.documentElement.lang = en ? "en" : "zh-CN";
      const english = {
        intro:
          "Hover a tab and its neighbors make a little room. Keep a different thought on every page, then take the whole notebook with you.",
        tab0: "◌ Notes",
        tab1: "☑ Plans",
        tab2: "✧ Ideas",
        tab3: "♡ Joys",
        session: "Kept for this session",
        hint: "← → Switch tabs · Write freely",
        total: "CHARACTERS IN THE NOTEBOOK",
        prompt: "Give me a beginning ↗",
        next: "Turn the page →",
        export: "Export all as Markdown ↓",
        footer: "No cloud sync · Export before refreshing",
      };
      if (en) {
        document
          .querySelectorAll("[data-i18n]")
          .forEach((el) => (el.textContent = english[el.dataset.i18n]));
        if (!config.customTitle) {
          document.querySelector("h1").textContent = "Give small thoughts a little room.";
          document.title = "Give small thoughts a little room.";
        }
        if (!config.customText.includes("notebook"))
          $("notebook").textContent = "The little idea notebook";
        $("tabs").setAttribute("aria-label", "Notebook pages");
        $("page-title").setAttribute("aria-label", "Page title");
        $("writing").setAttribute("aria-label", "Note text");
        $("task-text").setAttribute("aria-label", "New plan");
        $("task-text").placeholder = "Add one small plan…";
        $("add-task").setAttribute("aria-label", "Add plan");
      }
      const pages = [
        {
          title: t("把这一天，装进口袋。", "Put a little of today in your pocket."),
          body: t(
            "今天的小发现：\n\n把留白也当作一种安排。\n给散步留一点不赶时间的空间。",
            "A small thing I noticed today:\n\nLeave a little space in the plan.\nTake a walk without trying to arrive.",
          ),
          aside: t(
            "不必写成一篇文章。\n一句没头没尾的话，也值得拥有一页。",
            "It does not need to be an essay.\nA half-finished thought deserves a page, too.",
          ),
          icon: "✳",
        },
        {
          title: t("只做三件小事。", "Three small things are enough."),
          body: "",
          aside: t(
            "完成不等于做得很多。\n把一个小计划划掉，也是一种前进。",
            "Progress is not always a long list.\nOne small tick can be enough.",
          ),
          icon: "✓",
        },
        {
          title: t("如果换一种方式呢？", "What if we tried it another way?"),
          body: t(
            "一个还没想清楚的点子：\n\n做一盏只在雨天亮起的灯。",
            "An idea that is not quite an idea yet:\n\nA lamp that lights only on rainy days.",
          ),
          aside: t(
            "先把奇怪的想法写下来。\n实用性可以晚一点再说。",
            "Write the strange idea first.\nPracticality can wait a little.",
          ),
          icon: "✧",
        },
        {
          title: t("值得留住的小瞬间。", "Small moments worth keeping."),
          body: t(
            "晒过太阳的被子。\n刚好遇上的绿灯。\n有人记得我随口说过的话。",
            "Sun-warmed laundry.\nA green light at just the right time.\nSomeone remembering a passing thought.",
          ),
          aside: t(
            "不是每个瞬间都惊天动地。\n小小的好，也算数。",
            "Not every moment is extraordinary.\nSmall good things count.",
          ),
          icon: "♡",
        },
      ];
      let active = 0,
        tasks = [
          { id: 1, text: t("去窗边看看天空", "Look at the sky from a window"), done: false },
          { id: 2, text: t("给一个想法起名字", "Give an idea a name"), done: true },
          { id: 3, text: t("留十分钟无所事事", "Leave ten minutes unplanned"), done: false },
        ],
        nextTask = 4,
        promptIndex = 0;
      function say(text) {
        $("status").textContent = text;
      }
      function storePage() {
        pages[active].title = $("page-title").value;
        if (active !== 1) pages[active].body = $("writing").value;
      }
      function updateCount() {
        const n = active === 1 ? tasks.filter((x) => x.done).length : pages[active].body.length;
        $("count").textContent =
          active === 1
            ? n + " / " + tasks.length + t(" 已完成", " DONE")
            : n + t(" 字符", " CHARACTERS");
        $("total").textContent =
          pages.reduce((n, p) => n + p.title.length + p.body.length, 0) +
          tasks.reduce((n, x) => n + x.text.length, 0);
      }
      function renderTasks() {
        const list = $("todo-list");
        list.replaceChildren();
        tasks.forEach((task) => {
          const li = document.createElement("li"),
            label = document.createElement("label"),
            check = document.createElement("input"),
            text = document.createElement("span"),
            remove = document.createElement("button");
          check.type = "checkbox";
          check.checked = task.done;
          text.textContent = task.text;
          check.onchange = () => {
            task.done = check.checked;
            updateCount();
            say(
              task.done
                ? t("又完成了一件小事。", "One more small thing, done.")
                : t("计划重新打开了。", "That plan is open again."),
            );
          };
          remove.className = "remove-task";
          remove.textContent = "×";
          remove.setAttribute("aria-label", t("移除计划：", "Remove plan: ") + task.text);
          remove.onclick = () => {
            tasks = tasks.filter((x) => x.id !== task.id);
            renderTasks();
            updateCount();
            $("task-text").focus();
            say(t("已移除这个计划。", "Plan removed."));
          };
          label.append(check, text);
          li.append(label, remove);
          list.append(li);
        });
        updateCount();
      }
      function openPage(index, focus = false) {
        storePage();
        active = index;
        document.querySelectorAll("[role=tab]").forEach((tab, i) => {
          tab.setAttribute("aria-selected", i === active);
          tab.tabIndex = i === active ? 0 : -1;
        });
        $("panel").setAttribute("aria-labelledby", "tab-" + active);
        $("page-title").value = pages[active].title;
        $("writing").value = pages[active].body;
        $("writing").classList.toggle("hidden", active === 1);
        $("tasks").classList.toggle("hidden", active !== 1);
        $("prompt").textContent =
          active === 1
            ? t("加一个轻松的小计划 ↗", "Add a gentle little plan ↗")
            : t("给我一个开头 ↗", "Give me a beginning ↗");
        $("page-number").textContent = "PAGE 0" + (active + 1) + " / 04";
        $("page-aside").textContent = pages[active].aside;
        $("stamp").textContent = pages[active].icon;
        renderTasks();
        if (focus) $("tab-" + active).focus();
        say(t("翻到第 ", "Opened page ") + (active + 1) + t(" 页。", "."));
      }
      function tilt(index) {
        document.querySelectorAll("[role=tab]").forEach((tab, i) => {
          tab.classList.toggle("hovered", i === index);
          tab.classList.toggle("left-neighbor", i === index - 1);
          tab.classList.toggle("right-neighbor", i === index + 1);
        });
      }
      function untilt() {
        document
          .querySelectorAll("[role=tab]")
          .forEach((tab) => tab.classList.remove("hovered", "left-neighbor", "right-neighbor"));
      }
      document.querySelectorAll("[role=tab]").forEach((tab, i) => {
        tab.onclick = () => openPage(i);
        tab.onpointerenter = () => tilt(i);
        tab.onpointerleave = untilt;
        tab.onfocus = () => tilt(i);
        tab.onblur = untilt;
        tab.onkeydown = (e) => {
          let next;
          if (e.key === "ArrowRight") next = (i + 1) % 4;
          if (e.key === "ArrowLeft") next = (i + 3) % 4;
          if (e.key === "Home") next = 0;
          if (e.key === "End") next = 3;
          if (next !== undefined) {
            e.preventDefault();
            openPage(next, true);
          }
        };
      });
      $("page-title").oninput = () => {
        pages[active].title = $("page-title").value;
        updateCount();
      };
      $("writing").oninput = () => {
        pages[active].body = $("writing").value;
        updateCount();
      };
      $("next").onclick = () => openPage((active + 1) % 4, true);
      $("add-form").onsubmit = (e) => {
        e.preventDefault();
        const text = $("task-text").value.trim();
        if (!text) return;
        if (tasks.length >= 20) {
          say(
            t("先完成几件小事吧，最多保留 20 个计划。", "Keep it small: up to 20 plans at a time."),
          );
          return;
        }
        tasks.push({ id: nextTask++, text, done: false });
        $("task-text").value = "";
        renderTasks();
        say(t("一个新计划，已经记下了。", "One new little plan, noted."));
      };
      const prompts = [
        t("如果今天是一种颜色，那会是：", "If today were a color, it would be:"),
        t("我想把更多时间留给：", "I would like to leave more time for:"),
        t("一个不必马上有答案的问题：", "A question that does not need an answer yet:"),
        t("刚刚让我停下来看的东西：", "Something that made me stop and look:"),
      ];
      $("prompt").onclick = () => {
        if (active === 1) {
          $("task-text").value = t("给自己倒一杯水", "Pour yourself a glass of water");
          $("task-text").focus();
          say(
            t("写好了一个开头，按 + 加入计划。", "A starting point is ready. Press + to add it."),
          );
          return;
        }
        const text = (pages[active].body ? "\n\n" : "") + prompts[promptIndex++ % prompts.length];
        if (pages[active].body.length + text.length > 4000) {
          say(t("这一页写满了，换一页继续吧。", "This page is full. Try another page."));
          return;
        }
        pages[active].body += text;
        $("writing").value = pages[active].body;
        $("writing").focus();
        $("writing").setSelectionRange($("writing").value.length, $("writing").value.length);
        updateCount();
        say(
          t("加了一个开头，把故事继续写下去吧。", "A beginning is in place. Make the rest yours."),
        );
      };
      function markdown() {
        storePage();
        return (
          "# " +
          $("notebook").textContent +
          "\n\n" +
          pages
            .map(
              (p, i) =>
                "## " +
                (p.title || t("未命名页面", "Untitled page")) +
                "\n\n" +
                (i === 1
                  ? tasks.map((x) => "- [" + (x.done ? "x" : " ") + "] " + x.text).join("\n")
                  : p.body),
            )
            .join("\n\n---\n\n") +
          "\n"
        );
      }
      $("export").onclick = () => {
        const url = URL.createObjectURL(
          new Blob([markdown()], { type: "text/markdown;charset=utf-8" }),
        );
        const link = document.createElement("a");
        link.href = url;
        link.download = "little-idea-notebook.md";
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        say(
          t(
            "四页笔记已导出为 Markdown，包括已勾选的计划。",
            "All four pages exported as Markdown, including checked plans.",
          ),
        );
      };
      $("page-title").value = pages[0].title;
      $("writing").value = pages[0].body;
      openPage(0);
      say(t("这一页，留给你今天的小发现。", "This page is for a small thing you noticed today."));
    </script>
