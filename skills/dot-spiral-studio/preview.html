<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Order, with a little twist.</title>
    <style>
      :root {
        --accent: #ff7948;
        --bg: #0c0c0b;
        --chassis: #151412;
        --recess: #060605;
        --ink: #f5efe7;
        --muted: #b5a999;
        --line: rgba(245, 232, 214, 0.11);
        --line-strong: rgba(245, 232, 214, 0.2);
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Hiragino Sans GB",
          "Noto Sans SC",
          "Helvetica Neue",
          sans-serif;
        color: var(--ink);
        background: var(--bg);
        color-scheme: dark;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 60% 55% at 74% 48%, rgba(255, 121, 72, 0.08), transparent 68%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent 220px);
        color: var(--ink);
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      canvas:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .shell {
        max-width: 1240px;
        margin: auto;
        padding: 18px 4.5% 20px;
        min-height: 700px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding-bottom: 13px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font:
          500 0.72rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.12em;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: #f3e8da;
        font-weight: 600;
      }
      .brand::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 2px;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(290px, 0.78fr) minmax(0, 1.22fr);
        gap: 4.5%;
        align-items: center;
        padding-top: 18px;
      }
      .copy {
        min-width: 0;
      }
      .eyebrow {
        font:
          500 0.72rem/1.3 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: var(--accent);
        letter-spacing: 0.1em;
      }
      h1 {
        font-size: clamp(2.1rem, 3.8vw, 3.35rem);
        font-weight: 600;
        line-height: 1.08;
        letter-spacing: -0.04em;
        margin: 12px 0 12px;
        overflow-wrap: anywhere;
        white-space: pre-line;
        color: #faf4ec;
        text-wrap: balance;
      }
      :lang(zh) h1 {
        letter-spacing: -0.02em;
        line-height: 1.16;
      }
      .intro {
        font-size: 0.875rem;
        line-height: 1.68;
        color: var(--muted);
        max-width: 38ch;
        margin: 0 0 18px;
        text-wrap: pretty;
      }
      .panel {
        background: var(--chassis);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        box-shadow:
          0 18px 42px rgba(0, 0, 0, 0.44),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }
      .presets {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 0 0 16px;
      }
      button {
        background: #1d1b18;
        border: 1px solid #35302a;
        border-radius: 10px;
        color: #d8cdc0;
        padding: 9px 12px;
        min-height: 38px;
        font-size: 0.8rem;
        font-weight: 500;
        transition:
          background-color 0.18s ease,
          border-color 0.18s ease,
          color 0.18s ease,
          box-shadow 0.18s ease;
      }
      button[aria-pressed="true"] {
        background: var(--accent);
        color: #160c05;
        border-color: var(--accent);
        font-weight: 600;
        box-shadow:
          0 0 18px color-mix(in srgb, var(--accent) 40%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      @media (hover: hover) {
        button:hover:not([aria-pressed="true"]) {
          background: #272420;
          border-color: #50473d;
          color: #ffffff;
        }
        button[aria-pressed="true"]:hover {
          filter: brightness(1.06);
        }
      }
      .control {
        margin: 14px 0;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.8rem;
        font-weight: 500;
        margin-bottom: 8px;
        color: #d0c4b6;
      }
      .repeat-row {
        margin: 14px 0 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        cursor: pointer;
      }
      .repeat-row input[type="checkbox"] {
        width: 17px;
        height: 17px;
        accent-color: var(--accent);
        cursor: pointer;
        margin: 0;
      }
      output {
        font:
          600 0.78rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: #28241f;
        accent-color: var(--accent);
        cursor: pointer;
        margin: 6px 0;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        background: #f5eee6;
        border: 2px solid var(--accent);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        background: #f5eee6;
        border: 2px solid var(--accent);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 14px;
      }
      .actions button {
        border-radius: 10px;
        min-height: 40px;
        white-space: nowrap;
      }
      .actions .primary {
        background: #f3e9dc;
        color: #19130d;
        border-color: #f3e9dc;
        font-weight: 600;
      }
      .actions .primary[aria-pressed="true"] {
        background: var(--accent);
        color: #160c05;
        border-color: var(--accent);
      }
      @media (hover: hover) {
        .actions .primary:hover:not([aria-pressed="true"]) {
          background: #ffffff;
          color: #120d08;
        }
      }
      .stage-bezel {
        min-width: 0;
        background: linear-gradient(180deg, #1b1917 0%, #11100e 100%);
        border: 1px solid var(--line-strong);
        border-radius: 22px;
        padding: 12px 14px;
        box-shadow:
          0 28px 60px rgba(0, 0, 0, 0.62),
          inset 0 1px 0 rgba(255, 255, 255, 0.09);
        max-width: 556px;
        width: 100%;
        justify-self: end;
      }
      .bezel-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 0 2px 9px;
      }
      .bezel-bar.bottom-bar {
        padding: 9px 2px 0;
        justify-content: flex-end;
      }
      .stage {
        position: relative;
        aspect-ratio: 1;
        min-width: 0;
        width: 100%;
        max-height: 516px;
        background: var(--recess);
        border: 1px solid #2b2620;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.85);
      }
      .stage canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: pointer;
        user-select: none;
      }
      .edge {
        color: #bdb0a0;
        font:
          500 0.68rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.12em;
      }
      .bezel-led {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #9f9282;
        font:
          500 0.65rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.1em;
      }
      .bezel-led::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
      }
      .index {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        font:
          500 1.35rem/1 Georgia,
          serif;
        color: #b59b82;
      }
      .index small {
        font:
          500 0.68rem/1.2 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.1em;
        color: #b4a595;
      }
      footer {
        margin-top: 16px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
        font:
          400 0.72rem/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      #status {
        color: #dfd0be;
      }
      @media (max-width: 820px) {
        .shell {
          padding: 18px 18px 20px;
          min-height: 0;
        }
        .layout {
          grid-template-columns: 1fr;
          gap: 16px;
          padding-top: 14px;
        }
        .copy {
          display: contents;
        }
        .eyebrow {
          margin: 0;
        }
        h1 {
          font-size: 2.15rem;
          margin: 0;
        }
        .intro {
          max-width: none;
          margin: 0;
        }
        .stage-bezel {
          grid-row: 4;
          justify-self: center;
          max-width: 500px;
          padding: 10px;
          border-radius: 18px;
        }
        .stage {
          max-height: none;
        }
        .panel {
          grid-row: 5;
        }
        .index {
          display: none;
        }
        footer {
          flex-direction: column;
          gap: 6px;
        }
        header {
          font-size: 0.68rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <span class="brand">DOT / ORDER</span>
        <span data-i="header">01 — 点阵运动工坊</span>
      </header>
      <section class="layout">
        <div class="copy">
          <div class="eyebrow" data-i="eyebrow">微小的点，组成巨大的节奏。</div>
          <h1>Order, with a little twist.</h1>
          <p class="intro" data-i="intro">
            拖动时间，让冷白点阵卷成螺旋。独立探索三种图案，或让它们连续变换，把红橙黄的轨迹留成矢量海报。
          </p>
          <div class="panel">
            <div class="presets" role="group" aria-label="图案">
              <button data-mode="spiral" aria-pressed="true" data-i="spiral">方螺旋</button>
              <button data-mode="rings" aria-pressed="false" data-i="rings">同心回响</button>
              <button data-mode="cycle" aria-pressed="false" data-i="cycle">三形态循环</button>
              <button data-mode="wave" aria-pressed="false" data-i="wave">流动切面</button>
            </div>
            <div class="control">
              <label class="row" for="phase">
                <span data-i="phase">时间切片</span>
                <output id="phaseValue">44 / 100</output>
              </label>
              <input id="phase" type="range" min="0" max="100" value="44" />
            </div>
            <div class="control">
              <label class="row" for="grid">
                <span data-i="density">矩阵密度</span>
                <output id="gridValue">31 × 31</output>
              </label>
              <input id="grid" type="range" min="17" max="41" step="1" value="31" />
            </div>
            <label class="row repeat-row" for="repeat">
              <span data-i="repeat">连续播放</span>
              <input id="repeat" type="checkbox" />
            </label>
            <div class="actions">
              <button id="play" class="primary" aria-pressed="false" data-i="play">
                ▷ 播放一圈
              </button>
              <button id="save" data-i="save">保存 SVG ↗</button>
            </div>
            <div class="index">
              01
              <small data-i="edition">秩序里的小偏离</small>
            </div>
          </div>
        </div>
        <div class="stage-bezel">
          <div class="bezel-bar">
            <span class="edge" id="cellCount">961 CELLS</span>
            <span class="bezel-led" aria-hidden="true">LED MATRIX</span>
          </div>
          <div class="stage">
            <canvas tabindex="0" role="button" aria-label="点按推进时间，左右键逐格探索"></canvas>
          </div>
          <div class="bezel-bar bottom-bar">
            <span class="edge" data-i="stageHint">点按 / 左右键 · 探索下一帧</span>
          </div>
        </div>
      </section>
      <footer>
        <span data-i="footer">离线生成 · 矢量快照 · 一圈 8 秒</span>
        <span id="status" role="status" aria-live="polite">已暂停，拖动时间切片开始探索。</span>
      </footer>
    </main>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {};
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(
              /Packed ([\d,]+) bytes\. CRC32 ([0-9a-f]+)\. Download contains the complete file, ready to decode\./gi,
              "已打包 $1 字节。CRC32 $2。下载文件包含完整内容，可直接解码。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
          applyLanguage(resolved);
        };

        function boot() {
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;
          if (chinese) applyLanguage("zh");

          let langObserver;
          if (typeof MutationObserver === "function") {
            langObserver = new MutationObserver(() => {
              const next =
                normalizeLang(document.documentElement.dataset.skillLang) || resolveLang();
              if (next !== currentLang) applyLanguage(next);
            });
            langObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skill-lang"],
            });
            window.addEventListener("pagehide", () => langObserver.disconnect(), { once: true });
          }

          if (parent === window) return;
          // Freeze viewport-based demo heights before measuring, avoiding vh feedback
          // when the parent grows the iframe. Intentional inner demo scrollers remain.
          const initialHeight = Math.max(360, Math.min(760, innerHeight));
          function fixRules(rules) {
            for (const rule of rules) {
              if (rule.cssRules) fixRules(rule.cssRules);
              if (!rule.style) continue;
              if (/v[hbs]/.test(rule.style.minHeight))
                rule.style.setProperty("min-height", "0", "important");
              if (/v[hbs]/.test(rule.style.height))
                rule.style.setProperty("height", `${initialHeight}px`, "important");
            }
          }
          for (const sheet of document.styleSheets) {
            try {
              fixRules(sheet.cssRules);
            } catch {
              /* Same-file styles are sufficient. */
            }
          }
          for (const element of [document.documentElement, document.body]) {
            element.style.setProperty("height", "auto", "important");
            element.style.setProperty("min-height", "0", "important");
          }
          document.documentElement.style.overflowX = "clip";
          let frame = 0,
            lastHeight = 0;
          const measure = () => {
            frame = 0;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height),
            );
            if (height > 0 && height <= 20000 && height !== lastHeight) {
              lastHeight = height;
              parent.postMessage({ type: "usefulshelf:resize", height }, "*");
            }
          };
          const schedule = () => {
            if (!frame) frame = requestAnimationFrame(measure);
          };
          const observer = new ResizeObserver(schedule);
          observer.observe(document.body);
          window.addEventListener("resize", schedule);
          const onMessage = (event) => {
            if (event.source === parent && event.data?.type === "usefulshelf:measure") {
              // The first resize may precede parent hydration. A measurement request
              // must acknowledge even an unchanged height, so that message is recovered.
              lastHeight = 0;
              schedule();
            }
          };
          window.addEventListener("message", onMessage);
          document.fonts?.ready.then(schedule);
          window.addEventListener(
            "pagehide",
            () => {
              observer.disconnect();
              cancelAnimationFrame(frame);
              window.removeEventListener("resize", schedule);
              window.removeEventListener("message", onMessage);
            },
            { once: true },
          );
          schedule();
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        else boot();
      })();
    </script>
    <!-- usefulshelf-runtime:end -->
    <script>
      const config = window.__usefulshelfConfigure({"title": null, "accent": "#ff7948", "grid": 31, "phase": 44, "mode": "spiral"}),
        resolvedLang =
          new URLSearchParams(location.search).get("lang") ||
          document.documentElement.dataset.skillLang ||
          (/^zh/i.test(document.documentElement.lang) ? "zh" : "en"),
        en = resolvedLang !== "zh";
      document.documentElement.lang = en ? "en" : "zh-CN";
      const words = {
        header: "01 — MATRIX MOTION STUDIO",
        eyebrow: "SMALL DOTS. A MUCH BIGGER RHYTHM.",
        intro:
          "Scrub through time and watch a cool-white matrix curl into a spiral. Explore three patterns on their own or blend them in a continuous cycle. Save the red-to-yellow trails as a vector poster.",
        spiral: "Square spiral",
        rings: "Echo rings",
        wave: "Flowing facets",
        cycle: "Three-form cycle",
        repeat: "Repeat loop",
        phase: "Time slice",
        density: "Matrix density",
        play: "▷ Play one cycle",
        save: "Save SVG ↗",
        edition: "A SMALL DEVIATION FROM ORDER",
        stageHint: "TAP / ARROW KEYS · NEXT FRAME",
        footer: "Offline generation · Vector snapshot · 8-second cycle",
      };
      if (en) {
        document.querySelectorAll("[data-i]").forEach((e) => (e.textContent = words[e.dataset.i]));
        document.querySelector(".presets").setAttribute("aria-label", "Pattern");
      }
      document.querySelector("h1").textContent =
        config.title ?? (en ? "Order, with\na little twist." : "让秩序，\n转个弯。");
      document.title = config.title ?? (en ? "Order, with a little twist." : "让秩序，转个弯。");
      const c = document.querySelector("canvas"),
        ctx = c.getContext("2d"),
        phaseInput = document.querySelector("#phase"),
        gridInput = document.querySelector("#grid"),
        play = document.querySelector("#play"),
        status = document.querySelector("#status"),
        motion = matchMedia("(prefers-reduced-motion: reduce)");
      c.setAttribute(
        "aria-label",
        en
          ? "Advance the pattern. Use left and right arrows to scrub."
          : "点按推进时间，左右键逐格探索",
      );
      let size = 1,
        phase = config.phase / 100,
        n = config.grid,
        mode = config.mode,
        raf = 0,
        playing = false,
        started = 0,
        initialPhase = phase;
      const repeat = document.querySelector("#repeat");
      const accentHex =
        config.accent.length === 4
          ? "#" + [...config.accent.slice(1)].map((ch) => ch + ch).join("")
          : config.accent;
      const hot = [1, 3, 5].map((i) => parseInt(accentHex.slice(i, i + 2), 16));
      phaseInput.value = config.phase;
      gridInput.value = n;
      const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
      const clamp = (x) => Math.max(0, Math.min(1, x));
      function fieldAt(kind, x, y, r, angle, p) {
        return kind === "spiral"
          ? Math.sin(angle - r * 9 + p)
          : kind === "rings"
            ? Math.cos(r * 15 - p)
            : Math.sin(x * 4 + y * 2 + p) * Math.cos(y * 2 - p);
      }
      function cells() {
        const result = [],
          step = 800 / n,
          margin = 100;
        for (let row = 0; row < n; row++)
          for (let col = 0; col < n; col++) {
            const x = (col - (n - 1) / 2) / (n / 2),
              y = (row - (n - 1) / 2) / (n / 2),
              r = Math.max(Math.abs(x), Math.abs(y)),
              angle = Math.atan2(y, x),
              p = phase * Math.PI * 2;
            let field;
            if (mode === "cycle") {
              const k = (phase % 1) * 3,
                index = Math.floor(k),
                t = k - index,
                ease = t * t * (3 - 2 * t),
                forms = ["spiral", "rings", "wave"];
              field =
                fieldAt(forms[index], x, y, r, angle, p) * (1 - ease) +
                fieldAt(forms[(index + 1) % 3], x, y, r, angle, p) * ease;
            } else field = fieldAt(mode, x, y, r, angle, p);
            const weight = Math.pow((field + 1) / 2, 1.65),
              scale = 0.055 + 0.81 * weight,
              trail = clamp(Math.min((field + 0.05) / 0.12, (0.97 - field) / 0.13)),
              heat = clamp((field - 0.07) / 0.77),
              warm =
                heat < 0.5
                  ? mix([255, 28, 22], hot, heat * 2)
                  : mix(hot, [255, 236, 72], (heat - 0.5) * 2),
              color = mix([216, 234, 255], warm, trail);
            const width = step * scale;
            result.push({
              x: margin + (col + 0.5) * step - width / 2,
              y: margin + (row + 0.5) * step - width / 2,
              cx: margin + (col + 0.5) * step,
              cy: margin + (row + 0.5) * step,
              width,
              trail,
              heat,
              rgb: color,
              color: `rgb(${color.join(",")})`,
            });
          }
        return result;
      }

      function draw() {
        ctx.clearRect(0, 0, size, size);
        ctx.save();
        ctx.scale(size / 1000, size / 1000);

        // Subtle recessed anodized LED backplane
        const bgGrad = ctx.createRadialGradient(500, 500, 60, 500, 500, 560);
        bgGrad.addColorStop(0, "#0b0a09");
        bgGrad.addColorStop(1, "#040404");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 1000, 1000);

        // Hairline coordinate ruler ticks around the 800×800 matrix bay
        ctx.strokeStyle = "rgba(235, 219, 198, 0.14)";
        ctx.lineWidth = 1.4;
        ctx.strokeRect(86, 86, 828, 828);
        ctx.strokeStyle = "rgba(235, 219, 198, 0.22)";
        for (let i = 0; i <= 8; i++) {
          const pos = 100 + i * 100,
            len = i % 2 === 0 ? 12 : 6;
          ctx.beginPath();
          ctx.moveTo(pos, 72);
          ctx.lineTo(pos, 72 + len);
          ctx.moveTo(72, pos);
          ctx.lineTo(72 + len, pos);
          ctx.moveTo(pos, 928);
          ctx.lineTo(pos, 928 - len);
          ctx.moveTo(928, pos);
          ctx.lineTo(928 - len, pos);
          ctx.stroke();
        }

        const list = cells();

        // Pass 1: Restrained radial phosphor bloom ONLY on thermal-band LED cells
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (const p of list) {
          if (p.trail > 0.35 && p.width > 5) {
            const halo = p.width * 1.45;
            ctx.fillStyle = `rgba(${p.rgb[0]},${p.rgb[1]},${p.rgb[2]},${(p.trail * 0.14).toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(p.cx, p.cy, halo, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();

        // Pass 2: Precision LED diode array cells
        for (const p of list) {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.roundRect(p.x, p.y, p.width, p.width, p.width * 0.23);
          ctx.fill();
          // Subtle phosphor core specular highlight on larger cells
          if (p.width > 9) {
            ctx.fillStyle = "rgba(255,255,255,0.22)";
            ctx.beginPath();
            ctx.roundRect(
              p.x + p.width * 0.18,
              p.y + p.width * 0.16,
              p.width * 0.32,
              p.width * 0.22,
              p.width * 0.08,
            );
            ctx.fill();
          }
        }
        ctx.restore();
      }
      function sync() {
        phaseInput.value = Math.round(phase * 100);
        document.querySelector("#phaseValue").textContent = Math.round(phase * 100) + " / 100";
        document.querySelector("#gridValue").textContent = n + " × " + n;
        document.querySelector("#cellCount").textContent = n * n + " CELLS";
      }
      function stop(message) {
        cancelAnimationFrame(raf);
        raf = 0;
        playing = false;
        play.setAttribute("aria-pressed", "false");
        play.textContent = repeat.checked
          ? en
            ? "▷ Play loop"
            : "▷ 连续播放"
          : en
            ? words.play
            : "▷ 播放一圈";
        if (message) status.textContent = message;
      }
      function update(message) {
        sync();
        draw();
        if (message) status.textContent = message;
      }
      function frame(now) {
        const elapsed = now - started;
        if (elapsed >= 8000 && !repeat.checked) {
          phase = initialPhase;
          update();
          stop(
            en
              ? "One cycle complete. Save a frame or try another pattern."
              : "一圈已完成。保存这一帧，或试试另一个图案。",
          );
          return;
        }
        phase = (initialPhase + elapsed / 8000) % 1;
        update();
        raf = requestAnimationFrame(frame);
      }
      function step(delta) {
        stop();
        phase = (phase + delta + 1) % 1;
        update(
          en
            ? `Time slice ${Math.round(phase * 100)}. Paused.`
            : `时间切片 ${Math.round(phase * 100)}，已暂停。`,
        );
      }
      phaseInput.oninput = () => {
        stop();
        phase = Number(phaseInput.value) / 100;
        update(
          en ? `Time slice ${phaseInput.value}. Paused.` : `时间切片 ${phaseInput.value}，已暂停。`,
        );
      };
      gridInput.oninput = () => {
        n = Number(gridInput.value);
        update(en ? `${n * n} cells in this pattern.` : `当前图案包含 ${n * n} 个单元。`);
      };
      document.querySelectorAll("[data-mode]").forEach(
        (b) =>
          (b.onclick = () => {
            mode = b.dataset.mode;
            document
              .querySelectorAll("[data-mode]")
              .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
            update(en ? `${words[mode]} selected.` : `已切换为${b.textContent}。`);
          }),
      );
      play.onclick = () => {
        if (playing) {
          stop(en ? "Paused on this frame." : "已停在这一帧。");
          return;
        }
        if (motion.matches) {
          step(0.13);
          status.textContent = en
            ? "Static step applied. Reduced motion is enabled."
            : "已前进一个静态切片。减少动态效果已启用。";
          return;
        }
        playing = true;
        initialPhase = phase;
        started = performance.now();
        play.setAttribute("aria-pressed", "true");
        play.textContent = en ? "Ⅱ Pause" : "Ⅱ 暂停";
        status.textContent = repeat.checked
          ? en
            ? "Looping until paused."
            : "正在连续播放，点暂停即可停下。"
          : en
            ? "Playing one 8-second cycle."
            : "正在播放一圈，8 秒后自动停止。";
        raf = requestAnimationFrame(frame);
      };
      repeat.onchange = () => {
        stop(
          en ? "Playback preference updated. Press play to begin." : "播放方式已更新，点播放开始。",
        );
      };
      c.onclick = () => step(0.07);
      c.addEventListener("keydown", (e) => {
        if (["ArrowLeft", "ArrowRight", "Enter", " "].includes(e.key)) {
          e.preventDefault();
          step(e.key === "ArrowLeft" ? -0.01 : 0.01);
        }
      });
      document.querySelector("#save").onclick = () => {
        const svg =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000"><title>Dot matrix snapshot</title><rect width="1000" height="1000" fill="#050504"/>' +
          cells()
            .map(
              (p) =>
                `<rect x="${p.x.toFixed(3)}" y="${p.y.toFixed(3)}" width="${p.width.toFixed(3)}" height="${p.width.toFixed(3)}" rx="${(p.width * 0.23).toFixed(3)}" fill="${p.color}"/>`,
            )
            .join("") +
          "</svg>";
        const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" })),
          a = document.createElement("a");
        a.href = url;
        a.download = "dot-matrix-snapshot.svg";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        status.textContent = en
          ? `Saved ${n * n} editable cells as SVG.`
          : `已保存 ${n * n} 个可编辑单元的 SVG。`;
      };
      new ResizeObserver(() => {
        size = c.getBoundingClientRect().width;
        const d = Math.min(devicePixelRatio || 1, 2);
        c.width = size * d;
        c.height = size * d;
        ctx.setTransform(d, 0, 0, d, 0, 0);
        draw();
      }).observe(c);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop(en ? "Paused while hidden." : "页面隐藏，已暂停。");
      });
      motion.addEventListener("change", () => {
        if (motion.matches)
          stop(
            en
              ? "Reduced motion enabled. Use the time slider."
              : "减少动态效果已启用，请使用时间滑杆。",
          );
      });
      document
        .querySelectorAll("[data-mode]")
        .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
      sync();
      status.textContent = en
        ? "Paused. Scrub the time slice to explore."
        : "已暂停，拖动时间切片开始探索。";
    </script>
  </body>
