<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Break the ice.</title>
    <style>
      :root {
        --accent: #a5e6ff;
        --bg: #050a10;
        --deck: rgba(11, 22, 34, 0.82);
        --ink: #eff8fc;
        --muted: #9eb9c9;
        --line: rgba(165, 230, 255, 0.14);
        --line-strong: rgba(165, 230, 255, 0.28);
        color-scheme: dark;
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Hiragino Sans GB",
          "Noto Sans SC",
          "Helvetica Neue",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 64% 58% at 72% 40%, rgba(44, 126, 178, 0.2), transparent 68%),
          radial-gradient(ellipse 46% 42% at 22% 80%, rgba(165, 230, 255, 0.08), transparent 72%);
        color: var(--ink);
      }
      button,
      input {
        font: inherit;
      }
      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      input:focus-visible,
      canvas:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .shell {
        max-width: 1240px;
        margin: auto;
        min-height: 700px;
        padding: 20px 4.5% 22px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font:
          500 0.72rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.14em;
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-weight: 600;
        font-size: 0.92rem;
        letter-spacing: 0.08em;
        color: #f4fbff;
      }
      .mark span {
        color: var(--accent);
        text-shadow: 0 0 12px var(--accent);
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #a9c6d6;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(165, 230, 255, 0.06);
        border: 1px solid var(--line);
      }
      .live:before {
        content: "◈";
        color: var(--accent);
      }
      .hero {
        position: relative;
        min-height: 430px;
        display: grid;
        grid-template-columns: minmax(0, 0.88fr) minmax(0, 1.12fr);
        gap: 4%;
        align-items: center;
        margin: 16px 0;
      }
      .copy {
        z-index: 2;
      }
      .eyebrow {
        font:
          500 0.72rem/1.3 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.14em;
        color: var(--accent);
      }
      h1 {
        white-space: pre-line;
        font-size: clamp(2.4rem, 4.9vw, 4.6rem);
        line-height: 1.02;
        letter-spacing: -0.045em;
        max-width: 11ch;
        font-weight: 600;
        margin: 14px 0 16px;
        overflow-wrap: anywhere;
        color: #f5fbff;
        text-wrap: balance;
      }
      :lang(zh) h1 {
        letter-spacing: -0.02em;
        line-height: 1.16;
        font-size: clamp(2.25rem, 4.1vw, 3.8rem);
      }
      .intro {
        color: var(--muted);
        max-width: 40ch;
        line-height: 1.68;
        font-size: 0.9375rem;
        margin: 0;
        text-wrap: pretty;
      }
      .visual {
        position: relative;
        min-width: 0;
        height: 430px;
        border-radius: 26px;
        background:
          radial-gradient(ellipse 66% 62% at 50% 48%, rgba(37, 110, 155, 0.34), transparent 72%),
          linear-gradient(180deg, rgba(11, 24, 38, 0.92) 0%, rgba(5, 11, 18, 0.96) 100%);
        border: 1px solid rgba(165, 230, 255, 0.16);
        box-shadow:
          0 28px 60px rgba(0, 0, 0, 0.56),
          inset 0 1px 0 rgba(220, 248, 255, 0.16);
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
        user-select: none;
      }
      .cross {
        position: absolute;
        font:
          500 0.85rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: rgba(165, 230, 255, 0.45);
        pointer-events: none;
      }
      .cross.a {
        top: 18px;
        left: 20px;
      }
      .cross.b {
        bottom: 18px;
        right: 20px;
      }
      .tip {
        position: absolute;
        bottom: 16px;
        left: 0;
        right: 0;
        text-align: center;
        color: #b5d1df;
        font:
          500 0.7rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        letter-spacing: 0.12em;
        pointer-events: none;
      }
      .controls {
        background: var(--deck);
        border: 1px solid var(--line);
        border-radius: 20px;
        display: grid;
        grid-template-columns: minmax(190px, 0.95fr) minmax(200px, 1.15fr) auto;
        gap: 28px;
        padding: 16px 22px;
        align-items: center;
        box-shadow:
          0 16px 38px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(210, 242, 255, 0.1);
      }
      .label {
        font:
          500 0.7rem/1.2 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        color: #9ec0d2;
        letter-spacing: 0.12em;
      }
      .amount {
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
        margin-top: 4px;
        line-height: 1.05;
        color: #f4fbff;
      }
      .amount small {
        font-size: 0.85rem;
        color: #99b8c8;
        letter-spacing: 0;
        margin-left: 4px;
        font-weight: 500;
      }
      .meter {
        display: flex;
        gap: 4px;
        margin-top: 9px;
      }
      .meter i {
        height: 4px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 55%, transparent);
        flex: 1;
        opacity: 0.92;
        transition: opacity 0.2s ease;
      }
      .range-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 0.8125rem;
        font-weight: 500;
        color: #cfe4ef;
        margin-bottom: 10px;
      }
      .range-top output {
        font:
          600 0.8125rem/1 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: rgba(165, 230, 255, 0.16);
        accent-color: var(--accent);
        cursor: pointer;
        margin: 8px 0;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #f5fcff;
        border: 3px solid var(--accent);
        box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 68%, transparent);
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #f5fcff;
        border: 3px solid var(--accent);
        box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 68%, transparent);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }
      button {
        border: 1px solid rgba(165, 230, 255, 0.34);
        border-radius: 999px;
        padding: 11px 20px;
        min-height: 42px;
        background: rgba(165, 230, 255, 0.06);
        color: #edf9ff;
        font-size: 0.84rem;
        font-weight: 500;
        white-space: nowrap;
        transition:
          background-color 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #05131c;
        font-weight: 600;
        box-shadow:
          0 0 24px color-mix(in srgb, var(--accent) 42%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
      }
      @media (hover: hover) {
        button:hover:not(.primary) {
          background: rgba(165, 230, 255, 0.14);
          border-color: rgba(165, 230, 255, 0.55);
        }
        button.primary:hover {
          filter: brightness(1.07);
        }
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        color: #9bb8c7;
        font:
          400 0.72rem/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid rgba(165, 230, 255, 0.08);
      }
      #status {
        color: #cde7f4;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      @media (max-width: 820px) {
        .shell {
          padding: 18px 20px 20px;
          min-height: 0;
        }
        .hero {
          grid-template-columns: 1fr;
          min-height: 0;
          gap: 16px;
          margin: 14px 0;
        }
        h1 {
          max-width: none;
          font-size: 2.35rem;
          margin: 10px 0 10px;
        }
        .intro {
          font-size: 0.875rem;
          max-width: none;
        }
        .visual {
          height: 300px;
          border-radius: 20px;
        }
        .controls {
          grid-template-columns: 1fr;
          gap: 16px;
          padding: 16px;
          border-radius: 18px;
        }
        .actions {
          justify-content: stretch;
        }
        .actions button {
          flex: 1;
        }
        footer {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
          margin-top: 14px;
        }
        .live {
          font-size: 0.66rem;
          padding: 6px 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="mark">
          <span>✳</span>
          PHASE / 01
        </div>
        <div class="live" data-i="header">形态实验室</div>
      </header>
      <section class="hero">
        <div class="copy">
          <div class="eyebrow" data-i="eyebrow">固态 → 碎片 → 新生</div>
          <h1>Break the ice.</h1>
          <p class="intro" data-i="intro">
            点击冰晶，释放一次冲击。调高力量，看每块切面找到新的轨迹；重冻，让一切回到原点。
          </p>
        </div>
        <div class="visual">
          <span class="cross a">+</span>
          <canvas tabindex="0" role="button" aria-label="点击或按回车碎裂冰晶"></canvas>
          <span class="cross b">+</span>
          <div class="tip" data-i="tip">点击 / 回车 · 施加冲击</div>
        </div>
      </section>
      <section class="controls" aria-label="实验控制">
        <div>
          <div class="label" data-i="state">晶体完整度</div>
          <div class="amount">
            <span id="integrity">100</span>
            <small>%</small>
          </div>
          <div class="meter" aria-hidden="true"></div>
        </div>
        <div>
          <label class="range-top" for="force">
            <span data-i="force">冲击力度</span>
            <output id="forceValue">65%</output>
          </label>
          <input id="force" type="range" min="10" max="100" value="65" />
        </div>
        <div class="actions">
          <button class="primary" id="break" data-i="break">碎裂 ↗</button>
          <button id="freeze" data-i="freeze">重新凝结 ↺</button>
        </div>
      </section>
      <footer>
        <span data-i="footer">24 个切面 / 每一次冲击，都有不同的形状</span>
        <span id="status" role="status" aria-live="polite">冰晶已凝结</span>
      </footer>
    </main>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {};
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(
              /Packed ([\d,]+) bytes\. CRC32 ([0-9a-f]+)\. Download contains the complete file, ready to decode\./gi,
              "已打包 $1 字节。CRC32 $2。下载文件包含完整内容，可直接解码。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
          applyLanguage(resolved);
        };

        function boot() {
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;
          if (chinese) applyLanguage("zh");

          let langObserver;
          if (typeof MutationObserver === "function") {
            langObserver = new MutationObserver(() => {
              const next =
                normalizeLang(document.documentElement.dataset.skillLang) || resolveLang();
              if (next !== currentLang) applyLanguage(next);
            });
            langObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skill-lang"],
            });
            window.addEventListener("pagehide", () => langObserver.disconnect(), { once: true });
          }

          if (parent === window) return;
          // Freeze viewport-based demo heights before measuring, avoiding vh feedback
          // when the parent grows the iframe. Intentional inner demo scrollers remain.
          const initialHeight = Math.max(360, Math.min(760, innerHeight));
          function fixRules(rules) {
            for (const rule of rules) {
              if (rule.cssRules) fixRules(rule.cssRules);
              if (!rule.style) continue;
              if (/v[hbs]/.test(rule.style.minHeight))
                rule.style.setProperty("min-height", "0", "important");
              if (/v[hbs]/.test(rule.style.height))
                rule.style.setProperty("height", `${initialHeight}px`, "important");
            }
          }
          for (const sheet of document.styleSheets) {
            try {
              fixRules(sheet.cssRules);
            } catch {
              /* Same-file styles are sufficient. */
            }
          }
          for (const element of [document.documentElement, document.body]) {
            element.style.setProperty("height", "auto", "important");
            element.style.setProperty("min-height", "0", "important");
          }
          document.documentElement.style.overflowX = "clip";
          let frame = 0,
            lastHeight = 0;
          const measure = () => {
            frame = 0;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height),
            );
            if (height > 0 && height <= 20000 && height !== lastHeight) {
              lastHeight = height;
              parent.postMessage({ type: "usefulshelf:resize", height }, "*");
            }
          };
          const schedule = () => {
            if (!frame) frame = requestAnimationFrame(measure);
          };
          const observer = new ResizeObserver(schedule);
          observer.observe(document.body);
          window.addEventListener("resize", schedule);
          const onMessage = (event) => {
            if (event.source === parent && event.data?.type === "usefulshelf:measure") {
              // The first resize may precede parent hydration. A measurement request
              // must acknowledge even an unchanged height, so that message is recovered.
              lastHeight = 0;
              schedule();
            }
          };
          window.addEventListener("message", onMessage);
          document.fonts?.ready.then(schedule);
          window.addEventListener(
            "pagehide",
            () => {
              observer.disconnect();
              cancelAnimationFrame(frame);
              window.removeEventListener("resize", schedule);
              window.removeEventListener("message", onMessage);
            },
            { once: true },
          );
          schedule();
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        else boot();
      })();
    </script>
    <!-- usefulshelf-runtime:end -->
    <script>
      const config = window.__usefulshelfConfigure({"title": null, "impact": 65});
      const resolvedLang =
        new URLSearchParams(location.search).get("lang") ||
        document.documentElement.dataset.skillLang ||
        (/^zh/i.test(document.documentElement.lang) ? "zh" : "en");
      const en = resolvedLang !== "zh";
      document.documentElement.lang = en ? "en" : "zh-CN";
      const texts = {
        header: "MATERIAL PLAYGROUND",
        eyebrow: "SOLID → SCATTERED → REBORN",
        intro:
          "Tap the crystal to release an impact. Turn up the force and follow every fragment. Refreeze to bring it all home.",
        tip: "TAP / ENTER · APPLY IMPACT",
        state: "CRYSTAL INTEGRITY",
        force: "Impact force",
        break: "Fracture ↗",
        freeze: "Refreeze ↺",
        footer: "24 facets / A different shape with every impact",
      };
      if (en) {
        document.querySelectorAll("[data-i]").forEach((e) => (e.textContent = texts[e.dataset.i]));
        document.querySelector(".controls")?.setAttribute("aria-label", "Experiment controls");
      }
      document.querySelector("h1").textContent =
        config.title ?? (en ? "Break the ice." : "打破形态。\n重新凝结。");
      document.title = config.title ?? (en ? "Break the ice." : "打破形态。重新凝结。");
      const canvas = document.querySelector("canvas"),
        ctx = canvas.getContext("2d"),
        range = document.querySelector("#force"),
        status = document.querySelector("#status");
      canvas.setAttribute(
        "aria-label",
        en ? "Click or press Enter to fracture the crystal" : "点击或按回车碎裂冰晶",
      );
      const motion = matchMedia("(prefers-reduced-motion: reduce)");
      let w = 1,
        h = 1,
        dpr = 1,
        raf = 0,
        progress = 0,
        target = 0,
        origin = 0,
        start = 0,
        impact = 0,
        seed = 0;
      range.value = config.impact;
      const rawAccent = getComputedStyle(document.documentElement)
          .getPropertyValue("--accent")
          .trim(),
        accent =
          rawAccent.length === 4
            ? "#" + [...rawAccent.slice(1)].map((ch) => ch + ch).join("")
            : rawAccent;
      const accentRgb = [1, 3, 5].map((i) => parseInt(accent.slice(i, i + 2), 16));
      const meter = document.querySelector(".meter");
      for (let i = 0; i < 12; i++) meter.append(document.createElement("i"));
      const pieces = [];
      const vertices = [];
      for (let i = 0; i < 8; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 4;
        vertices.push([Math.cos(a) * 0.78, Math.sin(a)]);
      }
      for (let i = 0; i < 8; i++) {
        const a = vertices[i],
          b = vertices[(i + 1) % 8],
          mid = [(a[0] + b[0]) * 0.39, (a[1] + b[1]) * 0.39];
        pieces.push([[0, 0], a, mid], [[0, 0], mid, b], [a, b, mid]);
      }
      function draw() {
        ctx.clearRect(0, 0, w, h);
        const r = Math.min(w * 0.33, h * 0.36),
          cx = w * 0.5,
          cy = h * 0.45;

        // Subtle glacial reticle & optical measurement rings
        ctx.save();
        ctx.translate(cx, cy);
        ctx.strokeStyle = `rgba(${accentRgb.join(",")},0.12)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.18, 0, Math.PI * 2);
        ctx.stroke();

        ctx.setLineDash([2, 6]);
        ctx.strokeStyle = `rgba(${accentRgb.join(",")},0.16)`;
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.38, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        // Volumetric glacial aura behind crystal
        const aura = ctx.createRadialGradient(
          0,
          -r * 0.1,
          r * 0.1,
          0,
          0,
          r * (1.42 + progress * 0.3),
        );
        aura.addColorStop(0, `rgba(${accentRgb.join(",")},${(0.28 - progress * 0.08).toFixed(3)})`);
        aura.addColorStop(0.55, "rgba(38, 128, 184, 0.12)");
        aura.addColorStop(1, "rgba(5, 10, 16, 0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Caustic floor reflection & plinth ellipse
        const floorRx = r * (0.94 + progress * 0.34),
          floorRy = r * 0.18;
        const floorGlow = ctx.createRadialGradient(0, r * 1.12, 4, 0, r * 1.12, floorRx);
        floorGlow.addColorStop(
          0,
          `rgba(${accentRgb.join(",")},${(0.26 - progress * 0.12).toFixed(3)})`,
        );
        floorGlow.addColorStop(0.65, "rgba(34, 96, 134, 0.08)");
        floorGlow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.save();
        ctx.translate(0, r * 1.12);
        ctx.scale(1, floorRy / floorRx);
        ctx.fillStyle = floorGlow;
        ctx.beginPath();
        ctx.arc(0, 0, floorRx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.strokeStyle = `rgba(${accentRgb.join(",")},0.22)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(0, r * 1.12, floorRx, floorRy, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Shockwave caustic flash ring when fractured
        if (progress > 0.02) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          const burstR = r * (0.35 + progress * 1.25);
          ctx.strokeStyle = `rgba(${accentRgb.join(",")},${((1 - progress * 0.65) * 0.28).toFixed(3)})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(0, 0, burstR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // 24 non-overlapping crystalline facets with directional specular lighting
        for (let i = 0; i < pieces.length; i++) {
          const p = pieces[i],
            center = p.reduce((v, q) => [v[0] + q[0] / 3, v[1] + q[1] / 3], [0, 0]),
            a = Math.atan2(center[1], center[0]) + Math.sin(i * 3.1 + seed) * 0.28,
            dist = progress * (0.52 + (i % 5) * 0.145),
            rot = progress * Math.sin(i * 7.3 + seed) * 0.85;

          // Directional lighting based on facet centroid orientation (light from top-left)
          const len = Math.hypot(center[0], center[1]) || 1,
            nx = center[0] / len,
            ny = center[1] / len,
            lambert = Math.max(0, Math.min(1, (-nx * 0.66 - ny * 0.75) * 0.52 + 0.54)),
            isCore = i % 3 !== 2;

          ctx.save();
          ctx.translate(Math.cos(a) * dist * r, Math.sin(a) * dist * r);
          ctx.rotate(rot);

          ctx.beginPath();
          p.forEach((q, j) =>
            j ? ctx.lineTo(q[0] * r, q[1] * r) : ctx.moveTo(q[0] * r, q[1] * r),
          );
          ctx.closePath();

          // Translucent multi-stop diamond/ice gradient
          const g = ctx.createLinearGradient(
            p[0][0] * r,
            p[0][1] * r,
            p[2][0] * r + r * 0.25,
            p[2][1] * r + r * 0.25,
          );
          const topL = Math.round(54 + lambert * 38 + (isCore ? 6 : 0)),
            midL = Math.round(30 + lambert * 32),
            botL = Math.round(14 + lambert * 18);
          g.addColorStop(0, `hsla(195, 86%, ${topL}%, 0.92)`);
          g.addColorStop(0.52, `hsla(204, 62%, ${midL}%, 0.86)`);
          g.addColorStop(1, `hsla(212, 54%, ${botL}%, 0.94)`);
          ctx.fillStyle = g;
          ctx.fill();

          // Internal caustic specular sheen clipped to each facet
          ctx.save();
          ctx.clip();
          const sheen = ctx.createLinearGradient(-r * 0.6, -r * 0.9, r * 0.7, r * 0.8);
          sheen.addColorStop(0, "rgba(255,255,255,0.42)");
          sheen.addColorStop(0.32, `rgba(${accentRgb.join(",")},0.16)`);
          sheen.addColorStop(0.6, "rgba(255,255,255,0)");
          sheen.addColorStop(1, "rgba(255,255,255,0.14)");
          ctx.fillStyle = sheen;
          ctx.fillRect(-r, -r, r * 2, r * 2);
          ctx.restore();

          // Razor-sharp crystalline facet edges
          ctx.strokeStyle =
            lambert > 0.65
              ? "rgba(244, 252, 255, 0.88)"
              : i % 3 === 0
                ? accent
                : "rgba(165, 230, 255, 0.56)";
          ctx.lineWidth = lambert > 0.65 ? 1.15 : 0.75;
          ctx.stroke();

          ctx.restore();
        }

        // Central diamond glint highlight when crystal is intact or partially intact
        if (progress < 0.7) {
          const glintAlpha = (1 - progress / 0.7) * 0.85;
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          const gl = ctx.createRadialGradient(0, -r * 0.14, 0, 0, -r * 0.14, r * 0.48);
          gl.addColorStop(0, `rgba(255,255,255,${(glintAlpha * 0.62).toFixed(3)})`);
          gl.addColorStop(0.4, `rgba(${accentRgb.join(",")},${(glintAlpha * 0.24).toFixed(3)})`);
          gl.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = gl;
          ctx.beginPath();
          ctx.arc(0, -r * 0.14, r * 0.48, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Glittering suspended ice-shard micro-sparkles when fractured
        for (let i = 0; i < 36; i++) {
          const ang = i * 2.39996 + seed * 0.5,
            rad = r * (0.28 + ((i * 37) % 100) / 100) * (0.85 + progress * 0.9),
            sx = Math.cos(ang) * rad,
            sy = Math.sin(ang) * rad,
            sz = (i % 4 === 0 ? 2.4 : 1.3) * (0.45 + progress * 0.85);
          ctx.fillStyle = i % 3 === 0 ? "#ffffff" : accent;
          ctx.globalAlpha = 0.22 + progress * 0.55;
          ctx.beginPath();
          ctx.moveTo(sx, sy - sz);
          ctx.lineTo(sx + sz * 0.6, sy);
          ctx.lineTo(sx, sy + sz);
          ctx.lineTo(sx - sz * 0.6, sy);
          ctx.closePath();
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }
      function resize() {
        const r = canvas.getBoundingClientRect();
        w = r.width;
        h = r.height;
        dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }
      new ResizeObserver(resize).observe(canvas);
      function state() {
        document.querySelector("#integrity").textContent = Math.round(100 * (1 - target));
        [...meter.children].forEach(
          (e, i) => (e.style.opacity = i / 12 < 1 - target ? ".95" : ".14"),
        );
      }
      function animate(now) {
        const t = Math.min((now - start) / 850, 1),
          ease = 1 - Math.pow(1 - t, 3);
        progress = origin + (target - origin) * ease;
        draw();
        if (t < 1 && !document.hidden) raf = requestAnimationFrame(animate);
        else raf = 0;
      }
      function move(next) {
        cancelAnimationFrame(raf);
        origin = progress;
        target = next;
        state();
        if (motion.matches || document.hidden) {
          progress = target;
          draw();
          raf = 0;
        } else {
          start = performance.now();
          raf = requestAnimationFrame(animate);
        }
      }
      function fracture() {
        impact++;
        seed = impact * 1.7;
        move(Math.min(1, target + 0.15 + Number(range.value) / 150));
        status.textContent = en
          ? `Impact ${impact} · ${Math.round((1 - target) * 100)}% intact`
          : `第 ${impact} 次冲击 · 完整度 ${Math.round((1 - target) * 100)}%`;
      }
      function freeze() {
        move(0);
        impact = 0;
        status.textContent = en
          ? "Crystal refrozen. Ready for a new impact."
          : "冰晶已重新凝结，可以再次冲击。";
      }
      canvas.addEventListener("click", fracture);
      canvas.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          fracture();
        }
      });
      document.querySelector("#break").onclick = fracture;
      document.querySelector("#freeze").onclick = freeze;
      range.oninput = () => (document.querySelector("#forceValue").textContent = range.value + "%");
      range.oninput();
      status.textContent = en ? "Crystal frozen. Ready for impact." : "冰晶已凝结";
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          cancelAnimationFrame(raf);
          progress = target;
          draw();
        }
      });
      motion.addEventListener("change", () => {
        if (motion.matches) {
          cancelAnimationFrame(raf);
          progress = target;
          draw();
        }
      });
    </script>
  </body>
