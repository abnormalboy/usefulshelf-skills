<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A collection of perspectives.</title>
    <style>
      :root {
        --accent: #d6ef82;
        --ink: #f5f2ea;
        --muted: #a1a89d;
        --bg: #101311;
        --surface: #181c19;
        --line: rgba(255, 255, 255, 0.1);
        --stage-glow: rgba(215, 114, 68, 0.24);
        --cw: 256px;
        --ch: 350px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 70% 45% at 50% 0%, rgba(255, 252, 240, 0.065), transparent 68%),
          radial-gradient(circle at 50% 62%, rgba(255, 255, 255, 0.025), transparent 55%);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Helvetica Neue", Arial,
          sans-serif;
        overflow-x: clip;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      .stage:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 5px;
      }
      .shell {
        max-width: 1400px;
        margin: auto;
      }
      header {
        padding: 18px 36px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        font:
          500 11px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.12em;
        color: var(--muted);
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-weight: 700;
        color: var(--ink);
      }
      .wordmark::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent);
      }
      .intro {
        text-align: center;
        padding: 22px 24px 0;
      }
      .intro span {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--line));
        background: color-mix(in srgb, var(--accent) 8%, rgba(255, 255, 255, 0.02));
        font:
          500 10.5px/1.3 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: var(--accent);
        letter-spacing: 0.14em;
      }
      h1 {
        font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", Georgia, serif;
        font-size: clamp(30px, 3.6vw, 46px);
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1.1;
        margin: 12px 0 8px;
        text-wrap: balance;
      }
      :lang(zh) h1 {
        font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.2;
        word-break: keep-all;
      }
      .intro p {
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.6;
        margin: 0;
      }
      .stage {
        height: 432px;
        perspective: 1120px;
        position: relative;
        overflow: hidden;
        touch-action: pan-y;
        cursor: grab;
        outline-offset: -8px !important;
      }
      .stage::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 6%;
        width: 520px;
        height: 220px;
        transform: translateX(-50%);
        background: radial-gradient(
          ellipse at center,
          rgba(255, 252, 244, 0.09) 0%,
          rgba(255, 252, 244, 0) 70%
        );
        pointer-events: none;
      }
      .stage::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 10px;
        width: min(560px, 84%);
        height: 68px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(ellipse at center, var(--stage-glow) 0%, rgba(0, 0, 0, 0) 72%);
        filter: blur(14px);
        pointer-events: none;
        transition: background 420ms ease;
      }
      .stage:active {
        cursor: grabbing;
      }
      .rail {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      .card {
        position: absolute;
        left: 50%;
        top: 48%;
        width: var(--cw);
        height: var(--ch);
        margin: calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2);
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        background: #1d201d;
        overflow: hidden;
        transform-style: preserve-3d;
        box-shadow:
          0 26px 48px rgba(0, 0, 0, 0.56),
          0 6px 14px rgba(0, 0, 0, 0.34);
        will-change: transform;
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.22) 0%,
          rgba(255, 255, 255, 0.04) 28%,
          rgba(255, 255, 255, 0) 56%
        );
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.36);
        pointer-events: none;
      }
      .card svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .card .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 15px 16px;
        text-align: left;
        background: rgba(16, 19, 17, 0.84);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
      }
      .caption small {
        display: block;
        font:
          500 9.5px/1.3 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.1em;
        color: #c5cabd;
        margin-bottom: 4px;
        text-transform: uppercase;
      }
      .caption strong {
        font-size: 14.5px;
        font-weight: 550;
        color: #f8f6f0;
      }
      .caption .arrow {
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid color-mix(in srgb, var(--accent) 42%, rgba(255, 255, 255, 0.15));
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        font-size: 14px;
        color: var(--accent);
        flex-shrink: 0;
      }
      .card[aria-current="true"] {
        border-color: rgba(255, 255, 255, 0.38);
        box-shadow:
          0 34px 66px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(255, 255, 255, 0.18),
          0 0 38px var(--stage-glow);
      }
      .under {
        max-width: 860px;
        padding: 4px 30px 18px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 20px;
        align-items: center;
      }
      .counter {
        font:
          500 11.5px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .counter strong {
        color: var(--ink);
        font-weight: 600;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .control {
        height: 38px;
        min-width: 38px;
        padding: 0 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: linear-gradient(180deg, #252b26 0%, #191e1a 100%);
        box-shadow:
          0 2px 6px rgba(0, 0, 0, 0.32),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink);
        transition:
          background 160ms ease,
          border-color 160ms ease,
          transform 120ms ease;
      }
      @media (hover: hover) {
        .control:hover:not(:disabled) {
          border-color: color-mix(in srgb, var(--accent) 55%, rgba(255, 255, 255, 0.2));
          background: linear-gradient(180deg, #2e362f 0%, #1f2621 100%);
        }
      }
      .control:active:not(:disabled) {
        transform: scale(0.96);
      }
      .control:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .motion {
        min-width: 78px;
      }
      .dots {
        display: flex;
        justify-content: end;
        align-items: center;
        gap: 4px;
      }
      .dot {
        width: 24px;
        height: 28px;
        border: 0;
        padding: 0;
        background: transparent;
        position: relative;
      }
      .dot:after {
        content: "";
        position: absolute;
        width: 6px;
        height: 6px;
        background: #676f62;
        border-radius: 999px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        transition:
          width 220ms ease,
          background-color 180ms ease;
      }
      .dot[aria-pressed="true"]:after {
        background: var(--accent);
        width: 18px;
        height: 6px;
        box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 55%, transparent);
      }
      .readout {
        border-top: 1px solid var(--line);
        padding: 16px 36px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
      }
      .readout strong {
        color: var(--ink);
        font-weight: 500;
      }
      .readout .hint {
        font:
          500 10px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        text-align: right;
      }
      dialog {
        width: min(468px, 92vw);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 18px;
        padding: 26px;
        background: linear-gradient(180deg, #1d231d 0%, #131714 100%);
        color: var(--ink);
        box-shadow: 0 36px 80px rgba(0, 0, 0, 0.72);
      }
      dialog::backdrop {
        background: rgba(6, 9, 7, 0.76);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dialog-head span {
        font:
          500 10.5px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: var(--accent);
        letter-spacing: 0.14em;
      }
      .dialog-head button {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.04);
        font-size: 18px;
        display: grid;
        place-items: center;
      }
      .dialog-art {
        height: 236px;
        margin: 18px 0 20px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .dialog-art svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      dialog h2 {
        font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", Georgia, serif;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
      }
      dialog p {
        color: #c2cabd;
        line-height: 1.7;
        font-size: 14px;
        margin: 0;
      }
      @media (max-width: 600px) {
        :root {
          --cw: 208px;
          --ch: 296px;
        }
        header {
          padding: 16px 18px;
          font-size: 10px;
        }
        .intro {
          padding: 20px 20px 0;
        }
        h1 {
          font-size: 30px;
        }
        :lang(zh) h1 {
          font-size: clamp(24px, 7vw, 30px);
        }
        .intro p {
          font-size: 12.5px;
        }
        .stage {
          height: 368px;
          perspective: 820px;
        }
        .under {
          padding: 4px 18px 18px;
          grid-template-columns: 1fr auto;
          gap: 14px;
        }
        .dots {
          grid-column: 1/-1;
          justify-content: center;
        }
        .readout {
          padding: 16px 18px;
          font-size: 11px;
          gap: 14px;
        }
        .readout .hint {
          font-size: 9px;
          max-width: 122px;
        }
        .caption strong {
          font-size: 13px;
        }
        .card .caption {
          padding: 12px 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body data-speed="0.8">
    <div class="shell">
      <header>
        <span class="wordmark">FRAME / 07</span>
        <span>SELECTED VISUAL STUDIES — 2026</span>
      </header>
      <div class="intro">
        <span>CHANGE YOUR POINT OF VIEW</span>
        <h1>A collection of perspectives.</h1>
        <p>Independent studies in form, color and movement.</p>
      </div>
      <section
        id="stage"
        class="stage"
        tabindex="0"
        aria-roledescription="carousel"
        aria-label="Visual study collection. Use left and right arrow keys to change slides."
      >
        <div class="rail" id="rail"></div>
      </section>
      <div class="under">
        <div class="counter">
          <strong id="count">01</strong>
          / 07 STUDIES
        </div>
        <div class="controls">
          <button class="control" id="prev" aria-label="Previous study">←</button>
          <button class="control motion" id="motion" aria-pressed="false">Pause</button>
          <button class="control" id="next" aria-label="Next study">→</button>
        </div>
        <div class="dots" id="dots" aria-label="Choose a study"></div>
      </div>
      <div class="readout">
        <span id="readout" role="status" aria-live="polite">
          <strong>Folded landscape</strong>
          / Editorial composition
        </span>
        <span class="hint">
          DRAG TO BROWSE
          <br />
          SELECT THE CENTER CARD TO EXPLORE
        </span>
      </div>
    </div>
    <dialog id="detail" aria-labelledby="detail-title">
      <div class="dialog-head">
        <span>COLLECTION NOTES</span>
        <button id="close" aria-label="Close study">×</button>
      </div>
      <div id="detail-art" class="dialog-art" aria-hidden="true"></div>
      <h2 id="detail-title"></h2>
      <p id="detail-description"></p>
    </dialog>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {
          "/ 07 STUDIES": "/ 07 组练习",
          "/ Editorial composition": "/ 编辑构图",
          "A collection of perspectives.": "把不同的视角，放在一起。",
          "A monumental arch turns simple negative space into an architectural subject.":
            "一座拱门，让简单留白成为建筑般的主题。",
          "A set of interlocking disks creates movement without relying on a literal image.":
            "交错圆盘不用具象图片，也能让画面流动。",
          "A single letter becomes an architectural form through repetition and scale.":
            "一个字母经过重复和缩放，变成建筑般的形状。",
          "A stepped horizon and an oversized sun make a landscape from just three colors.":
            "阶梯地平线和大太阳，只用三种颜色组成景观。",
          "Abstract landscape": "抽象景观",
          "Angular planes intersect across a warm field, with a small solar accent anchoring the composition.":
            "折面交叠在温暖画面上，一枚小小太阳稳定构图。",
          "Between the lines": "字里行间",
          "CHANGE YOUR POINT OF VIEW": "换一个角度看世界",
          "COLLECTION NOTES": "收藏说明",
          "Choose a study": "选择练习",
          "Chromatic experiment": "色彩实验",
          "Close study": "关闭练习",
          "Color in motion": "颜色在移动",
          "DRAG TO BROWSE": "拖动浏览",
          "Editorial composition": "编辑构图",
          "Folded landscape": "折叠景观",
          "Graphic rhythm": "图形节奏",
          Home: "首页",
          "Independent studies in form, color and movement.": "关于形态、颜色与动作的独立练习。",
          "Layered blocks and warm neutral tones suggest a room through the relationship of shapes.":
            "层叠色块与暖中性色，通过形状关系暗示一个房间。",
          List: "列表",
          "Material language": "材质语言",
          New: "新建",
          "New horizons": "新的地平线",
          "Next study": "下一个练习",
          Pause: "暂停",
          Play: "播放",
          "Previous study": "上一个练习",
          "Repeated marks build density and then dissolve into a small moment of silence.":
            "重复记号逐渐密集，又融成片刻安静。",
          "SELECT THE CENTER CARD TO EXPLORE": "选择中间卡片查看",
          "SELECTED VISUAL STUDIES — 2026": "精选视觉练习 — 2026",
          Select: "选择",
          Show: "显示",
          "Signal & noise": "信号与杂音",
          "Soft architecture": "柔和建筑",
          "Spatial study": "空间练习",
          "The quiet room": "安静房间",
          "This is an original geometric study for demonstration.":
            "这是一组用于演示的原创几何练习。",
          "Typography study": "字体研究",
          "Visual study collection. Use left and right arrow keys to change slides.":
            "视觉练习集，可用左右方向键切换。",
          name: "名称",
          star: "星星",
        };
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
