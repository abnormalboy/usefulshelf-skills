<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A collection of perspectives.</title>
    <style>
      :root {
        --accent: #d6ef82;
        --ink: #f4f2eb;
        --muted: #92948c;
        --bg: #161916;
        --line: #343a32;
        --cw: 260px;
        --ch: 360px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      .stage:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 6px;
      }
      .shell {
        max-width: 1400px;
        margin: auto;
      }
      header {
        padding: 26px 36px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 15px;
        font: 11px monospace;
        letter-spacing: 1px;
      }
      .wordmark {
        font-weight: 700;
      }
      .intro {
        text-align: center;
        padding: 40px 24px 0;
      }
      .intro span {
        font: 10px monospace;
        color: var(--accent);
        letter-spacing: 2px;
      }
      h1 {
        font-size: clamp(28px, 4vw, 44px);
        font-weight: 400;
        letter-spacing: -1.5px;
        margin: 15px 0 12px;
        text-wrap: balance;
      }
      :lang(zh) h1 {
        letter-spacing: -0.02em;
        line-height: 1.2;
        word-break: keep-all;
      }
      .intro p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        margin: 0;
      }
      .stage {
        height: 455px;
        perspective: 1100px;
        position: relative;
        overflow: hidden;
        touch-action: pan-y;
        cursor: grab;
        outline-offset: -8px !important;
      }
      .stage:active {
        cursor: grabbing;
      }
      .rail {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      .card {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--cw);
        height: var(--ch);
        margin: calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2);
        padding: 0;
        border: 1px solid #ffffff22;
        border-radius: 10px;
        background: #222;
        overflow: hidden;
        transform-style: preserve-3d;
        box-shadow: 0 22px 35px #0005;
        will-change: transform;
      }
      .card svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .card .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 17px;
        text-align: left;
        background: #141915e8;
        display: flex;
        justify-content: space-between;
        align-items: end;
        border-top: 1px solid #ffffff14;
      }
      .caption small {
        display: block;
        font-size: 9px;
        letter-spacing: 1px;
        color: #b5b9ad;
        margin-bottom: 6px;
        text-transform: uppercase;
      }
      .caption strong {
        font-size: 14px;
        font-weight: 500;
      }
      .caption .arrow {
        font-size: 20px;
        color: var(--accent);
      }
      .card[aria-current="true"] {
        border-color: #ffffff55;
      }
      .under {
        max-width: 850px;
        padding: 0 30px 28px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 20px;
        align-items: center;
      }
      .counter {
        font: 11px monospace;
        color: var(--muted);
      }
      .counter strong {
        color: var(--ink);
        font-weight: 400;
      }
      .controls {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .control {
        height: 44px;
        min-width: 44px;
        padding: 0 15px;
        border: 1px solid #52584c;
        border-radius: 30px;
        background: transparent;
        font-size: 12px;
      }
      .control:hover {
        background: #2a3127;
      }
      .motion {
        min-width: 72px;
      }
      .dots {
        display: flex;
        justify-content: end;
        gap: 8px;
      }
      .dot {
        width: 20px;
        height: 28px;
        border: 0;
        padding: 0;
        background: transparent;
        position: relative;
      }
      .dot:after {
        content: "";
        position: absolute;
        width: 5px;
        height: 5px;
        background: #747a6b;
        border-radius: 50%;
        left: 7px;
        top: 11px;
      }
      .dot[aria-pressed="true"]:after {
        background: var(--accent);
        width: 7px;
        height: 7px;
        left: 6px;
        top: 10px;
      }
      .readout {
        border-top: 1px solid var(--line);
        padding: 20px 36px;
        display: flex;
        justify-content: space-between;
        gap: 24px;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.7;
      }
      .readout strong {
        color: var(--ink);
        font-weight: 400;
      }
      .readout .hint {
        font: 10px/1.7 monospace;
        text-align: right;
      }
      dialog {
        width: min(460px, 90vw);
        border: 1px solid #59644e;
        border-radius: 14px;
        padding: 28px;
        background: #20271e;
        color: var(--ink);
      }
      dialog::backdrop {
        background: #080b09bc;
        backdrop-filter: blur(8px);
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dialog-head span {
        font: 10px monospace;
        color: var(--accent);
        letter-spacing: 1px;
      }
      .dialog-head button {
        width: 44px;
        height: 44px;
        border: 1px solid #65715c;
        border-radius: 50%;
        background: none;
      }
      .dialog-art {
        height: 230px;
        margin: 20px 0;
      }
      .dialog-art svg {
        width: 100%;
        height: 100%;
        border-radius: 8px;
      }
      dialog h2 {
        font-size: 30px;
        font-weight: 400;
        letter-spacing: -1px;
      }
      dialog p {
        color: #b7bfae;
        line-height: 1.7;
        font-size: 14px;
      }
      @media (max-width: 600px) {
        :root {
          --cw: 210px;
          --ch: 304px;
        }
        header {
          padding: 22px 20px;
          font-size: 10px;
        }
        .intro {
          padding: 33px 22px 0;
        }
        h1 {
          font-size: 32px;
        }
        :lang(zh) h1 {
          font-size: clamp(24px, 7.2vw, 30px);
        }
        .intro p {
          font-size: 12px;
        }
        .stage {
          height: 394px;
          perspective: 800px;
        }
        .under {
          padding: 0 20px 24px;
          grid-template-columns: 1fr auto;
          gap: 16px;
        }
        .dots {
          grid-column: 1/-1;
          justify-content: center;
        }
        .readout {
          padding: 18px 20px;
          font-size: 10px;
          gap: 14px;
        }
        .readout .hint {
          font-size: 9px;
          max-width: 110px;
        }
        .caption strong {
          font-size: 13px;
        }
        .card .caption {
          padding: 15px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body data-speed="0.8">
    <div class="shell">
      <header>
        <span class="wordmark">FRAME / 07</span>
        <span>SELECTED VISUAL STUDIES — 2026</span>
      </header>
      <div class="intro">
        <span>CHANGE YOUR POINT OF VIEW</span>
        <h1>A collection of perspectives.</h1>
        <p>Independent studies in form, color and movement.</p>
      </div>
      <section
        id="stage"
        class="stage"
        tabindex="0"
        aria-roledescription="carousel"
        aria-label="Visual study collection. Use left and right arrow keys to change slides."
      >
        <div class="rail" id="rail"></div>
      </section>
      <div class="under">
        <div class="counter">
          <strong id="count">01</strong>
          / 07 STUDIES
        </div>
        <div class="controls">
          <button class="control" id="prev" aria-label="Previous study">←</button>
          <button class="control motion" id="motion" aria-pressed="false">Pause</button>
          <button class="control" id="next" aria-label="Next study">→</button>
        </div>
        <div class="dots" id="dots" aria-label="Choose a study"></div>
      </div>
      <div class="readout">
        <span id="readout" role="status" aria-live="polite">
          <strong>Folded landscape</strong>
          / Editorial composition
        </span>
        <span class="hint">
          DRAG TO BROWSE
          <br />
          SELECT THE CENTER CARD TO EXPLORE
        </span>
      </div>
    </div>
    <dialog id="detail" aria-labelledby="detail-title">
      <div class="dialog-head">
        <span>COLLECTION NOTES</span>
        <button id="close" aria-label="Close study">×</button>
      </div>
      <div id="detail-art" class="dialog-art" aria-hidden="true"></div>
      <h2 id="detail-title"></h2>
      <p id="detail-description"></p>
    </dialog>
    <!-- usefulshelf-runtime:start -->
    <script>
      // Inlined into each downloadable template: no sibling runtime is required.
      (() => {
        "use strict";
        const dictionary = {
          "/ 07 STUDIES": "/ 07 组练习",
          "/ Editorial composition": "/ 编辑构图",
          "A collection of perspectives.": "把不同的视角，放在一起。",
          "A monumental arch turns simple negative space into an architectural subject.":
            "一座拱门，让简单留白成为建筑般的主题。",
          "A set of interlocking disks creates movement without relying on a literal image.":
            "交错圆盘不用具象图片，也能让画面流动。",
          "A single letter becomes an architectural form through repetition and scale.":
            "一个字母经过重复和缩放，变成建筑般的形状。",
          "A stepped horizon and an oversized sun make a landscape from just three colors.":
            "阶梯地平线和大太阳，只用三种颜色组成景观。",
          "Abstract landscape": "抽象景观",
          "Angular planes intersect across a warm field, with a small solar accent anchoring the composition.":
            "折面交叠在温暖画面上，一枚小小太阳稳定构图。",
          "Between the lines": "字里行间",
          "CHANGE YOUR POINT OF VIEW": "换一个角度看世界",
          "COLLECTION NOTES": "收藏说明",
          "Choose a study": "选择练习",
          "Chromatic experiment": "色彩实验",
          "Close study": "关闭练习",
          "Color in motion": "颜色在移动",
          "DRAG TO BROWSE": "拖动浏览",
          "Editorial composition": "编辑构图",
          "Folded landscape": "折叠景观",
          "Graphic rhythm": "图形节奏",
          Home: "首页",
          "Independent studies in form, color and movement.": "关于形态、颜色与动作的独立练习。",
          "Layered blocks and warm neutral tones suggest a room through the relationship of shapes.":
            "层叠色块与暖中性色，通过形状关系暗示一个房间。",
          List: "列表",
          "Material language": "材质语言",
          New: "新建",
          "New horizons": "新的地平线",
          "Next study": "下一个练习",
          Pause: "暂停",
          Play: "播放",
          "Previous study": "上一个练习",
          "Repeated marks build density and then dissolve into a small moment of silence.":
            "重复记号逐渐密集，又融成片刻安静。",
          "SELECT THE CENTER CARD TO EXPLORE": "选择中间卡片查看",
          "SELECTED VISUAL STUDIES — 2026": "精选视觉练习 — 2026",
          Select: "选择",
          Show: "显示",
          "Signal & noise": "信号与杂音",
          "Soft architecture": "柔和建筑",
          "Spatial study": "空间练习",
          "The quiet room": "安静房间",
          "This is an original geometric study for demonstration.":
            "这是一组用于演示的原创几何练习。",
          "Typography study": "字体研究",
          "Visual study collection. Use left and right arrow keys to change slides.":
            "视觉练习集，可用左右方向键切换。",
          name: "名称",
          star: "星星",
        };
        const normalize = (value) => value.replace(/\s+/g, " ").trim();
        const normalizeLang = (value) => {
          if (!value) return "";
          const lower = String(value).trim().toLowerCase();
          if (lower === "zh" || lower.startsWith("zh-")) return "zh";
          if (lower === "en" || lower.startsWith("en-")) return "en";
          return "";
        };
        const readQueryLang = () => {
          try {
            return normalizeLang(new URLSearchParams(location.search).get("lang"));
          } catch {
            return "";
          }
        };
        const resolveLang = () =>
          readQueryLang() ||
          normalizeLang(document.documentElement.dataset.skillLang) ||
          (normalizeLang(document.documentElement.lang) === "zh" ? "zh" : "en");

        let currentLang = resolveLang();
        let chinese = currentLang === "zh";
        document.documentElement.lang = chinese ? "zh-CN" : "en";

        const actionZh = { receive: "收款", send: "发送", swap: "兑换" };
        const flavorZh = {
          vanilla: "香草",
          berry: "莓果",
          matcha: "抹茶",
          cocoa: "可可",
          citrus: "柑橘",
          peach: "蜜桃",
        };
        const localizedAttrs = ["aria-label", "placeholder", "title", "data-hint"];
        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
          applyLanguage(resolved);
        };

        function boot() {
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;
          if (chinese) applyLanguage("zh");

          let langObserver;
          if (typeof MutationObserver === "function") {
            langObserver = new MutationObserver(() => {
              const next =
                normalizeLang(document.documentElement.dataset.skillLang) || resolveLang();
              if (next !== currentLang) applyLanguage(next);
            });
            langObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skill-lang"],
            });
            window.addEventListener("pagehide", () => langObserver.disconnect(), { once: true });
          }

          if (parent === window) return;
          // Freeze viewport-based demo heights before measuring, avoiding vh feedback
          // when the parent grows the iframe. Intentional inner demo scrollers remain.
          const initialHeight = Math.max(360, Math.min(760, innerHeight));
          function fixRules(rules) {
            for (const rule of rules) {
              if (rule.cssRules) fixRules(rule.cssRules);
              if (!rule.style) continue;
              if (/v[hbs]/.test(rule.style.minHeight))
                rule.style.setProperty("min-height", "0", "important");
              if (/v[hbs]/.test(rule.style.height))
                rule.style.setProperty("height", `${initialHeight}px`, "important");
            }
          }
          for (const sheet of document.styleSheets) {
            try {
              fixRules(sheet.cssRules);
            } catch {
              /* Same-file styles are sufficient. */
            }
          }
          for (const element of [document.documentElement, document.body]) {
            element.style.setProperty("height", "auto", "important");
            element.style.setProperty("min-height", "0", "important");
          }
          document.documentElement.style.overflowX = "clip";
          let frame = 0,
            lastHeight = 0;
          const measure = () => {
            frame = 0;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height),
            );
            if (height > 0 && height <= 20000 && height !== lastHeight) {
              lastHeight = height;
              parent.postMessage({ type: "usefulshelf:resize", height }, "*");
            }
          };
          const schedule = () => {
            if (!frame) frame = requestAnimationFrame(measure);
          };
          const observer = new ResizeObserver(schedule);
          observer.observe(document.body);
          window.addEventListener("resize", schedule);
          const onMessage = (event) => {
            if (event.source === parent && event.data?.type === "usefulshelf:measure") {
              // The first resize may precede parent hydration. A measurement request
              // must acknowledge even an unchanged height, so that message is recovered.
              lastHeight = 0;
              schedule();
            }
          };
          window.addEventListener("message", onMessage);
          document.fonts?.ready.then(schedule);
          window.addEventListener(
            "pagehide",
            () => {
              observer.disconnect();
              cancelAnimationFrame(frame);
              window.removeEventListener("resize", schedule);
              window.removeEventListener("message", onMessage);
            },
            { once: true },
          );
          schedule();
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        else boot();
