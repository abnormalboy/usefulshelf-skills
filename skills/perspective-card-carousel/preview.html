<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>A collection of perspectives.</title>
    <style>
      :root {
        --accent: #d6ef82;
        --ink: #f4f2eb;
        --muted: #92948c;
        --bg: #161916;
        --line: #343a32;
        --cw: 260px;
        --ch: 360px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      .stage:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 6px;
      }
      .shell {
        max-width: 1400px;
        margin: auto;
      }
      header {
        padding: 26px 36px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 15px;
        font: 11px monospace;
        letter-spacing: 1px;
      }
      .wordmark {
        font-weight: 700;
      }
      .intro {
        text-align: center;
        padding: 40px 24px 0;
      }
      .intro span {
        font: 10px monospace;
        color: var(--accent);
        letter-spacing: 2px;
      }
      h1 {
        font-size: clamp(28px, 4vw, 44px);
        font-weight: 400;
        letter-spacing: -1.5px;
        margin: 15px 0 12px;
      }
      .intro p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        margin: 0;
      }
      .stage {
        height: 455px;
        perspective: 1100px;
        position: relative;
        overflow: hidden;
        touch-action: pan-y;
        cursor: grab;
        outline-offset: -8px !important;
      }
      .stage:active {
        cursor: grabbing;
      }
      .rail {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      .card {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--cw);
        height: var(--ch);
        margin: calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2);
        padding: 0;
        border: 1px solid #ffffff22;
        border-radius: 10px;
        background: #222;
        overflow: hidden;
        transform-style: preserve-3d;
        box-shadow: 0 22px 35px #0005;
        will-change: transform;
      }
      .card svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .card .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 17px;
        text-align: left;
        background: #141915e8;
        display: flex;
        justify-content: space-between;
        align-items: end;
        border-top: 1px solid #ffffff14;
      }
      .caption small {
        display: block;
        font-size: 9px;
        letter-spacing: 1px;
        color: #b5b9ad;
        margin-bottom: 6px;
        text-transform: uppercase;
      }
      .caption strong {
        font-size: 14px;
        font-weight: 500;
      }
      .caption .arrow {
        font-size: 20px;
        color: var(--accent);
      }
      .card[aria-current="true"] {
        border-color: #ffffff55;
      }
      .under {
        max-width: 850px;
        padding: 0 30px 28px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 20px;
        align-items: center;
      }
      .counter {
        font: 11px monospace;
        color: var(--muted);
      }
      .counter strong {
        color: var(--ink);
        font-weight: 400;
      }
      .controls {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .control {
        height: 44px;
        min-width: 44px;
        padding: 0 15px;
        border: 1px solid #52584c;
        border-radius: 30px;
        background: transparent;
        font-size: 12px;
      }
      .control:hover {
        background: #2a3127;
      }
      .motion {
        min-width: 72px;
      }
      .dots {
        display: flex;
        justify-content: end;
        gap: 8px;
      }
      .dot {
        width: 20px;
        height: 28px;
        border: 0;
        padding: 0;
        background: transparent;
        position: relative;
      }
      .dot:after {
        content: "";
        position: absolute;
        width: 5px;
        height: 5px;
        background: #747a6b;
        border-radius: 50%;
        left: 7px;
        top: 11px;
      }
      .dot[aria-pressed="true"]:after {
        background: var(--accent);
        width: 7px;
        height: 7px;
        left: 6px;
        top: 10px;
      }
      .readout {
        border-top: 1px solid var(--line);
        padding: 20px 36px;
        display: flex;
        justify-content: space-between;
        gap: 24px;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.7;
      }
      .readout strong {
        color: var(--ink);
        font-weight: 400;
      }
      .readout .hint {
        font: 10px/1.7 monospace;
        text-align: right;
      }
      dialog {
        width: min(460px, 90vw);
        border: 1px solid #59644e;
        border-radius: 14px;
        padding: 28px;
        background: #20271e;
        color: var(--ink);
      }
      dialog::backdrop {
        background: #080b09bc;
        backdrop-filter: blur(8px);
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dialog-head span {
        font: 10px monospace;
        color: var(--accent);
        letter-spacing: 1px;
      }
      .dialog-head button {
        width: 44px;
        height: 44px;
        border: 1px solid #65715c;
        border-radius: 50%;
        background: none;
      }
      .dialog-art {
        height: 230px;
        margin: 20px 0;
      }
      .dialog-art svg {
        width: 100%;
        height: 100%;
        border-radius: 8px;
      }
      dialog h2 {
        font-size: 30px;
        font-weight: 400;
        letter-spacing: -1px;
      }
      dialog p {
        color: #b7bfae;
        line-height: 1.7;
        font-size: 14px;
      }
      @media (max-width: 600px) {
        :root {
          --cw: 210px;
          --ch: 304px;
        }
        header {
          padding: 22px 20px;
          font-size: 10px;
        }
        .intro {
          padding: 33px 22px 0;
        }
        h1 {
          font-size: 32px;
        }
        .intro p {
          font-size: 12px;
        }
        .stage {
          height: 394px;
          perspective: 800px;
        }
        .under {
          padding: 0 20px 24px;
          grid-template-columns: 1fr auto;
          gap: 16px;
        }
        .dots {
          grid-column: 1/-1;
          justify-content: center;
        }
        .readout {
          padding: 18px 20px;
          font-size: 10px;
          gap: 14px;
        }
        .readout .hint {
          font-size: 9px;
          max-width: 110px;
        }
        .caption strong {
          font-size: 13px;
        }
        .card .caption {
          padding: 15px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>

      <header>
        <span class="wordmark">FRAME / 07</span>

        <span class="hint">

          SELECT THE CENTER CARD TO EXPLORE
        </span>
      </div>
    </div>
    <dialog id="detail" aria-labelledby="detail-title">

      </div>
      <div id="detail-art" class="dialog-art" aria-hidden="true"></div>
      <h2 id="detail-title"></h2>
      <p id="detail-description"></p>
    </dialog>
