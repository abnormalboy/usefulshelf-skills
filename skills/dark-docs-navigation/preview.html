<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark documentation navigation</title>
    <style>
      :root {
        --bg: #000000;
        --surface: #1a1a1a;
        --hover: #141414;
        --text: #f2f2f2;
        --muted: #9a9a9a;
        --section: #7a7a7a;
        --accent: #e23b3b;
        --border: #222222;
        --tree: #3a3a3a;
        --sidebar-w: 280px;
        --radius: 6px;
        --row-h: 36px;
        --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --duration: 220ms;
        --trans: var(--duration) cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 52px;
        flex-wrap: wrap;
        padding: 0 18px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        text-decoration: none;
        font-weight: 560;
        font-size: 15px;
      }
      .logo {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
      }
      .logo svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      .brand-name {
        color: var(--text);
        font-weight: 600;
      }
      .brand-docs {
        color: var(--muted);
        font-weight: 500;
      }
      .brand-divider {
        width: 1px;
        height: 14px;
        background: #3a3a3a;
        margin: 0 2px;
      }
      .menu-toggle {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--hover);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        margin-left: auto;
        transition:
          background var(--trans),
          border-color var(--trans);
      }
      .menu-toggle:hover {
        background: var(--surface);
        border-color: var(--tree);
      }
      .menu-toggle svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
      }
      .tabs {
        display: flex;
        align-items: stretch;
        gap: 4px;
        height: 52px;
        max-width: 100%;
      }
      .tab {
        position: relative;
        display: flex;
        align-items: center;
        padding: 0 12px;
        height: 100%;
        color: var(--muted);
        font-size: 13.5px;
        font-weight: 500;
        background: transparent;
        border: 0;
        cursor: pointer;
        border-radius: 0;
        transition:
          color var(--trans),
          background var(--trans);
      }
      .tab:hover {
        color: var(--text);
      }
      .tab[aria-selected="true"] {
        color: var(--text);
        background: transparent;
      }
      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 0;
        height: 2px;
        background: var(--accent);
        border-radius: 2px 2px 0 0;
      }
      .layout {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .sidebar {
        width: var(--sidebar-w);
        max-width: 100%;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
        padding: 18px 12px 28px;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: #333 transparent;
      }
      .section {
        margin-bottom: 22px;
      }
      .section-label {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--section);
        font-weight: 560;
        padding: 4px 10px 10px;
        user-select: none;
      }
      .nav {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .nav-item {
        margin: 1px 0;
      }
      .nav-btn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        height: var(--row-h);
        padding: 0 10px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13.5px;
        font-weight: 450;
        cursor: pointer;
        text-align: left;
        transition:
          background var(--trans),
          color var(--trans);
      }
      .nav-btn .ico {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
        display: grid;
        place-items: center;
        opacity: 0.92;
      }
      .nav-btn .ico svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
      }
      .nav-btn .label {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nav-btn .chev {
        width: 14px;
        height: 14px;
        opacity: 0.55;
        flex: 0 0 14px;
        transition:
          transform var(--trans),
          opacity var(--trans);
      }
      .nav-btn .chev svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
      }
      .nav-btn:hover,
      .nav-btn:focus-visible {
        background: var(--hover);
        outline: none;
      }
      .nav-btn[aria-current="page"] {
        background: var(--surface);
        color: var(--text);
        font-weight: 500;
      }
      .nav-btn[aria-expanded="true"] .chev {
        transform: rotate(90deg);
        opacity: 0.85;
      }
      .sub {
        list-style: none;
        margin: 2px 0 6px;
        padding: 0 0 0 0;
        overflow: hidden;
        max-height: 0;
        opacity: 0;
        visibility: hidden;
        transition:
          max-height var(--trans),
          opacity var(--trans);
      }
      .sub.open {
        max-height: 420px;
        opacity: 1;
        visibility: visible;
      }
      .sub-wrap {
        position: relative;
        margin-left: 18px;
        padding-left: 14px;
      }
      .sub-wrap::before {
        content: "";
        position: absolute;
        left: 0;
        top: 4px;
        bottom: 10px;
        width: 0;
        border-left: 1px dashed var(--tree);
      }
      .sub-btn {
        position: relative;
        width: 100%;
        display: flex;
        align-items: center;
        height: 32px;
        padding: 0 10px 0 12px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        font-weight: 450;
        cursor: pointer;
        text-align: left;
        transition:
          background var(--trans),
          color var(--trans);
      }
      .sub-btn::before {
        content: "";
        position: absolute;
        left: -14px;
        top: 50%;
        width: 10px;
        height: 0;
        border-top: 1px dashed var(--tree);
      }
      .sub-btn:hover,
      .sub-btn:focus-visible {
        background: var(--hover);
        color: var(--text);
        outline: none;
      }
      .sub-btn[aria-current="page"] {
        background: var(--surface);
        color: var(--text);
      }
      .main {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        padding: 28px 36px;
        overflow: auto;
        color: var(--muted);
      }
      .main h1 {
        margin: 0 0 10px;
        color: var(--text);
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .main p {
        max-width: 52ch;
        line-height: 1.55;
        font-size: 14.5px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 18px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
      }
      .badge i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent) !important;
        outline-offset: 2px;
      }
      @media (max-width: 720px) {
        .menu-toggle {
          display: inline-flex;
        }
        .sidebar {
          display: none;
          width: 100%;
          border-right: 0;
          border-bottom: 1px solid var(--border);
          max-height: 58vh;
        }
        .sidebar.mobile-open {
          display: block;
        }
        .layout {
          flex-direction: column;
        }
        .main {
          padding: 20px 18px;
        }
        .topbar {
          gap: 8px 10px;
          padding: 6px 12px 0;
        }
        .tabs {
          width: 100%;
          height: 42px;
        }
        .tab {
          padding: 0 8px;
          font-size: 12.5px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>

        const skipSelector =
          "script,style,pre,code,textarea,[contenteditable],[data-skill-custom-text]";
        const originalTextNodes = new WeakMap();
        const originalAttrs = new WeakMap();
        let originalDocumentTitle = null;

        window.__usefulshelfConfigure = (config) => {
          const accent = document.documentElement.dataset.skillAccent;
          return /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(accent || "")
            ? { ...config, accent }
            : config;
        };

        window.__usefulshelfText = (value) => {
          if (!chinese || typeof value !== "string") return value;
          const normalized = normalize(value);
          if (!normalized) return value;
          const exact = dictionary[normalized];
          if (exact !== undefined) return exact;
          return value
            .replace(/What is ([^?]+)\?/g, "什么是 $1？")
            .replace(/(\d+) of 4 memories discovered/g, "已发现 $1 / 4 段回忆")
            .replace(/PLAYING\s+(\d+)\s*\/\s*(\d+)/g, "正在播放 $1 / $2")
            .replace(
              /^(Vanilla|Berry|Matcha|Cocoa|Citrus|Peach)\s*·\s*(\d+)\s+bites?\s+to happiness$/i,
              (_, flavor, count) =>
                `${flavorZh[flavor.toLowerCase()] || flavor} · 还有 ${count} 口小快乐`,
            )
            .replace(/(\d+)\s+bites?\s+to happiness/g, "还有 $1 口小快乐")
            .replace(/All gone!\s*(\d+)\s+cookies?\s+enjoyed\./g, "吃完啦！已享用 $1 枚饼干。")
            .replace(
              /\bPreview\s+(Receive|Send|Swap)\b/gi,
              (_, action) => `预览${actionZh[action.toLowerCase()] || action}`,
            )
            .replace(
              /^(Receive|Send|Swap)\s+preview:\s*(\$[\d.,]+)\s*·\s*no transaction sent$/i,
              (_, action, amount) =>
                `${actionZh[action.toLowerCase()] || action}预览：${amount} · 未发送真实交易`,
            )
            .replace(/(\d+)\s*\/\s*12\s+STICKERS/g, "$1 / 12 张贴纸")
            .replace(/(\d+)\s+stickers? on your sheet\./g, "画布上有 $1 张贴纸。")
            .replace(
              /Landed in column (\d+)\.\s*Try a different launch position\./g,
              "落在第 $1 列。换个发射位置试试。",
            )
            .replace(/Landed in column (\d+)\./g, "落在第 $1 列。")
            .replace(/Try a different launch position\./g, "换个发射位置试试。")
            .replace(/Selected sticker rotated to\s*(-?\d+)\s*degrees\./g, "所选贴纸旋转至 $1 度。")
            .replace(/Selected sticker rotated to/g, "所选贴纸旋转至")
            .replace(/collection opened\. Pick a shape to add\./g, "集合已展开，选一个图形加入。")
            .replace(/added to your journal\./g, "已加入咖啡记录。")
            .replace(/(\d+)\s+wish(?:es)?\s+added to your sky\./g, "$1 个愿望已加入夜空。")
            .replace(/added to your sky\./g, "已加入夜空。")
            .replace(/(\d+)\s+little clouds?\s+drifting by\./g, "$1 朵小云正轻轻飘过。")
            .replace(/(\d+)\s+little clouds?/g, "$1 朵小云")
            .replace(/drifting by\./g, "正轻轻飘过。")
            .replace(
              /Files stay on this device\. Maximum (\d+) MB\./g,
              "文件留在此设备，最大 $1 MB。",
            )
            .replace(/· no transaction sent/g, "· 未发送真实交易");
        };

        function isCustomDocumentTitle(sourceTitle) {
          const titleEl = document.querySelector("title");
          if (titleEl?.hasAttribute("data-skill-custom-text")) return true;
          const normalizedTitle = normalize(sourceTitle || "");
          if (!normalizedTitle) return false;
          for (const element of document.querySelectorAll("[data-skill-custom-text]")) {
            if (normalize(element.textContent || "") === normalizedTitle) return true;
          }
          return false;
        }

        function applyLanguage(nextLang) {
          const resolved = normalizeLang(nextLang) || "en";
          currentLang = resolved;
          chinese = resolved === "zh";
          document.documentElement.lang = chinese ? "zh-CN" : "en";
          if (!document.body) return;
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;

          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement?.closest(skipSelector)) continue;
            if (chinese) {
              const source = originalTextNodes.has(node)
                ? originalTextNodes.get(node)
                : node.textContent;
              const next = window.__usefulshelfText(source);
              if (next !== source) {
                if (!originalTextNodes.has(node)) originalTextNodes.set(node, source);
                if (node.textContent !== next) node.textContent = next;
              }
            } else if (originalTextNodes.has(node)) {
              const source = originalTextNodes.get(node);
              if (node.textContent !== source) node.textContent = source;
            }
          }

          for (const element of document.querySelectorAll(
            "[aria-label],[placeholder],[title],[data-hint]",
          )) {
            if (element.closest("[data-skill-custom-text]")) continue;
            let saved = originalAttrs.get(element);
            for (const name of localizedAttrs) {
              if (!element.hasAttribute(name)) continue;
              if (chinese) {
                const source =
                  saved && Object.prototype.hasOwnProperty.call(saved, name)
                    ? saved[name]
                    : element.getAttribute(name);
                const next = window.__usefulshelfText(source);
                if (next !== source) {
                  if (!saved) {
                    saved = {};
                    originalAttrs.set(element, saved);
                  }
                  if (!Object.prototype.hasOwnProperty.call(saved, name)) {
                    saved[name] = source;
                  }
                  if (element.getAttribute(name) !== next) element.setAttribute(name, next);
                }
              } else if (saved && Object.prototype.hasOwnProperty.call(saved, name)) {
                if (element.getAttribute(name) !== saved[name]) {
                  element.setAttribute(name, saved[name]);
                }
              }
            }
          }

          if (!isCustomDocumentTitle(originalDocumentTitle)) {
            const targetTitle = chinese
              ? window.__usefulshelfText(originalDocumentTitle)
              : originalDocumentTitle;
            if (document.title !== targetTitle) document.title = targetTitle;
          }
        }

        window.__usefulshelfSetLang = (lang) => {
          const resolved = normalizeLang(lang) || "en";
          if (document.documentElement.dataset.skillLang !== resolved) {
            document.documentElement.dataset.skillLang = resolved;
          }
          applyLanguage(resolved);
        };

        function boot() {
          if (originalDocumentTitle === null) originalDocumentTitle = document.title;
          if (chinese) applyLanguage("zh");

          let langObserver;
          if (typeof MutationObserver === "function") {
            langObserver = new MutationObserver(() => {
              const next =
                normalizeLang(document.documentElement.dataset.skillLang) || resolveLang();
              if (next !== currentLang) applyLanguage(next);
            });
            langObserver.observe(document.documentElement, {
              attributes: true,
              attributeFilter: ["data-skill-lang"],
            });
            window.addEventListener("pagehide", () => langObserver.disconnect(), { once: true });
          }

          if (parent === window) return;
          // Freeze viewport-based demo heights before measuring, avoiding vh feedback
          // when the parent grows the iframe. Intentional inner demo scrollers remain.
          const initialHeight = Math.max(360, Math.min(760, innerHeight));
          function fixRules(rules) {
            for (const rule of rules) {
              if (rule.cssRules) fixRules(rule.cssRules);
              if (!rule.style) continue;
              if (/v[hbs]/.test(rule.style.minHeight))
                rule.style.setProperty("min-height", "0", "important");
              if (/v[hbs]/.test(rule.style.height))
                rule.style.setProperty("height", `${initialHeight}px`, "important");
            }
          }
          for (const sheet of document.styleSheets) {
            try {
              fixRules(sheet.cssRules);
            } catch {
              /* Same-file styles are sufficient. */
            }
          }
          for (const element of [document.documentElement, document.body]) {
            element.style.setProperty("height", "auto", "important");
            element.style.setProperty("min-height", "0", "important");
          }
          document.documentElement.style.overflowX = "clip";
          let frame = 0,
            lastHeight = 0;
          const measure = () => {
            frame = 0;
            const height = Math.ceil(
              Math.max(document.body.scrollHeight, document.body.getBoundingClientRect().height),
            );
            if (height > 0 && height <= 20000 && height !== lastHeight) {
              lastHeight = height;
              parent.postMessage({ type: "usefulshelf:resize", height }, "*");
            }
          };
          const schedule = () => {
            if (!frame) frame = requestAnimationFrame(measure);
          };
          const observer = new ResizeObserver(schedule);
          observer.observe(document.body);
          window.addEventListener("resize", schedule);
          const onMessage = (event) => {
            if (event.source === parent && event.data?.type === "usefulshelf:measure") {
              // The first resize may precede parent hydration. A measurement request
              // must acknowledge even an unchanged height, so that message is recovered.
              lastHeight = 0;
              schedule();
            }
          };
          window.addEventListener("message", onMessage);
          document.fonts?.ready.then(schedule);
          window.addEventListener(
            "pagehide",
            () => {
              observer.disconnect();
              cancelAnimationFrame(frame);
              window.removeEventListener("resize", schedule);
              window.removeEventListener("message", onMessage);
            },
            { once: true },
          );
          schedule();
        }
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", boot, { once: true });
        else boot();
      })();
    </script>
    <!-- usefulshelf-runtime:end -->
    <script>
      (function () {
        const titles = {"what": "What is Atlas?", "quickstart": "Quickstart", "architecture": "Architecture", "features": "Features", "fundamentals": "Fundamentals", "datasets": "Datasets", "edge": "Edge deployments", "limits": "Limits", "performance": "Performance", "optimize": "Optimize usage", "requirements": "Requirements", "semantic": "Semantic conventions", "glossary": "Glossary", "security": "Security", "roadmap": "Roadmap", "ref-arch": "Reference architectures", "methods": "Methods", "console": "Console", "console-home": "Console overview", "console-query": "Console query", "console-dash": "Dashboards", "console-stream": "Stream"};
        const bodies = {"_default": "Replace this sample text with documentation for the selected page.", "what": "Explore the platform, follow the quickstart, and learn the core concepts.", "quickstart": "Get from zero to first query: create a dataset, send events, open the console.", "fundamentals": "Core concepts that underpin ingest, storage, and query behavior.", "edge": "Run collectors closer to your traffic edge for lower latency and regional buffering.", "limits": "Rate limits, retention windows, and plan ceilings that shape how you design pipelines.", "performance": "Guidance for query shape, indexing hints, and ingest batching."};
        const customMeta = {"titles": [], "bodies": []};
        const customTitles = new Set(customMeta.titles || []);
        const customBodies = new Set(customMeta.bodies || []);
        const pageTitle = document.getElementById("page-title");
        const pageBody = document.getElementById("page-body");
        const sidebar = document.getElementById("docs-sidebar");
        const menuToggle = document.getElementById("menu-toggle");
        const mobileMq = matchMedia("(max-width: 720px)");
        const allNav = [...document.querySelectorAll(".nav-btn[data-id], .sub-btn[data-id]")];

        function setSidebarOpen(open) {
          if (!sidebar || !menuToggle) return;
          const isMobile = mobileMq.matches;
          const expanded = isMobile && open;
          sidebar.classList.toggle("mobile-open", expanded);
          sidebar.inert = isMobile && !expanded;
          menuToggle.setAttribute("aria-expanded", String(expanded));
        }

        if (menuToggle) {
          menuToggle.addEventListener("click", () => {
            const open = menuToggle.getAttribute("aria-expanded") === "true";
            setSidebarOpen(!open);
          });
        }
        document.addEventListener("keydown", (event) => {
          if (
            event.key === "Escape" &&
            mobileMq.matches &&
            menuToggle &&
            menuToggle.getAttribute("aria-expanded") === "true"
          ) {
            setSidebarOpen(false);
            menuToggle.focus();
          }
        });
        mobileMq.addEventListener("change", () => setSidebarOpen(false));
        setSidebarOpen(false);

        function setActive(id) {
          allNav.forEach((el) => {
            if (el.dataset.id === id) el.setAttribute("aria-current", "page");
            else el.removeAttribute("aria-current");
          });
          const rawTitle = titles[id] || id;
          pageTitle.textContent = customTitles.has(id)
            ? rawTitle
            : window.__usefulshelfText(rawTitle);
          const body = bodies[id] || bodies._default;
          pageBody.textContent = customBodies.has(id) ? body : window.__usefulshelfText(body);
          document.body.dataset.active = id;
        }

        document.querySelectorAll(".nav-btn.expandable").forEach((btn) => {
          btn.addEventListener("click", () => {
            const open = btn.getAttribute("aria-expanded") === "true";
            const sub = document.getElementById(btn.getAttribute("aria-controls"));
            btn.setAttribute("aria-expanded", open ? "false" : "true");
            if (sub) {
              sub.classList.toggle("open", !open);
              sub.inert = open;
            }
            activateDocumentation();
            setActive(btn.dataset.id);
          });
        });

        document.querySelectorAll(".nav-btn:not(.expandable), .sub-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            activateDocumentation();
            setActive(btn.dataset.id);
            if (mobileMq.matches) setSidebarOpen(false);
          });
        });

        const tabs = [...document.querySelectorAll(".tab")];
        function selectTab(tab) {
          tabs.forEach((item) => {
            item.setAttribute("aria-selected", String(item === tab));
            item.tabIndex = item === tab ? 0 : -1;
          });
          document.getElementById("content").setAttribute("aria-labelledby", tab.id);
          if (tab.dataset.tab === "query") {
            pageTitle.textContent = window.__usefulshelfText("Query Reference");
            pageBody.textContent = window.__usefulshelfText(
              "Query operators, functions, and examples. Replace this sample content with your reference documentation.",
            );
          } else {
            setActive(document.body.dataset.active || "what");
          }
        }
        function activateDocumentation() {
          selectTab(tabs[0]);
        }
        tabs.forEach((tab, index) => {
          tab.addEventListener("click", () => selectTab(tab));
          tab.addEventListener("keydown", (event) => {
            let next;
            if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
            if (event.key === "ArrowLeft") next = (index - 1 + tabs.length) % tabs.length;
            if (event.key === "Home") next = 0;
            if (event.key === "End") next = tabs.length - 1;
            if (next === undefined) return;
            event.preventDefault();
            tabs[next].focus();
            selectTab(tabs[next]);
          });
        });

        const initial = document.body.dataset.active || "what";
        setActive(initial);
        const selected = allNav.find((item) => item.dataset.id === initial);
        const submenu = selected?.closest(".sub");
        if (submenu) {
          submenu.inert = false;
          submenu.classList.add("open");
          document
            .querySelector(`[aria-controls="${submenu.id}"]`)
            .setAttribute("aria-expanded", "true");
        }
      })();
    </script>
