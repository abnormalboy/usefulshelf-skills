<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>把一天，理清楚。</title>
    <style>
      :root {
        --accent: #557966;
        --bg: #f3f0e9;
        --ink: #1b2620;
        --muted: #425148;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 16px 16px 18px;
        color: var(--ink);
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 52% 48% at 14% 16%, rgba(196, 236, 138, 0.78), transparent 64%),
          radial-gradient(ellipse 48% 50% at 86% 20%, rgba(124, 214, 206, 0.74), transparent 62%),
          radial-gradient(ellipse 52% 48% at 78% 88%, rgba(235, 152, 190, 0.7), transparent 64%),
          radial-gradient(ellipse 52% 52% at 18% 86%, rgba(246, 208, 120, 0.74), transparent 64%),
          radial-gradient(ellipse 46% 42% at 52% 50%, rgba(176, 198, 245, 0.44), transparent 66%);
        background-attachment: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Hiragino Sans GB",
          "Noto Sans CJK SC",
          system-ui,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 636px;
        margin: 0 auto;
        padding: 20px 24px 16px;
        background: linear-gradient(
          165deg,
          rgba(254, 253, 250, 0.84) 0%,
          rgba(248, 246, 241, 0.76) 100%
        );
        backdrop-filter: blur(28px) saturate(148%);
        -webkit-backdrop-filter: blur(28px) saturate(148%);
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 28px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          0 28px 72px rgba(29, 44, 38, 0.14),
          0 4px 14px rgba(29, 44, 38, 0.06),
          0 0 0 1px rgba(32, 46, 38, 0.06);
        transition: max-width 0.25s ease;
      }
      .mast {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font:
          600 12.5px/1.2 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        color: var(--ink);
      }
      .mast .brand-wrap {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .mast .mark {
        display: inline-grid;
        place-items: center;
        width: 24px;
        height: 24px;
        background: linear-gradient(155deg, #27332c, #131916);
        color: #ffffff;
        border-radius: 8px;
        font-size: 13px;
        box-shadow: 0 3px 8px rgba(20, 30, 24, 0.22);
      }
      .view-switch {
        display: inline-flex;
        gap: 3px;
        padding: 3px;
        border-radius: 999px;
        background: rgba(27, 38, 32, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      .view-switch button {
        font:
          600 12px/1.2 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        border: 0;
        background: transparent;
        padding: 6px 13px;
        border-radius: 999px;
        color: var(--muted);
        cursor: pointer;
        transition:
          background-color 0.16s ease,
          color 0.16s ease,
          box-shadow 0.16s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .view-switch button[aria-pressed="true"] {
        background: #ffffff;
        color: #16221b;
        box-shadow: 0 2px 6px rgba(24, 38, 30, 0.1);
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 24px;
        margin: 14px 0 14px;
      }
      h1 {
        font:
          600 clamp(30px, 3.6vw, 40px)/1.12 "Iowan Old Style",
          "Palatino Linotype",
          Georgia,
          "Songti SC",
          "Noto Serif CJK SC",
          serif;
        letter-spacing: -0.03em;
        margin: 0 0 5px;
        overflow-wrap: anywhere;
        text-wrap: balance;
        white-space: pre-line;
        color: #151f19;
      }
      :lang(zh) h1 {
        line-height: 1.18;
        letter-spacing: -0.015em;
        word-break: keep-all;
      }
      .sub {
        font-size: 13.5px;
        color: var(--muted);
        line-height: 1.55;
        margin: 0;
        max-width: 520px;
        text-wrap: pretty;
      }
      .count {
        display: none;
        flex-shrink: 0;
        font:
          600 40px/1 "Iowan Old Style",
          Georgia,
          serif;
        font-variant-numeric: tabular-nums;
        text-align: right;
        color: var(--accent);
      }
      .count span {
        display: block;
        font:
          600 10.5px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-top: 4px;
      }
      /* Frosted inner application card (concentric radius 16px) */
      .insight-app {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        overflow: hidden;
        box-shadow:
          0 14px 32px rgba(32, 46, 38, 0.09),
          0 1px 3px rgba(32, 46, 38, 0.06),
          0 0 0 1px rgba(27, 38, 32, 0.08);
      }
      .insight-chrome {
        padding: 9px 15px;
        background: linear-gradient(180deg, rgba(246, 247, 244, 0.96), rgba(238, 241, 236, 0.92));
        border-bottom: 1px solid rgba(27, 38, 32, 0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .dots {
        display: flex;
        gap: 6px;
      }
      .dots i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ec6a5e;
        box-shadow: inset 0 -1px 1px rgba(0, 0, 0, 0.14);
      }
      .dots i:nth-child(2) {
        background: #f4bf4f;
      }
      .dots i:nth-child(3) {
        background: #61c554;
      }
      .analysis-body {
        padding: 14px 18px 12px;
      }
      .question {
        margin: 0 0 12px auto;
        width: fit-content;
        max-width: 86%;
        background-color: #171e1a;
        background-image: linear-gradient(160deg, #252e28, #151b17);
        color: #ffffff;
        padding: 9px 15px;
        border-radius: 16px 16px 4px 16px;
        font:
          500 13px/1.45 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.16),
          0 8px 18px rgba(20, 30, 24, 0.18);
      }
      .analysis-kicker {
        font:
          600 11.5px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 5px;
        display: flex;
        justify-content: space-between;
      }
      #analysis-answer {
        font-size: 13px;
        line-height: 1.58;
        margin: 0 0 12px;
        color: #212e26;
      }
      .chart-heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 7px;
      }
      #analysis-total {
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .analysis-bar {
        height: 12px;
        display: flex;
        gap: 2px;
        border-radius: 999px;
        overflow: hidden;
        background: #ebeee8;
        padding: 1.5px;
        box-shadow: inset 0 1px 2px rgba(20, 30, 24, 0.1);
      }
      .analysis-bar span {
        height: 100%;
        border-radius: 999px;
        transition:
          width 0.3s ease,
          opacity 0.2s ease;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }
      .analysis-legend {
        display: grid;
        gap: 2px;
        margin-top: 9px;
      }
      .legend-row {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 10px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        padding: 5px 7px;
        width: 100%;
        text-align: left;
        font-size: 12.5px;
        color: var(--ink);
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }
      @media (hover: hover) {
        .legend-row:hover {
          background: rgba(27, 38, 32, 0.045);
        }
      }
      .legend-row[aria-pressed="true"] {
        background: color-mix(in srgb, var(--accent) 10%, #ffffff 90%);
        border-color: color-mix(in srgb, var(--accent) 32%, transparent);
      }
      .legend-row i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.5);
      }
      .legend-row strong {
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
      }
      .legend-row small {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        min-width: 48px;
        text-align: right;
      }
      #analysis-focus {
        min-height: 18px;
        margin: 8px 0 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
      }
      .analysis-options {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding: 11px 18px;
        border-top: 1px solid rgba(27, 38, 32, 0.08);
        background: linear-gradient(180deg, rgba(249, 250, 247, 0.9), rgba(243, 245, 240, 0.92));
      }
      .analysis-options label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .analysis-options select {
        max-width: 100%;
        border: 1px solid rgba(27, 38, 32, 0.2);
        background: #ffffff;
        border-radius: 999px;
        padding: 6px 12px;
        color: var(--ink);
        font:
          500 12px/1.2 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        box-shadow: 0 1px 3px rgba(20, 30, 24, 0.05);
        cursor: pointer;
      }
      .analysis-note {
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
        margin: 10px 0 0;
      }

      /* Inbox Desk View */
      .desk {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        overflow: hidden;
        box-shadow:
          0 16px 36px rgba(32, 46, 38, 0.09),
          0 0 0 1px rgba(27, 38, 32, 0.08);
      }
      .chrome {
        padding: 10px 18px;
        background: linear-gradient(180deg, rgba(244, 247, 242, 0.96), rgba(235, 240, 232, 0.94));
        border-bottom: 1px solid rgba(27, 38, 32, 0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font:
          600 11.5px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        border-bottom: 1px solid rgba(27, 38, 32, 0.09);
      }
      .filters {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .filters button {
        border: 0;
        background: transparent;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
      }
      .filters button[aria-pressed="true"] {
        background: var(--accent);
        color: #ffffff;
      }
      #search {
        width: 210px;
        min-width: 0;
        background: #f2f5ef;
        border: 1px solid rgba(27, 38, 32, 0.14);
        border-radius: 999px;
        padding: 7px 13px;
        font-size: 12px;
        color: var(--ink);
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(250px, 0.86fr) minmax(0, 1.2fr);
        min-height: 360px;
      }
      .list {
        border-right: 1px solid rgba(27, 38, 32, 0.1);
        padding: 10px;
      }
      .message {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        width: 100%;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 11px;
        padding: 12px 11px;
        text-align: left;
        color: var(--ink);
        cursor: pointer;
      }
      .message[aria-pressed="true"] {
        background: #edf3ea;
        border-color: rgba(62, 107, 86, 0.22);
      }
      .avatar {
        height: 32px;
        width: 32px;
        border-radius: 10px;
        background: var(--av, #e9dbc7);
        display: grid;
        place-items: center;
        font:
          600 13px Georgia,
          serif;
        color: #212c24;
      }
      .message strong {
        font-size: 12.5px;
        display: block;
        font-weight: 600;
      }
      .message small {
        font-size: 12px;
        display: block;
        color: var(--muted);
        margin-top: 3px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .message em {
        font:
          600 11px ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-style: normal;
      }
      .reader {
        padding: 20px 26px;
        min-width: 0;
      }
      #channel {
        font:
          600 11px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        color: var(--accent);
        letter-spacing: 0.1em;
      }
      h2 {
        font:
          600 24px/1.22 "Iowan Old Style",
          Georgia,
          "Songti SC",
          serif;
        margin: 10px 0 6px;
        overflow-wrap: anywhere;
      }
      #sender {
        font-size: 12.5px;
        color: var(--muted);
      }
      #body {
        font-size: 13.5px;
        line-height: 1.7;
        color: #29362d;
        min-height: 58px;
        margin: 16px 0;
      }
      .reader-actions {
        display: flex;
        gap: 14px;
        margin-bottom: 16px;
      }
      .reader-actions button {
        padding: 6px 12px;
        border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent) 7%, #ffffff 93%);
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        cursor: pointer;
      }
      .draft-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        display: block;
        margin-bottom: 7px;
      }
      textarea {
        resize: vertical;
        width: 100%;
        min-height: 68px;
        max-height: 170px;
        padding: 10px 12px;
        background: #f5f8f2;
        border: 1px solid rgba(27, 38, 32, 0.18);
        border-radius: 10px;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.5;
      }
      .save {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }
      .save small {
        font-size: 11.5px;
        color: var(--muted);
      }
      .save button {
        border: 0;
        background: #1b2620;
        color: #ffffff;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-top: 10px;
      }
      .mix {
        display: flex;
        overflow: hidden;
        height: 6px;
        background: #e1e7da;
        border-radius: 999px;
        width: 190px;
      }
      .mix i {
        height: 100%;
      }
      .mix-label {
        font:
          600 10.5px/1.2 ui-monospace,
          "SFMono-Regular",
          Menlo,
          monospace;
        color: var(--muted);
        margin-top: 6px;
      }
      #status {
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
        min-height: 18px;
      }
      .undo {
        border: 0;
        border-bottom: 1.5px solid currentColor;
        background: none;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 0 0 2px;
      }
      .undo:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 2.5px solid var(--accent);
        outline-offset: 3px;
      }
      .empty {
        font-size: 12.5px;
        color: var(--muted);
        padding: 32px 18px;
        line-height: 1.75;
      }
      .work-open {
        max-width: 1060px;
      }
      .work-open .count {
        display: block;
      }
      @media (max-width: 670px) {
        body {
          padding: 12px;
          align-items: flex-start;
        }
        main {
          padding: 18px 16px 16px;
          border-radius: 22px;
        }
        .mast {
          font-size: 11px;
          gap: 8px;
        }
        .view-switch button {
          padding: 6px 10px;
        }
        .hero {
          display: block;
        }
        .count {
          display: none !important;
        }
        h1 {
          font-size: 31px;
        }
        .analysis-body {
          padding: 14px 14px 12px;
        }
        .question {
          max-width: 92%;
        }
        .analysis-options {
          padding: 12px 14px;
        }
        .analysis-options label {
          flex: 1 1 130px;
          align-items: start;
          flex-direction: column;
        }
        .analysis-options select {
          width: 100%;
          font-size: 16px;
        }
        .toolbar {
          align-items: stretch;
          gap: 10px;
          flex-direction: column;
          padding: 12px 14px;
        }
        #search {
          width: 100%;
          font-size: 16px;
        }
        .columns {
          grid-template-columns: 1fr;
        }
        .list {
          border-right: 0;
          border-bottom: 1px solid rgba(27, 38, 32, 0.1);
          max-height: 250px;
          overflow: auto;
        }
        .reader {
          padding: 18px 16px;
        }
        .save {
          flex-wrap: wrap;
        }
        .bottom {
          flex-direction: column;
          align-items: start;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mast">
        <span class="brand-wrap">
          <span class="mark" aria-hidden="true">✳</span>
          <span data-zh="轻巧收件工作台" data-en="A little clarity">轻巧收件工作台</span>
        </span>
        <div class="view-switch" role="group" aria-label="视图">
          <button id="analysis-view" aria-pressed="true" data-zh="洞察" data-en="Insights">
            洞察
          </button>
          <button id="desk-view" aria-pressed="false" data-zh="工作台" data-en="Inbox desk">
            工作台
          </button>
        </div>
      </div>
      <div class="hero">
        <div>
          <h1>把一天，理清楚。</h1>
          <p class="sub" id="subtitle">
            问一个小问题，让每段对话都有清晰的去处。
          </p>
        </div>
        <div class="count">
          <b id="count">5</b>
          <span data-zh="条消息，慢慢处理" data-en="MESSAGES, AT YOUR PACE">条消息，慢慢处理</span>
        </div>
      </div>
      <section id="insight-view" class="insight-app" aria-label="渠道洞察">
        <div class="insight-chrome">
          <span class="dots" aria-hidden="true">
            <i></i>
            <i></i>
            <i></i>
          </span>
          <span data-zh="一天，看得更清楚" data-en="A clearer picture">一天，看得更清楚</span>
          <span>⌘</span>
        </div>
        <div class="analysis-body">
          <p id="analysis-question" class="question"></p>
          <p class="analysis-kicker">
            <span data-zh="整理与分析" data-en="A moment of clarity">整理与分析</span>
            <span aria-hidden="true">↗</span>
          </p>
          <p id="analysis-answer"></p>
          <div class="chart-heading">
            <span id="chart-heading"></span>
            <span id="analysis-total"></span>
          </div>
          <div id="analysis-bar" class="analysis-bar" aria-hidden="true"></div>
          <div id="analysis-legend" class="analysis-legend"></div>
          <p id="analysis-focus"></p>
        </div>
        <div class="analysis-options">
          <label for="question-select">
            <span data-zh="换个问题" data-en="Ask about">换个问题</span>
            <select id="question-select">
              <option
                value="volume"
                data-zh="消息从哪里来？"
                data-en="Where do messages come from?"
              >
                消息从哪里来？
              </option>
              <option value="resolved" data-zh="哪些已被处理？" data-en="What has been resolved?">
                哪些已被处理？
              </option>
              <option value="attention" data-zh="哪里需要关注？" data-en="What needs attention?">
                哪里需要关注？
              </option>
            </select>
          </label>
          <label for="period">
            <span data-zh="时间" data-en="Period">时间</span>
            <select id="period">

        document.querySelector("#pin").addEventListener("click", () => {
          const m = current();
          if (!m) return;
          m.pinned = !m.pinned;
          status.textContent = m.pinned
            ? L("重要的消息，放在最上面。", "Pinned to keep it close.")
            : L("已取消置顶。", "Message unpinned.");
          render();
        });
        document.querySelector("#archive").addEventListener("click", () => {
          const m = current();
          if (!m) return;
          m.archived = true;
          history.push(m.id);
          status.textContent = L("已归档：", "Archived: ") + m.subject;
          render();
        });
        document.querySelector("#undo").addEventListener("click", () => {
          const id = history.pop();
          if (!id) return;
          messages.find((m) => m.id === id).archived = false;
          selected = id;
          filter = "all";
          search.value = "";
          document
            .querySelectorAll("[data-filter]")
            .forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.filter === "all")));
          render();
          status.textContent = L("那条消息又回来了。", "That message is back in your inbox.");
        });
        document.querySelector("#restore").addEventListener("click", () => {
          const m = current();
          if (!m) return;
          m.draft = m.saved;
          draft.value = m.saved;
          status.textContent = L("已恢复上一次保存的草稿。", "Restored the last saved draft.");
        });
        document.querySelector("#save").addEventListener("click", () => {
          const m = current();
          if (!m) return;
          m.saved = m.draft;
          status.textContent = m.draft.trim()
            ? L(
                "草稿已留在这条消息里，尚未发送。",
                "Draft saved with this message. Nothing was sent.",
              )
            : L("空草稿已保存。", "Empty draft saved.");
        });
        render();
        const channelNames = [
            L("邮件", "Email"),
            L("聊天", "Chat"),
            L("网站", "Website"),
            L("语音", "Voice"),
            L("便签", "Notes"),
          ],
          channelColors = ["#e8a528", "#2aa374", "#3892d4", "#6b6fd6", "#d65683"];
        const samples = {
          week: { volume: [2648, 174, 83, 39, 24], resolved: [2360, 123, 52, 21, 19] },
          month: { volume: [9180, 1150, 630, 280, 160], resolved: [7820, 930, 490, 192, 134] },
        };
        let question = "volume",
          period = "week",
          focused = -1;
        const questions = {
          volume: L("这段时间，消息都从哪里来？", "Where have our conversations come from?"),
          resolved: L("帮我看看，哪些消息已经处理好了？", "What have we already taken care of?"),
          attention: L(
            "接下来，哪些渠道需要多一点关注？",
            "Which channels need a little more attention?",
          ),
        };
        function analysis(announce = false) {
          const data = samples[period],
            values =
              question === "attention"
                ? data.volume.map((v, i) => v - data.resolved[i])
                : data[question],
            total = values.reduce((a, b) => a + b, 0),
            top = values.indexOf(Math.max(...values)),
            pct = (i) => ((values[i] / total) * 100).toFixed(1),
            days = period === "week" ? 7 : 30;
          document.querySelector("#analysis-question").textContent = questions[question];
          document.querySelector("#analysis-answer").textContent =
            question === "volume"
              ? L(
                  `最近 ${days} 天，共收到 ${total.toLocaleString()} 条消息。${channelNames[top]}占 ${pct(top)}%，是最活跃的渠道。`,
                  `${total.toLocaleString()} conversations in the last ${days} days. ${channelNames[top]} leads with ${pct(top)}% of the total.`,
                )
              : question === "resolved"
                ? L(
                    `最近 ${days} 天，已处理 ${total.toLocaleString()} 条消息。${channelNames[top]}贡献了最多的已处理记录，给下一件事腾出了空间。`,
                    `${total.toLocaleString()} conversations resolved in ${days} days. ${channelNames[top]} accounts for the largest share—more room for what comes next.`,
                  )
                : L(
                    `最近 ${days} 天，还有 ${total.toLocaleString()} 条消息待处理。${channelNames[top]}的待处理量最高，可以从这里开始。`,
                    `${total.toLocaleString()} conversations still need attention over ${days} days. Start with ${channelNames[top]}, where the remaining count is highest.`,
                  );
          document.querySelector("#chart-heading").textContent = L(
            { volume: "消息渠道分布", resolved: "已处理渠道分布", attention: "待处理渠道分布" }[
              question
            ],
            {
              volume: "Conversations by channel",
              resolved: "Resolved by channel",
              attention: "Needs attention by channel",
            }[question],
          );
          document.querySelector("#analysis-total").textContent =
            total.toLocaleString() + L(" 条", " total");
          const bar = document.querySelector("#analysis-bar"),
            legend = document.querySelector("#analysis-legend");
          bar.replaceChildren();
          legend.replaceChildren();
          values.forEach((v, i) => {
            const segment = document.createElement("span");
            segment.style.width = (v / total) * 100 + "%";
            segment.style.background = channelColors[i];
            segment.style.opacity = focused < 0 || focused === i ? "1" : ".22";
            bar.append(segment);
            const row = document.createElement("button");
            row.className = "legend-row";
            row.setAttribute("aria-pressed", String(focused === i));
            row.setAttribute(
              "aria-label",
              channelNames[i] + ": " + v.toLocaleString() + ", " + pct(i) + "%",
            );
            const dot = document.createElement("i"),
              name = document.createElement("span"),
              count = document.createElement("strong"),
              share = document.createElement("small");
            dot.style.background = channelColors[i];
            name.textContent = channelNames[i];
            count.textContent = v.toLocaleString();
            share.textContent = pct(i) + "%";
            row.append(dot, name, count, share);
            row.onclick = () => {
              focused = focused === i ? -1 : i;
              analysis(true);
              document.querySelectorAll(".legend-row")[i].focus();
            };
            legend.append(row);
          });
          document.querySelector("#analysis-focus").textContent =
            focused < 0
              ? L(
                  "选择一行，看看它在全局里的位置。",
                  "Select a channel to see its place in the whole.",
                )
              : L(
                  `${channelNames[focused]} · ${values[focused].toLocaleString()} 条 · 占 ${pct(focused)}%`,
                  `${channelNames[focused]} · ${values[focused].toLocaleString()} conversations · ${pct(focused)}%`,
                );
          if (announce)
            status.textContent =
              focused < 0
                ? L("已更新渠道分析。", "Channel analysis updated.")
                : document.querySelector("#analysis-focus").textContent;
        }
        document
          .querySelector("#question-select")
          .setAttribute("aria-label", L("换个问题", "Ask about"));
        document.querySelector("#period").setAttribute("aria-label", L("时间", "Period"));
        document.querySelector("#question-select").onchange = (e) => {
          question = e.target.value;
          focused = -1;
          analysis(true);
        };
        document.querySelector("#period").onchange = (e) => {
          period = e.target.value;
          analysis(true);
        };
        function view(work) {
          document.querySelector("#work-view").hidden = !work;
          document.querySelector("#insight-view").hidden = work;
          document.querySelector("#insight-note").hidden = work;
          document.querySelector("#desk-mix").hidden = !work;
          document.querySelector("#undo").hidden = !work;
          document.querySelector("main").classList.toggle("work-open", work);
          document.querySelector("#analysis-view").setAttribute("aria-pressed", String(!work));
          document.querySelector("#desk-view").setAttribute("aria-pressed", String(work));
          status.textContent = work
            ? L(
                "工作台已打开。搜索、保存草稿或归档消息。",
                "Inbox desk open. Search, save drafts, or archive a message.",
              )
            : L("选择一个问题，探索每个渠道。", "Choose a question, then explore the channels.");
        }
        document.querySelector("#analysis-view").onclick = () => view(false);
        document.querySelector("#desk-view").onclick = () => view(true);
        document.querySelector(".view-switch").setAttribute("aria-label", L("视图", "View"));
        document
          .querySelector("#insight-view")
          .setAttribute("aria-label", L("渠道洞察", "Channel insights"));
        analysis();
        view(false);
      })();
    </script>
  </body>
</html>
